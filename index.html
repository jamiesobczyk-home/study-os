hy it fails."},{"text":"Secondary structure is stabilized by hydrogen bonds between the **amine and carboxyl groups of the backbone**. R group interactions are what hold **tertiary** structure. Getting this backwards collapses the two levels into one and loses marks in both.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying secondary structure is held by R group interactions."},{"text":"Peptide bonds are covalent and aren’t broken by heat or pH change. What breaks are the weaker interactions holding the folded shape. The primary structure survives denaturation intact, which is exactly why denaturation is sometimes reversible.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying denaturation breaks peptide bonds."},{"text":"The syllabus says it may be reversible or irreversible. A protein denatured mildly can sometimes refold, because the primary structure that determines the shape is still there.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating denaturation as always irreversible."}],"after":{"label":"What would have scored","text":"Attach the bonding to every level — backbone hydrogen bonds for secondary; hydrogen, ionic, disulfide and hydrophobic interactions between R groups for tertiary."}},{"id":"B1.2-t5","topic":"B1.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"All proteins have four levels of structure.","prompt":"Why does it fail?","options":[{"text":"Quaternary structure exists only where two or more polypeptides associate. A protein made of a single polypeptide has no quaternary structure at all.","correct":true,"why":"That’s exactly why it fails."},{"text":"Secondary structure is stabilized by hydrogen bonds between the **amine and carboxyl groups of the backbone**. R group interactions are what hold **tertiary** structure. Getting this backwards collapses the two levels into one and loses marks in both.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying secondary structure is held by R group interactions."},{"text":"Peptide bonds are covalent and aren’t broken by heat or pH change. What breaks are the weaker interactions holding the folded shape. The primary structure survives denaturation intact, which is exactly why denaturation is sometimes reversible.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying denaturation breaks peptide bonds."},{"text":"The syllabus says it may be reversible or irreversible. A protein denatured mildly can sometimes refold, because the primary structure that determines the shape is still there.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating denaturation as always irreversible."}],"after":{"label":"What would have scored","text":"Quaternary structure is present only in proteins made of more than one polypeptide, such as haemoglobin."}},{"id":"B1.2-t6","topic":"B1.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Non-polar R groups are pushed into the centre because water repels them.","prompt":"Why does it fail?","options":[{"text":"Nothing pushes. Water molecules bond preferentially with each other and with polar R groups, which leaves the non-polar ones excluded and therefore clustered inside. This is the same mechanism as in A1.1, and examiners treat \"repelled\" as a misunderstanding rather than loose wording.","correct":true,"why":"That’s exactly why it fails."},{"text":"Secondary structure is stabilized by hydrogen bonds between the **amine and carboxyl groups of the backbone**. R group interactions are what hold **tertiary** structure. Getting this backwards collapses the two levels into one and loses marks in both.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying secondary structure is held by R group interactions."},{"text":"Peptide bonds are covalent and aren’t broken by heat or pH change. What breaks are the weaker interactions holding the folded shape. The primary structure survives denaturation intact, which is exactly why denaturation is sometimes reversible.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying denaturation breaks peptide bonds."},{"text":"The syllabus says it may be reversible or irreversible. A protein denatured mildly can sometimes refold, because the primary structure that determines the shape is still there.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating denaturation as always irreversible."}],"after":{"label":"What would have scored","text":"Non-polar R groups can’t form hydrogen bonds with water, so water associates with itself and with polar R groups instead, leaving the non-polar groups clustered in the interior."}},{"id":"B1.2-t7","topic":"B1.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Essential amino acids are the ones the body needs most.","prompt":"Why does it fail?","options":[{"text":"\"Essential\" is about synthesis, not importance. All twenty are needed. Essential ones are simply those the body can’t make, so they must come from the diet.","correct":true,"why":"That’s exactly why it fails."},{"text":"Secondary structure is stabilized by hydrogen bonds between the **amine and carboxyl groups of the backbone**. R group interactions are what hold **tertiary** structure. Getting this backwards collapses the two levels into one and loses marks in both.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying secondary structure is held by R group interactions."},{"text":"Peptide bonds are covalent and aren’t broken by heat or pH change. What breaks are the weaker interactions holding the folded shape. The primary structure survives denaturation intact, which is exactly why denaturation is sometimes reversible.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying denaturation breaks peptide bonds."},{"text":"The syllabus says it may be reversible or irreversible. A protein denatured mildly can sometimes refold, because the primary structure that determines the shape is still there.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating denaturation as always irreversible."}],"after":{"label":"What would have scored","text":"Essential amino acids can’t be synthesized by the body and must be obtained from the diet; non-essential ones can be synthesized."}},{"id":"B1.2-t8","topic":"B1.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Water is added to join two amino acids.","prompt":"Why does it fail?","options":[{"text":"Condensation **releases** water as the bond forms. Adding water breaks the bond, which is hydrolysis. One word, one mark, and it is lost constantly.","correct":true,"why":"That’s exactly why it fails."},{"text":"Secondary structure is stabilized by hydrogen bonds between the **amine and carboxyl groups of the backbone**. R group interactions are what hold **tertiary** structure. Getting this backwards collapses the two levels into one and loses marks in both.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying secondary structure is held by R group interactions."},{"text":"Peptide bonds are covalent and aren’t broken by heat or pH change. What breaks are the weaker interactions holding the folded shape. The primary structure survives denaturation intact, which is exactly why denaturation is sometimes reversible.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying denaturation breaks peptide bonds."},{"text":"The syllabus says it may be reversible or irreversible. A protein denatured mildly can sometimes refold, because the primary structure that determines the shape is still there.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating denaturation as always irreversible."}],"after":{"label":"What would have scored","text":"Condensation joins the amine group of one amino acid to the carboxyl group of another, forming a peptide bond and releasing a molecule of water."}}]}},{"code":"B2.1","title":"Membranes and membrane transport","theme":"B","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"70-74","questionsPage":80,"bookTitle":null,"pack":{"oneLiner":"A cell membrane is a fluid phospholipid barrier whose proteins control what crosses, allowing the cell to keep its inside different from its surroundings. \u003c!-- Keep this heading exactly as written. The web app pulls the sentence beneath it and shows it as the subtitle on the topic screen. Rename the heading and the subtitle silently disappears. -->","essentials":"\n> Tick a line only after you can do it with the page closed and without prompts.\n\n## Core\n\n- [ ] Describe a phospholipid as an amphipathic molecule with a hydrophilic phosphate head and two hydrophobic hydrocarbon tails.\n- [ ] Explain why phospholipids form bilayers spontaneously in water, with the heads facing aqueous solutions and the tails sheltered in the centre.\n- [ ] Explain the fluid mosaic model and distinguish integral proteins from peripheral proteins.\n- [ ] Predict whether a substance can cross the phospholipid bilayer directly from its size, charge and polarity.\n- [ ] Compare simple diffusion, facilitated diffusion, osmosis and active transport by route, energy use and direction relative to a gradient.\n- [ ] Explain how aquaporins increase the rate of osmosis without using ATP.\n- [ ] Explain how a pump protein uses ATP and a conformational change to move a substance against its concentration gradient.\n- [ ] Explain how glycoproteins and glycolipids contribute to cell recognition and adhesion.\n- [ ] Explain how temperature and the saturation of fatty acid tails affect membrane fluidity.\n- [ ] Explain how cholesterol buffers the fluidity of animal cell membranes at high and low temperatures.\n- [ ] Use the membrane's structure and its transport proteins together to explain selective permeability.\n\n## Higher level\n\n- [ ] Explain how membrane fluidity allows vesicles to form by fission and merge by fusion during endocytosis, exocytosis and intracellular transport.\n- [ ] Distinguish voltage-gated from ligand-gated ion channels by the signal that opens each one.\n- [ ] Explain how the sodium–potassium pump moves three Na+ out and two K+ in per ATP hydrolyzed, producing ion gradients and a charge difference.\n- [ ] Explain sodium-dependent glucose cotransport as indirect active transport powered by a sodium gradient established using ATP elsewhere.\n- [ ] Explain how cell-adhesion proteins bind cells together so tissues can form.\n\n## Links to other topics\n\n- **A1.1 Water** — hydrophilic and hydrophobic interactions explain why phospholipids form a bilayer. Secure that cause and the membrane stops being a diagram to memorize.\n- **B2.2 Organelles and compartmentalization** — membrane-bound compartments work because membranes maintain different conditions on their two sides.\n- **C2.2 Neural signalling** — ion pumps and gated channels create and change membrane potentials. Accurate directions and ion numbers here prevent confusion in action potentials.\n- **D2.3 Water potential** — osmosis is developed into predictions about water movement. Knowing what aquaporins change, and what they don’t change, makes that topic easier.\n\n## Vocabulary that has to be exact\n\n| Term | What it means | What it’s not |\n| --- | --- | --- |\n| Amphipathic | Having both hydrophilic and hydrophobic regions | The same as fully polar or fully non-polar |\n| Simple diffusion | Net movement down a concentration gradient directly through the phospholipid bilayer | Movement through a channel or carrier protein |\n| Facilitated diffusion | Passive movement down a gradient through a specific channel or carrier protein | Active transport; it doesn’t use ATP |\n| Osmosis | Net movement of water through a partially permeable membrane from higher to lower water potential | Movement of solute particles |\n| Active transport | Movement against a concentration gradient using energy and a transport protein | Any transport involving a membrane protein |\n| Integral protein | A protein embedded in the bilayer; some span the entire membrane | A protein that must cross the whole membrane |\n| Peripheral protein | A protein attached to a membrane surface rather than embedded in the hydrophobic core | A channel through the bilayer |\n| Selective permeability | Allowing some substances to cross more readily than others because of the bilayer and specific transport proteins | Random leakage through gaps in the membrane |\n| Cotransport | Coupled movement in which one substance moving down its electrochemical gradient drives another substance | ATP hydrolysis at every cotransporter |\n","videos":"\nWatch **one** main video, close it, and rebuild the membrane and transport table from memory. A second explanation of the same idea strengthens recognition, which is the problem this system exists to fix.\n\n## Main\n\n**Alex Lee Biology — B2.1 Membranes and membrane transport**\n\n- Channel: \u003chttps://www.youtube.com/@misterleescience> — verified\n- Search: \u003chttps://www.youtube.com/results?search_query=Mister+Lee+Science+B2.1+membranes+membrane+transport>\n\nAlex Lee organizes Biology around the current IB topic codes, so begin with the explanation made for B2.1.\n\n**Watch for:**\n\n- Why phospholipids form a bilayer in water without a structure assembling them.\n- How size, charge and polarity determine whether a substance can cross the bilayer directly.\n- Which two tests separate facilitated diffusion from active transport: direction relative to the gradient and ATP use.\n- Why cholesterol can reduce fluidity in one condition and prevent rigidity in another.\n\n**Pause at:** the first comparison of transport mechanisms. Draw four columns labelled simple diffusion, facilitated diffusion, osmosis and active transport. For each, add the route, whether ATP is used and the direction of movement relative to a gradient before playing on.\n\n## If that didn’t land\n\n**Amoeba Sisters — cell membrane and cell transport**\n\n- Channel: \u003chttps://www.youtube.com/@AmoebaSisters> — verified\n- Search: \u003chttps://www.youtube.com/results?search_query=Amoeba+Sisters+cell+membrane+transport>\n\nUse this if the passive-versus-active distinction is still blurred. When it ends, test recall rather than opening a third explanation.\n\n**Khan Academy — membrane transport**\n\n- Channel: \u003chttps://www.youtube.com/@khanacademy> — verified\n- Search: \u003chttps://www.youtube.com/results?search_query=Khan+Academy+membrane+transport+diffusion+active+transport>\n\nUse this if you need the concentration-gradient reasoning developed more slowly.\n\n## Worth it once, not for revision\n\nThe sodium–potassium pump and sodium–glucose cotransporter are mechanical sequences, so an **animation** earns one exception to the one-video rule. Movement can show the pump changing shape and the two transporters sharing an ion gradient in a way that prose can’t.\n\n- Pump search: \u003chttps://www.youtube.com/results?search_query=sodium+potassium+pump+animation+3+sodium+2+potassium>\n- Cotransport search: \u003chttps://www.youtube.com/results?search_query=sodium+glucose+cotransport+animation+secondary+active+transport>\n\nAfter watching, draw the chain from ATP hydrolysis to the sodium gradient and then to glucose uptake. If the cotransporter itself is shown hydrolyzing ATP in your drawing, correct it before moving on.\n\n## Pinned\n","traps":"\n## Saying the cell assembles the bilayer\n\n**Commonly written:** “The cell builds phospholipids into a bilayer.”\n\n**Why it doesn’t score:** This replaces the molecular explanation with an unnamed process. The examiner wants the hydrophilic and hydrophobic regions related to water.\n\n**Scores instead:** “Phospholipids form a bilayer spontaneously, with hydrophilic heads facing the aqueous solutions and hydrophobic tails sheltered in the centre away from water.”\n\n## Saying the hydrophobic core repels ions\n\n**Commonly written:** “The membrane repels Na+ because the centre is hydrophobic.”\n\n**Why it doesn’t score:** “Repels” suggests a force pushing the ion away. The key idea is that transfer of a charged particle from water into a non-polar environment is energetically unfavourable.\n\n**Scores instead:** “Na+ doesn’t cross the phospholipid bilayer directly because moving a charged ion into the non-polar core is energetically unfavourable.”\n\n## Giving facilitated diffusion an ATP cost\n\n**Commonly written:** “Facilitated diffusion uses ATP because a transport protein is involved.”\n\n**Why it doesn’t score:** Facilitated diffusion is passive. A protein supplies a selective route, but net movement remains down a concentration or electrochemical gradient.\n\n**Scores instead:** “Facilitated diffusion moves particles down their concentration or electrochemical gradient through a channel or carrier without ATP input.”\n\n## Defining active transport by protein use\n\n**Commonly written:** “It’s active transport because it uses a membrane protein.”\n\n**Why it doesn’t score:** Facilitated diffusion also uses membrane proteins. The defining evidence is movement against a gradient using energy.\n\n**Scores instead:** “This is active transport because the pump uses energy to move the substance against its concentration gradient.”\n\n## Saying water can’t cross without aquaporins\n\n**Commonly written:** “Water needs aquaporins because it can’t pass through the bilayer.”\n\n**Why it doesn’t score:** Water can cross the bilayer slowly. Aquaporins increase permeability and rate; they don’t create the water-potential difference or determine its direction.\n\n**Scores instead:** “Water can cross the bilayer slowly, while aquaporins increase its rate of movement down a water-potential gradient without using ATP.”\n\n## Giving only one effect of cholesterol\n\n**Commonly written:** “Cholesterol makes the membrane less fluid.”\n\n**Why it doesn’t score:** The direction of cholesterol's effect depends on temperature, so one flat statement misses the buffering role.\n\n**Scores instead:** “Cholesterol reduces excessive fluidity at higher temperatures and prevents close phospholipid packing at lower temperatures.”\n\n## Reversing the sodium–potassium pump\n\n**Commonly written:** “The pump moves two sodium ions out and three potassium ions in.”\n\n**Why it doesn’t score:** The numbers and directions are reversed, removing the unequal charge transfer that makes the pump electrogenic.\n\n**Scores instead:** “For each ATP hydrolyzed, the pump moves three Na+ out and two K+ in, making the cell interior relatively more negative.”\n\n## Putting ATP hydrolysis at the cotransporter\n\n**Commonly written:** “The sodium–glucose cotransporter uses ATP to bring glucose into the cell.”\n\n**Why it doesn’t score:** ATP is hydrolyzed by the sodium–potassium pump. The cotransporter uses energy stored in the Na+ electrochemical gradient.\n\n**Scores instead:** “The sodium–potassium pump uses ATP to establish a Na+ gradient, and Na+ moving down that gradient through the cotransporter drives glucose uptake against its gradient.”\n","cards":[{"id":"B2.1-01","q":"Describe a phospholipid and explain why phospholipids form a bilayer spontaneously in water.","a":"A phospholipid is amphipathic: it has a hydrophilic phosphate head and two hydrophobic hydrocarbon tails. In water, the heads face the aqueous solutions on both sides while the tails gather in the centre away from water. Hydrophobic interactions make this bilayer a stable arrangement, so no structure has to assemble each phospholipid into place.","note":"Name both regions, their orientations and the reason. The word amphipathic alone doesn’t explain bilayer formation.","marks":null},{"id":"B2.1-02","q":"Predict whether O2, Na+ and glucose can cross a phospholipid bilayer directly, and explain each prediction.","a":"O2 is small and non-polar, so it dissolves in the hydrophobic interior and crosses by simple diffusion. Na+ is charged, so entering the non-polar core is energetically unfavourable and it requires a transport protein. Glucose is relatively large and polar, so it also requires a specific transport protein.","note":"Don’t describe the core as repelling charge. The barrier is the energetic cost of moving a charged or polar particle into a non-polar environment.","marks":null},{"id":"B2.1-03","q":"Rebuild the transport comparison: for simple diffusion, facilitated diffusion, osmosis and active transport, state the route, ATP use and direction of net movement.","a":"Simple diffusion occurs through the phospholipid bilayer, uses no ATP and has net movement down a concentration gradient. Facilitated diffusion occurs through a channel or carrier, uses no ATP and has net movement down a concentration or electrochemical gradient. Osmosis is the net movement of water through a partially permeable membrane from higher to lower water potential; it uses no ATP and may be accelerated by aquaporins. Active transport uses a pump or carrier and energy to move a substance against its concentration or electrochemical gradient.","note":"This is the synthesis card. Produce all four rows before revealing the answer.","marks":null},{"id":"B2.1-04","q":"Explain how aquaporins affect osmosis and correct the claim that water can’t cross a membrane without them.","a":"Aquaporins are channel proteins that greatly increase membrane permeability to water, so water moves across the membrane more rapidly. Water can also cross the phospholipid bilayer slowly because it’s small, even though it’s polar. Aquaporins change the rate of osmosis, not its direction, and they don’t use ATP.","note":"The direction still depends on the water-potential difference across the membrane.","marks":null},{"id":"B2.1-05","q":"Distinguish integral membrane proteins from peripheral membrane proteins and give one possible role of each.","a":"Integral proteins are embedded in the phospholipid bilayer, and transmembrane proteins span it; an integral protein may act as a channel, carrier or pump. Peripheral proteins are attached to one membrane surface rather than embedded in the hydrophobic core; they may anchor the cytoskeleton or participate in signalling.","note":"Integral doesn’t always mean transmembrane. Some integral proteins are embedded in only one layer.","marks":null},{"id":"B2.1-06","q":"Explain both words in the fluid mosaic model of membrane structure.","a":"The membrane is fluid because phospholipids and some proteins can move laterally within the bilayer. It’s a mosaic because varied proteins, glycoproteins and other components are distributed through or on the phospholipid bilayer rather than forming one repeated pattern.","note":"","marks":null},{"id":"B2.1-07","q":"Explain how temperature and unsaturated fatty acid tails affect membrane fluidity.","a":"Higher temperature increases the kinetic energy and movement of phospholipids, increasing fluidity, while lower temperature reduces their movement. Cis double bonds create kinks in unsaturated tails, preventing close packing, so a greater proportion of unsaturated tails helps a membrane remain fluid at lower temperatures.","note":"","marks":null},{"id":"B2.1-08","q":"Explain the two-directional effect of cholesterol on the fluidity of animal cell membranes.","a":"At higher temperatures, cholesterol restrains phospholipid movement and reduces excessive fluidity. At lower temperatures, it prevents phospholipids from packing as closely and reduces solidification. Cholesterol therefore buffers membrane fluidity across a range of temperatures.","note":"An answer giving only one temperature condition is incomplete.","marks":null},{"id":"B2.1-09","q":"Describe glycoproteins and glycolipids and explain how their carbohydrate chains contribute to cell recognition and adhesion.","a":"Glycoproteins are proteins with attached carbohydrate chains, while glycolipids are lipids with attached carbohydrate chains. The chains project from the extracellular surface and can act as specific recognition markers or parts of receptors. Some membrane glycoproteins also bind cells to one another, contributing to adhesion.","note":"","marks":null},{"id":"B2.1-10","q":"Explain selective permeability using both the phospholipid bilayer and membrane transport proteins.","a":"The hydrophobic interior of the bilayer allows small non-polar molecules to cross more readily but restricts ions and most large polar molecules. Channels, carriers and pumps are selective for particular substances, so the set and activity of transport proteins in a membrane control which restricted substances can cross and in which direction.","note":"Selectivity isn’t caused by random holes between phospholipids.","marks":null},{"id":"B2.1-11","q":"Explain one complete cycle of the sodium–potassium pump, including ion numbers, direction and energy source.","a":"Three Na+ bind on the cytoplasmic side. ATP phosphorylates the pump, causing a conformational change that releases the Na+ outside. Two K+ then bind outside; dephosphorylation returns the protein to its original conformation and releases the K+ inside. One ATP is hydrolyzed per cycle, moving three Na+ out and two K+ in against their electrochemical gradients and making the inside relatively more negative.","note":"Three sodium out, two potassium in. The unequal exchange makes the pump electrogenic.","marks":null},{"id":"B2.1-12","q":"Trace the energy pathway that allows a sodium–glucose cotransporter to move glucose into an intestinal epithelial cell against its gradient.","a":"The sodium–potassium pump hydrolyzes ATP and moves Na+ out of the epithelial cell, maintaining a low intracellular Na+ concentration. Na+ then enters from the intestinal lumen down its electrochemical gradient through a sodium–glucose cotransporter. The coupled conformational change carries glucose into the cell against its gradient. This is indirect or secondary active transport because ATP is used by the pump, not by the cotransporter itself.","note":"Keep the causal chain intact: ATP powers the pump, the pump establishes the Na+ gradient, and the Na+ gradient powers glucose uptake.","marks":null},{"id":"B2.1-13","q":"Distinguish voltage-gated and ligand-gated ion channels by what opens them, and state what happens after opening.","a":"A voltage-gated channel opens or closes in response to a change in membrane potential. A ligand-gated channel opens or closes when a specific signalling molecule binds. Once open, ions move through the channel down their electrochemical gradient without ATP being hydrolyzed by the channel.","note":"","marks":null},{"id":"B2.1-14","q":"Explain why membrane fluidity is required for vesicle fission and fusion, and connect each process to a named example.","a":"Because phospholipids can move within a fluid bilayer, a membrane can bend, separate and reseal during fission, as when an endocytic vesicle forms. A vesicle membrane can also merge and become continuous with another membrane during fusion, as in exocytosis or delivery to an organelle. Both processes preserve a closed hydrophobic barrier around aqueous contents.","note":"","marks":null},{"id":"B2.1-15","q":"Correct this misconception: 'Any membrane transport that uses a protein is active transport.'","a":"Protein use doesn’t make transport active. Facilitated diffusion uses a channel or carrier but remains passive because particles move down their concentration or electrochemical gradient without ATP input. Active transport moves a substance against its gradient using an energy source and a pump or carrier.","note":"In a comparison, write about both gradient direction and energy source.","marks":null},{"id":"B2.1-16","q":"Explain how cell-adhesion proteins allow individual cells to form a tissue.","a":"Cell-adhesion proteins in one cell membrane bind to specific proteins on neighbouring cells or to the extracellular matrix. These attachments hold cells in stable positions and connect them mechanically, allowing cells to remain organized as a tissue rather than separating.","note":"","marks":null}],"exam":[{"question":"## Q1. Explain how phospholipid structure causes a bilayer to form in water. **[4]**","scheme":"- A phospholipid has a hydrophilic/polar phosphate head and hydrophobic/non-polar hydrocarbon tails. **[1]**\n- The heads interact with / face the aqueous solutions. **[1]**\n- The tails are excluded from water / cluster away from water. **[1]**\n- A bilayer forms spontaneously with heads facing out on both sides and tails facing inward. **[1]**\n\n_Examiner note: naming the molecule amphipathic isn’t the explanation. Full marks require the orientation of both regions and the interaction with water._"},{"question":"## Q2. Compare and contrast facilitated diffusion and active transport across a membrane. **[5]**","scheme":"- Both use specific integral membrane proteins / carriers can be involved in both. **[1]**\n- Facilitated diffusion is passive, whereas active transport requires an energy source. **[1]**\n- Facilitated diffusion moves substances down a concentration/electrochemical gradient, whereas active transport moves them against one. **[1]**\n- Facilitated diffusion may use channels or carriers, whereas direct active transport uses pumps/carriers that undergo conformational change. **[1]**\n- Facilitated diffusion tends to reduce a gradient, whereas active transport can establish or maintain a gradient. **[1]**\n\n_Examiner note: two separate descriptions aren’t a comparison. Pair each similarity or difference in the same sentence._"},{"question":"## Q3. Explain sodium-dependent glucose uptake from the intestinal lumen into an epithelial cell. **[5]**","scheme":"- The sodium–potassium pump hydrolyzes ATP / uses energy to move Na+ out of the epithelial cell. **[1]**\n- This maintains a low Na+ concentration inside the cell / establishes a Na+ electrochemical gradient. **[1]**\n- Na+ moves into the cell down its electrochemical gradient through a sodium–glucose cotransporter. **[1]**\n- Glucose is carried into the cell at the same time against its concentration gradient. **[1]**\n- This is indirect/secondary active transport because ATP is used by the pump rather than by the cotransporter. **[1]**\n\n_Examiner note: “active transport moves glucose in” misses the causal chain. Full marks connect ATP to the pump, the pump to the Na+ gradient and that gradient to glucose uptake._"},{"question":"## Q4. Outline how cholesterol affects the fluidity of an animal cell membrane. **[3]**","scheme":"- Cholesterol is positioned between phospholipids in the bilayer. **[1]**\n- At higher temperatures it restricts phospholipid movement / reduces excessive fluidity. **[1]**\n- At lower temperatures it prevents close phospholipid packing / reduces solidification. **[1]**\n\n_Examiner note: cholesterol doesn’t move fluidity in one fixed direction. One temperature condition gives an incomplete answer._"},{"question":"## Q5. Distinguish voltage-gated channels from ligand-gated channels. **[3]**","scheme":"- Voltage-gated channels respond to a change in membrane potential. **[1]**\n- Ligand-gated channels respond when a specific signalling molecule binds. **[1]**\n- When open, both allow specific ions to move down their electrochemical gradients / neither channel directly hydrolyzes ATP for ion movement. **[1]**\n\n_Examiner note: “both open when stimulated” gains no distinction mark. Name the different stimulus for each channel._"},{"question":"## Q6. Explain how membrane properties allow vesicles to form and fuse. **[4]**","scheme":"- Phospholipids move laterally, making the bilayer fluid/flexible. **[1]**\n- The membrane can bend and undergo fission to enclose material in a vesicle / accept: endocytosis as a named example. **[1]**\n- A vesicle membrane can fuse with another membrane / accept: exocytosis or organelle delivery as a named example. **[1]**\n- The bilayers reseal so hydrophobic tails remain away from water / a closed barrier is maintained. **[1]**\n\n_Examiner note: describing a vesicle moving isn’t enough. The question asks why the membrane can split, merge and reseal without exposing its hydrophobic tails to water._"}],"mcq":[{"id":"B2.1-q01","topic":"B2.1","kind":"mcq","lead":"","quote":"","prompt":"Why do phospholipids form a bilayer when placed in water?","options":[{"text":"The cell uses ATP to arrange them tail to tail","correct":false,"why":"No energy is spent building it. The bilayer forms on its own because of how the molecule interacts with water."},{"text":"Hydrophilic heads face water and hydrophobic tails are shielded","correct":true,"why":"The heads interact with the water on both sides, and the tails end up in the center, away from it."},{"text":"Water pushes the tails together with a repulsive force","correct":false,"why":"Nothing pushes. Water molecules bond with each other and the heads, and that leaves the tails together."},{"text":"Covalent bonds form between tails in the two layers","correct":false,"why":"The two layers aren't bonded together. Hydrophobic interactions hold the tails in the middle."}],"after":null},{"id":"B2.1-q02","topic":"B2.1","kind":"mcq","lead":"","quote":"","prompt":"Which of these crosses the phospholipid bilayer by simple diffusion?","options":[{"text":"Sodium ions","correct":false,"why":"Ions are charged, so they need a channel or a pump to get through."},{"text":"Glucose","correct":false,"why":"Glucose is large and polar, so it crosses through a carrier protein."},{"text":"Oxygen","correct":true,"why":"Oxygen is small and non-polar, so it passes straight through the hydrophobic core."},{"text":"Amino acids","correct":false,"why":"Amino acids are charged or polar, so they need transport proteins."}],"after":null},{"id":"B2.1-q03","topic":"B2.1","kind":"mcq","lead":"","quote":"","prompt":"Why can't ions cross the phospholipid bilayer directly?","options":[{"text":"The hydrophobic core repels charged particles","correct":false,"why":"That's the trap. The core doesn't push ions away. Moving a charge into a non-polar region costs too much energy."},{"text":"Moving a charged ion into the non-polar core is energetically unfavorable","correct":true,"why":"An ion interacts well with water and not at all with the tails, so it stays out of the core."},{"text":"Ions are too large to fit between the phospholipids","correct":false,"why":"Many ions are smaller than oxygen or water molecules. Charge is the problem, not size."},{"text":"The phosphate heads bond permanently to any ion","correct":false,"why":"The heads don't trap ions. The barrier is the hydrophobic core."}],"after":null},{"id":"B2.1-q04","topic":"B2.1","kind":"mcq","lead":"","quote":"","prompt":"Which describes facilitated diffusion?","options":[{"text":"Through a channel or carrier protein, down the gradient, without ATP","correct":true,"why":"The protein gives a route through the membrane. The gradient supplies the energy, so no ATP is spent."},{"text":"Through a pump protein, down the gradient, using ATP to speed it up","correct":false,"why":"Facilitated diffusion never uses ATP. If you give it an ATP cost, the examiner reads it as active transport."},{"text":"Directly through the bilayer, down the gradient, without any proteins","correct":false,"why":"That's simple diffusion. \"Facilitated\" means a protein helps."},{"text":"Through a channel protein, against the gradient, powered by ATP","correct":false,"why":"Moving against a gradient needs energy, and that's active transport."}],"after":null},{"id":"B2.1-q05","topic":"B2.1","kind":"mcq","lead":"","quote":"","prompt":"What makes a transport process active?","options":[{"text":"It moves a substance through a membrane protein","correct":false,"why":"Facilitated diffusion uses proteins too. Protein use doesn't make it active."},{"text":"It moves a substance against its gradient using energy","correct":true,"why":"Energy, usually ATP, is spent to move something from low concentration to high."},{"text":"It moves a substance faster than simple diffusion","correct":false,"why":"Speed doesn't define it. Aquaporins speed up osmosis and that's still passive."},{"text":"It moves water toward a lower water potential","correct":false,"why":"That's osmosis, which is passive."}],"after":null},{"id":"B2.1-q06","topic":"B2.1","kind":"mcq","lead":"","quote":"","prompt":"What do aquaporins do?","options":[{"text":"Let water cross a membrane it otherwise couldn't cross","correct":false,"why":"Water can cross the bilayer without them, only slowly. Aquaporins speed it up."},{"text":"Speed up osmosis without using any ATP","correct":true,"why":"They're channels that greatly increase permeability to water. They change the rate, not the direction."},{"text":"Pump water against its gradient using ATP","correct":false,"why":"Aquaporins are channels, not pumps. Water still moves toward the lower water potential."},{"text":"Reverse the direction of osmosis when needed","correct":false,"why":"Direction is set by the water potential difference. Aquaporins only change how fast it happens."}],"after":null},{"id":"B2.1-q07","topic":"B2.1","kind":"mcq","lead":"","quote":"","prompt":"What does cholesterol do to an animal cell membrane?","options":[{"text":"Makes the membrane more fluid at every temperature","correct":false,"why":"It works in both directions. Giving only one effect is a common way to drop the mark."},{"text":"Makes the membrane more rigid at every temperature","correct":false,"why":"At low temperatures it does the opposite and stops the membrane from becoming too rigid."},{"text":"Carries ions across the membrane by diffusion","correct":false,"why":"Cholesterol isn't a transport molecule. Its job is fluidity."},{"text":"Limits fluidity when warm and prevents stiffening when cold","correct":true,"why":"Cholesterol buffers fluidity. It restrains phospholipids when warm and stops them packing tightly when cold."}],"after":null},{"id":"B2.1-q08","topic":"B2.1","kind":"mcq","lead":"","quote":"","prompt":"Why does a higher proportion of unsaturated fatty acid tails keep a membrane fluid at low temperatures?","options":[{"text":"Kinks from double bonds stop the tails packing closely","correct":true,"why":"Cis double bonds bend the tails. Bent tails can't line up tightly, so the membrane stays fluid."},{"text":"Unsaturated tails are longer, so they move around more","correct":false,"why":"Length isn't the point. The double bonds cause kinks, and kinks prevent close packing."},{"text":"Unsaturated tails are hydrophilic, so they attract water","correct":false,"why":"Unsaturated tails are still hydrophobic. They sit in the core like the saturated ones."},{"text":"Double bonds release heat that warms the membrane","correct":false,"why":"Double bonds don't generate heat. They change the tails' shape."}],"after":null},{"id":"B2.1-q09","topic":"B2.1","kind":"mcq","lead":"","quote":"","prompt":"In one cycle of the sodium–potassium pump, which ions move and in which direction?","options":[{"text":"Three Na+ move in and two K+ move out","correct":false,"why":"That's reversed. Sodium is pumped out of the cell and potassium in."},{"text":"Two Na+ move out and three K+ move in","correct":false,"why":"The numbers are swapped. It's three sodium out, two potassium in."},{"text":"Three Na+ move out and two K+ move in","correct":true,"why":"One ATP per cycle moves three sodium out and two potassium in, both against their gradients."},{"text":"Three Na+ and two K+ both move out","correct":false,"why":"It's an exchange. Sodium goes out and potassium comes in."}],"after":null},{"id":"B2.1-q10","topic":"B2.1","kind":"mcq","lead":"","quote":"","prompt":"In sodium-dependent glucose cotransport, where is ATP hydrolyzed?","options":[{"text":"At the cotransporter, every time it moves a glucose","correct":false,"why":"That's the trap. The cotransporter uses no ATP itself. It uses the sodium gradient."},{"text":"At the sodium–potassium pump that builds the Na+ gradient","correct":true,"why":"The pump spends ATP making the sodium gradient. Sodium flowing back through the cotransporter drags glucose with it."},{"text":"Nowhere, since glucose moves down its own gradient","correct":false,"why":"Glucose is moved against its gradient here. The energy comes indirectly from ATP used at the pump."},{"text":"Inside the glucose molecule once it's in the cell","correct":false,"why":"That's respiration, which happens after transport. The transport step is paid for at the pump."}],"after":null},{"id":"B2.1-q11","topic":"B2.1","kind":"mcq","lead":"","quote":"","prompt":"What opens a ligand-gated ion channel?","options":[{"text":"A change in voltage across the membrane","correct":false,"why":"That's a voltage-gated channel. The two types are told apart by what opens them."},{"text":"A specific chemical, such as a neurotransmitter, binding","correct":true,"why":"A ligand is a signaling molecule. When it binds the channel, the channel changes shape and opens."},{"text":"Energy released when ATP is hydrolyzed","correct":false,"why":"Channels don't use ATP. That's how pumps work."},{"text":"A difference in water potential across the membrane","correct":false,"why":"Water potential drives osmosis. It doesn't open ion channels."}],"after":null},{"id":"B2.1-q12","topic":"B2.1","kind":"mcq","lead":"","quote":"","prompt":"What is the role of glycoproteins on the outer surface of the membrane?","options":[{"text":"Pumping ions against their gradients using ATP","correct":false,"why":"That's pump proteins. Glycoproteins have carbohydrate chains that face outward for recognition."},{"text":"Cell recognition and adhesion between cells","correct":true,"why":"Their carbohydrate chains act as identity markers other cells can recognize, and they help cells stick together."},{"text":"Controlling membrane fluidity at low temperatures","correct":false,"why":"That's cholesterol and unsaturated tails."},{"text":"Letting water cross the membrane faster","correct":false,"why":"That's aquaporins."}],"after":null},{"id":"B2.1-t1","topic":"B2.1","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"The cell builds phospholipids into a bilayer.","prompt":"Why does it fail?","options":[{"text":"This replaces the molecular explanation with an unnamed process. The examiner wants the hydrophilic and hydrophobic regions related to water.","correct":true,"why":"That’s exactly why it fails."},{"text":"“Repels” suggests a force pushing the ion away. The key idea is that transfer of a charged particle from water into a non-polar environment is energetically unfavourable.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying the hydrophobic core repels ions."},{"text":"Facilitated diffusion is passive. A protein supplies a selective route, but net movement remains down a concentration or electrochemical gradient.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: giving facilitated diffusion an ATP cost."},{"text":"Facilitated diffusion also uses membrane proteins. The defining evidence is movement against a gradient using energy.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: defining active transport by protein use."}],"after":{"label":"What would have scored","text":"Phospholipids form a bilayer spontaneously, with hydrophilic heads facing the aqueous solutions and hydrophobic tails sheltered in the centre away from water."}},{"id":"B2.1-t2","topic":"B2.1","kind":"tr
