<style>
:root {
  --bg: #fbfaf8; --panel: #fff; --ink: #1a1a1a; --muted: #6b6b6b;
  --line: #e4e1dc; --accent: #2b6cb0; --accent-ink: #fff;
  --good: #2f7a46; --mid: #a8700a; --bad: #b03a35;
  --radius: 10px; --max: 44rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181c; --panel: #1e2126; --ink: #e9e7e3; --muted: #9a9894;
    --line: #2e3238; --accent: #6fa8dc; --accent-ink: #12141a;
    --good: #6bbf85; --mid: #d9a441; --bad: #e0796f;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 16px 96px; }
header {
  position: sticky; top: 0; z-index: 10; background: var(--bg);
  border-bottom: 1px solid var(--line); margin-bottom: 20px;
}
.bar { max-width: var(--max); margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.brand { font-weight: 700; letter-spacing: -0.01em; margin-right: auto; cursor: pointer; }
.brand small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); letter-spacing: 0; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button {
  background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px;
  padding: 6px 10px; border-radius: 7px; cursor: pointer;
}
nav button:hover { background: var(--line); color: var(--ink); }
nav button[aria-current="page"] { background: var(--ink); color: var(--bg); }
h1 { font-size: 24px; line-height: 1.25; margin: 0 0 4px; letter-spacing: -0.02em; }
h2 { font-size: 18px; margin: 28px 0 10px; letter-spacing: -0.01em; }
h3 { font-size: 15px; margin: 18px 0 6px; }
p { margin: 0 0 12px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px; margin: 0 0 14px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
  font: inherit; font-weight: 600; padding: 11px 18px; cursor: pointer; text-decoration: none;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn.wide { width: 100%; }
.btn.sm { padding: 7px 12px; font-size: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.grade button {
  font: inherit; font-weight: 600; padding: 14px 6px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); line-height: 1.3;
}
.grade button span { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
.grade button:hover { border-color: currentColor; }
.g-got:hover { color: var(--good); } .g-shaky:hover { color: var(--mid); } .g-missed:hover { color: var(--bad); }
.q { font-size: 19px; font-weight: 600; line-height: 1.45; margin: 0 0 4px; }
.a { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 16px; }
.box { color: var(--muted); margin-right: 3px; }
.box.done { color: var(--good); }
#view ul ul { margin: 6px 0 0; }
pre {
  background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
  padding: 10px 12px; overflow-x: auto; font-size: 13px; line-height: 1.5;
}
code { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 0.9em; }
pre code { background: none; border: 0; padding: 0; }
.note { color: var(--muted); font-size: 14px; font-style: italic; margin-top: 10px; }
.meta { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 10px; }
.pill { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.pill.hl { border-color: var(--mid); color: var(--mid); }
.pill.due { border-color: var(--accent); color: var(--accent); }
ul.clean { list-style: none; padding: 0; margin: 0; }
ul.clean li { padding: 11px 0; border-bottom: 1px solid var(--line); }
ul.clean li:last-child { border-bottom: 0; }
.topic-row { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; padding: 0; }
.topic-row:hover .code { color: var(--accent); }
.code { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3.1em; }
.topic-row .t { flex: 1; }
.bar-track { height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; width: 70px; flex-shrink: 0; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 99px; }
.stat { display: flex; gap: 22px; margin: 0 0 18px; flex-wrap: wrap; }
.stat div b { display: block; font-size: 26px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
.stat div span { font-size: 12px; color: var(--muted); }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps li { counter-increment: s; position: relative; padding: 0 0 14px 36px; }
.steps li::before {
  content: counter(s); position: absolute; left: 0; top: 0;
  width: 24px; height: 24px; border-radius: 99px; background: var(--ink); color: var(--bg);
  display: grid; place-items: center; font-size: 13px; font-weight: 700;
}
.steps b { display: block; }
.steps small { color: var(--muted); }
.capture { background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 14px; margin: 12px 0; }
.capture textarea {
  width: 100%; min-height: 140px; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 7px; padding: 10px; font: inherit; resize: vertical;
}
.scheme { background: var(--bg); border-left: 3px solid var(--accent); padding: 12px 14px; border-radius: 0 7px 7px 0; }
.scheme ul { margin: 0; padding-left: 18px; }
.scheme li { margin-bottom: 6px; }
a { color: var(--accent); }
.vid { display: block; padding: 12px 0; border-bottom: 1px solid var(--line); }
.vid:last-child { border-bottom: 0; }
.watchfor { margin: 8px 0 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
.progress-track { height: 4px; background: var(--line); border-radius: 99px; margin: 14px 0 0; overflow: hidden; }
.progress-track div { height: 100%; background: var(--accent); transition: width .25s; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px;
  font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50;
}
.toast.show { opacity: 1; }
.hide { display: none !important; }
@media (max-width: 480px) {
  h1 { font-size: 21px; }
  .q { font-size: 17px; }
  .bar { padding: 10px 12px; }
  .wrap { padding: 0 12px 80px; }
}
@media print { header, nav, .btn, .grade { display: none !important; } }

<script>window.__STUDY_DATA__ = {"course":{"id":"bio-hl","title":"Biology HL"},"themes":{"A":"Unity and diversity","B":"Form and function","C":"Interaction and interdependence","D":"Continuity and change"},"levels":{"1":"Molecules","2":"Cells","3":"Organisms","4":"Ecosystems"},"book":{"author":"Andrew Allott","title":"Biology Study Guide","edition":"2023 edition","answersUrl":"https://www.oxfordsecondary.com/ib-science-support"},"method":"\nRead this once. It is short, and it explains why the system asks you to do the\none thing you will not want to do.\n\n## The problem with videos\n\nYou already know you learn well from videos. That is real, and it is worth\nbuilding on — a good explanation with moving pictures will get an idea into\nyour head faster than a textbook page will.\n\nBut there is a catch, and it is the reason a topic can feel clear on Sunday and\nblank on Thursday.\n\nWhen you watch someone explain cell respiration, you follow along. Each step\nmakes sense as it arrives. At the end you feel like you understand it, and that\nfeeling is honest — you *did* understand it while it was in front of you. What\nyou have built is the ability to **recognise** the explanation. Recognition is\nfast, it feels like knowledge, and it disappears within days.\n\nAn exam never asks you to recognise anything. It asks you to **produce** it,\nfrom nothing, on a blank page, under time pressure. That is a different skill,\nand watching does not train it.\n\n## What actually makes things stick\n\nTrying to remember something is what moves it into long-term memory. Not\nreading it again. Not highlighting it. Not watching a second video.\n\nThe uncomfortable part: the harder the recall feels, the better it works.\nStruggling to remember something and eventually getting it does more for you\nthan reading it smoothly ten times. Which means the study method that feels\nmost productive is usually the one doing the least.\n\nThat is the whole reason this system exists. It is built to take what you get\nfrom videos — which is genuinely a lot — and force it through the step that\nmakes it permanent.\n\n## The loop\n\nFour steps, about forty minutes.\n\n**1. Watch (15 min).** One video. Not three. `study watch C1.2` gives you the\nvideo and, more importantly, the specific questions to hold in your head while\nyou watch. Watching with a question is an active thing. Watching without one is\ntelevision.\n\n**2. Capture (5 min).** Close the laptop. On paper, write down what you\nremember. Three things you can now state, one thing you could explain out loud,\none thing that is still fuzzy.\n\nThis step will feel bad. You will sit there having just watched a clear\nexplanation and produce almost nothing. **That is not a sign the video failed or\nthat you are bad at this.** That gap — between what you could follow and what\nyou can produce — is the actual state of your knowledge, and every student has\nit. The difference is that most never look at it, so they find out in the exam.\n\n**Then open the Allott study guide** at the same topic code and read the\nsection. It is deliberately condensed — a few pages a topic — which makes it a\nfast way to see what you left out. Mark every point you missed. Those are the\nones to watch for in the quiz.\n\nDo it in that order. The book after the brain-dump is a check. The book before\nit is just reading, and reading is the thing that does not work.\n\n**3. Recall (10 min).** `study quiz`. Say each answer out loud before you reveal\nit. Out loud matters: thinking \"yeah, I know this\" is exactly the recognition\nfeeling that got you here.\n\nMark yourself honestly. A card you half-had is a card you missed. The system\nuses your answers to decide when to show each card again, so lying to it only\nmeans it stops showing you the things you most need.\n\n**4. Check (10 min).** `study exam C1.2`. One real exam-style question with a\nreal mark scheme. Write the answer properly, then mark yourself strictly. This\nis where you find out that you understood the biology and still lost two marks\nfor writing \"describe\" when the question said \"explain\".\n\nWhen you want more of these, your study guide has a question set at the end of\neach group — `study exam` tells you the page — and the answers are free at\n\u003chttps://www.oxfordsecondary.com/ib-science-support>. Those are worth more than\nanother video, every time.\n\n## Why cards come back when they do\n\nCards you get right move further away — one day, then three, then a week, then\nover a month. Cards you miss come straight back tomorrow.\n\nSo the deck automatically concentrates on what you do not know, and the stuff\nyou have solid stops wasting your time. Twenty minutes on the right twenty\ncards beats two hours re-reading a chapter, and it is not close.\n\nYou cannot cram this. Six short sessions across two weeks will leave you with\nmore than one six-hour session, even though the six-hour session feels more\nlike work. Spacing is doing something real: every time you retrieve a fact\nafter nearly forgetting it, you make it harder to forget next time.\n\n## What a bad week looks like\n\nYou will have weeks where you do nothing. The cards pile up and opening the\nthing feels worse every day.\n\nWhen that happens, do not try to clear the backlog. Run `study quiz --limit 10`\nand do ten cards. Then stop. Ten cards today beats a heroic session you keep\npostponing, and it beats zero, which is what usually actually happens.\n\n## The short version\n\n- Watching is how the idea gets in. Recall is how it stays.\n- The step that feels worst is the step that works.\n- The book comes *after* the brain-dump, never before it.\n- Be honest when you mark yourself. The system is only as good as your grading.\n- Little and often. Always.\n","topics":[{"code":"A1.1","title":"Water","theme":"A","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"1-3","questionsPage":8,"bookTitle":null,"pack":{"oneLiner":"Water's bent, polar structure lets it form hydrogen bonds and dissolve charged or polar substances, which explains its roles in transport, temperature control, habitats and metabolism.","essentials":"\n> Tick a line only after you can do it with the page closed and without prompts.\n\n## Core\n\n- [ ] Explain why oxygen and hydrogen share electrons unequally in water, and why the molecule's bent shape gives it two differently charged regions.\n- [ ] Distinguish the polar covalent bonds inside a water molecule from the hydrogen bonds between water molecules.\n- [ ] Explain how many individually weak hydrogen bonds produce water's cohesion and surface tension.\n- [ ] Distinguish cohesion from adhesion and connect both properties to the movement of water through xylem.\n- [ ] Explain how water surrounds ions and polar molecules, allowing them to dissolve and move in aqueous solutions.\n- [ ] Predict whether a biological substance will be hydrophilic or hydrophobic from its charge and polarity.\n- [ ] Explain why water is a medium for metabolic reactions and for transport in blood, tissue fluid and plant sap.\n- [ ] Explain how organisms transport poorly soluble substances, using oxygen and lipids as named examples.\n- [ ] Compare water with air in density, buoyancy, viscosity, thermal conductivity and specific heat capacity, then link the differences to animal adaptations.\n- [ ] Explain how high specific heat capacity limits temperature change and how high latent heat of vaporization makes evaporation an effective cooling process.\n- [ ] Outline why the search for extraterrestrial life focuses on liquid water, without claiming that water proves life is present.\n\n## Links to other topics\n\n- **B2.1 Membranes and membrane transport** — polarity explains why phospholipids arrange into bilayers. If hydrophilic and hydrophobic interactions are secure here, membrane structure has a cause rather than becoming another diagram to memorise.\n- **B3.2 Transport** — transpiration applies cohesion, adhesion and evaporation to an entire plant. A1.1 supplies the molecular explanation for the mechanism.\n- **D2.3 Water potential** — osmosis depends on water as a solvent and on differences in the tendency of water to move. Accurate solvent language here prevents confusion later.\n- **D3.3 Homeostasis** — sweating works because evaporation requires energy. The homeostasis question is an application of latent heat of vaporization.\n\n## Vocabulary that has to be exact\n\n| Term | What it means | What it is not |\n| --- | --- | --- |\n| Electronegativity | The tendency of an atom to attract a shared pair of electrons | An atom's overall electrical charge |\n| Polar molecule | A molecule with an uneven distribution of charge and partial positive and negative regions | An ion; water remains neutral overall |\n| Polar covalent bond | A covalent bond in which electrons are shared unequally | A hydrogen bond between molecules |\n| Hydrogen bond | An attraction between a partially positive hydrogen and a partially negative electronegative atom on another molecule | The O–H bond within one water molecule |\n| Cohesion | Attraction between molecules of the same substance, such as water and water | Adhesion to another surface |\n| Adhesion | Attraction between different substances, such as water and cellulose | Cohesion between water molecules |\n| Hydrophilic | Charged or polar and able to interact with water | Any substance found inside an organism |\n| Hydrophobic | Non-polar and poorly soluble in water | A substance pushed away by a repulsive force |\n| Specific heat capacity | Energy needed to raise the temperature of unit mass by one degree | Energy needed for a liquid to evaporate |\n| Latent heat of vaporization | Energy needed to change a liquid to a gas without changing temperature | The temperature at which a substance boils |\n","videos":"\nWatch **one** main video. Then close it and write what you can produce from memory. Watching another version immediately strengthens recognition, and recognition is the skill that has been hiding the gaps.\n\n## Main\n\n**Alex Lee Biology — A1.1 Water**\n\n- Channel: \u003chttps://www.youtube.com/@misterleescience> — verified\n- Search: \u003chttps://www.youtube.com/results?search_query=Mister+Lee+Science+A1.1+Water>\n\nAlex Lee organizes the course by the current IB topic codes, so start with the explanation built for A1.1.\n\n**Watch for:**\n\n- Why oxygen attracts the shared electrons more strongly than hydrogen does.\n- Why the two O–H bond dipoles do not cancel in a bent molecule.\n- How the explanation moves from hydrogen bonding to cohesion, adhesion and thermal properties.\n- Which property of water explains each biological example, rather than memorizing the example alone.\n\n**Pause at:** the first labelled water molecule. Hide the labels, draw its shape, add δ− and δ+ in the correct places, and explain aloud why the whole molecule is polar but not charged.\n\n## If that did not land\n\n**Khan Academy — hydrogen bonding and water**\n\n- Search: \u003chttps://www.youtube.com/results?search_query=Khan+Academy+hydrogen+bonding+water+properties>\n\nUse this if the chemistry under polarity and hydrogen bonding is the part you cannot yet reproduce.\n\n**Amoeba Sisters — properties of water**\n\n- Search: \u003chttps://www.youtube.com/results?search_query=Amoeba+Sisters+properties+of+water>\n\nUse this for a shorter biological explanation. When it ends, return to recall instead of opening a third video.\n\n## Worth it once, not for revision\n\nA hydrogen-bond network changes from moment to moment, so an **animation** earns one exception to the one-video rule. Movement shows the bonds forming and breaking more clearly than a static paragraph can.\n\n- Search: \u003chttps://www.youtube.com/results?search_query=water+molecules+hydrogen+bonds+animation>\n\nAfter watching, draw four water molecules. Use solid lines for polar covalent bonds and dotted lines for hydrogen bonds. If the two bond types end up in the same place, watch that segment again.\n\n## Pinned\n","traps":"\n## Calling partial charges full charges\n\n**Commonly written:** \"The oxygen in water is negative and the hydrogens are positive.\"\n\n**Why it does not score:** The atoms carry partial charges because electrons are shared unequally. The molecule remains neutral overall.\n\n**Scores instead:** \"Oxygen attracts the shared electrons more strongly, so it has a partial negative charge and each hydrogen has a partial positive charge.\"\n\n## Putting hydrogen bonds inside the molecule\n\n**Commonly written:** \"Hydrogen bonds join oxygen to hydrogen in a water molecule.\"\n\n**Why it does not score:** The O–H bonds within one molecule are polar covalent bonds. Hydrogen bonds act between separate molecules.\n\n**Scores instead:** \"Polar covalent bonds join oxygen to hydrogen within each molecule, while hydrogen bonds form between neighbouring water molecules.\"\n\n## Saying cohesion causes transpiration pull\n\n**Commonly written:** \"Cohesion pulls water from the roots to the leaves.\"\n\n**Why it does not score:** Cohesion transmits tension through the water column. Evaporation from the leaf creates the tension.\n\n**Scores instead:** \"Transpiration creates tension in the xylem, and cohesion transmits that tension through an unbroken column of water.\"\n\n## Treating adhesion and cohesion as interchangeable\n\n**Commonly written:** \"Adhesion keeps water molecules joined together in xylem.\"\n\n**Why it does not score:** Water-to-water attraction is cohesion. Adhesion is attraction between water and the vessel wall.\n\n**Scores instead:** \"Cohesion keeps water molecules connected, while adhesion helps water cling to the hydrophilic xylem walls.\"\n\n## Saying hydrophobic substances are repelled\n\n**Commonly written:** \"Water pushes lipids away because they are hydrophobic.\"\n\n**Why it does not score:** No repulsive force is required. Non-polar lipids lack favorable interactions with water, while water molecules continue hydrogen bonding with one another.\n\n**Scores instead:** \"Lipids are poorly soluble because they are non-polar and cannot form favorable electrostatic interactions with water.\"\n\n## Using specific heat capacity to explain sweating\n\n**Commonly written:** \"Sweat cools the body because water has a high specific heat capacity.\"\n\n**Why it does not score:** Sweating involves a change from liquid to vapor, so the relevant property is latent heat of vaporization.\n\n**Scores instead:** \"Evaporation of sweat removes a large amount of energy from the skin because water has a high latent heat of vaporization.\"\n\n## Listing facts instead of comparing habitats\n\n**Commonly written:** \"Water is dense and viscous. Air contains oxygen.\"\n\n**Why it does not score:** A compare-and-contrast question requires paired statements that use one medium as the reference for the other.\n\n**Scores instead:** \"Water is more viscous than air, so aquatic animals experience greater drag and benefit from streamlined bodies.\"\n\n## Treating water as proof of extraterrestrial life\n\n**Commonly written:** \"Liquid water on a planet means that life exists there.\"\n\n**Why it does not score:** Water indicates a potentially suitable condition for known life. It does not show that organisms are present.\n\n**Scores instead:** \"Liquid water indicates potential habitability for life as we know it, but its presence alone does not demonstrate life.\"\n","cards":[{"id":"A1.1-01","q":"Explain fully why a water molecule is polar but has no overall charge.","a":"Oxygen is more electronegative than hydrogen, so it attracts the shared electrons in each O–H bond more strongly. Oxygen develops a partial negative charge and the hydrogen atoms develop partial positive charges. Water is bent, so the two bond dipoles do not cancel. The molecule is polar even though its total charge remains zero.","note":"A complete answer needs unequal sharing, partial charges and the bent shape.","marks":null},{"id":"A1.1-02","q":"Distinguish the O–H bonds within one water molecule from the bonds between neighbouring water molecules.","a":"Within one water molecule, oxygen and hydrogen are joined by polar covalent bonds in which electrons are shared unequally. Between neighbouring water molecules, a hydrogen bond forms between a partially positive hydrogen and a partially negative oxygen. A hydrogen bond is an intermolecular attraction and is weaker than a covalent bond.","note":"Putting hydrogen bonds inside the molecule is a common mark-losing error.","marks":null},{"id":"A1.1-03","q":"Explain how many weak hydrogen bonds can give water strong cohesive behavior.","a":"Each hydrogen bond between water molecules is weak and forms or breaks readily. A body of water contains a very large number of these bonds at the same time. Their combined attraction keeps water molecules associated, producing cohesion even though no single hydrogen bond is strong.","note":"","marks":null},{"id":"A1.1-04","q":"Distinguish cohesion from adhesion and give one biological consequence of each.","a":"Cohesion is attraction between water molecules, and it helps an unbroken column of water remain under tension in xylem. Adhesion is attraction between water and another polar surface, and it helps water cling to the cellulose walls of xylem vessels.","note":"State what is attracted to what before giving the example.","marks":null},{"id":"A1.1-05","q":"Explain the complete sequence by which water is pulled from roots toward leaves in xylem.","a":"Water evaporates from mesophyll cell walls and leaves through stomata, creating tension in the xylem. Cohesion caused by hydrogen bonding transmits the tension through a continuous column of water. Adhesion between water and the hydrophilic xylem walls helps support the column against gravity as it is pulled upward.","note":"Transpiration provides the pull. Cohesion transmits it. Adhesion supports the column.","marks":null},{"id":"A1.1-06","q":"Explain how cohesion produces surface tension at the surface of water.","a":"Water molecules at the surface form hydrogen bonds with neighbouring molecules beside and below them. The resulting inward cohesive attraction makes the surface resist being stretched or broken. This surface tension can support small organisms at the air–water boundary.","note":"","marks":null},{"id":"A1.1-07","q":"Explain at the molecular level how water dissolves sodium chloride.","a":"The partially negative oxygen regions of water molecules orient toward Na+ ions, while the partially positive hydrogen regions orient toward Cl− ions. These attractions separate the ions from the crystal and surround each ion with a hydration shell, keeping the ions dispersed in solution.","note":"","marks":null},{"id":"A1.1-08","q":"Predict how water interacts differently with polar and non-polar substances, and explain the difference.","a":"Water forms hydrogen bonds or other electrostatic attractions with polar or charged substances, so many of them dissolve. Non-polar substances cannot form comparable favorable interactions with water, so water continues bonding with itself and excludes them, leaving them poorly soluble.","note":"Hydrophobic substances are not pushed away by water. They lack favorable interactions with it.","marks":null},{"id":"A1.1-09","q":"Explain why water is an effective medium for metabolism and transport in living organisms.","a":"Ions and many polar molecules dissolve in water, allowing reactants to move, collide and undergo enzyme-catalyzed reactions in aqueous cytoplasm. Dissolved substances can also be carried in blood plasma, tissue fluid and plant sap. Water therefore provides both a reaction medium and a transport medium.","note":"","marks":null},{"id":"A1.1-10","q":"Explain how blood transports oxygen and lipids even though both have limited solubility in water.","a":"Most oxygen is carried bound reversibly to haemoglobin inside red blood cells rather than dissolved in plasma. Hydrophobic lipids are carried in lipoproteins, which have hydrophilic outer surfaces that interact with plasma and hydrophobic interiors that enclose the lipids.","note":"Haemoglobin-bound oxygen is carried in red blood cells, not dissolved in plasma.","marks":null},{"id":"A1.1-11","q":"Compare density and viscosity in water and air, then explain one consequence of each difference for animals.","a":"Water is denser than air and provides greater buoyancy, so aquatic animals require less support against gravity. Water is also more viscous than air and produces greater drag, so streamlined shapes reduce the energy needed for movement through it.","note":"","marks":null},{"id":"A1.1-12","q":"Compare thermal conductivity in water and air, then explain a consequence for an endothermic animal.","a":"Water has a higher thermal conductivity than air, so it transfers heat away from an animal more rapidly. Endothermic aquatic animals may therefore need insulation such as blubber or a low surface-area-to-volume ratio to reduce heat loss.","note":"","marks":null},{"id":"A1.1-13","q":"Explain how water's high specific heat capacity affects organisms and aquatic habitats.","a":"A large amount of energy is required to raise the temperature of water because added energy is used in disrupting hydrogen bonds before molecular motion increases greatly. Water-rich organisms and aquatic habitats therefore change temperature slowly, reducing rapid temperature fluctuations.","note":"","marks":null},{"id":"A1.1-14","q":"Explain how high latent heat of vaporization makes sweating and transpiration effective cooling processes.","a":"A large amount of energy is required for water molecules to escape from the liquid because hydrogen bonds must be disrupted. When water evaporates from skin or a leaf, that energy is taken from the surface and its surroundings, so the remaining surface cools.","note":"Evaporative cooling depends on latent heat of vaporization, not specific heat capacity.","marks":null},{"id":"A1.1-15","q":"Correct this claim: 'Finding liquid water on another planet proves that life is present.'","a":"Finding liquid water shows that one condition required by all known life may be present. Liquid water can act as a solvent and medium for metabolic reactions and transport. Its presence therefore indicates potential habitability for life as we know it, but it does not demonstrate that organisms are present.","note":"This is a limit-of-evidence question. Habitability is not evidence of life by itself.","marks":null},{"id":"A1.1-16","q":"Construct one causal chain linking water's molecular structure to its major biological roles.","a":"Water's polar covalent bonds and bent shape create partial charges. Those partial charges allow hydrogen bonds between molecules and attractions with ions and other polar substances. Hydrogen bonding produces cohesion and important thermal properties, while polarity makes water an effective solvent. These properties support xylem transport, aqueous metabolism, transport of solutes, stable temperatures and evaporative cooling.","note":"Do not recite disconnected properties. Move from structure to interaction to property to biological consequence.","marks":null}],"exam":[{"question":"## Q1. Explain why a water molecule is polar. **[3]**","scheme":"- Oxygen is more electronegative than hydrogen / attracts the shared electrons in each O–H bond more strongly. **[1]**\n- Oxygen has a partial negative charge and the hydrogen atoms have partial positive charges. **[1]**\n- Water is bent / the bond dipoles do not cancel, producing separate partially charged regions. **[1]**\n\n_Examiner note: \"oxygen is negative\" is too loose. Full marks require partial charges and the reason the two bond dipoles do not cancel._"},{"question":"## Q2. Distinguish cohesion from adhesion and give one biological example of each. **[4]**","scheme":"- Cohesion is attraction between molecules of the same substance / between water molecules. **[1]**\n- accept: cohesion maintains a continuous water column in xylem / produces surface tension. **[1]**\n- Adhesion is attraction between different substances / between water and a polar or charged surface. **[1]**\n- accept: adhesion allows water to cling to cellulose xylem walls / contributes to capillary movement in narrow spaces. **[1]**\n\n_Examiner note: examples alone do not distinguish the terms. The answer must identify what is attracted to what on both sides of the comparison._"},{"question":"## Q3. Explain how the properties of water contribute to transport from roots to leaves in a tall plant. **[4]**","scheme":"- Evaporation from mesophyll cell walls / transpiration through stomata creates tension in xylem. **[1]**\n- Water molecules form hydrogen bonds with one another / are cohesive. **[1]**\n- Cohesion transmits tension through an unbroken column of water. **[1]**\n- Adhesion between water and hydrophilic / cellulose xylem walls helps support the column against gravity. **[1]**\n\n_Examiner note: saying that cohesion \"pulls water up\" loses the source of the force. Transpiration creates the tension, cohesion transmits it, and adhesion supports the column._"},{"question":"## Q4. Compare and contrast water and air as habitats for animals. **[6]**","scheme":"Award any six:\n\n- Both are fluids through which animals can move. **[1]**\n- Water is denser than air and provides greater buoyancy / reduces the need for weight-bearing support. **[1]**\n- Water is more viscous than air and creates greater drag / increases the advantage of streamlining. **[1]**\n- Water has higher thermal conductivity than air and removes body heat more rapidly / increases the need for insulation. **[1]**\n- Water has higher specific heat capacity than air and undergoes smaller or slower temperature changes / provides a more stable thermal environment. **[1]**\n- Oxygen is less available in water than in air / aquatic gas exchange requires adaptations for extracting dissolved oxygen. **[1]**\n\n_Examiner note: every difference must be comparative. \"Water is viscous\" states a fact, while \"water is more viscous than air, so swimming produces greater drag\" answers the command term._"},{"question":"## Q5. Explain how evaporation of water cools a human body or a leaf. **[3]**","scheme":"- Water has a high latent heat of vaporization / much energy is required to disrupt hydrogen bonds during evaporation. **[1]**\n- Higher-energy water molecules leave the liquid as vapor. **[1]**\n- Energy is removed from the surface / the mean kinetic energy and temperature of the remaining liquid decrease. **[1]**\n\n_Examiner note: high specific heat capacity does not explain evaporation. The answer must name latent heat of vaporization and show where the energy goes._"},{"question":"## Q6. Suggest why liquid water is used as an indicator of potential habitability when searching for extraterrestrial life. **[3]**","scheme":"- All known life uses liquid water as a solvent / medium for metabolism. **[1]**\n- Liquid water allows dissolved substances to move and react / supports transport and biochemical reactions. **[1]**\n- Its presence indicates that one condition for life as we know it may be met, but does not prove that life is present. **[1]**\n\n_Examiner note: the limiting sentence earns the third mark. Water supports a possibility; it is not direct evidence of organisms._"}]}},{"code":"A1.2","title":"Nucleic acids","theme":"A","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"4-7","questionsPage":8,"bookTitle":null,"pack":null},{"code":"A2.1","title":"Origins of cells","theme":"A","level":2,"levelTitle":"Cells","hlOnly":true,"pages":"56-58","questionsPage":69,"bookTitle":null,"pack":null},{"code":"A2.2","title":"Cell structure","theme":"A","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"59-66","questionsPage":69,"bookTitle":null,"pack":null},{"code":"A2.3","title":"Viruses","theme":"A","level":2,"levelTitle":"Cells","hlOnly":true,"pages":"67-68","questionsPage":69,"bookTitle":null,"pack":null},{"code":"A3.1","title":"Diversity of organisms","theme":"A","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"105-109","questionsPage":114,"bookTitle":null,"pack":null},{"code":"A3.2","title":"Classification and cladistics","theme":"A","level":3,"levelTitle":"Organisms","hlOnly":true,"pages":"110-113","questionsPage":114,"bookTitle":null,"pack":null},{"code":"A4.1","title":"Evolution and speciation","theme":"A","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"179-184","questionsPage":189,"bookTitle":null,"pack":null},{"code":"A4.2","title":"Conservation of biodiversity","theme":"A","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"185-188","questionsPage":189,"bookTitle":"Conservation of biology","pack":null},{"code":"B1.1","title":"Carbohydrates and lipids","theme":"B","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"9-13","questionsPage":18,"bookTitle":null,"pack":null},{"code":"B1.2","title":"Proteins","theme":"B","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"14-17","questionsPage":18,"bookTitle":null,"pack":{"oneLiner":"Twenty building blocks, joined in any order and any length, fold into shapes determined entirely by that order — and the shape is what does the job, which is why heating a protein or shifting its pH destroys the function without breaking a single link in the chain.","essentials":"\n> Each line is a thing you should be able to *do* with the page closed.\n> Note how short the Core list is and how long the Higher level one is. That\n> ratio is the topic.\n\n## Core\n\n- [ ] Draw and label the **generalized structure of an amino acid**: a central\n      carbon bonded to an amine group, a carboxyl group, a hydrogen atom, and a\n      variable R group.\n- [ ] Explain **condensation** between two amino acids: the amine group of one\n      reacts with the carboxyl group of the other, forming a **peptide bond**\n      and releasing one molecule of water. The product is a dipeptide.\n- [ ] Extend that to **polypeptides**: repeated condensation joins many amino\n      acids into a chain, releasing one water per bond formed.\n- [ ] Explain **dietary requirements for amino acids**: some amino acids cannot\n      be synthesised by the body and must be obtained from food (essential);\n      the rest can be made from other compounds (non-essential). A diet short\n      of an essential amino acid limits protein synthesis.\n- [ ] Explain why the **variety of possible peptide chains is effectively\n      unlimited**: any of 20 amino acids can occupy any position, and chains\n      vary in length, so the number of possible sequences of length *n* is\n      20 to the power of *n*.\n- [ ] Explain the **effect of temperature and pH on protein structure**: both\n      disrupt the bonds holding the folded shape, changing the conformation and\n      causing loss of function — **denaturation**. It may be reversible or\n      irreversible, and it does **not** break peptide bonds.\n\n## Higher level\n\n> Seven of the twelve syllabus statements sit here. This is the bulk of the\n> topic for you.\n\n- [ ] Explain how **chemical diversity in R groups** is the basis of protein\n      diversity: R groups differ in size, charge, polarity and reactivity, so\n      the same backbone supports enormously different molecules.\n- [ ] Define **primary structure** — the sequence of amino acids in a\n      polypeptide — and explain that it determines the final conformation,\n      because it fixes which R groups can interact and where.\n- [ ] Describe **secondary structure**: the alpha helix (coiling) and beta\n      pleated sheet (pleating), both stabilised by **hydrogen bonds between the\n      amine and carboxyl groups of the backbone**, not between R groups.\n- [ ] Describe **tertiary structure** — the overall three-dimensional shape of\n      one polypeptide — and name the four interactions between **R groups**\n      that hold it: hydrogen bonds, ionic bonds, disulfide covalent bonds\n      (between two cysteines), and hydrophobic interactions.\n- [ ] Explain the **effect of polar and non-polar amino acids** on tertiary\n      structure: in an aqueous environment, non-polar R groups tend to be\n      positioned in the interior and polar ones on the surface. In a membrane\n      the arrangement is reversed, with non-polar R groups facing the\n      hydrophobic core.\n- [ ] Describe **quaternary structure**: two or more polypeptides associating\n      into one functional protein. Distinguish **non-conjugated** proteins\n      (polypeptides only) from **conjugated** proteins, which include a\n      non-polypeptide prosthetic group — haemoglobin with its haem groups is\n      the standard example.\n- [ ] Compare **fibrous and globular proteins**: fibrous are long, narrow,\n      repetitive in sequence, largely insoluble and structural (collagen,\n      keratin); globular are rounded, irregular in sequence, soluble and\n      functional (enzymes, haemoglobin, insulin).\n\n## Links to other topics\n\n- **C1.1 Enzymes and metabolism** — enzymes are globular proteins, and the\n  active site is tertiary structure. Denaturation here *is* the enzyme\n  denaturation there. Learn it once.\n- **B2.1 Membranes** — integral and peripheral proteins sit where they do\n  because of polar and non-polar R groups. Same principle, one level up.\n- **D1.2 Protein synthesis** — translation builds primary structure. That\n  topic makes much more sense once you know what primary structure determines.\n- **A1.1 Water** — the hydrophobic interactions folding a protein are the same\n  exclusion effect you met with water. Nothing pushes.\n\n## Vocabulary that has to be exact\n\n| Term | What it means | What it is not |\n| --- | --- | --- |\n| Peptide bond | Covalent bond between amino acids, formed by condensation | A hydrogen bond. It survives denaturation |\n| Primary structure | The **sequence** of amino acids | The shape |\n| Secondary structure | Helix or pleated sheet, H-bonded along the **backbone** | Held by R group interactions |\n| Tertiary structure | The 3D shape of **one** polypeptide, held by R group interactions | Quaternary |\n| Quaternary structure | **Two or more** polypeptides in one functional protein | Present in every protein |\n| Conjugated protein | Contains a non-polypeptide prosthetic group | Any protein with more than one chain |\n| Denaturation | Loss of 3D conformation and function | Breaking the polypeptide into amino acids |\n| Essential amino acid | Cannot be synthesised; must come from the diet | More important than the others |\n","videos":"\n> Watch **one** video, not four. A second explanation of the same idea feels\n> like progress and is mostly re-recognition. When one is done, close it and\n> draw the four levels of structure from memory — that drawing is the point.\n\n> Links below are channel and search links, which do not rot. When you find the\n> video that actually works, paste its URL under \"Pinned\".\n\n## Main\n\n**Alex Lee — B1.2 Proteins** (may be split across videos)\n\n- Channel: \u003chttps://www.youtube.com/@misterleescience> — verified\n- Find it: \u003chttps://www.youtube.com/results?search_query=Mister+Lee+Science+B1.2+Proteins>\n\nAlex Lee's IB Biology series is widely recommended by IB students and is\nreported to follow the 2023 syllabus topic by topic. Search rather than trusting\na channel URL — handles change, and a dead link is what ends a study session.\nWhen you find the channel, paste it under Pinned. Because so much of B1.2 is HL,\ncheck he covers the higher level material and does not stop at the SL statements.\n\nWatch for:\n- **Which bonds hold which level.** This is the whole topic. Secondary is\n  hydrogen bonds along the backbone; tertiary is four kinds of interaction\n  between R groups. If you take one thing away, take that.\n- The moment denaturation is explained. Listen for whether peptide bonds break.\n  They do not, and that is a marking point.\n- Every time an R group is mentioned — R groups are the reason proteins differ.\n\nPause at: the tertiary structure diagram. Before playing on, name all four\nR group interactions out loud. If the fourth does not come, rewind.\n\n## If that did not land\n\n**Amoeba Sisters — Biomolecules / Protein structure**\n\n- Find it: \u003chttps://www.youtube.com/results?search_query=Amoeba+Sisters+protein+structure+amino+acids>\n\nNot HL depth, but if amino acids and condensation themselves are the problem,\nthis sorts them out quickly and you can return to Alex Lee for the folding.\n\n**Protein folding animation**\n\n- Find it: \u003chttps://www.youtube.com/results?search_query=protein+folding+animation+primary+secondary+tertiary+quaternary>\n\nWatch an **animation** for the folding specifically. Going from a flat chain to\na three-dimensional shape is a spatial idea, and it is far cheaper to learn\nfrom movement than from a paragraph. This is the one place in the topic where a\nsecond video earns its time.\n\n## Worth it once, not for revision\n\n- Any short clip of an egg white cooking, explained as denaturation. Sixty\n  seconds, and irreversible denaturation stops being an abstraction.\n\n## Pinned\n\n_Paste the URL of the video that actually worked, once you have found it._\n\n- Main:\n- Folding animation:\n","traps":"## Saying secondary structure is held by R group interactions\n\n**Commonly written:** \"The alpha helix is held together by bonds between the R\ngroups.\"\n\n**Why it does not score:** Secondary structure is stabilised by hydrogen bonds\nbetween the **amine and carboxyl groups of the backbone**. R group interactions\nare what hold **tertiary** structure. Getting this backwards collapses the two\nlevels into one and loses marks in both.\n\n**Scores instead:** \"Hydrogen bonds form between the carboxyl group of one\namino acid and the amine group of another along the polypeptide backbone,\nproducing an alpha helix or beta pleated sheet.\"\n\n## Saying denaturation breaks peptide bonds\n\n**Commonly written:** \"Heating denatures the protein by breaking the bonds\nbetween the amino acids.\"\n\n**Why it does not score:** Peptide bonds are covalent and are not broken by\nheat or pH change. What breaks are the weaker interactions holding the folded\nshape. The primary structure survives denaturation intact — which is exactly\nwhy denaturation is sometimes reversible.\n\n**Scores instead:** \"Heat disrupts the hydrogen bonds, ionic bonds and\nhydrophobic interactions holding the tertiary structure, changing the\nconformation. The peptide bonds and primary structure are unaffected.\"\n\n## Treating denaturation as always irreversible\n\n**Commonly written:** \"Denaturation is permanent.\"\n\n**Why it does not score:** The syllabus says it may be reversible or\nirreversible. A protein denatured mildly can sometimes refold, because the\nprimary structure that determines the shape is still there.\n\n**Scores instead:** \"Denaturation may be reversible or irreversible depending\non the severity of the change.\"\n\n## Naming the levels without naming the bonds\n\n**Commonly written:** \"Primary is the sequence, secondary is the helix,\ntertiary is the 3D shape, quaternary is more than one chain.\"\n\n**Why it does not score:** That is a list of labels. Questions on this topic\nalmost always ask what **holds** each level, and a labels-only answer scores at\nthe bottom of the band.\n\n**Scores instead:** Attach the bonding to every level — backbone hydrogen bonds\nfor secondary; hydrogen, ionic, disulfide and hydrophobic interactions between\nR groups for tertiary.\n\n## Saying every protein has quaternary structure\n\n**Commonly written:** \"All proteins have four levels of structure.\"\n\n**Why it does not score:** Quaternary structure exists only where two or more\npolypeptides associate. A protein made of a single polypeptide has no\nquaternary structure at all.\n\n**Scores instead:** \"Quaternary structure is present only in proteins made of\nmore than one polypeptide, such as haemoglobin.\"\n\n## Saying hydrophobic R groups are \"repelled\" by water\n\n**Commonly written:** \"Non-polar R groups are pushed into the centre because\nwater repels them.\"\n\n**Why it does not score:** Nothing pushes. Water molecules bond preferentially\nwith each other and with polar R groups, which leaves the non-polar ones\nexcluded and therefore clustered inside. This is the same mechanism as in A1.1,\nand examiners treat \"repelled\" as a misunderstanding rather than loose wording.\n\n**Scores instead:** \"Non-polar R groups cannot form hydrogen bonds with water,\nso water associates with itself and with polar R groups instead, leaving the\nnon-polar groups clustered in the interior.\"\n\n## Calling essential amino acids the important ones\n\n**Commonly written:** \"Essential amino acids are the ones the body needs most.\"\n\n**Why it does not score:** \"Essential\" is about synthesis, not importance. All\ntwenty are needed. Essential ones are simply those the body cannot make, so\nthey must come from the diet.\n\n**Scores instead:** \"Essential amino acids cannot be synthesised by the body\nand must be obtained from the diet; non-essential ones can be synthesised.\"\n\n## Getting condensation and hydrolysis the wrong way round\n\n**Commonly written:** \"Water is added to join two amino acids.\"\n\n**Why it does not score:** Condensation **releases** water as the bond forms.\nAdding water breaks the bond, which is hydrolysis. One word, one mark, and it\nis lost constantly.\n\n**Scores instead:** \"Condensation joins the amine group of one amino acid to\nthe carboxyl group of another, forming a peptide bond and releasing a molecule\nof water.\"\n","cards":[{"id":"B1.2-01","q":"Describe the generalized structure of an amino acid. Name every group attached to the central carbon.","a":"A central carbon atom is bonded to four things: an amine group (NH2), a carboxyl group (COOH), a hydrogen atom, and a variable R group. The first three are identical in every amino acid; only the R group differs.","note":"Four groups, and three of them are always the same. That is why R groups carry all the diversity.","marks":null},{"id":"B1.2-02","q":"Explain what happens when two amino acids join, naming the reaction, the bond and the by-product.","a":"The reaction is condensation. The amine group of one amino acid reacts with the carboxyl group of the other, forming a covalent peptide bond between them and releasing one molecule of water. The product of two amino acids joining is a dipeptide.","note":"Condensation releases water. Adding water to break the bond is hydrolysis — getting these the wrong way round is a constant one-mark loss.","marks":null},{"id":"B1.2-03","q":"A polypeptide contains 150 amino acids. How many peptide bonds does it have, and how many water molecules were released making it?","a":"149 peptide bonds, and 149 water molecules released. Each condensation joins one more amino acid to the chain and releases one water, so a chain of n amino acids has n minus 1 bonds.","note":"","marks":null},{"id":"B1.2-04","q":"Distinguish between essential and non-essential amino acids, and say why the distinction matters in a diet.","a":"Essential amino acids cannot be synthesised by the body and must be obtained from food. Non-essential amino acids can be synthesised from other compounds. The distinction matters because a diet short of any essential amino acid limits protein synthesis, regardless of how much total protein is eaten.","note":"'Essential' means 'cannot be made', not 'most important'. All twenty are needed.","marks":null},{"id":"B1.2-05","q":"Explain why the number of possible polypeptides is effectively unlimited.","a":"Any of the 20 amino acids can occupy any position in the chain, and chains can be any length. For a chain of n amino acids the number of possible sequences is 20 to the power of n, which becomes astronomically large even for short chains.","note":"","marks":null},{"id":"B1.2-06","q":"Define denaturation, and state precisely what is and is not broken.","a":"Denaturation is the disruption of a protein's three-dimensional conformation, causing loss of function. The hydrogen bonds, ionic bonds and hydrophobic interactions holding the folded shape are disrupted. Peptide bonds are not broken, so the primary structure remains intact. Denaturation may be reversible or irreversible depending on severity.","note":"Three separate marking points hide in here: shape lost, function lost, peptide bonds intact.","marks":null},{"id":"B1.2-07","q":"Explain how a change in pH denatures a protein, at the level of the bonds involved.","a":"A change in pH alters the charges on the R groups of amino acids, because acidic and basic R groups gain or lose hydrogen ions. Ionic bonds between oppositely charged R groups are therefore disrupted, and hydrogen bonding is affected, so the tertiary structure changes and function is lost.","note":"","marks":null},{"id":"B1.2-08","q":"Explain how high temperature denatures a protein.","a":"Increased temperature increases the kinetic energy and vibration of the molecule. This disrupts the relatively weak hydrogen bonds, ionic bonds and hydrophobic interactions holding the tertiary structure, so the protein unfolds and loses its functional shape. The covalent peptide bonds are not broken.","note":"","marks":null},{"id":"B1.2-09","q":"What is primary structure, and why does it determine everything else about the protein?","a":"Primary structure is the sequence of amino acids in a polypeptide, joined by peptide bonds. It determines the final conformation because the sequence fixes which R groups are present and where they sit relative to one another, and therefore which interactions can form as the chain folds.","note":"HL. 'The sequence determines the shape' is the sentence the whole topic rests on.","marks":null},{"id":"B1.2-10","q":"Describe secondary structure, naming both forms and the bonds that hold them. Be precise about where those bonds form.","a":"Secondary structure is regular, repeating folding of the polypeptide into an alpha helix (coiling) or a beta pleated sheet (pleating). Both are stabilised by hydrogen bonds between the carboxyl group of one amino acid and the amine group of another along the polypeptide backbone. R groups are not involved.","note":"HL. Backbone, not R groups. This is the single most common confusion in the topic.","marks":null},{"id":"B1.2-11","q":"Name all four interactions that hold tertiary structure, and say what they form between.","a":"All four form between R groups: hydrogen bonds between polar R groups; ionic bonds between oppositely charged R groups; disulfide covalent bonds between two cysteine R groups; and hydrophobic interactions between non-polar R groups. Together they fold one polypeptide into its specific three-dimensional shape.","note":"HL. Four of them, all between R groups. If only three come to mind, the missing one is usually disulfide.","marks":null},{"id":"B1.2-12","q":"Where do polar and non-polar R groups end up in a protein dissolved in water, and why? What changes in a membrane protein?","a":"In an aqueous environment, non-polar R groups are positioned mainly in the interior and polar R groups on the surface. This is because water bonds preferentially with itself and with polar groups, leaving the non-polar ones excluded and clustered inside. In a membrane protein the arrangement is reversed where the protein spans the bilayer: non-polar R groups face outwards into the hydrophobic core.","note":"HL. Nothing pushes the non-polar groups inward — they are excluded. Same mechanism as A1.1.","marks":null},{"id":"B1.2-13","q":"What is quaternary structure, and what makes a protein conjugated rather than non-conjugated?","a":"Quaternary structure is the association of two or more polypeptides into a single functional protein. A non-conjugated protein consists of polypeptides only. A conjugated protein also contains a non-polypeptide prosthetic group; haemoglobin is the standard example, with four polypeptides and four haem groups.","note":"HL. Not every protein has quaternary structure — only those with more than one chain.","marks":null},{"id":"B1.2-14","q":"Compare fibrous and globular proteins across shape, solubility, sequence and role, with an example of each.","a":"Fibrous proteins are long and narrow with a repetitive amino acid sequence, are largely insoluble in water, and have structural roles — collagen and keratin. Globular proteins are rounded and compact with an irregular sequence, are soluble in water, and have functional roles such as catalysis or transport — enzymes and haemoglobin.","note":"","marks":null},{"id":"B1.2-15","q":"Why can twenty amino acids produce proteins as different as keratin and an enzyme?","a":"Because the R groups differ chemically — in size, charge, polarity and reactivity. The backbone is identical in every amino acid, so it is the R groups that determine which interactions form during folding, and therefore the shape and properties of the finished protein. Different sequences of R groups give completely different molecules from the same set of building blocks.","note":"","marks":null},{"id":"B1.2-16","q":"Someone writes: 'Boiling an egg denatures the proteins by breaking the peptide bonds.' What is wrong, and what is right?","a":"Peptide bonds are covalent and are not broken by heat. What heat disrupts are the weaker hydrogen bonds, ionic bonds and hydrophobic interactions holding the tertiary structure. The protein unfolds and loses function, but the primary structure is unchanged. In this case the denaturation happens to be irreversible.","note":"","marks":null},{"id":"B1.2-17","q":"Build the four levels of protein structure from memory: name each, and name what holds it.","a":"Primary: the sequence of amino acids, joined by peptide bonds. Secondary: alpha helix or beta pleated sheet, held by hydrogen bonds between backbone amine and carboxyl groups. Tertiary: the three-dimensional shape of one polypeptide, held by hydrogen bonds, ionic bonds, disulfide covalent bonds and hydrophobic interactions between R groups. Quaternary: two or more polypeptides associating, held by the same kinds of R group interaction, and present only in multi-chain proteins.","note":"HL. The synthesis card. If you can produce this one cleanly, most of B1.2 is yours.","marks":null}],"exam":[{"question":"## Q1. Outline how a dipeptide is formed from two amino acids. **[3]**","scheme":"- The reaction is condensation. **[1]**\n- The amine group of one amino acid reacts with the carboxyl group of the\n  other, forming a peptide bond. **[1]**\n- A molecule of water is released / eliminated. **[1]**\n\n_Examiner note: all three points are separate marks, and candidates routinely\ndrop the water. \"They join by a peptide bond\" is one mark, not three._"},{"question":"## Q2. Explain the effect of high temperature on the structure and function of an enzyme. **[4]**","scheme":"- Increased temperature increases kinetic energy / vibration of the\n  molecule. **[1]**\n- This disrupts the hydrogen bonds / ionic bonds / hydrophobic interactions\n  holding the tertiary structure. **[1]**\n- The three-dimensional conformation changes — the protein is denatured. **[1]**\n- The active site changes shape, so the substrate no longer fits / the enzyme\n  loses function. **[1]**\n- Accept: peptide bonds and primary structure are not affected. **[1 max within total]**\n\n_Examiner note: an answer that says \"the enzyme denatures and stops working\"\nscores one mark at most. \"Explain\" wants the chain — energy, bonds, shape,\nfunction — and each link is a separate mark._"},{"question":"## Q3. Distinguish between the secondary and tertiary structure of a protein. **[4]**","scheme":"Comparative statements. Maximum [4]:\n\n- Secondary structure is regular repeating folding (alpha helix or beta pleated\n  sheet) whereas tertiary structure is the overall three-dimensional shape of\n  the whole polypeptide. **[1]**\n- Secondary structure is stabilised by hydrogen bonds between backbone amine\n  and carboxyl groups, whereas tertiary structure is stabilised by interactions\n  between R groups. **[1]**\n- Tertiary structure involves four types of interaction — hydrogen bonds, ionic\n  bonds, disulfide covalent bonds and hydrophobic interactions — whereas\n  secondary structure involves hydrogen bonds only. **[1]**\n- Secondary structure is independent of the R groups present whereas tertiary\n  structure depends directly on which R groups are in the sequence. **[1]**\n\n_Examiner note: the backbone-versus-R-group distinction is the mark that\nseparates grades here. An answer that attributes secondary structure to R group\ninteractions loses it and usually confuses the rest of the answer too._"},{"question":"## Q4. Explain how the primary structure of a polypeptide determines its tertiary structure. **[3]**","scheme":"- Primary structure is the sequence of amino acids. **[1]**\n- The sequence determines which R groups are present and their positions in the\n  chain. **[1]**\n- The R groups interact — by hydrogen bonds, ionic bonds, disulfide bonds and\n  hydrophobic interactions — and these interactions fold the chain into a\n  specific three-dimensional shape. **[1]**\n\n_Examiner note: \"the sequence determines the shape\" restates the question and\nscores nothing on its own. The mark is in naming R groups as the link between\nthe two._"},{"question":"## Q5. Compare and contrast fibrous and globular proteins. **[4]**","scheme":"Comparative statements only. Maximum [4]:\n\n- Both are polypeptides / both are built from amino acids joined by peptide\n  bonds. **[1]**\n- Fibrous proteins are long and narrow whereas globular proteins are rounded\n  and compact. **[1]**\n- Fibrous proteins have a repetitive amino acid sequence whereas globular\n  proteins have an irregular sequence. **[1]**\n- Fibrous proteins are largely insoluble in water whereas globular proteins are\n  soluble. **[1]**\n- Fibrous proteins have structural roles whereas globular proteins have\n  functional roles such as catalysis or transport. **[1]**\n- Named examples used comparatively: collagen or keratin versus haemoglobin,\n  insulin or an enzyme. **[1]**\n\n_Examiner note: \"compare and contrast\" requires at least one similarity, and\nevery point must be written comparatively. \"Fibrous proteins are insoluble\"\nscores nothing on its own._"},{"question":"## Q6. State what is meant by a conjugated protein, and give one example. **[2]**","scheme":"- A protein containing a non-polypeptide prosthetic group in addition to its\n  polypeptide(s). **[1]**\n- Example: haemoglobin, which contains haem groups. **[1]**\n\n_Examiner note: \"state\" wants two sentences at most. A protein with more than\none chain is not automatically conjugated — that is quaternary structure, which\nis a different idea._"}]}},{"code":"B2.1","title":"Membranes and membrane transport","theme":"B","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"70-74","questionsPage":80,"bookTitle":null,"pack":{"oneLiner":"A cell membrane is a fluid phospholipid barrier whose proteins control what crosses, allowing the cell to keep its inside different from its surroundings. \u003c!-- Keep this heading exactly as written. The web app pulls the sentence beneath it and shows it as the subtitle on the topic screen. Rename the heading and the subtitle silently disappears. -->","essentials":"\n> Tick a line only after you can do it with the page closed and without prompts.\n\n## Core\n\n- [ ] Describe a phospholipid as an amphipathic molecule with a hydrophilic phosphate head and two hydrophobic hydrocarbon tails.\n- [ ] Explain why phospholipids form bilayers spontaneously in water, with the heads facing aqueous solutions and the tails sheltered in the centre.\n- [ ] Explain the fluid mosaic model and distinguish integral proteins from peripheral proteins.\n- [ ] Predict whether a substance can cross the phospholipid bilayer directly from its size, charge and polarity.\n- [ ] Compare simple diffusion, facilitated diffusion, osmosis and active transport by route, energy use and direction relative to a gradient.\n- [ ] Explain how aquaporins increase the rate of osmosis without using ATP.\n- [ ] Explain how a pump protein uses ATP and a conformational change to move a substance against its concentration gradient.\n- [ ] Explain how glycoproteins and glycolipids contribute to cell recognition and adhesion.\n- [ ] Explain how temperature and the saturation of fatty acid tails affect membrane fluidity.\n- [ ] Explain how cholesterol buffers the fluidity of animal cell membranes at high and low temperatures.\n- [ ] Use the membrane's structure and its transport proteins together to explain selective permeability.\n\n## Higher level\n\n- [ ] Explain how membrane fluidity allows vesicles to form by fission and merge by fusion during endocytosis, exocytosis and intracellular transport.\n- [ ] Distinguish voltage-gated from ligand-gated ion channels by the signal that opens each one.\n- [ ] Explain how the sodium–potassium pump moves three Na+ out and two K+ in per ATP hydrolysed, producing ion gradients and a charge difference.\n- [ ] Explain sodium-dependent glucose cotransport as indirect active transport powered by a sodium gradient established using ATP elsewhere.\n- [ ] Explain how cell-adhesion proteins bind cells together so tissues can form.\n\n## Links to other topics\n\n- **A1.1 Water** — hydrophilic and hydrophobic interactions explain why phospholipids form a bilayer. Secure that cause and the membrane stops being a diagram to memorise.\n- **B2.2 Organelles and compartmentalization** — membrane-bound compartments work because membranes maintain different conditions on their two sides.\n- **C2.2 Neural signalling** — ion pumps and gated channels create and change membrane potentials. Accurate directions and ion numbers here prevent confusion in action potentials.\n- **D2.3 Water potential** — osmosis is developed into predictions about water movement. Knowing what aquaporins change, and what they do not change, makes that topic easier.\n\n## Vocabulary that has to be exact\n\n| Term | What it means | What it is not |\n| --- | --- | --- |\n| Amphipathic | Having both hydrophilic and hydrophobic regions | The same as fully polar or fully non-polar |\n| Simple diffusion | Net movement down a concentration gradient directly through the phospholipid bilayer | Movement through a channel or carrier protein |\n| Facilitated diffusion | Passive movement down a gradient through a specific channel or carrier protein | Active transport; it does not use ATP |\n| Osmosis | Net movement of water through a partially permeable membrane from higher to lower water potential | Movement of solute particles |\n| Active transport | Movement against a concentration gradient using energy and a transport protein | Any transport involving a membrane protein |\n| Integral protein | A protein embedded in the bilayer; some span the entire membrane | A protein that must cross the whole membrane |\n| Peripheral protein | A protein attached to a membrane surface rather than embedded in the hydrophobic core | A channel through the bilayer |\n| Selective permeability | Allowing some substances to cross more readily than others because of the bilayer and specific transport proteins | Random leakage through gaps in the membrane |\n| Cotransport | Coupled movement in which one substance moving down its electrochemical gradient drives another substance | ATP hydrolysis at every cotransporter |\n","videos":"\nWatch **one** main video, close it, and rebuild the membrane and transport table from memory. A second explanation of the same idea strengthens recognition, which is the problem this system exists to fix.\n\n## Main\n\n**Alex Lee Biology — B2.1 Membranes and membrane transport**\n\n- Channel: \u003chttps://www.youtube.com/@misterleescience> — verified\n- Search: \u003chttps://www.youtube.com/results?search_query=Mister+Lee+Science+B2.1+membranes+membrane+transport>\n\nAlex Lee organizes Biology around the current IB topic codes, so begin with the explanation made for B2.1.\n\n**Watch for:**\n\n- Why phospholipids form a bilayer in water without a structure assembling them.\n- How size, charge and polarity determine whether a substance can cross the bilayer directly.\n- Which two tests separate facilitated diffusion from active transport: direction relative to the gradient and ATP use.\n- Why cholesterol can reduce fluidity in one condition and prevent rigidity in another.\n\n**Pause at:** the first comparison of transport mechanisms. Draw four columns labelled simple diffusion, facilitated diffusion, osmosis and active transport. For each, add the route, whether ATP is used and the direction of movement relative to a gradient before playing on.\n\n## If that did not land\n\n**Amoeba Sisters — cell membrane and cell transport**\n\n- Search: \u003chttps://www.youtube.com/results?search_query=Amoeba+Sisters+cell+membrane+transport>\n\nUse this if the passive-versus-active distinction is still blurred. When it ends, test recall rather than opening a third explanation.\n\n**Khan Academy — membrane transport**\n\n- Search: \u003chttps://www.youtube.com/results?search_query=Khan+Academy+membrane+transport+diffusion+active+transport>\n\nUse this if you need the concentration-gradient reasoning developed more slowly.\n\n## Worth it once, not for revision\n\nThe sodium–potassium pump and sodium–glucose cotransporter are mechanical sequences, so an **animation** earns one exception to the one-video rule. Movement can show the pump changing shape and the two transporters sharing an ion gradient in a way that prose cannot.\n\n- Pump search: \u003chttps://www.youtube.com/results?search_query=sodium+potassium+pump+animation+3+sodium+2+potassium>\n- Cotransport search: \u003chttps://www.youtube.com/results?search_query=sodium+glucose+cotransport+animation+secondary+active+transport>\n\nAfter watching, draw the chain from ATP hydrolysis to the sodium gradient and then to glucose uptake. If the cotransporter itself is shown hydrolysing ATP in your drawing, correct it before moving on.\n\n## Pinned\n","traps":"\n## Saying the cell assembles the bilayer\n\n**Commonly written:** “The cell builds phospholipids into a bilayer.”\n\n**Why it does not score:** This replaces the molecular explanation with an unnamed process. The examiner wants the hydrophilic and hydrophobic regions related to water.\n\n**Scores instead:** “Phospholipids form a bilayer spontaneously, with hydrophilic heads facing the aqueous solutions and hydrophobic tails sheltered in the centre away from water.”\n\n## Saying the hydrophobic core repels ions\n\n**Commonly written:** “The membrane repels Na+ because the centre is hydrophobic.”\n\n**Why it does not score:** “Repels” suggests a force pushing the ion away. The key idea is that transfer of a charged particle from water into a non-polar environment is energetically unfavourable.\n\n**Scores instead:** “Na+ does not cross the phospholipid bilayer directly because moving a charged ion into the non-polar core is energetically unfavourable.”\n\n## Giving facilitated diffusion an ATP cost\n\n**Commonly written:** “Facilitated diffusion uses ATP because a transport protein is involved.”\n\n**Why it does not score:** Facilitated diffusion is passive. A protein supplies a selective route, but net movement remains down a concentration or electrochemical gradient.\n\n**Scores instead:** “Facilitated diffusion moves particles down their concentration or electrochemical gradient through a channel or carrier without ATP input.”\n\n## Defining active transport by protein use\n\n**Commonly written:** “It is active transport because it uses a membrane protein.”\n\n**Why it does not score:** Facilitated diffusion also uses membrane proteins. The defining evidence is movement against a gradient using energy.\n\n**Scores instead:** “This is active transport because the pump uses energy to move the substance against its concentration gradient.”\n\n## Saying water cannot cross without aquaporins\n\n**Commonly written:** “Water needs aquaporins because it cannot pass through the bilayer.”\n\n**Why it does not score:** Water can cross the bilayer slowly. Aquaporins increase permeability and rate; they do not create the water-potential difference or determine its direction.\n\n**Scores instead:** “Water can cross the bilayer slowly, while aquaporins increase its rate of movement down a water-potential gradient without using ATP.”\n\n## Giving only one effect of cholesterol\n\n**Commonly written:** “Cholesterol makes the membrane less fluid.”\n\n**Why it does not score:** The direction of cholesterol's effect depends on temperature, so one flat statement misses the buffering role.\n\n**Scores instead:** “Cholesterol reduces excessive fluidity at higher temperatures and prevents close phospholipid packing at lower temperatures.”\n\n## Reversing the sodium–potassium pump\n\n**Commonly written:** “The pump moves two sodium ions out and three potassium ions in.”\n\n**Why it does not score:** The numbers and directions are reversed, removing the unequal charge transfer that makes the pump electrogenic.\n\n**Scores instead:** “For each ATP hydrolysed, the pump moves three Na+ out and two K+ in, making the cell interior relatively more negative.”\n\n## Putting ATP hydrolysis at the cotransporter\n\n**Commonly written:** “The sodium–glucose cotransporter uses ATP to bring glucose into the cell.”\n\n**Why it does not score:** ATP is hydrolysed by the sodium–potassium pump. The cotransporter uses energy stored in the Na+ electrochemical gradient.\n\n**Scores instead:** “The sodium–potassium pump uses ATP to establish a Na+ gradient, and Na+ moving down that gradient through the cotransporter drives glucose uptake against its gradient.”\n","cards":[{"id":"B2.1-01","q":"Describe a phospholipid and explain why phospholipids form a bilayer spontaneously in water.","a":"A phospholipid is amphipathic: it has a hydrophilic phosphate head and two hydrophobic hydrocarbon tails. In water, the heads face the aqueous solutions on both sides while the tails gather in the centre away from water. Hydrophobic interactions make this bilayer a stable arrangement, so no structure has to assemble each phospholipid into place.","note":"Name both regions, their orientations and the reason. The word amphipathic alone does not explain bilayer formation.","marks":null},{"id":"B2.1-02","q":"Predict whether O2, Na+ and glucose can cross a phospholipid bilayer directly, and explain each prediction.","a":"O2 is small and non-polar, so it dissolves in the hydrophobic interior and crosses by simple diffusion. Na+ is charged, so entering the non-polar core is energetically unfavourable and it requires a transport protein. Glucose is relatively large and polar, so it also requires a specific transport protein.","note":"Do not describe the core as repelling charge. The barrier is the energetic cost of moving a charged or polar particle into a non-polar environment.","marks":null},{"id":"B2.1-03","q":"Rebuild the transport comparison: for simple diffusion, facilitated diffusion, osmosis and active transport, state the route, ATP use and direction of net movement.","a":"Simple diffusion occurs through the phospholipid bilayer, uses no ATP and has net movement down a concentration gradient. Facilitated diffusion occurs through a channel or carrier, uses no ATP and has net movement down a concentration or electrochemical gradient. Osmosis is the net movement of water through a partially permeable membrane from higher to lower water potential; it uses no ATP and may be accelerated by aquaporins. Active transport uses a pump or carrier and energy to move a substance against its concentration or electrochemical gradient.","note":"This is the synthesis card. Produce all four rows before revealing the answer.","marks":null},{"id":"B2.1-04","q":"Explain how aquaporins affect osmosis and correct the claim that water cannot cross a membrane without them.","a":"Aquaporins are channel proteins that greatly increase membrane permeability to water, so water moves across the membrane more rapidly. Water can also cross the phospholipid bilayer slowly because it is small, even though it is polar. Aquaporins change the rate of osmosis, not its direction, and they do not use ATP.","note":"The direction still depends on the water-potential difference across the membrane.","marks":null},{"id":"B2.1-05","q":"Distinguish integral membrane proteins from peripheral membrane proteins and give one possible role of each.","a":"Integral proteins are embedded in the phospholipid bilayer, and transmembrane proteins span it; an integral protein may act as a channel, carrier or pump. Peripheral proteins are attached to one membrane surface rather than embedded in the hydrophobic core; they may anchor the cytoskeleton or participate in signalling.","note":"Integral does not always mean transmembrane. Some integral proteins are embedded in only one layer.","marks":null},{"id":"B2.1-06","q":"Explain both words in the fluid mosaic model of membrane structure.","a":"The membrane is fluid because phospholipids and some proteins can move laterally within the bilayer. It is a mosaic because varied proteins, glycoproteins and other components are distributed through or on the phospholipid bilayer rather than forming one repeated pattern.","note":"","marks":null},{"id":"B2.1-07","q":"Explain how temperature and unsaturated fatty acid tails affect membrane fluidity.","a":"Higher temperature increases the kinetic energy and movement of phospholipids, increasing fluidity, while lower temperature reduces their movement. Cis double bonds create kinks in unsaturated tails, preventing close packing, so a greater proportion of unsaturated tails helps a membrane remain fluid at lower temperatures.","note":"","marks":null},{"id":"B2.1-08","q":"Explain the two-directional effect of cholesterol on the fluidity of animal cell membranes.","a":"At higher temperatures, cholesterol restrains phospholipid movement and reduces excessive fluidity. At lower temperatures, it prevents phospholipids from packing as closely and reduces solidification. Cholesterol therefore buffers membrane fluidity across a range of temperatures.","note":"An answer giving only one temperature condition is incomplete.","marks":null},{"id":"B2.1-09","q":"Describe glycoproteins and glycolipids and explain how their carbohydrate chains contribute to cell recognition and adhesion.","a":"Glycoproteins are proteins with attached carbohydrate chains, while glycolipids are lipids with attached carbohydrate chains. The chains project from the extracellular surface and can act as specific recognition markers or parts of receptors. Some membrane glycoproteins also bind cells to one another, contributing to adhesion.","note":"","marks":null},{"id":"B2.1-10","q":"Explain selective permeability using both the phospholipid bilayer and membrane transport proteins.","a":"The hydrophobic interior of the bilayer allows small non-polar molecules to cross more readily but restricts ions and most large polar molecules. Channels, carriers and pumps are selective for particular substances, so the set and activity of transport proteins in a membrane control which restricted substances can cross and in which direction.","note":"Selectivity is not caused by random holes between phospholipids.","marks":null},{"id":"B2.1-11","q":"Explain one complete cycle of the sodium–potassium pump, including ion numbers, direction and energy source.","a":"Three Na+ bind on the cytoplasmic side. ATP phosphorylates the pump, causing a conformational change that releases the Na+ outs
