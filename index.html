<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biology HL — study-os</title>
<meta name="description" content="Retrieval practice and spaced repetition for Biology HL.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128218;</text></svg>">
<style>
:root {
  --bg: #fbfaf8; --panel: #fff; --ink: #1a1a1a; --muted: #6b6b6b;
  --line: #e4e1dc; --accent: #2b6cb0; --accent-ink: #fff;
  --good: #2f7a46; --mid: #a8700a; --bad: #b03a35;
  --radius: 10px; --max: 44rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181c; --panel: #1e2126; --ink: #e9e7e3; --muted: #9a9894;
    --line: #2e3238; --accent: #6fa8dc; --accent-ink: #12141a;
    --good: #6bbf85; --mid: #d9a441; --bad: #e0796f;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 16px 96px; }
header {
  position: sticky; top: 0; z-index: 10; background: var(--bg);
  border-bottom: 1px solid var(--line); margin-bottom: 20px;
}
.bar { max-width: var(--max); margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.brand { font-weight: 700; letter-spacing: -0.01em; margin-right: auto; cursor: pointer; }
.brand small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); letter-spacing: 0; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button {
  background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px;
  padding: 6px 10px; border-radius: 7px; cursor: pointer;
}
nav button:hover { background: var(--line); color: var(--ink); }
nav button[aria-current="page"] { background: var(--ink); color: var(--bg); }
h1 { font-size: 24px; line-height: 1.25; margin: 0 0 4px; letter-spacing: -0.02em; }
h2 { font-size: 18px; margin: 28px 0 10px; letter-spacing: -0.01em; }
h3 { font-size: 15px; margin: 18px 0 6px; }
p { margin: 0 0 12px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px; margin: 0 0 14px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
  font: inherit; font-weight: 600; padding: 11px 18px; cursor: pointer; text-decoration: none;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn.wide { width: 100%; }
.btn.sm { padding: 7px 12px; font-size: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.grade button {
  font: inherit; font-weight: 600; padding: 14px 6px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); line-height: 1.3;
}
.grade button span { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
.grade button:hover { border-color: currentColor; }
.g-got:hover { color: var(--good); } .g-shaky:hover { color: var(--mid); } .g-missed:hover { color: var(--bad); }
.q { font-size: 19px; font-weight: 600; line-height: 1.45; margin: 0 0 4px; }
.a { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 16px; }
.box { color: var(--muted); margin-right: 3px; }
.box.done { color: var(--good); }
#view ul ul { margin: 6px 0 0; }
pre {
  background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
  padding: 10px 12px; overflow-x: auto; font-size: 13px; line-height: 1.5;
}
code { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 0.9em; }
pre code { background: none; border: 0; padding: 0; }
.note { color: var(--muted); font-size: 14px; font-style: italic; margin-top: 10px; }
.meta { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 10px; }
.pill { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.pill.hl { border-color: var(--mid); color: var(--mid); }
.pill.due { border-color: var(--accent); color: var(--accent); }
ul.clean { list-style: none; padding: 0; margin: 0; }
ul.clean li { padding: 11px 0; border-bottom: 1px solid var(--line); }
ul.clean li:last-child { border-bottom: 0; }
.topic-row { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; padding: 0; }
.topic-row:hover .code { color: var(--accent); }
.code { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3.1em; }
.topic-row .t { flex: 1; }
.bar-track { height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; width: 70px; flex-shrink: 0; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 99px; }
.stat { display: flex; gap: 22px; margin: 0 0 18px; flex-wrap: wrap; }
.stat div b { display: block; font-size: 26px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
.stat div span { font-size: 12px; color: var(--muted); }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps li { counter-increment: s; position: relative; padding: 0 0 14px 36px; }
.steps li::before {
  content: counter(s); position: absolute; left: 0; top: 0;
  width: 24px; height: 24px; border-radius: 99px; background: var(--ink); color: var(--bg);
  display: grid; place-items: center; font-size: 13px; font-weight: 700;
}
.steps b { display: block; }
.steps small { color: var(--muted); }
.capture { background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 14px; margin: 12px 0; }
.capture textarea {
  width: 100%; min-height: 140px; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 7px; padding: 10px; font: inherit; resize: vertical;
}
.scheme { background: var(--bg); border-left: 3px solid var(--accent); padding: 12px 14px; border-radius: 0 7px 7px 0; }
.scheme ul { margin: 0; padding-left: 18px; }
.scheme li { margin-bottom: 6px; }
a { color: var(--accent); }
.vid { display: block; padding: 12px 0; border-bottom: 1px solid var(--line); }
.vid:last-child { border-bottom: 0; }
.watchfor { margin: 8px 0 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
.progress-track { height: 4px; background: var(--line); border-radius: 99px; margin: 14px 0 0; overflow: hidden; }
.progress-track div { height: 100%; background: var(--accent); transition: width .25s; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px;
  font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50;
}
.toast.show { opacity: 1; }
.hide { display: none !important; }
@media (max-width: 480px) {
  h1 { font-size: 21px; }
  .q { font-size: 17px; }
  .bar { padding: 10px 12px; }
  .wrap { padding: 0 12px 80px; }
}
@media print { header, nav, .btn, .grade { display: none !important; } }

/* ---- quiz mode ---------------------------------------------------------- */
.picker-group { margin-bottom: 18px; }
.picker-group:last-child { margin-bottom: 0; }
.picker-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-weight: 700; font-size: 14px; padding-bottom: 6px; margin-bottom: 4px;
  border-bottom: 1px solid var(--line);
}
.pick {
  display: flex; align-items: center; gap: 10px; padding: 9px 2px; cursor: pointer;
  border-bottom: 1px solid var(--line);
}
.pick:last-child { border-bottom: 0; }
.pick input { width: 19px; height: 19px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }
.pick .t { flex: 1; }
.pick:hover .code { color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }

blockquote.wrote {
  margin: 0; padding: 14px 16px; border-left: 4px solid var(--bad);
  background: var(--bg); border-radius: 0 8px 8px 0; font-size: 18px; line-height: 1.5;
}
.opts { display: flex; flex-direction: column; gap: 9px; }
.opt {
  text-align: left; font: inherit; line-height: 1.45; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
  padding: 13px 15px; cursor: pointer;
}
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--bg); }
.opt:disabled { cursor: default; opacity: .62; }
.opt.right { border-color: var(--good); background: var(--bg); opacity: 1; }
.opt.right::after { content: " \2713"; color: var(--good); font-weight: 700; }
.opt.chosen-wrong { border-color: var(--bad); background: var(--bg); opacity: 1; }
.opt.chosen-wrong::after { content: " \2717"; color: var(--bad); font-weight: 700; }
.verdict-box {
  margin-top: 18px; padding: 16px; border-radius: 9px; background: var(--bg);
  border: 1px solid var(--line); border-left-width: 4px;
}
.verdict-box.good { border-left-color: var(--good); }
.verdict-box.bad { border-left-color: var(--bad); }
.verdict-box p { margin: 0 0 10px; }
.verdict-box p:last-of-type { margin-bottom: 0; }
@media (max-width: 480px) { .opt { padding: 12px 13px; font-size: 15px; } }

/* Shown in place of the app when the file itself is broken. */
.damaged {
  max-width: 34rem; margin: 12vh auto 0; padding: 26px;
  border: 1px solid var(--bad); border-left-width: 5px; border-radius: var(--radius);
  background: var(--panel);
}
.damaged h1 { color: var(--bad); margin-bottom: 14px; }
.damaged p { margin: 0 0 12px; }
.damaged p:last-child { margin-bottom: 0; }

</style>

<script>window.__STUDY_DATA__ = {"course":{"id":"bio-hl","title":"Biology HL"},"themes":{"A":"Unity and diversity","B":"Form and function","C":"Interaction and interdependence","D":"Continuity and change"},"levels":{"1":"Molecules","2":"Cells","3":"Organisms","4":"Ecosystems"},"book":{"author":"Andrew Allott","title":"Biology Study Guide","edition":"2023 edition","answersUrl":"https://www.oxfordsecondary.com/ib-science-support"},"method":"\nRead this once. It’s short, and it explains why the system asks you to do the\none thing you’ll not want to do.\n\n## The problem with videos\n\nYou already know you learn well from videos. That’s real, and it’s worth\nbuilding on — a good explanation with moving pictures will get an idea into\nyour head faster than a textbook page will.\n\nBut there’s a catch, and it’s the reason a topic can feel clear on Sunday and\nblank on Thursday.\n\nWhen you watch someone explain cell respiration, you follow along. Each step\nmakes sense as it arrives. At the end you feel like you understand it, and that\nfeeling is honest — you *did* understand it while it was in front of you. What\nyou’ve built is the ability to **recognize** the explanation. Recognition is\nfast, it feels like knowledge, and it disappears within days.\n\nAn exam never asks you to recognize anything. It asks you to **produce** it,\nfrom nothing, on a blank page, under time pressure. That’s a different skill,\nand watching doesn’t train it.\n\n## What actually makes things stick\n\nTrying to remember something is what moves it into long-term memory. Not\nreading it again. Not highlighting it. Not watching a second video.\n\nThe uncomfortable part: the harder the recall feels, the better it works.\nStruggling to remember something and eventually getting it does more for you\nthan reading it smoothly ten times. Which means the study method that feels\nmost productive is usually the one doing the least.\n\nThat’s the whole reason this system exists. It’s built to take what you get\nfrom videos, which is a lot, and force it through the step that\nmakes it permanent.\n\n## The loop\n\nFour steps, about forty minutes.\n\n**1. Watch (15 min).** One video. Not three. `study watch C1.2` gives you the\nvideo and, more importantly, the specific questions to hold in your head while\nyou watch. Watching with a question is an active thing. Watching without one is\ntelevision.\n\n**2. Capture (5 min).** Close the laptop. On paper, write down what you\nremember. Three things you can now state, one thing you could explain out loud,\none thing that’s still fuzzy.\n\nThis step will feel bad. You’ll sit there having just watched a clear\nexplanation and produce almost nothing. **That’s not a sign the video failed or\nthat you’re bad at this.** That gap between what you could follow and what\nyou can produce is the actual state of your knowledge, and every student has\nit. The difference is that most never look at it, so they find out in the exam.\n\n**Then open the Allott study guide** at the same topic code and read the\nsection. It’s deliberately condensed, a few pages a topic, which makes it a\nfast way to see what you left out. Mark every point you missed. Those are the\nones to watch for in the quiz.\n\nDo it in that order. The book after the brain-dump is a check. The book before\nit’s just reading, and reading is the thing that doesn’t work.\n\n**3. Recall (10 min).** `study quiz`. Say each answer out loud before you reveal\nit. Out loud matters: thinking \"yeah, I know this\" is exactly the recognition\nfeeling that got you here.\n\nMark yourself honestly. A card you half-had is a card you missed. The system\nuses your answers to decide when to show each card again, so lying to it only\nmeans it stops showing you the things you most need.\n\n**4. Check (10 min).** `study exam C1.2`. One real exam-style question with a\nreal mark scheme. Write the answer properly, then mark yourself strictly. This\nis where you find out that you understood the biology and still lost two marks\nfor writing \"describe\" when the question said \"explain\".\n\nWhen you want more of these, your study guide has a question set at the end of\neach group — `study exam` tells you the page — and the answers are free at\n\u003chttps://www.oxfordsecondary.com/ib-science-support>. Those are worth more than\nanother video, every time.\n\n## Why cards come back when they do\n\nCards you get right move further away — one day, then three, then a week, then\nover a month. Cards you miss come straight back tomorrow.\n\nSo the deck automatically concentrates on what you don’t know, and the stuff\nyou’ve solid stops wasting your time. Twenty minutes on the right twenty\ncards beats two hours re-reading a chapter, and it’s not close.\n\nYou can’t cram this. Six short sessions across two weeks will leave you with\nmore than one six-hour session, even though the six-hour session feels more\nlike work. Spacing is doing something real: every time you retrieve a fact\nafter nearly forgetting it, you make it harder to forget next time.\n\n## What a bad week looks like\n\nYou’ll have weeks where you do nothing. The cards pile up and opening the\nthing feels worse every day.\n\nWhen that happens, don’t try to clear the backlog. Run `study quiz --limit 10`\nand do ten cards. Then stop. Ten cards today beats a heroic session you keep\npostponing, and it beats zero, which is what usually actually happens.\n\n## The short version\n\n- Watching is how the idea gets in. Recall is how it stays.\n- The step that feels worst is the step that works.\n- The book comes *after* the brain-dump, never before it.\n- Be honest when you mark yourself. The system is only as good as your grading.\n- Little and often. Always.\n","topics":[{"code":"A1.1","title":"Water","theme":"A","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"1-3","questionsPage":8,"bookTitle":null,"pack":{"oneLiner":"Water's bent, polar structure lets it form hydrogen bonds and dissolve charged or polar substances, which explains its roles in transport, temperature control, habitats and metabolism.","essentials":"\n> Tick a line only after you can do it with the page closed and without prompts.\n\n## Core\n\n- [ ] Explain why oxygen and hydrogen share electrons unequally in water, and why the molecule's bent shape gives it two differently charged regions.\n- [ ] Distinguish the polar covalent bonds inside a water molecule from the hydrogen bonds between water molecules.\n- [ ] Explain how many individually weak hydrogen bonds produce water's cohesion and surface tension.\n- [ ] Distinguish cohesion from adhesion and connect both properties to the movement of water through xylem.\n- [ ] Explain how water surrounds ions and polar molecules, allowing them to dissolve and move in aqueous solutions.\n- [ ] Predict whether a biological substance will be hydrophilic or hydrophobic from its charge and polarity.\n- [ ] Explain why water is a medium for metabolic reactions and for transport in blood, tissue fluid and plant sap.\n- [ ] Explain how organisms transport poorly soluble substances, using oxygen and lipids as named examples.\n- [ ] Compare water with air in density, buoyancy, viscosity, thermal conductivity and specific heat capacity, then link the differences to animal adaptations.\n- [ ] Explain how high specific heat capacity limits temperature change and how high latent heat of vaporization makes evaporation an effective cooling process.\n- [ ] Outline why the search for extraterrestrial life focuses on liquid water, without claiming that water proves life is present.\n\n## Links to other topics\n\n- **B2.1 Membranes and membrane transport** — polarity explains why phospholipids arrange into bilayers. If hydrophilic and hydrophobic interactions are secure here, membrane structure has a cause rather than becoming another diagram to memorize.\n- **B3.2 Transport** — transpiration applies cohesion, adhesion and evaporation to an entire plant. A1.1 supplies the molecular explanation for the mechanism.\n- **D2.3 Water potential** — osmosis depends on water as a solvent and on differences in the tendency of water to move. Accurate solvent language here prevents confusion later.\n- **D3.3 Homeostasis** — sweating works because evaporation requires energy. The homeostasis question is an application of latent heat of vaporization.\n\n## Vocabulary that has to be exact\n\n| Term | What it means | What it’s not |\n| --- | --- | --- |\n| Electronegativity | The tendency of an atom to attract a shared pair of electrons | An atom's overall electrical charge |\n| Polar molecule | A molecule with an uneven distribution of charge and partial positive and negative regions | An ion; water remains neutral overall |\n| Polar covalent bond | A covalent bond in which electrons are shared unequally | A hydrogen bond between molecules |\n| Hydrogen bond | An attraction between a partially positive hydrogen and a partially negative electronegative atom on another molecule | The O–H bond within one water molecule |\n| Cohesion | Attraction between molecules of the same substance, such as water and water | Adhesion to another surface |\n| Adhesion | Attraction between different substances, such as water and cellulose | Cohesion between water molecules |\n| Hydrophilic | Charged or polar and able to interact with water | Any substance found inside an organism |\n| Hydrophobic | Non-polar and poorly soluble in water | A substance pushed away by a repulsive force |\n| Specific heat capacity | Energy needed to raise the temperature of unit mass by one degree | Energy needed for a liquid to evaporate |\n| Latent heat of vaporization | Energy needed to change a liquid to a gas without changing temperature | The temperature at which a substance boils |\n","videos":"\nWatch **one** main video. Then close it and write what you can produce from memory. Watching another version immediately strengthens recognition, and recognition is the skill that has been hiding the gaps.\n\n## Main\n\n**Alex Lee Biology — A1.1 Water**\n\n- Channel: \u003chttps://www.youtube.com/@misterleescience> — verified\n- Search: \u003chttps://www.youtube.com/results?search_query=Mister+Lee+Science+A1.1+Water>\n\nAlex Lee organizes the course by the current IB topic codes, so start with the explanation built for A1.1.\n\n**Watch for:**\n\n- Why oxygen attracts the shared electrons more strongly than hydrogen does.\n- Why the two O–H bond dipoles don’t cancel in a bent molecule.\n- How the explanation moves from hydrogen bonding to cohesion, adhesion and thermal properties.\n- Which property of water explains each biological example, rather than memorizing the example alone.\n\n**Pause at:** the first labelled water molecule. Hide the labels, draw its shape, add δ− and δ+ in the correct places, and explain aloud why the whole molecule is polar but not charged.\n\n## If that didn’t land\n\n**Khan Academy — hydrogen bonding and water**\n\n- Channel: \u003chttps://www.youtube.com/@khanacademy> — verified\n- Search: \u003chttps://www.youtube.com/results?search_query=Khan+Academy+hydrogen+bonding+water+properties>\n\nUse this if the chemistry under polarity and hydrogen bonding is the part you can’t yet reproduce.\n\n**Amoeba Sisters — properties of water**\n\n- Channel: \u003chttps://www.youtube.com/@AmoebaSisters> — verified\n- Search: \u003chttps://www.youtube.com/results?search_query=Amoeba+Sisters+properties+of+water>\n\nUse this for a shorter biological explanation. When it ends, return to recall instead of opening a third video.\n\n## Worth it once, not for revision\n\nA hydrogen-bond network changes from moment to moment, so an **animation** earns one exception to the one-video rule. Movement shows the bonds forming and breaking more clearly than a static paragraph can.\n\n- Search: \u003chttps://www.youtube.com/results?search_query=water+molecules+hydrogen+bonds+animation>\n\nAfter watching, draw four water molecules. Use solid lines for polar covalent bonds and dotted lines for hydrogen bonds. If the two bond types end up in the same place, watch that segment again.\n\n## Pinned\n","traps":"\n## Calling partial charges full charges\n\n**Commonly written:** \"The oxygen in water is negative and the hydrogens are positive.\"\n\n**Why it doesn’t score:** The atoms carry partial charges because electrons are shared unequally. The molecule remains neutral overall.\n\n**Scores instead:** \"Oxygen attracts the shared electrons more strongly, so it has a partial negative charge and each hydrogen has a partial positive charge.\"\n\n## Putting hydrogen bonds inside the molecule\n\n**Commonly written:** \"Hydrogen bonds join oxygen to hydrogen in a water molecule.\"\n\n**Why it doesn’t score:** The O–H bonds within one molecule are polar covalent bonds. Hydrogen bonds act between separate molecules.\n\n**Scores instead:** \"Polar covalent bonds join oxygen to hydrogen within each molecule, while hydrogen bonds form between neighbouring water molecules.\"\n\n## Saying cohesion causes transpiration pull\n\n**Commonly written:** \"Cohesion pulls water from the roots to the leaves.\"\n\n**Why it doesn’t score:** Cohesion transmits tension through the water column. Evaporation from the leaf creates the tension.\n\n**Scores instead:** \"Transpiration creates tension in the xylem, and cohesion transmits that tension through an unbroken column of water.\"\n\n## Treating adhesion and cohesion as interchangeable\n\n**Commonly written:** \"Adhesion keeps water molecules joined together in xylem.\"\n\n**Why it doesn’t score:** Water-to-water attraction is cohesion. Adhesion is attraction between water and the vessel wall.\n\n**Scores instead:** \"Cohesion keeps water molecules connected, while adhesion helps water cling to the hydrophilic xylem walls.\"\n\n## Saying hydrophobic substances are repelled\n\n**Commonly written:** \"Water pushes lipids away because they are hydrophobic.\"\n\n**Why it doesn’t score:** No repulsive force is required. Non-polar lipids lack favorable interactions with water, while water molecules continue hydrogen bonding with one another.\n\n**Scores instead:** \"Lipids are poorly soluble because they are non-polar and can’t form favorable electrostatic interactions with water.\"\n\n## Using specific heat capacity to explain sweating\n\n**Commonly written:** \"Sweat cools the body because water has a high specific heat capacity.\"\n\n**Why it doesn’t score:** Sweating involves a change from liquid to vapor, so the relevant property is latent heat of vaporization.\n\n**Scores instead:** \"Evaporation of sweat removes a large amount of energy from the skin because water has a high latent heat of vaporization.\"\n\n## Listing facts instead of comparing habitats\n\n**Commonly written:** \"Water is dense and viscous. Air contains oxygen.\"\n\n**Why it doesn’t score:** A compare-and-contrast question requires paired statements that use one medium as the reference for the other.\n\n**Scores instead:** \"Water is more viscous than air, so aquatic animals experience greater drag and benefit from streamlined bodies.\"\n\n## Treating water as proof of extraterrestrial life\n\n**Commonly written:** \"Liquid water on a planet means that life exists there.\"\n\n**Why it doesn’t score:** Water indicates a potentially suitable condition for known life. It doesn’t show that organisms are present.\n\n**Scores instead:** \"Liquid water indicates potential habitability for life as we know it, but its presence alone doesn’t demonstrate life.\"\n","cards":[{"id":"A1.1-01","q":"Explain fully why a water molecule is polar but has no overall charge.","a":"Oxygen is more electronegative than hydrogen, so it attracts the shared electrons in each O–H bond more strongly. Oxygen develops a partial negative charge and the hydrogen atoms develop partial positive charges. Water is bent, so the two bond dipoles don’t cancel. The molecule is polar even though its total charge remains zero.","note":"A complete answer needs unequal sharing, partial charges and the bent shape.","marks":null},{"id":"A1.1-02","q":"Distinguish the O–H bonds within one water molecule from the bonds between neighbouring water molecules.","a":"Within one water molecule, oxygen and hydrogen are joined by polar covalent bonds in which electrons are shared unequally. Between neighbouring water molecules, a hydrogen bond forms between a partially positive hydrogen and a partially negative oxygen. A hydrogen bond is an intermolecular attraction and is weaker than a covalent bond.","note":"Putting hydrogen bonds inside the molecule is a common mark-losing error.","marks":null},{"id":"A1.1-03","q":"Explain how many weak hydrogen bonds can give water strong cohesive behavior.","a":"Each hydrogen bond between water molecules is weak and forms or breaks readily. A body of water contains a very large number of these bonds at the same time. Their combined attraction keeps water molecules associated, producing cohesion even though no single hydrogen bond is strong.","note":"","marks":null},{"id":"A1.1-04","q":"Distinguish cohesion from adhesion and give one biological consequence of each.","a":"Cohesion is attraction between water molecules, and it helps an unbroken column of water remain under tension in xylem. Adhesion is attraction between water and another polar surface, and it helps water cling to the cellulose walls of xylem vessels.","note":"State what is attracted to what before giving the example.","marks":null},{"id":"A1.1-05","q":"Explain the complete sequence by which water is pulled from roots toward leaves in xylem.","a":"Water evaporates from mesophyll cell walls and leaves through stomata, creating tension in the xylem. Cohesion caused by hydrogen bonding transmits the tension through a continuous column of water. Adhesion between water and the hydrophilic xylem walls helps support the column against gravity as it’s pulled upward.","note":"Transpiration provides the pull. Cohesion transmits it. Adhesion supports the column.","marks":null},{"id":"A1.1-06","q":"Explain how cohesion produces surface tension at the surface of water.","a":"Water molecules at the surface form hydrogen bonds with neighbouring molecules beside and below them. The resulting inward cohesive attraction makes the surface resist being stretched or broken. This surface tension can support small organisms at the air–water boundary.","note":"","marks":null},{"id":"A1.1-07","q":"Explain at the molecular level how water dissolves sodium chloride.","a":"The partially negative oxygen regions of water molecules orient toward Na+ ions, while the partially positive hydrogen regions orient toward Cl− ions. These attractions separate the ions from the crystal and surround each ion with a hydration shell, keeping the ions dispersed in solution.","note":"","marks":null},{"id":"A1.1-08","q":"Predict how water interacts differently with polar and non-polar substances, and explain the difference.","a":"Water forms hydrogen bonds or other electrostatic attractions with polar or charged substances, so many of them dissolve. Non-polar substances can’t form comparable favorable interactions with water, so water continues bonding with itself and excludes them, leaving them poorly soluble.","note":"Hydrophobic substances aren’t pushed away by water. They lack favorable interactions with it.","marks":null},{"id":"A1.1-09","q":"Explain why water is an effective medium for metabolism and transport in living organisms.","a":"Ions and many polar molecules dissolve in water, allowing reactants to move, collide and undergo enzyme-catalyzed reactions in aqueous cytoplasm. Dissolved substances can also be carried in blood plasma, tissue fluid and plant sap. Water therefore provides both a reaction medium and a transport medium.","note":"","marks":null},{"id":"A1.1-10","q":"Explain how blood transports oxygen and lipids even though both have limited solubility in water.","a":"Most oxygen is carried bound reversibly to haemoglobin inside red blood cells rather than dissolved in plasma. Hydrophobic lipids are carried in lipoproteins, which have hydrophilic outer surfaces that interact with plasma and hydrophobic interiors that enclose the lipids.","note":"Haemoglobin-bound oxygen is carried in red blood cells, not dissolved in plasma.","marks":null},{"id":"A1.1-11","q":"Compare density and viscosity in water and air, then explain one consequence of each difference for animals.","a":"Water is denser than air and provides greater buoyancy, so aquatic animals require less support against gravity. Water is also more viscous than air and produces greater drag, so streamlined shapes reduce the energy needed for movement through it.","note":"","marks":null},{"id":"A1.1-12","q":"Compare thermal conductivity in water and air, then explain a consequence for an endothermic animal.","a":"Water has a higher thermal conductivity than air, so it transfers heat away from an animal more rapidly. Endothermic aquatic animals may therefore need insulation such as blubber or a low surface-area-to-volume ratio to reduce heat loss.","note":"","marks":null},{"id":"A1.1-13","q":"Explain how water's high specific heat capacity affects organisms and aquatic habitats.","a":"A large amount of energy is required to raise the temperature of water because added energy is used in disrupting hydrogen bonds before molecular motion increases greatly. Water-rich organisms and aquatic habitats therefore change temperature slowly, reducing rapid temperature fluctuations.","note":"","marks":null},{"id":"A1.1-14","q":"Explain how high latent heat of vaporization makes sweating and transpiration effective cooling processes.","a":"A large amount of energy is required for water molecules to escape from the liquid because hydrogen bonds must be disrupted. When water evaporates from skin or a leaf, that energy is taken from the surface and its surroundings, so the remaining surface cools.","note":"Evaporative cooling depends on latent heat of vaporization, not specific heat capacity.","marks":null},{"id":"A1.1-15","q":"Correct this claim: 'Finding liquid water on another planet proves that life is present.'","a":"Finding liquid water shows that one condition required by all known life may be present. Liquid water can act as a solvent and medium for metabolic reactions and transport. Its presence therefore indicates potential habitability for life as we know it, but it doesn’t demonstrate that organisms are present.","note":"This is a limit-of-evidence question. Habitability isn’t evidence of life by itself.","marks":null},{"id":"A1.1-16","q":"Construct one causal chain linking water's molecular structure to its major biological roles.","a":"Water's polar covalent bonds and bent shape create partial charges. Those partial charges allow hydrogen bonds between molecules and attractions with ions and other polar substances. Hydrogen bonding produces cohesion and important thermal properties, while polarity makes water an effective solvent. These properties support xylem transport, aqueous metabolism, transport of solutes, stable temperatures and evaporative cooling.","note":"Don’t recite disconnected properties. Move from structure to interaction to property to biological consequence.","marks":null}],"exam":[{"question":"## Q1. Explain why a water molecule is polar. **[3]**","scheme":"- Oxygen is more electronegative than hydrogen / attracts the shared electrons in each O–H bond more strongly. **[1]**\n- Oxygen has a partial negative charge and the hydrogen atoms have partial positive charges. **[1]**\n- Water is bent / the bond dipoles do not cancel, producing separate partially charged regions. **[1]**\n\n_Examiner note: \"oxygen is negative\" is too loose. Full marks require partial charges and the reason the two bond dipoles don’t cancel._"},{"question":"## Q2. Distinguish cohesion from adhesion and give one biological example of each. **[4]**","scheme":"- Cohesion is attraction between molecules of the same substance / between water molecules. **[1]**\n- accept: cohesion maintains a continuous water column in xylem / produces surface tension. **[1]**\n- Adhesion is attraction between different substances / between water and a polar or charged surface. **[1]**\n- accept: adhesion allows water to cling to cellulose xylem walls / contributes to capillary movement in narrow spaces. **[1]**\n\n_Examiner note: examples alone don’t distinguish the terms. The answer must identify what is attracted to what on both sides of the comparison._"},{"question":"## Q3. Explain how the properties of water contribute to transport from roots to leaves in a tall plant. **[4]**","scheme":"- Evaporation from mesophyll cell walls / transpiration through stomata creates tension in xylem. **[1]**\n- Water molecules form hydrogen bonds with one another / are cohesive. **[1]**\n- Cohesion transmits tension through an unbroken column of water. **[1]**\n- Adhesion between water and hydrophilic / cellulose xylem walls helps support the column against gravity. **[1]**\n\n_Examiner note: saying that cohesion \"pulls water up\" loses the source of the force. Transpiration creates the tension, cohesion transmits it, and adhesion supports the column._"},{"question":"## Q4. Compare and contrast water and air as habitats for animals. **[6]**","scheme":"Award any six:\n\n- Both are fluids through which animals can move. **[1]**\n- Water is denser than air and provides greater buoyancy / reduces the need for weight-bearing support. **[1]**\n- Water is more viscous than air and creates greater drag / increases the advantage of streamlining. **[1]**\n- Water has higher thermal conductivity than air and removes body heat more rapidly / increases the need for insulation. **[1]**\n- Water has higher specific heat capacity than air and undergoes smaller or slower temperature changes / provides a more stable thermal environment. **[1]**\n- Oxygen is less available in water than in air / aquatic gas exchange requires adaptations for extracting dissolved oxygen. **[1]**\n\n_Examiner note: every difference must be comparative. \"Water is viscous\" states a fact, while \"water is more viscous than air, so swimming produces greater drag\" answers the command term._"},{"question":"## Q5. Explain how evaporation of water cools a human body or a leaf. **[3]**","scheme":"- Water has a high latent heat of vaporization / much energy is required to disrupt hydrogen bonds during evaporation. **[1]**\n- Higher-energy water molecules leave the liquid as vapor. **[1]**\n- Energy is removed from the surface / the mean kinetic energy and temperature of the remaining liquid decrease. **[1]**\n\n_Examiner note: high specific heat capacity doesn’t explain evaporation. The answer must name latent heat of vaporization and show where the energy goes._"},{"question":"## Q6. Suggest why liquid water is used as an indicator of potential habitability when searching for extraterrestrial life. **[3]**","scheme":"- All known life uses liquid water as a solvent / medium for metabolism. **[1]**\n- Liquid water allows dissolved substances to move and react / supports transport and biochemical reactions. **[1]**\n- Its presence indicates that one condition for life as we know it may be met, but does not prove that life is present. **[1]**\n\n_Examiner note: the limiting sentence earns the third mark. Water supports a possibility; it’s not direct evidence of organisms._"}],"mcq":[{"id":"A1.1-q01","topic":"A1.1","kind":"mcq","lead":"","quote":"","prompt":"Why is a water molecule polar?","options":[{"text":"Oxygen attracts the shared electrons more strongly, and the bent shape stops the charges canceling","correct":true,"why":"Both parts matter. Unequal sharing makes partial charges, and the bent shape means they don't cancel out across the molecule."},{"text":"Oxygen takes electrons completely from hydrogen, so the molecule carries full positive and negative charges","correct":false,"why":"That's what an ion does. Water's charges are partial because the electrons are still shared, only unevenly."},{"text":"Hydrogen bonds inside the molecule hold oxygen and hydrogen together unevenly","correct":false,"why":"The bonds inside one water molecule are polar covalent bonds. Hydrogen bonds form between separate molecules."},{"text":"The molecule is linear, so the oxygen end and the hydrogen end carry opposite charges","correct":false,"why":"Water is bent, not linear. The bend is the reason the partial charges don't cancel."}],"after":null},{"id":"A1.1-q02","topic":"A1.1","kind":"mcq","lead":"","quote":"","prompt":"Where do hydrogen bonds form in liquid water?","options":[{"text":"Between a partially positive hydrogen on one molecule and a partially negative oxygen on another","correct":true,"why":"They're attractions between neighboring molecules. Each one is weak, but there are a huge number of them."},{"text":"Between the hydrogen and oxygen atoms inside each water molecule, holding the molecule together","correct":false,"why":"Those are polar covalent bonds. If you call them hydrogen bonds, the examiner reads it as not knowing the difference."},{"text":"Between two oxygen atoms on neighboring molecules, which share a pair of electrons","correct":false,"why":"Oxygen atoms on different molecules don't share electrons. The attraction is between a hydrogen on one molecule and an oxygen on another."},{"text":"Between neighboring molecules, and each one is stronger than a covalent bond","correct":false,"why":"The location's right, but hydrogen bonds are much weaker than covalent bonds. Water's properties come from how many there are."}],"after":null},{"id":"A1.1-q03","topic":"A1.1","kind":"mcq","lead":"","quote":"","prompt":"What generates the tension that pulls water up the xylem?","options":[{"text":"Cohesion between water molecules in the column","correct":false,"why":"Cohesion keeps the column from breaking while it's pulled. It doesn't do the pulling."},{"text":"Evaporation of water from the leaves","correct":true,"why":"Water evaporating from the leaf is what creates the pull. Cohesion and adhesion let that pull reach all the way down the stem."},{"text":"Adhesion of water to the cellulose walls","correct":false,"why":"Adhesion helps water hold onto the xylem walls, but it doesn't create tension in the column."},{"text":"Root cells pumping water upward using ATP","correct":false,"why":"The transpiration stream is passive. The energy that drives it comes from evaporation, not from ATP in the roots."}],"after":null},{"id":"A1.1-q04","topic":"A1.1","kind":"mcq","lead":"","quote":"","prompt":"Water molecules are attracted to the cellulose walls of xylem vessels. What is this property called?","options":[{"text":"Cohesion","correct":false,"why":"Cohesion is water sticking to water. Water sticking to cellulose is a different substance, so it's adhesion."},{"text":"Adhesion","correct":true,"why":"Adhesion is attraction between different substances, here water and cellulose."},{"text":"Surface tension","correct":false,"why":"Surface tension comes from cohesion at a water surface. It isn't about water sticking to a wall."},{"text":"Buoyancy","correct":false,"why":"Buoyancy is the upward push water gives things floating in it. It has nothing to do with sticking to a wall."}],"after":null},{"id":"A1.1-q05","topic":"A1.1","kind":"mcq","lead":"","quote":"","prompt":"Why does sodium chloride dissolve in water?","options":[{"text":"Partially charged regions of water molecules attract and surround the separated ions","correct":true,"why":"The negative oxygen side faces the Na+ and the positive hydrogen side faces the Cl−, so each ion ends up surrounded by water."},{"text":"Water breaks the covalent bonds between the sodium and chlorine atoms","correct":false,"why":"Sodium chloride is held together by ionic bonds, not covalent ones. Water separates the ions by attracting them."},{"text":"Water molecules form hydrogen bonds with the sodium and chloride ions","correct":false,"why":"Ions don't form hydrogen bonds. The attraction is between the ions' charges and water's partial charges."},{"text":"Sodium chloride is non-polar, so it mixes evenly with the water","correct":false,"why":"It's the opposite. Sodium chloride is made of charged ions, and that's exactly why water can dissolve it."}],"after":null},{"id":"A1.1-q06","topic":"A1.1","kind":"mcq","lead":"","quote":"","prompt":"Which of these substances is hydrophobic?","options":[{"text":"Glucose","correct":false,"why":"Glucose has lots of polar hydroxyl groups, so it dissolves well in water."},{"text":"Sodium ions","correct":false,"why":"Ions are charged, and charged particles are hydrophilic."},{"text":"Cholesterol","correct":true,"why":"Cholesterol is mostly non-polar, so it doesn't interact well with water. That's why blood has to carry it inside lipoproteins."},{"text":"Amino acids","correct":false,"why":"Amino acids have charged amine and carboxyl groups, so they dissolve in water."}],"after":null},{"id":"A1.1-q07","topic":"A1.1","kind":"mcq","lead":"","quote":"","prompt":"How is cholesterol transported in the blood?","options":[{"text":"Dissolved directly in the plasma, like glucose","correct":false,"why":"Cholesterol is non-polar, so it barely dissolves in plasma. It needs a carrier."},{"text":"Bound to haemoglobin inside red blood cells","correct":false,"why":"Haemoglobin carries oxygen. It's the example for oxygen, not for lipids."},{"text":"Inside lipoproteins with a hydrophilic outer surface","correct":true,"why":"The lipoprotein's outside faces the water in plasma, and the cholesterol sits inside where it doesn't have to."},{"text":"As free ions after it's broken down in the liver","correct":false,"why":"Cholesterol isn't broken into ions to be carried. It travels intact inside lipoproteins."}],"after":null},{"id":"A1.1-q08","topic":"A1.1","kind":"mcq","lead":"","quote":"","prompt":"Why do endothermic animals living in water, such as seals, need thick insulation like blubber?","options":[{"text":"Water conducts heat away from the body much faster than air does","correct":true,"why":"Water's thermal conductivity is far higher than air's, so a warm body loses heat quickly in it. Blubber slows that down."},{"text":"Water has a lower specific heat capacity than air, so it warms up quickly","correct":false,"why":"That's backwards. Water's specific heat capacity is much higher than air's, and that isn't the reason for blubber anyway."},{"text":"Water is less dense than air, so the animal needs extra fat to float","correct":false,"why":"Water is much denser than air. That's why it gives more buoyancy, not less."},{"text":"Water's high viscosity makes swimming slow, so the animal stores more energy","correct":false,"why":"Viscosity affects movement, not heat loss. Blubber is there because of how quickly water conducts heat."}],"after":null},{"id":"A1.1-q09","topic":"A1.1","kind":"mcq","lead":"","quote":"","prompt":"Which property of water makes sweating an effective way to cool down?","options":[{"text":"High specific heat capacity","correct":false,"why":"That's the trap. Specific heat capacity is about changing temperature. Sweating cools you because evaporating the water takes energy."},{"text":"High latent heat of vaporization","correct":true,"why":"Turning liquid sweat into vapor takes a lot of energy, and that energy comes from the skin as heat."},{"text":"High thermal conductivity","correct":false,"why":"Conductivity explains heat loss into surrounding water. Sweat cools by evaporating."},{"text":"Strong cohesion between molecules","correct":false,"why":"Hydrogen bonds are why evaporation takes so much energy, but the property that cools you is latent heat of vaporization."}],"after":null},{"id":"A1.1-q10","topic":"A1.1","kind":"mcq","lead":"","quote":"","prompt":"A lake's temperature changes much more slowly than the air above it. Why?","options":[{"text":"Water has a high latent heat of vaporization","correct":false,"why":"That's about evaporation. Here the water isn't changing state, only temperature."},{"text":"Water is a good solvent for dissolved salts","correct":false,"why":"Being a solvent has nothing to do with how fast the temperature changes."},{"text":"Water has a high specific heat capacity","correct":true,"why":"It takes a lot of energy to change water's temperature, so a lake stays steadier than the air. That makes it a stable habitat."},{"text":"Water has high cohesion at its surface","correct":false,"why":"Cohesion and surface tension explain things like pond skaters, not steady temperature."}],"after":null},{"id":"A1.1-q11","topic":"A1.1","kind":"mcq","lead":"","quote":"","prompt":"Why do aquatic animals need less skeletal support than land animals of a similar size?","options":[{"text":"Water is denser than air, so it gives more buoyancy","correct":true,"why":"Water pushes up on the body far more than air does, so less of the animal's weight has to be carried by its skeleton."},{"text":"Water is less viscous than air, so moving takes less force","correct":false,"why":"Water is more viscous than air, not less. And viscosity is about moving through it, not support."},{"text":"Water conducts heat well, so muscles need less energy","correct":false,"why":"Thermal conductivity is about heat loss. The support comes from buoyancy."},{"text":"Water's cohesion holds the animal's body at the surface","correct":false,"why":"Surface tension can hold up a tiny insect, but not a fish or a seal. Buoyancy does the supporting."}],"after":null},{"id":"A1.1-q12","topic":"A1.1","kind":"mcq","lead":"","quote":"","prompt":"Why does the search for life on other planets focus on finding liquid water?","options":[{"text":"Liquid water proves that life must be present on that planet","correct":false,"why":"Water doesn't prove anything. It only marks a place where life could be possible."},{"text":"Every known organism uses liquid water as the medium for its metabolism","correct":true,"why":"All life we know depends on water for its reactions, so liquid water marks a planet as possibly habitable. That's all it tells you."},{"text":"Liquid water can only form on planets that already have oxygen","correct":false,"why":"Liquid water depends on temperature and pressure, not on oxygen being present."},{"text":"Water is the only substance that can dissolve any other molecule","correct":false,"why":"Water's a very good solvent, but it doesn't dissolve everything. Hydrophobic substances are the obvious exception."}],"after":null},{"id":"A1.1-t1","topic":"A1.1","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"The oxygen in water is negative and the hydrogens are positive.","prompt":"Why does it fail?","options":[{"text":"The atoms carry partial charges because electrons are shared unequally. The molecule remains neutral overall.","correct":true,"why":"That’s exactly why it fails."},{"text":"The O–H bonds within one molecule are polar covalent bonds. Hydrogen bonds act between separate molecules.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: putting hydrogen bonds inside the molecule."},{"text":"Cohesion transmits tension through the water column. Evaporation from the leaf creates the tension.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying cohesion causes transpiration pull."},{"text":"Water-to-water attraction is cohesion. Adhesion is attraction between water and the vessel wall.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating adhesion and cohesion as interchangeable."}],"after":{"label":"What would have scored","text":"Oxygen attracts the shared electrons more strongly, so it has a partial negative charge and each hydrogen has a partial positive charge."}},{"id":"A1.1-t2","topic":"A1.1","kind":"trap","lead":"A student wrote this. It didn’t score: ferent mistake: putting hydrogen bonds inside the molecule."},{"text":"Water-to-water attraction is cohesion. Adhesion is attraction between water and the vessel wall.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating adhesion and cohesion as interchangeable."}],"after":{"label":"What would have scored","text":"Transpiration creates tension in the xylem, and cohesion transmits that tension through an unbroken column of water."}},{"id":"A1.1-t4","topic":"A1.1","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Adhesion keeps water molecules joined together in xylem.","prompt":"Why does it fail?","options":[{"text":"Water-to-water attraction is cohesion. Adhesion is attraction between water and the vessel wall.","correct":true,"why":"That’s exactly why it fails."},{"text":"The atoms carry partial charges because electrons are shared unequally. The molecule remains neutral overall.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling partial charges full charges."},{"text":"The O–H bonds within one molecule are polar covalent bonds. Hydrogen bonds act between separate molecules.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: putting hydrogen bonds inside the molecule."},{"text":"Cohesion transmits tension through the water column. Evaporation from the leaf creates the tension.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying cohesion causes transpiration pull."}],"after":{"label":"What would have scored","text":"Cohesion keeps water molecules connected, while adhesion helps water cling to the hydrophilic xylem walls."}},{"id":"A1.1-t5","topic":"A1.1","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Water pushes lipids away because they are hydrophobic.","prompt":"Why does it fail?","options":[{"text":"No repulsive force is required. Non-polar lipids
