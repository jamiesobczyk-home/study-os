e water column. Evaporation from the leaf creates the tension.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying cohesion causes transpiration pull."}],"after":{"label":"What would have scored","text":"Evaporation of sweat removes a large amount of energy from the skin because water has a high latent heat of vaporization."}},{"id":"A1.1-t7","topic":"A1.1","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Water is dense and viscous. Air contains oxygen.","prompt":"Why does it fail?","options":[{"text":"A compare-and-contrast question requires paired statements that use one medium as the reference for the other.","correct":true,"why":"That’s exactly why it fails."},{"text":"The atoms carry partial charges because electrons are shared unequally. The molecule remains neutral overall.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling partial charges full charges."},{"text":"The O–H bonds within one molecule are polar covalent bonds. Hydrogen bonds act between separate molecules.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: putting hydrogen bonds inside the molecule."},{"text":"Cohesion transmits tension through the water column. Evaporation from the leaf creates the tension.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying cohesion causes transpiration pull."}],"after":{"label":"What would have scored","text":"Water is more viscous than air, so aquatic animals experience greater drag and benefit from streamlined bodies."}},{"id":"A1.1-t8","topic":"A1.1","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Liquid water on a planet means that life exists there.","prompt":"Why does it fail?","options":[{"text":"Water indicates a potentially suitable condition for known life. It doesn’t show that organisms are present.","correct":true,"why":"That’s exactly why it fails."},{"text":"The atoms carry partial charges because electrons are shared unequally. The molecule remains neutral overall.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling partial charges full charges."},{"text":"The O–H bonds within one molecule are polar covalent bonds. Hydrogen bonds act between separate molecules.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: putting hydrogen bonds inside the molecule."},{"text":"Cohesion transmits tension through the water column. Evaporation from the leaf creates the tension.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying cohesion causes transpiration pull."}],"after":{"label":"What would have scored","text":"Liquid water indicates potential habitability for life as we know it, but its presence alone doesn’t demonstrate life."}}]}},{"code":"A1.2","title":"Nucleic acids","theme":"A","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"4-7","questionsPage":8,"bookTitle":null,"pack":{"oneLiner":"DNA stores instructions in the order of its bases, and its paired strands make those instructions possible to copy and use.","essentials":"\n> Tick a line only after you can do it with the page closed and without prompts.\n\n## Core\n\n- [ ] Explain why DNA is the genetic material of living organisms without claiming that every virus uses DNA.\n- [ ] Draw a nucleotide as a phosphate, a pentose sugar and a nitrogenous base, with each part in the right place.\n- [ ] Explain how condensation joins nucleotides into an RNA strand and creates a covalent sugar–phosphate backbone.\n- [ ] Name the bases in DNA and RNA, and explain why their order carries information.\n- [ ] Draw two antiparallel DNA strands with A–T and G–C pairs, showing hydrogen bonds between bases rather than along the backbone.\n- [ ] Compare DNA and RNA by sugar, bases and usual number of strands, including the difference at the 2′ carbon of their sugars.\n- [ ] Explain how complementary base pairing lets DNA be copied and information be expressed in RNA.\n- [ ] Explain why the possible sequences of four bases give DNA a high capacity to store information.\n- [ ] Explain how the near-universality of the genetic code supports common ancestry, without claiming that every organism has the same DNA sequence.\n\n## Higher level\n\n- [ ] Label the 5′ and 3′ ends of nucleic acid strands and explain why template strands run antiparallel to newly made strands.\n- [ ] Explain why a purine pairing with a pyrimidine keeps the width of the DNA double helix consistent.\n- [ ] Describe a nucleosome as DNA wound around an eight-histone core, with linker DNA and an associated linker histone.\n- [ ] Explain how the Hershey–Chase radioisotope results identify DNA rather than protein as the genetic material of the bacteriophage.\n- [ ] Interpret Chargaff’s base-composition data, including A≈T and G≈C within species and differing base proportions among species.\n\n## Links to other topics\n\n* **B1.2 Proteins** — a DNA base sequence ultimately specifies a protein's amino acid sequence. This connects a change in a gene to a possible change in protein shape and function.\n* **D1.1 DNA replication** — complementary strands and 5′/3′ directionality explain how copies are made and why the two new strands are synthesized differently.\n* **D1.2 Protein synthesis** — RNA uses complementary pairing to carry a copy of a gene's information; its base sequence is then read during translation.\n* **D1.3 Mutation and gene editing** — a changed base alters the stored sequence. Keeping the base order separate from the sugar–phosphate backbone makes a mutation easier to describe accurately.\n\n## Vocabulary that has to be exact\n\n| Term                       | What it means                                                                                                    | What it’s not                                                 |\n| -------------------------- | ---------------------------------------------------------------------------------------------------------------- | ------------------------------------------------------------- |\n| Nucleotide                 | A phosphate group, a pentose sugar and a nitrogenous base joined as one monomer                                  | A base on its own                                             |\n| Sugar–phosphate backbone   | The covalently linked alternating sugars and phosphates of one strand                                            | The hydrogen bonds between DNA strands                        |\n| Phosphodiester bond        | A covalent link joining the 3′ sugar position of one nucleotide through phosphate to the 5′ position of the next | A bond between complementary bases                            |\n| Complementary base pairing | Specific pairing of A with T in DNA, or A with U in RNA, and G with C                                            | A claim that two whole DNA molecules have identical sequences |\n| Antiparallel               | The two DNA strands run in opposite 5′ to 3′ directions                                                          | Two strands with opposite base identities at every position   |\n| Genetic code               | The correspondence between mRNA codons and amino acids or stop signals                                           | The entire base sequence of one species' genome               |\n| Purine                     | A two-ring base, adenine or guanine                                                                              | A one-ring pyrimidine, cytosine, thymine or uracil            |\n| Nucleosome                 | DNA wrapped around a core of eight histone proteins                                                              | A nucleotide or a complete chromosome                         |\n","videos":"\nWatch **one** explanation, then close it and draw the strands from memory. Watching the same idea twice can make it familiar without making it available when you need to produce it.\n\n## Main\n\n**Mister Lee Science (Alex Lee) — A1.2 Nucleic acids**\n\n* Channel: [https://www.youtube.com/@misterleescience](https://www.youtube.com/@misterleescience)\n* Search: [https://www.youtube.com/results?search_query=Mister+Lee+Science+IB+Biology+A1.2+nucleic+acids](https://www.youtube.com/results?search_query=Mister+Lee+Science+IB+Biology+A1.2+nucleic+acids)\n\n**Watch for:**\n\n* Where are the phosphate, sugar and base on one nucleotide?\n* Which bonds join nucleotides along one strand, and which bonds join the two DNA strands?\n* Why does each DNA strand run in the opposite direction to the other?\n* How does one strand's base order determine the complementary strand's order?\n\n**Pause at:** the first double-stranded DNA diagram. Hide its labels and draw three paired nucleotides. Mark both 5′ and 3′ ends, circle the sugar–phosphate backbones, then add A–T and G–C between them.\n\n## If that didn’t land\n\n**Amoeba Sisters — DNA and RNA**\n\n* Channel: [https://www.youtube.com/@AmoebaSisters](https://www.youtube.com/@AmoebaSisters)\n* Search: [https://www.youtube.com/results?search_query=Amoeba+Sisters+DNA+RNA+structure+base+pairing](https://www.youtube.com/results?search_query=Amoeba+Sisters+DNA+RNA+structure+base+pairing)\n\nTry this if the DNA/RNA comparison hasn't stuck. It gives you a different explanation, but you still need to draw and label the strands afterwards.\n\n**Khan Academy — nucleotides and nucleic acid structure**\n\n* Channel: [https://www.youtube.com/@khanacademy](https://www.youtube.com/@khanacademy)\n* Search: [https://www.youtube.com/results?search_query=Khan+Academy+nucleotides+phosphodiester+bond+DNA+RNA](https://www.youtube.com/results?search_query=Khan+Academy+nucleotides+phosphodiester+bond+DNA+RNA)\n\nUse this if you can picture the strands but can't yet explain which atoms form the backbone.\n\n## Worth it once, not for revision\n\nAn **animation** of DNA wrapping around histones earns one extra watch because the nucleosome is spatial. You need to see which part winds around the core and which DNA connects neighboring nucleosomes.\n\n* Search: [https://www.youtube.com/results?search_query=DNA+nucleosome+histone+octamer+linker+DNA+animation](https://www.youtube.com/results?search_query=DNA+nucleosome+histone+octamer+linker+DNA+animation)\n\nAfterward, sketch one eight-histone core with DNA around it and linker DNA leaving on both sides. Don't use the animation as a replacement for that sketch.\n\n## Pinned\n","traps":"\n## Calling a base a nucleotide\n\n**Commonly written:** “Adenine is a nucleotide in DNA.”\n\n**Why it doesn’t score:** Adenine is one nitrogenous base. A nucleotide also needs a pentose sugar and a phosphate group.\n\n**Scores instead:** “An adenine nucleotide contains the base adenine attached to a pentose sugar and a phosphate group.”\n\n## Putting hydrogen bonds in the backbone\n\n**Commonly written:** “Hydrogen bonds join the sugars and phosphates along a DNA strand.”\n\n**Why it doesn’t score:** Sugar and phosphate are covalently linked within one strand. Hydrogen bonds join complementary bases across two strands.\n\n**Scores instead:** “Covalent phosphodiester bonds form each sugar–phosphate backbone, while hydrogen bonds join complementary bases between strands.”\n\n## Drawing both strands in the same direction\n\n**Commonly written:** “Both DNA strands run 5′ to 3′ from left to right.”\n\n**Why it doesn’t score:** The strands are antiparallel. If one runs 5′ to 3′ left to right, its partner runs 3′ to 5′ left to right.\n\n**Scores instead:** “The two DNA strands are antiparallel, so their 5′ to 3′ directions are opposite.”\n\n## Pairing A with U in DNA\n\n**Commonly written:** “Adenine pairs with uracil in the DNA double helix.”\n\n**Why it doesn’t score:** DNA uses thymine opposite adenine. Uracil replaces thymine in RNA, including the RNA copied from a DNA template.\n\n**Scores instead:** “Adenine pairs with thymine in DNA, while adenine pairs with uracil in RNA.”\n\n## Confusing code with base sequence\n\n**Commonly written:** “All organisms have the same DNA sequence because the genetic code is universal.”\n\n**Why it doesn’t score:** Organisms differ in DNA sequence. Near-universality concerns the mapping from mRNA codons to amino acids, not matching genomes.\n\n**Scores instead:** “Nearly all organisms use the same correspondence between mRNA codons and amino acids despite having different DNA sequences.”\n\n## Assuming all four bases have equal percentages\n\n**Commonly written:** “Chargaff proved that A, T, G and C each make up 25% of DNA.”\n\n**Why it doesn’t score:** A is approximately equal to T and G to C within double-stranded DNA, but A+T and G+C proportions can vary across species.\n\n**Scores instead:** “Chargaff found that A≈T and G≈C within species, while the overall base composition varied between species.”\n\n## Swapping the Hershey–Chase isotopes\n\n**Commonly written:** “Sulfur-35 labeled DNA and entered the bacteria.”\n\n**Why it doesn’t score:** Sulfur-35 labeled phage protein, mostly found outside the bacteria. Phosphorus-32 labeled DNA and was found with the bacterial pellet.\n\n**Scores instead:** “Phosphorus-32-labeled DNA was found mainly with the infected bacterial pellet, while sulfur-35-labeled protein remained mainly in the supernatant.”\n\n## Treating the nucleosome as one histone\n\n**Commonly written:** “DNA sits inside a single histone to make a nucleosome.”\n\n**Why it doesn’t score:** DNA wraps around a core of eight histones, with linker DNA between cores and an associated linker histone.\n\n**Scores instead:** “A nucleosome has DNA wrapped around an eight-histone core, with linker DNA connecting it to neighboring nucleosomes.”\n","cards":[{"id":"A1.2-01","q":"What molecule carries hereditary information in living organisms, and how do some viruses differ?","a":"DNA is the genetic material in living organisms. Some viruses use RNA as their genetic material, but viruses aren't classified as living organisms in this syllabus. That exception doesn't change the statement about living organisms.","note":"Don't turn 'all living organisms' into 'every biological entity.'","marks":null},{"id":"A1.2-02","q":"Draw a nucleotide and name its three components, stating what the base attaches to.","a":"A nucleotide contains a phosphate group, a five-carbon pentose sugar and a nitrogenous base. The base attaches to the sugar, and the phosphate attaches to the sugar at a different position. A base alone isn't a nucleotide.","note":"","marks":null},{"id":"A1.2-03","q":"Explain how RNA nucleotides join into a polymer, including the bond and the molecule released.","a":"The 3′ hydroxyl of one nucleotide's ribose joins to the phosphate attached to the next nucleotide's 5′ carbon in a condensation reaction that releases water. The resulting covalent phosphodiester links create an alternating sugar–phosphate backbone with bases projecting from it.","note":"The backbone is covalent. Hydrogen bonds aren't the links along one RNA strand.","marks":null},{"id":"A1.2-04","q":"Name all bases in DNA and RNA, then explain where the stored information lies.","a":"DNA contains adenine, thymine, guanine and cytosine. RNA contains adenine, uracil, guanine and cytosine. The order of bases along a strand carries information; the repeating sugar–phosphate backbone doesn't encode the changing sequence.","note":"","marks":null},{"id":"A1.2-05","q":"Describe how the two strands of DNA are arranged and held together, including both base-pair rules.","a":"DNA has two antiparallel nucleotide strands in a double helix. Covalent phosphodiester bonds hold each sugar–phosphate backbone together. Hydrogen bonds join complementary bases between strands: adenine pairs with thymine, and guanine pairs with cytosine.","note":"You can draw the paired strands as a ladder; the helical twist isn't required for this diagram.","marks":null},{"id":"A1.2-06","q":"Compare DNA and RNA by sugar, bases and usual number of strands. What differs on the sugars?","a":"DNA usually has two strands and contains deoxyribose and the bases A, T, G and C. RNA is usually single-stranded and contains ribose and A, U, G and C. Ribose has an OH group at its 2′ carbon, where deoxyribose has H.","note":"RNA can fold back and pair with itself, so 'usually single-stranded' is more accurate than 'never pairs.'","marks":null},{"id":"A1.2-07","q":"Explain how complementary base pairing helps DNA information be copied and expressed.","a":"During DNA replication, each existing strand can act as a template because A pairs with T and G with C, specifying bases on a new strand. During transcription, a DNA template specifies a complementary RNA sequence, with U pairing with A in RNA. Hydrogen bonding provides the base-pair specificity.","note":"","marks":null},{"id":"A1.2-08","q":"Why can a molecule with only four different DNA bases store so much information?","a":"DNA molecules can contain very long sequences, and each position can hold one of four bases. A sequence of n positions therefore has 4^n possible base orders. The base order stores information compactly while the sugar–phosphate backbone remains repetitive.","note":"","marks":null},{"id":"A1.2-09","q":"Explain how the near-universality of the genetic code supports common ancestry. What claim would go too far?","a":"Across almost all living organisms, the same mRNA codons specify the same amino acids, which is evidence that they inherited this translation system from a common ancestor. It doesn't mean their DNA sequences are identical, and there are a few exceptions to the code.","note":"The genetic code maps codons to amino acids. It isn't another name for a genome.","marks":null},{"id":"A1.2-10","q":"Label a nucleic acid strand's 5′ and 3′ ends and explain the direction of a newly synthesized strand.","a":"The 5′ end has a phosphate associated with the sugar's 5′ carbon; the 3′ end has a free hydroxyl on the sugar's 3′ carbon. New nucleotides are added to the 3′ end, so a new DNA or RNA strand is synthesized 5′ to 3′ while its template is read in the opposite direction.","note":"The 5′ and 3′ labels refer to numbered carbons in the sugar, not to a count of bases.","marks":null},{"id":"A1.2-11","q":"Which bases are purines and pyrimidines, and why do their pairings help keep DNA width consistent?","a":"Adenine and guanine are two-ring purines; cytosine and thymine are one-ring pyrimidines. A–T and G–C each pair one purine with one pyrimidine, giving both pairs the same approximate width. A purine–purine pair would be too wide and a pyrimidine–pyrimidine pair too narrow for the usual DNA helix.","note":"","marks":null},{"id":"A1.2-12","q":"Describe one nucleosome, including the core, the DNA and the linker region.","a":"A nucleosome contains DNA wrapped around a core of eight histone proteins. Linker DNA connects neighboring nucleosome cores, and an additional linker histone associates with DNA near the entry and exit and helps stabilize the arrangement. It isn't a single histone with DNA inside it.","note":"","marks":null},{"id":"A1.2-13","q":"Trace the labels, separation and results in Hershey and Chase's bacteriophage experiment. What did those results support?","a":"Hershey and Chase labeled phage DNA with radioactive phosphorus-32 in one sample and phage protein with sulfur-35 in another. After infection, blending removed attached phage coats and centrifugation put bacteria in the pellet. Most phosphorus label was in the pellet, while most sulfur label remained in the supernatant. This showed that phage DNA, rather than most of its protein coat, entered the bacteria and supported DNA as the phage's genetic material.","note":"Don't claim that no sulfur entered any cell or that this experiment alone proved DNA is the genetic material of every organism.","marks":null},{"id":"A1.2-14","q":"What patterns did Chargaff find in DNA base proportions, and what earlier claim did the data undermine?","a":"Within a species' double-stranded DNA, the proportion of adenine is approximately equal to thymine and guanine is approximately equal to cytosine. The relative A+T and G+C proportions differ among species. That variation undermined the tetranucleotide hypothesis that DNA was a monotonous repetition of the four bases in equal amounts.","note":"A≈T and G≈C don't imply A≈G or that all four bases have equal percentages.","marks":null},{"id":"A1.2-15","q":"Correct this claim: 'Hydrogen bonds make the DNA sugar–phosphate backbone, while covalent bonds join A to T.'","a":"Covalent phosphodiester bonds join sugars and phosphates along each DNA strand. Hydrogen bonds form between the complementary bases on different strands, including A–T and G–C. Reversing those locations confuses the stable backbone with the pairing that allows strands to separate and template copies.","note":"","marks":null},{"id":"A1.2-16","q":"Rebuild the path from one nucleotide to a copied and expressed DNA sequence, naming the components, bonds, direction and pairing rules.","a":"Each nucleotide has a phosphate, sugar and base. Covalent phosphodiester bonds join nucleotides 5′ to 3′ into a sugar–phosphate backbone with a variable base sequence. Two DNA strands run antiparallel, with hydrogen-bonded A–T and G–C pairs. Complementarity lets either strand specify a new DNA partner during replication, while a DNA template specifies RNA during transcription, using U opposite A.","note":"This is the synthesis card. Draw both strands and an RNA copy before checking.","marks":null}],"exam":[{"question":"## Q1. Outline how RNA nucleotides form a strand with a sugar–phosphate backbone. **[4]**","scheme":"* Each nucleotide contains a phosphate group, ribose sugar and nitrogenous base. **[1]**\n* A condensation reaction joins nucleotides / releases water. **[1]**\n* A covalent phosphodiester bond links the 3′ sugar position of one nucleotide to the phosphate at the 5′ position of the next. **[1]**\n* Alternating sugars and phosphates form the backbone, with bases projecting from the strand. **[1]**\n\n*Examiner note: naming phosphodiester bonds isn't enough for four marks. Place the bond between neighboring nucleotides, then show the continuous backbone and its outward-facing bases.*"},{"question":"## Q2. Compare and contrast DNA and RNA in structure. **[5]**","scheme":"* Both are nucleotide polymers with covalent sugar–phosphate backbones. **[1]**\n* DNA contains deoxyribose, whereas RNA contains ribose / ribose has a 2′ OH where deoxyribose has H. **[1]**\n* DNA contains thymine, whereas RNA contains uracil. **[1]**\n* Both contain adenine, guanine and cytosine. **[1]**\n* DNA is usually double-stranded, whereas RNA is usually single-stranded. **[1]**\n\n*Examiner note: answer in paired comparisons. Saying RNA never forms paired regions overstates the difference, since a single strand can fold back on itself.*"},{"question":"## Q3. Explain how DNA structure allows genetic information to be copied accurately. **[5]**","scheme":"* The order of bases along a strand stores genetic information. **[1]**\n* The two strands are complementary / each can act as a template. **[1]**\n* Adenine pairs with thymine and guanine pairs with cytosine. **[1]**\n* Specific hydrogen bonding between complementary bases selects bases on each new strand. **[1]**\n* The new strand is synthesized 5′ to 3′ while the template is read antiparallel / in the opposite direction. **[1]**\n\n*Examiner note: “DNA unzips and copies itself” skips the information-carrying base order and the pairing rules. State both before describing the new strand.*"},{"question":"## Q4. Explain why purine-to-pyrimidine pairing contributes to the stability of the DNA helix. **[4]**","scheme":"* Adenine and guanine are two-ring purines. **[1]**\n* Thymine and cytosine are one-ring pyrimidines. **[1]**\n* A–T and G–C each pair one purine with one pyrimidine. **[1]**\n* The pairs have similar widths / keep the distance between backbones consistent along the helix. **[1]**\n\n*Examiner note: don't substitute the number of hydrogen bonds for the geometric reason. This question asks why the helix can keep a consistent width across different sequences.*"},{"question":"## Q5. Explain how the results of the Hershey–Chase experiment supported DNA as the genetic material of the bacteriophage. **[5]**","scheme":"* Phage DNA was labeled with phosphorus-32 in one sample and phage protein with sulfur-35 in another. **[1]**\n* Phages infected bacteria, then blending detached coats and centrifugation separated bacteria in the pellet from coats in the supernatant. **[1]**\n* Most phosphorus-32 was found with the bacterial pellet. **[1]**\n* Most sulfur-35 stayed in the supernatant / with the phage coats. **[1]**\n* DNA entered bacteria and directed production of new phages / the result supports DNA rather than protein as the phage's hereditary material. **[1]**\n\n*Examiner note: if you can't place each isotope after centrifugation, the conclusion has no evidence. Keep the label, fraction and inference together.*"},{"question":"## Q6. Suggest what Chargaff's measurements show about DNA, given one species with A 30%, T 30%, G 20% and C 20%, and another with A 20%, T 20%, G 30% and C 30%. **[4]**","scheme":"* In each species A is approximately equal to T. **[1]**\n* In each species G is approximately equal to C. **[1]**\n* Base proportions vary between species / A+T content differs between species. **[1]**\n* The variation refutes a fixed, equal-proportion repeating tetranucleotide pattern / supports capacity for differing base sequences. **[1]**\n\n*Examiner note: four values that sum to 100% don't answer the question. Compare the paired proportions within each species and the composition between species.*"}],"mcq":[{"id":"A1.2-q01","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"Which three parts make one nucleotide?","options":[{"text":"A phosphate group, a pentose sugar and a nitrogenous base","correct":true,"why":"Those are the three parts you need to draw and label. The base is attached to the sugar."},{"text":"A phosphate group, an amino acid and a nitrogenous base","correct":false,"why":"Amino acids build proteins. A nucleotide uses a five-carbon sugar instead."},{"text":"A nitrogenous base, a pentose sugar and a peptide bond","correct":false,"why":"Peptide bonds link amino acids in proteins. A nucleotide has a phosphate group."},{"text":"Two nitrogenous bases linked by a five-carbon sugar","correct":false,"why":"A nucleotide has one base, one sugar and a phosphate. Paired bases belong to two DNA strands."}],"after":null},{"id":"A1.2-q02","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"Which linkage builds the backbone along one DNA strand?","options":[{"text":"Hydrogen bonds between A and T bases on neighboring nucleotides","correct":false,"why":"Hydrogen bonds pair bases between the two DNA strands. They don't join a strand's backbone."},{"text":"Covalent phosphodiester bonds between sugars and phosphate groups","correct":true,"why":"The alternating sugars and phosphates form a covalent chain. That's one strand's backbone."},{"text":"Ionic attractions between charged bases on the same strand","correct":false,"why":"The bases aren't linked along a strand by ionic attractions. The backbone links sugar and phosphate."},{"text":"Peptide bonds between adjacent sugars and nitrogenous bases","correct":false,"why":"Peptide bonds form in proteins. Nucleotide chains use phosphodiester links in the backbone."}],"after":null},{"id":"A1.2-q03","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"A DNA strand reads 5′-ATGC-3′. What is its complementary strand when written left to right?","options":[{"text":"5′-TACG-3′, because matching strands run in the same direction","correct":false,"why":"The base letters match, but the direction labels don't. DNA strands run antiparallel."},{"text":"3′-TACG-5′, with opposite strand directions","correct":true,"why":"T pairs with A, A with T, C with G and G with C. The partner runs 3′ to 5′ left to right."},{"text":"3′-UACG-5′, because uracil pairs with adenine in DNA","correct":false,"why":"Uracil occurs in RNA. In a DNA partner strand, adenine pairs with thymine."},{"text":"5′-ATGC-3′, because each base pairs with an identical base","correct":false,"why":"A pairs with T, and G pairs with C. Complementary doesn't mean identical."}],"after":null},{"id":"A1.2-q04","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"Which structural difference identifies ribose rather than deoxyribose?","options":[{"text":"It has a phosphate group attached directly to its 2′ carbon","correct":false,"why":"The 2′ distinction is an OH group, not a phosphate. Phosphate links the sugar backbone."},{"text":"It has an OH group on its 2′ carbon instead of an H","correct":true,"why":"Ribose keeps a 2′ OH. Deoxyribose lacks that oxygen at the same position."},{"text":"It has five carbon atoms while deoxyribose has six carbon atoms","correct":false,"why":"Both are five-carbon sugars. They differ in the group on carbon 2′."},{"text":"It contains uracil within its sugar ring rather than thymine","correct":false,"why":"Uracil and thymine are bases attached to sugars. They aren't atoms within the sugar ring."}],"after":null},{"id":"A1.2-q05","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"Why can one DNA strand specify the base order of a new partner?","options":[{"text":"The repeating phosphates determine the identity of every new base","correct":false,"why":"Phosphates repeat along the backbone and don't carry a changing base-by-base instruction."},{"text":"Specific A–T and G–C pairing identifies each complementary base","correct":true,"why":"Each template base limits which base can pair across from it. That's the basis of copying."},{"text":"The strand's histone proteins select bases by matching their shape","correct":false,"why":"Histones package DNA into nucleosomes. Complementary bases specify the copied sequence."},{"text":"Both strands already contain identical bases at every position","correct":false,"why":"The two strands are complementary, not usually identical. A faces T, and G faces C."}],"after":null},{"id":"A1.2-q06","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"A DNA segment contains 8 positions. How many different base sequences are possible?","options":[{"text":"32, because each of four bases can occupy eight positions once","correct":false,"why":"A base can appear more than once. Multiplying four by eight misses the independent choices."},{"text":"256, because four base types are paired across two DNA strands","correct":false,"why":"Pairing determines the opposite strand. It doesn't reduce eight positions to four choices total."},{"text":"65,536, because each of eight positions has four choices","correct":true,"why":"That's 4^8. The order of bases, rather than a new backbone for each message, creates the variety."},{"text":"40,320, because every base must occur exactly once in the segment","correct":false,"why":"Bases can repeat. The calculation isn't a permutation of eight distinct items."}],"after":null},{"id":"A1.2-q07","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"What does the near-universality of the genetic code support?","options":[{"text":"The idea that all species have exactly the same DNA sequences","correct":false,"why":"Species differ in DNA sequence. The shared feature is the codon-to-amino-acid correspondence."},{"text":"The idea that RNA has replaced DNA as the genetic material of cells","correct":false,"why":"RNA participates in gene expression, but living cells store hereditary instructions in DNA."},{"text":"The idea that all viruses have DNA and must share a common cell ancestor","correct":false,"why":"Some viruses have RNA genomes. The claim about living organisms doesn't cover every virus."},{"text":"Shared codon assignments inherited from a common ancestor","correct":true,"why":"Nearly the same codons specify the same amino acids across life. A shared origin explains that pattern."}],"after":null},{"id":"A1.2-q08","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"A new RNA chain is being extended during transcription. At which end is the next nucleotide added?","options":[{"text":"The 3′ end, leaving the new strand to grow 5′ to 3′","correct":true,"why":"Nucleotides join to the growing chain's 3′ OH. The template is read in the opposite direction."},{"text":"The 5′ end, leaving the new strand to grow 3′ to 5′","correct":false,"why":"That's backwards for synthesis. RNA polymerase extends the 3′ end of the new strand."},{"text":"Either end, depending on whether adenine or guanine comes next","correct":false,"why":"The base identity doesn't set the growth direction. New nucleotides join at the 3′ end."},{"text":"Both ends at once, because the DNA template has two strands","correct":false,"why":"One RNA strand grows at its 3′ end while a DNA strand acts as the template."}],"after":null},{"id":"A1.2-q09","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"Why do A–T and G–C pairs help keep the DNA helix a consistent width?","options":[{"text":"Each pair contains two purines with the same double-ring structure","correct":false,"why":"A and G are purines, but T and C are pyrimidines. Two purines would make a wider pair."},{"text":"Each pair contains two pyrimidines that fit between the backbones","correct":false,"why":"T and C are pyrimidines, but A and G are purines. Two pyrimidines would make a narrower pair."},{"text":"Each pair contains one purine and one pyrimidine","correct":true,"why":"A–T and G–C occupy similar widths because both pair one purine with one pyrimidine."},{"text":"Each pair has the same number of hydrogen bonds between its bases","correct":false,"why":"A–T and G–C don't have the same number of hydrogen bonds. Their similar width comes from base sizes."}],"after":null},{"id":"A1.2-q10","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"Which description identifies a nucleosome?","options":[{"text":"An RNA strand folded around a single histone protein","correct":false,"why":"Nucleosomes package DNA, not RNA, and use an eight-histone core."},{"text":"A DNA strand wound around a core of eight histones","correct":true,"why":"DNA winds around the histone core. Linker DNA connects the cores along a longer molecule."},{"text":"Two free DNA bases held together by a histone bond","correct":false,"why":"Bases pair through hydrogen bonds. Histones package DNA at a larger scale."},{"text":"An eight-nucleotide sequence enclosed inside one phosphate group","correct":false,"why":"Phosphates belong to nucleotide backbones. A nucleosome contains a protein core and wrapped DNA."}],"after":null},{"id":"A1.2-q11","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"In Hershey and Chase's experiment, where was most phosphorus-32 found after blending and centrifugation?","options":[{"text":"In the supernatant with the sulfur-labeled phage coats","correct":false,"why":"The supernatant held most protein label. Phosphorus labeled DNA and stayed with infected bacteria."},{"text":"In the bacterial pellet, where DNA from the phage had entered","correct":true,"why":"Phosphorus labeled phage DNA, and most of that label went with the infected bacteria into the pellet."},{"text":"Only in newly made viral protein, because phosphorus labels proteins","correct":false,"why":"Sulfur was used to label protein. Phosphorus labeled the DNA in the original phages."},{"text":"Equally in the pellet and supernatant, showing both substances entered","correct":false,"why":"The two labels separated. Most phosphorus was in the pellet, while most sulfur stayed outside."}],"after":null},{"id":"A1.2-q12","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"One species has 30% A and 20% t":"DNA wraps around a core of eight histones, with linker DNA between cores and an associated linker histone.","correct":true,"why":"That’s exactly why it fails."},{"text":"Adenine is one nitrogenous base. A nucleotide also needs a pentose sugar and a phosphate group.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling a base a nucleotide."},{"text":"Sugar and phosphate are covalently linked within one strand. Hydrogen bonds join complementary bases across two strands.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: putting hydrogen bonds in the backbone."},{"text":"The strands are antiparallel. If one runs 5′ to 3′ left to right, its partner runs 3′ to 5′ left to right.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: drawing both strands in the same direction."}],"after":{"label":"What would have scored","text":"A nucleosome has DNA wrapped around an eight-histone core, with linker DNA connecting it to neighboring nucleosomes."}}]}},{"code":"A2.1","title":"Origins of cells","theme":"A","level":2,"levelTitle":"Cells","hlOnly":true,"pages":"56-58","questionsPage":69,"bookTitle":null,"pack":null},{"code":"A2.2","title":"Cell structure","theme":"A","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"59-66","questionsPage":69,"bookTitle":null,"pack":null},{"code":"A2.3","title":"Viruses","theme":"A","level":2,"levelTitle":"Cells","hlOnly":true,"pages":"67-68","questionsPage":69,"bookTitle":null,"pack":null},{"code":"A3.1","title":"Diversity of organisms","theme":"A","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"105-109","questionsPage":114,"bookTitle":null,"pack":null},{"code":"A3.2","title":"Classification and cladistics","theme":"A","level":3,"levelTitle":"Organisms","hlOnly":true,"pages":"110-113","questionsPage":114,"bookTitle":null,"pack":null},{"code":"A4.1","title":"Evolution and speciation","theme":"A","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"179-184","questionsPage":189,"bookTitle":null,"pack":null},{"code":"A4.2","title":"Conservation of biodiversity","theme":"A","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"185-188","questionsPage":189,"bookTitle":"Conservation of biology","pack":null},{"code":"B1.1","title":"Carbohydrates and lipids","theme":"B","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"9-13","questionsPage":18,"bookTitle":null,"pack":null},{"code":"B1.2","title":"Proteins","theme":"B","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"14-17","questionsPage":18,"bookTitle":null,"pack":{"oneLiner":"Twenty building blocks, joined in any order and any length, fold into shapes determined entirely by that order — and the shape is what does the job, which is why heating a protein or shifting its pH destroys the function without breaking a single link in the chain.","essentials":"\n> Each line is a thing you should be able to *do* with the page closed.\n> Note how short the Core list is and how long the Higher level one is. That\n> ratio is the topic.\n\n## Core\n\n- [ ] Draw and label the **generalized structure of an amino acid**: a central\n      carbon bonded to an amine group, a carboxyl group, a hydrogen atom, and a\n      variable R group.\n- [ ] Explain **condensation** between two amino acids: the amine group of one\n      reacts with the carboxyl group of the other, forming a **peptide bond**\n      and releasing one molecule of water. The product is a dipeptide.\n- [ ] Extend that to **polypeptides**: repeated condensation joins many amino\n      acids into a chain, releasing one water per bond formed.\n- [ ] Explain **dietary requirements for amino acids**: some amino acids can’t\n      be synthesized by the body and must be obtained from food (essential);\n      the rest can be made from other compounds (non-essential). A diet short\n      of an essential amino acid limits protein synthesis.\n- [ ] Explain why the **variety of possible peptide chains is effectively\n      unlimited**: any of 20 amino acids can occupy any position, and chains\n      vary in length, so the number of possible sequences of length *n* is\n      20 to the power of *n*.\n- [ ] Explain the **effect of temperature and pH on protein structure**: both\n      disrupt the bonds holding the folded shape, changing the conformation and\n      causing loss of function — **denaturation**. It may be reversible or\n      irreversible, and it does **not** break peptide bonds.\n\n## Higher level\n\n> Seven of the twelve syllabus statements sit here. This is the bulk of the\n> topic for you.\n\n- [ ] Explain how **chemical diversity in R groups** is the basis of protein\n      diversity: R groups differ in size, charge, polarity and reactivity, so\n      the same backbone supports enormously different molecules.\n- [ ] Define **primary structure** — the sequence of amino acids in a\n      polypeptide, and explain that it determines the final conformation,\n      because it fixes which R groups can interact and where.\n- [ ] Describe **secondary structure**: the alpha helix (coiling) and beta\n      pleated sheet (pleating), both stabilized by **hydrogen bonds between the\n      amine and carboxyl groups of the backbone**, not between R groups.\n- [ ] Describe **tertiary structure** — the overall three-dimensional shape of\n      one polypeptide, and name the four interactions between **R groups**\n      that hold it: hydrogen bonds, ionic bonds, disulfide covalent bonds\n      (between two cysteines), and hydrophobic interactions.\n- [ ] Explain the **effect of polar and non-polar amino acids** on tertiary\n      structure: in an aqueous environment, non-polar R groups tend to be\n      positioned in the interior and polar ones on the surface. In a membrane\n      the arrangement is reversed, with non-polar R groups facing the\n      hydrophobic core.\n- [ ] Describe **quaternary structure**: two or more polypeptides associating\n      into one functional protein. Distinguish **non-conjugated** proteins\n      (polypeptides only) from **conjugated** proteins, which include a\n      non-polypeptide prosthetic group — haemoglobin with its haem groups is\n      the standard example.\n- [ ] Compare **fibrous and globular proteins**: fibrous are long, narrow,\n      repetitive in sequence, largely insoluble and structural (collagen,\n      keratin); globular are rounded, irregular in sequence, soluble and\n      functional (enzymes, haemoglobin, insulin).\n\n## Links to other topics\n\n- **C1.1 Enzymes and metabolism** — enzymes are globular proteins, and the\n  active site is tertiary structure. Denaturation here *is* the enzyme\n  denaturation there. Learn it once.\n- **B2.1 Membranes** — integral and peripheral proteins sit where they do\n  because of polar and non-polar R groups. Same principle, one level up.\n- **D1.2 Protein synthesis** — translation builds primary structure. That\n  topic makes much more sense once you know what primary structure determines.\n- **A1.1 Water** — the hydrophobic interactions folding a protein are the same\n  exclusion effect you met with water. Nothing pushes.\n\n## Vocabulary that has to be exact\n\n| Term | What it means | What it’s not |\n| --- | --- | --- |\n| Peptide bond | Covalent bond between amino acids, formed by condensation | A hydrogen bond. It survives denaturation |\n| Primary structure | The **sequence** of amino acids | The shape |\n| Secondary structure | Helix or pleated sheet, H-bonded along the **backbone** | Held by R group interactions |\n| Tertiary structure | The 3D shape of **one** polypeptide, held by R group interactions | Quaternary |\n| Quaternary structure | **Two or more** polypeptides in one functional protein | Present in every protein |\n| Conjugated protein | Contains a non-polypeptide prosthetic group | Any protein with more than one chain |\n| Denaturation | Loss of 3D conformation and function | Breaking the polypeptide into amino acids |\n| Essential amino acid | Can’t be synthesized; must come from the diet | More important than the others |\n","videos":"\n> Watch **one** video, not four. A second explanation of the same idea feels\n> like progress and is mostly re-recognition. When one is done, close it and\n> draw the four levels of structure from memory — that drawing is the point.\n\n> Links below are channel and search links, which don’t rot. When you find the\n> video that actually works, paste its URL under \"Pinned\".\n\n## Main\n\n**Alex Lee — B1.2 Proteins** (may be split across videos)\n\n- Channel: \u003chttps://www.youtube.com/@misterleescience> — verified\n- Find it: \u003chttps://www.youtube.com/results?search_query=Mister+Lee+Science+B1.2+Proteins>\n\nAlex Lee's IB Biology series is widely recommended by IB students and is\nreported to follow the 2023 syllabus topic by topic. Search rather than trusting\na channel URL — handles change, and a dead link is what ends a study session.\nWhen you find the channel, paste it under Pinned. Because so much of B1.2 is HL,\ncheck he covers the higher level material and doesn’t stop at the SL statements.\n\nWatch for:\n- **Which bonds hold which level.** This is the whole topic. Secondary is\n  hydrogen bonds along the backbone; tertiary is four kinds of interaction\n  between R groups. If you take one thing away, take that.\n- The moment denaturation is explained. Listen for whether peptide bonds break.\n  They don’t, and that’s a marking point.\n- Every time an R group is mentioned — R groups are the reason proteins differ.\n\nPause at: the tertiary structure diagram. Before playing on, name all four\nR group interactions out loud. If the fourth doesn’t come, rewind.\n\n## If that didn’t land\n\n**Amoeba Sisters — Biomolecules / Protein structure**\n\n- Channel: \u003chttps://www.youtube.com/@AmoebaSisters> — verified\n- Find it: \u003chttps://www.youtube.com/results?search_query=Amoeba+Sisters+protein+structure+amino+acids>\n\nNot HL depth, but if amino acids and condensation themselves are the problem,\nthis sorts them out quickly and you can return to Alex Lee for the folding.\n\n**Protein folding animation**\n\n- Find it: \u003chttps://www.youtube.com/results?search_query=protein+folding+animation+primary+secondary+tertiary+quaternary>\n\nWatch an **animation** for the folding specifically. Going from a flat chain to\na three-dimensional shape is a spatial idea, and it’s far cheaper to learn\nfrom movement than from a paragraph. This is the one place in the topic where a\nsecond video earns its time.\n\n## Worth it once, not for revision\n\n- Any short clip of an egg white cooking, explained as denaturation. Sixty\n  seconds, and irreversible denaturation stops being an abstraction.\n\n## Pinned\n\n_Paste the URL of the video that actually worked, once you’ve found it._\n\n- Main:\n- Folding animation:\n","traps":"## Saying secondary structure is held by R group interactions\n\n**Commonly written:** \"The alpha helix is held together by bonds between the R\ngroups.\"\n\n**Why it doesn’t score:** Secondary structure is stabilized by hydrogen bonds\nbetween the **amine and carboxyl groups of the backbone**. R group interactions\nare what hold **tertiary** structure. Getting this backwards collapses the two\nlevels into one and loses marks in both.\n\n**Scores instead:** \"Hydrogen bonds form between the carboxyl group of one\namino acid and the amine group of another along the polypeptide backbone,\nproducing an alpha helix or beta pleated sheet.\"\n\n## Saying denaturation breaks peptide bonds\n\n**Commonly written:** \"Heating denatures the protein by breaking the bonds\nbetween the amino acids.\"\n\n**Why it doesn’t score:** Peptide bonds are covalent and aren’t broken by\nheat or pH change. What breaks are the weaker interactions holding the folded\nshape. The primary structure survives denaturation intact, which is exactly\nwhy denaturation is sometimes reversible.\n\n**Scores instead:** \"Heat disrupts the hydrogen bonds, ionic bonds and\nhydrophobic interactions holding the tertiary structure, changing the\nconformation. The peptide bonds and primary structure are unaffected.\"\n\n## Treating denaturation as always irreversible\n\n**Commonly written:** \"Denaturation is permanent.\"\n\n**Why it doesn’t score:** The syllabus says it may be reversible or\nirreversible. A protein denatured mildly can sometimes refold, because the\nprimary structure that determines the shape is still there.\n\n**Scores instead:** \"Denaturation may be reversible or irreversible depending\non the severity of the change.\"\n\n## Naming the levels without naming the bonds\n\n**Commonly written:** \"Primary is the sequence, secondary is the helix,\ntertiary is the 3D shape, quaternary is more than one chain.\"\n\n**Why it doesn’t score:** That’s a list of labels. Questions on this topic\nalmost always ask what **holds** each level, and a labels-only answer scores at\nthe bottom of the band.\n\n**Scores instead:** Attach the bonding to every level — backbone hydrogen bonds\nfor secondary; hydrogen, ionic, disulfide and hydrophobic interactions between\nR groups for tertiary.\n\n## Saying every protein has quaternary structure\n\n**Commonly written:** \"All proteins have four levels of structure.\"\n\n**Why it doesn’t score:** Quaternary structure exists only where two or more\npolypeptides associate. A protein made of a single polypeptide has no\nquaternary structure at all.\n\n**Scores instead:** \"Quaternary structure is present only in proteins made of\nmore than one polypeptide, such as haemoglobin.\"\n\n## Saying hydrophobic R groups are \"repelled\" by water\n\n**Commonly written:** \"Non-polar R groups are pushed into the centre because\nwater repels them.\"\n\n**Why it doesn’t score:** Nothing pushes. Water molecules bond preferentially\nwith each other and with polar R groups, which leaves the non-polar ones\nexcluded and therefore clustered inside. This is the same mechanism as in A1.1,\nand examiners treat \"repelled\" as a misunderstanding rather than loose wording.\n\n**Scores instead:** \"Non-polar R groups can’t form hydrogen bonds with water,\nso water associates with itself and with polar R groups instead, leaving the\nnon-polar groups clustered in the interior.\"\n\n## Calling essential amino acids the important ones\n\n**Commonly written:** \"Essential amino acids are the ones the body needs most.\"\n\n**Why it doesn’t score:** \"Essential\" is about synthesis, not importance. All\ntwenty are needed. Essential ones are simply those the body can’t make, so\nthey must come from the diet.\n\n**Scores instead:** \"Essential amino acids can’t be synthesized by the body\nand must be obtained from the diet; non-essential ones can be synthesized.\"\n\n## Getting condensation and hydrolysis backwards\n\n**Commonly written:** \"Water is added to join two amino acids.\"\n\n**Why it doesn’t score:** Condensation **releases** water as the bond forms.\nAdding water breaks the bond, which is hydrolysis. One word, one mark, and it\nis lost constantly.\n\n**Scores instead:** \"Condensation joins the amine group of one amino acid to\nthe carboxyl group of another, forming a peptide bond and releasing a molecule\nof water.\"\n","cards":[{"id":"B1.2-01","q":"Describe the generalized structure of an amino acid. Name every group attached to the central carbon.","a":"A central carbon atom is bonded to four things: an amine group (NH2), a carboxyl group (COOH), a hydrogen atom, and a variable R group. The first three are identical in every amino acid; only the R group differs.","note":"Four groups, and three of them are always the same. That’s why R groups carry all the diversity.","marks":null},{"id":"B1.2-02","q":"Explain what happens when two amino acids join, naming the reaction, the bond and the by-product.","a":"The reaction is condensation. The amine group of one amino acid reacts with the carboxyl group of the other, forming a covalent peptide bond between them and releasing one molecule of water. The product of two amino acids joining is a dipeptide.","note":"Condensation releases water. Adding water to break the bond is hydrolysis — getting these backwards is a constant one-mark loss.","marks":null},{"id":"B1.2-03","q":"A polypeptide contains 150 amino acids. How many peptide bonds does it have, and how many water molecules were released making it?","a":"149 peptide bonds, and 149 water molecules released. Each condensation joins one more amino acid to the chain and releases one water, so a chain of n amino acids has n minus 1 bonds.","note":"","marks":null},{"id":"B1.2-04","q":"Distinguish between essential and non-essential amino acids, and say why the distinction matters in a diet.","a":"Essential amino acids can’t be synthesized by the body and must be obtained from food. Non-essential amino acids can be synthesized from other compounds. The distinction matters because a diet short of any essential amino acid limits protein synthesis, regardless of how much total protein is eaten.","note":"'Essential' means 'can’t be made', not 'most important'. All twenty are needed.","marks":null},{"id":"B1.2-05","q":"Explain why the number of possible polypeptides is effectively unlimited.","a":"Any of the 20 amino acids can occupy any position in the chain, and chains can be any length. For a chain of n amino acids the number of possible sequences is 20 to the power of n, which becomes astronomically large even for short chains.","note":"","marks":null},{"id":"B1.2-06","q":"Define denaturation, and state precisely what is and isn’t broken.","a":"Denaturation is the disruption of a protein's three-dimensional conformation, causing loss of function. The hydrogen bonds, ionic bonds and hydrophobic interactions holding the folded shape are disrupted. Peptide bonds aren’t broken, so the primary structure remains intact. Denaturation may be reversible or irreversible depending on severity.","note":"Three separate marking points hide in here: shape lost, function lost, peptide bonds intact.","marks":null},{"id":"B1.2-07","q":"Explain how a change in pH denatures a protein, at the level of the bonds involved.","a":"A change in pH alters the charges on the R groups of amino acids, because acidic and basic R groups gain or lose hydrogen ions. Ionic bonds between oppositely charged R groups are therefore disrupted, and hydrogen bonding is affected, so the tertiary structure changes and function is lost.","note":"","marks":null},{"id":"B1.2-08","q":"Explain how high temperature denatures a protein.","a":"Increased temperature increases the kinetic energy and vibration of the molecule. This disrupts the relatively weak hydrogen bonds, ionic bonds and hydrophobic interactions holding the tertiary structure, so the protein unfolds and loses its functional shape. The covalent peptide bonds aren’t broken.","note":"","marks":null},{"id":"B1.2-09","q":"What is primary structure, and why does it determine everything else about the protein?","a":"Primary structure is the sequence of amino acids in a polypeptide, joined by peptide bonds. It determines the final conformation because the sequence fixes which R groups are present and where they sit relative to one another, and therefore which interactions can form as the chain folds.","note":"HL. 'The sequence determines the shape' is the sentence the whole topic rests on.","marks":null},{"id":"B1.2-10","q":"Describe secondary structure, naming both forms and the bonds that hold them. Be precise about where those bonds form.","a":"Secondary structure is regular, repeating folding of the polypeptide into an alpha helix (coiling) or a beta pleated sheet (pleating). Both are stabilized by hydrogen bonds between the carboxyl group of one amino acid and the amine group of another along the polypeptide backbone. R groups aren’t involved.","note":"HL. Backbone, not R groups. This is the single most common confusion in the topic.","marks":null},{"id":"B1.2-11","q":"Name all four interactions that hold tertiary structure, and say what they form between.","a":"All four form between R groups: hydrogen bonds between polar R groups; ionic bonds between oppositely charged R groups; disulfide covalent bonds between two cysteine R groups; and hydrophobic interactions between non-polar R groups. Together they fold one polypeptide into its specific three-dimensional shape.","note":"HL. Four of them, all between R groups. If only three come to mind, the missing one is usually disulfide.","marks":null},{"id":"B1.2-12","q":"Where do polar and non-polar R groups end up in a protein dissolved in water, and why? What changes in a membrane protein?","a":"In an aqueous environment, non-polar R groups are positioned mainly in the interior and polar R groups on the surface. This is because water bonds preferentially with itself and with polar groups, leaving the non-polar ones excluded and clustered inside. In a membrane protein the arrangement is reversed where the protein spans the bilayer: non-polar R groups face outwards into the hydrophobic core.","note":"HL. Nothing pushes the non-polar groups inward — they are excluded. Same mechanism as A1.1.","marks":null},{"id":"B1.2-13","q":"What is quaternary structure, and what makes a protein conjugated rather than non-conjugated?","a":"Quaternary structure is the association of two or more polypeptides into a single functional protein. A non-conjugated protein consists of polypeptides only. A conjugated protein also contains a non-polypeptide prosthetic group; haemoglobin is the standard example, with four polypeptides and four haem groups.","note":"HL. Not every protein has quaternary structure — only those with more than one chain.","marks":null},{"id":"B1.2-14","q":"Compare fibrous and globular proteins across shape, solubility, sequence and role, with an example of each.","a":"Fibrous proteins are long and narrow with a repetitive amino acid sequence, are largely insoluble in water, and have structural roles — collagen and keratin. Globular proteins are rounded and compact with an irregular sequence, are soluble in water, and have functional roles such as catalysis or transport — enzymes and haemoglobin.","note":"","marks":null},{"id":"B1.2-15","q":"Why can twenty amino acids produce proteins as different as keratin and an enzyme?","a":"Because the R groups differ chemically — in size, charge, polarity and reactivity. The backbone is identical in every amino acid, so it’s the R groups that determine which interactions form during folding, and therefore the shape and properties of the finished protein. Different sequences of R groups give completely different molecules from the same set of building blocks.","note":"","marks":null},{"id":"B1.2-16","q":"Someone writes: 'Boiling an egg denatures the proteins by breaking the peptide bonds.' What is wrong, and what is right?","a":"Peptide bonds are covalent and aren’t broken by heat. What heat disrupts are the weaker hydrogen bonds, ionic bonds and hydrophobic interactions holding the tertiary structure. The protein unfolds and loses function, but the primary structure is unchanged. In this case the denaturation happens to be irreversible.","note":"","marks":null},{"id":"B1.2-17","q":"Build the four levels of protein structure from memory: name each, and name what holds it.","a":"Primary: the sequence of amino acids, joined by peptide bonds. Secondary: alpha helix or beta pleated sheet, held by hydrogen bonds between backbone amine and carboxyl groups. Tertiary: the three-dimensional shape of one polypeptide, held by hydrogen bonds, ionic bonds, disulfide covalent bonds and hydrophobic interactions between R groups. Quaternary: two or more polypeptides associating, held by the same kinds of R group interaction, and present only in multi-chain proteins.","note":"HL. The synthesis card. If you can produce this one cleanly, most of B1.2 is yours.","marks":null}],"exam":[{"question":"## Q1. Outline how a dipeptide is formed from two amino acids. **[3]**","scheme":"- The reaction is condensation. **[1]**\n- The amine group of one amino acid reacts with the carboxyl group of the\n  other, forming a peptide bond. **[1]**\n- A molecule of water is released / eliminated. **[1]**\n\n_Examiner note: all three points are separate marks, and candidates routinely\ndrop the water. \"They join by a peptide bond\" is one mark, not three._"},{"question":"## Q2. Explain the effect of high temperature on the structure and function of an enzyme. **[4]**","scheme":"- Increased temperature increases kinetic energy / vibration of the\n  molecule. **[1]**\n- This disrupts the hydrogen bonds / ionic bonds / hydrophobic interactions\n  holding the tertiary structure. **[1]**\n- The three-dimensional conformation changes — the protein is denatured. **[1]**\n- The active site changes shape, so the substrate no longer fits / the enzyme\n  loses function. **[1]**\n- Accept: peptide bonds and primary structure are not affected. **[1 max within total]**\n\n_Examiner note: an answer that says \"the enzyme denatures and stops working\"\nscores one mark at most. \"Explain\" wants the chain — energy, bonds, shape,\nfunction — and each link is a separate mark._"},{"question":"## Q3. Distinguish between the secondary and tertiary structure of a protein. **[4]**","scheme":"Comparative statements. Maximum [4]:\n\n- Secondary structure is regular repeating folding (alpha helix or beta pleated\n  sheet) whereas tertiary structure is the overall three-dimensional shape of\n  the whole polypeptide. **[1]**\n- Secondary structure is stabilized by hydrogen bonds between backbone amine\n  and carboxyl groups, whereas tertiary structure is stabilized by interactions\n  between R groups. **[1]**\n- Tertiary structure involves four types of interaction — hydrogen bonds, ionic\n  bonds, disulfide covalent bonds and hydrophobic interactions — whereas\n  secondary structure involves hydrogen bonds only. **[1]**\n- Secondary structure is independent of the R groups present whereas tertiary\n  structure depends directly on which R groups are in the sequence. **[1]**\n\n_Examiner note: the backbone-versus-R-group distinction is the mark that\nseparates grades here. An answer that attributes secondary structure to R group\ninteractions loses it and usually confuses the rest of the answer too._"},{"question":"## Q4. Explain how the primary structure of a polypeptide determines its tertiary structure. **[3]**","scheme":"- Primary structure is the sequence of amino acids. **[1]**\n- The sequence determines which R groups are present and their positions in the\n  chain. **[1]**\n- The R groups interact — by hydrogen bonds, ionic bonds, disulfide bonds and\n  hydrophobic interactions — and these interactions fold the chain into a\n  specific three-dimensional shape. **[1]**\n\n_Examiner note: \"the sequence determines the shape\" restates the question and\nscores nothing on its own. The mark is in naming R groups as the link between\nthe two._"},{"question":"## Q5. Compare and contrast fibrous and globular proteins. **[4]**","scheme":"Comparative statements only. Maximum [4]:\n\n- Both are polypeptides / both are built from amino acids joined by peptide\n  bonds. **[1]**\n- Fibrous proteins are long and narrow whereas globular proteins are rounded\n  and compact. **[1]**\n- Fibrous proteins have a repetitive amino acid sequence whereas globular\n  proteins have an irregular sequence. **[1]**\n- Fibrous proteins are largely insoluble in water whereas globular proteins are\n  soluble. **[1]**\n- Fibrous proteins have structural roles whereas globular proteins have\n  functional roles such as catalysis or transport. **[1]**\n- Named examples used comparatively: collagen or keratin versus haemoglobin,\n  insulin or an enzyme. **[1]**\n\n_Examiner note: \"compare and contrast\" requires at least one similarity, and\nevery point must be written comparatively. \"Fibrous proteins are insoluble\"\nscores nothing on its own._"},{"question":"## Q6. State what is meant by a conjugated protein, and give one example. **[2]**","scheme":"- A protein containing a non-polypeptide prosthetic group in addition to its\n  polypeptide(s). **[1]**\n- Example: haemoglobin, which contains haem groups. **[1]**\n\n_Examiner note: \"state\" wants two sentences at most. A protein with more than\none chain isn’t automatically conjugated — that’s quaternary structure, which\nis a different idea._"}],"mcq":[{"id":"B1.2-q01","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"Which four groups are bonded to the central carbon of an amino acid?","options":[{"text":"An amine group, a carboxyl group, a hydrogen atom and an R group","correct":true,"why":"Every amino acid has the same first three. Only the R group changes from one amino acid to the next."},{"text":"An amine group, a phosphate group, a hydrogen atom and an R group","correct":false,"why":"Phosphate groups belong in nucleotides and phospholipids. An amino acid has a carboxyl group there."},{"text":"A hydroxyl group, a carboxyl group, a hydrogen atom and an R group","correct":false,"why":"The \"amino\" in amino acid is the amine group. A hydroxyl group isn't one of the four."},{"text":"An amine group, a carboxyl group, a methyl group and a peptide bond","correct":false,"why":"A peptide bond only forms when two amino acids join, and the fourth group is a hydrogen atom."}],"after":null},{"id":"B1.2-q02","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"What happens when two amino acids join by condensation?","options":[{"text":"A water molecule is used up to split them apart","correct":false,"why":"That's hydrolysis, the reverse reaction. Condensation releases water."},{"text":"A peptide bond forms and water is released","correct":true,"why":"The amine group of one reacts with the carboxyl group of the other. You get a dipeptide and one molecule of water."},{"text":"A hydrogen bond forms between their R groups","correct":false,"why":"The link between amino acids in a chain is a peptide bond, which is covalent. R groups aren't involved."},{"text":"A disulfide bond forms and CO2 is released","correct":false,"why":"Disulfide bonds form between two cysteines in tertiary structure. They don't join amino acids into a chain."}],"after":null},{"id":"B1.2-q03","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"A polypeptide is 150 amino acids long. How many water molecules were released when it was made?","options":[{"text":"150","correct":false,"why":"Count the bonds, not the amino acids. A chain of 150 has one fewer bond than it has amino acids."},{"text":"149","correct":true,"why":"One water comes off for each peptide bond, and a chain of 150 amino acids has 149 bonds."},{"text":"151","correct":false,"why":"There's one bond fewer than the number of amino acids, not one more."},{"text":"300","correct":false,"why":"Each condensation releases one water, not two."}],"after":null},{"id":"B1.2-q04","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"What makes an amino acid \"essential\"?","options":[{"text":"It's needed in larger amounts than the others","correct":false,"why":"\"Essential\" isn't about amount or importance. It's about where the amino acid has to come from."},{"text":"It's found in every protein the body makes","correct":false,"why":"Plenty of proteins lack particular amino acids. That isn't what the word means here."},{"text":"The body can't make it, so it must come from food","correct":true,"why":"Non-essential ones can be made from other compounds. Essential ones can't, so a diet short of one limits protein synthesis."},{"text":"It's the only type that can form peptide bonds","correct":false,"why":"Every amino acid can form peptide bonds. Essential describes diet, not chemistry."}],"after":null},{"id":"B1.2-q05","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"How many different sequences are possible for a peptide three amino acids long?","options":[{"text":"60","correct":false,"why":"That's 20 × 3. Each of the three positions multiplies the choices, so it's 20 × 20 × 20."},{"text":"400","correct":false,"why":"That's 20 squared, which is the answer for two amino acids, not three."},{"text":"1,140","correct":false,"why":"That counts combinations where order doesn't matter. In a peptide order matters, so it's 20 to the power of 3."},{"text":"8,000","correct":true,"why":"Any of 20 amino acids can go in each position, so it's 20 to the power of 3."}],"after":null},{"id":"B1.2-q06","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"An enzyme is heated until it denatures. Which bonds are still intact?","options":[{"text":"Hydrogen bonds holding the secondary structure","correct":false,"why":"Those are among the first to break when a protein is heated."},{"text":"Ionic bonds between charged R groups","correct":false,"why":"Ionic bonds in the tertiary structure are disrupted by denaturation. That's part of why the shape changes."},{"text":"Peptide bonds between the amino acids","correct":true,"why":"Denaturation changes the shape, not the sequence. The chain is still one piece afterward."},{"text":"Hydrophobic interactions in the interior","correct":false,"why":"Heat disrupts those too, which is part of why the protein unfolds."}],"after":null},{"id":"B1.2-q07","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"Which statement about denaturation is correct?","options":[{"text":"It's always permanent once the shape is lost","correct":false,"why":"Mild denaturation can reverse. Writing \"always permanent\" loses the mark."},{"text":"It can be reversible or irreversible, depending on severity","correct":true,"why":"Some proteins refold when normal conditions return. Severe heat or extreme pH can make the change permanent."},{"text":"It breaks the protein back down into amino acids","correct":false,"why":"That would be hydrolysis. Denaturation leaves the chain of amino acids whole."},{"text":"It only happens at temperatures above 100 °C","correct":false,"why":"Many proteins denature well below boiling, and pH changes can denature them at any temperature."}],"after":null},{"id":"B1.2-q08","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"How does a change in pH denature a protein?","options":[{"text":"It changes the charges on R groups, disrupting ionic bonds","correct":true,"why":"Adding or removing H+ changes which R groups are charged, so ionic and hydrogen bonds holding the shape break."},{"text":"It hydrolyzes the peptide bonds along the backbone","correct":false,"why":"pH changes disrupt the folding, not the peptide bonds. The sequence stays the same."},{"text":"It adds extra amino acids to the end of the chain","correct":false,"why":"pH can't add amino acids. Only translation builds the chain."},{"text":"It removes water from inside the folded protein","correct":false,"why":"Losing water isn't the mechanism. pH works by changing the charges on R groups."}],"after":null},{"id":"B1.2-q09","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"Which bonds hold a protein's secondary structure together?","options":[{"text":"Ionic bonds between oppositely charged R groups","correct":false,"why":"That's tertiary structure. R-group bonds shape the whole chain, not the helix."},{"text":"Disulfide bonds between pairs of cysteine R groups","correct":false,"why":"Disulfide bonds are also R-group interactions, so they belong to tertiary structure."},{"text":"Hydrogen bonds between backbone amine and carboxyl groups","correct":true,"why":"The alpha helix and beta pleated sheet are the backbone folding on itself, so the R groups aren't involved yet."},{"text":"Hydrophobic interactions between non-polar R groups","correct":false,"why":"Those help fold the whole chain in tertiary structure, not the helix or sheet."}],"after":null},{"id":"B1.2-q10","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"Which interactions hold a protein's tertiary structure together?","options":[{"text":"Peptide bonds only, between neighboring amino acids along the chain","correct":false,"why":"Peptide bonds make the primary structure. The tertiary shape is held by R groups interacting."},{"text":"Hydrogen, ionic and disulfide bonds plus hydrophobic interactions between R groups","correct":true,"why":"Name all four and say they're between R groups. Listing \"bonds\" without naming them doesn't score."},{"text":"Hydrogen bonds between backbone amine and carboxyl groups, and nothing else","correct":false,"why":"That's secondary structure. Tertiary structure comes from the R groups."},{"text":"Bonds between two or more separate polypeptide chains in one protein","correct":false,"why":"That's quaternary structure. Tertiary is the shape of one chain."}],"after":null},{"id":"B1.2-q11","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"Which protein is an example of quaternary structure?","options":[{"text":"Haemoglobin, made of four polypeptide chains","correct":true,"why":"Quaternary structure means two or more polypeptides in one protein. Haemoglobin also has haem groups, so it's conjugated too."},{"text":"Any enzyme, since every protein has four levels","correct":false,"why":"Not every protein has quaternary structure. Many are a single polypeptide."},{"text":"A single polypeptide folded into an alpha helix","correct":false,"why":"One chain can't have quaternary structure, and a helix is secondary structure."},{"text":"Any dipeptide formed from two amino acids","correct":false,"why":"A dipeptide is two amino acids in one chain. Quaternary structure needs two or more chains."}],"after":null},{"id":"B1.2-q12","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"Which description fits a globular protein?","options":[{"text":"Long and narrow, insoluble, with a structural role","correct":false,"why":"That describes fibrous proteins like collagen and keratin."},{"text":"Rounded and soluble, with a functional role","correct":true,"why":"Enzymes, haemoglobin and insulin all fit. Their shape lets them do a job, not hold something up."},{"text":"Repetitive in sequence, forming strong fibers","correct":false,"why":"Repetitive sequences are a fibrous-protein feature. Globular proteins have irregular sequences."},{"text":"Always embedded in the phospholipid bilayer","correct":false,"why":"Some membrane proteins are globular, but most globular proteins, like enzymes, work in solution."}],"after":null},{"id":"B1.2-t1","topic":"B1.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"The alpha helix is held together by bonds between the R groups.","prompt":"Why does it fail?","options":[{"text":"Secondary structure is stabilized by hydrogen bonds between the **amine and carboxyl groups of the backbone**. R group interactions are what hold **tertiary** structure. Getting this backwards collapses the two levels into one and loses marks in both.","correct":true,"why":"That’s exactly why it fails."},{"text":"Peptide bonds are covalent and aren’t broken by heat or pH change. What breaks are the weaker interactions holding the folded shape. The primary structure survives denaturation intact, which is exactly why denaturation is sometimes reversible.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying denaturation breaks peptide bonds."},{"text":"The syllabus says it may be reversible or irreversible. A protein denatured mildly can sometimes refold, because the primary structure that determines the shape is still there.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating denaturation as always irreversible."},{"text":"That’s a list of labels. Questions on this topic almost always ask what **holds** each level, and a labels-only answer scores at the bottom of the band.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: naming the levels without naming the bonds."}],"after":{"label":"What would have scored","text":"Hydrogen bonds form between the carboxyl group of one amino acid and the amine group of another along the polypeptide backbone, producing an alpha helix or beta pleated sheet."}},{"id":"B1.2-t2","topic":"B1.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Heating denatures the protein by breaking the bonds between the amino acids.","prompt":"Why does it fail?","options":[{"text":"Peptide bonds are covalent and aren’t broken by heat or pH change. What breaks are the weaker interactions holding the folded shape. The primary structure survives denaturation intact, which is exactly why denaturation is sometimes reversible.","correct":true,"why":"That’s exactly why it fails."},{"text":"Secondary structure is stabilized by hydrogen bonds between the **amine and carboxyl groups of the backbone**. R group interactions are what hold **tertiary** structure. Getting this backwards collapses the two levels into one and loses marks in both.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying secondary structure is held by R group interactions."},{"text":"The syllabus says it may be reversible or irreversible. A protein denatured mildly can sometimes refold, because the primary structure that determines the shape is still there.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating denaturation as always irreversible."},{"text":"That’s a list of labels. Questions on this topic almost always ask what **holds** each level, and a labels-only answer scores at the bottom of the band.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: naming the levels without naming the bonds."}],"after":{"label":"What would have scored","text":"Heat disrupts the hydrogen bonds, ionic bonds and hydrophobic interactions holding the tertiary structure,
