prompt":"A cell is 25 µm long, while its micrograph is 50 mm long. What is the magnification?","options":[{"text":"×2","correct":false,"why":"This comes from dividing 50 by 25 before matching the units. The image length is given in millimeters."},{"text":"×200","correct":false,"why":"This is ten times too small. Converting 50 mm gives 50,000 µm."},{"text":"×2000","correct":true,"why":"Convert 50 mm to 50,000 µm, then divide image size by actual size: 50,000 ÷ 25 = 2000."},{"text":"×1,250,000","correct":false,"why":"The measurements have been multiplied rather than divided. Magnification is image size divided by actual size."}],"after":null},{"id":"A2.2-q03","topic":"A2.2","kind":"mcq","lead":"","quote":"","prompt":"Which statement distinguishes resolution from magnification?","options":[{"text":"Resolution separates nearby points; magnification enlarges the image","correct":true,"why":"Resolution determines whether fine detail can be distinguished. Magnification only describes how large the image is compared with the specimen."},{"text":"Resolution enlarges organelles; magnification increases image contrast","correct":false,"why":"Magnification enlarges the image, while contrast concerns differences between light and dark regions. Neither definition given here describes resolution."},{"text":"Resolution measures specimen size; magnification measures field diameter","correct":false,"why":"Specimen size and field diameter are measurements used in microscopy. They aren't the definitions of resolution and magnification."},{"text":"Resolution stains specimens; magnification focuses the objective lens","correct":false,"why":"Staining and focusing are preparation and microscope-use techniques. They don't define either quantity."}],"after":null},{"id":"A2.2-q04","topic":"A2.2","kind":"mcq","lead":"","quote":"","prompt":"What makes immunofluorescence useful for locating a particular protein in a cell?","options":[{"text":"Fluorescent antibodies bind specifically to the target antigen","correct":true,"why":"Antibody specificity connects the fluorescent signal to a particular antigen, usually the protein being located."},{"text":"Electrons cause every membrane in the specimen to fluoresce","correct":false,"why":"Immunofluorescence is a light-microscopy method. Its selectivity comes from antibodies, not electron illumination."},{"text":"A stain colors every organelle according to its natural pigment","correct":false,"why":"Most organelles lack diagnostic natural pigments. Labeling every structure would also remove the method's specificity."},{"text":"Freezing separates the two layers of each target protein","correct":false,"why":"Freezing and splitting a specimen describes freeze fracture. It isn't how antibodies locate a protein."}],"after":null},{"id":"A2.2-q05","topic":"A2.2","kind":"mcq","lead":"","quote":"","prompt":"Which combination identifies a typical prokaryotic cell?","options":[{"text":"Nucleoid DNA, 70S ribosomes and no membrane-bound nucleus","correct":true,"why":"A prokaryote keeps its DNA in a nucleoid region, uses 70S ribosomes and lacks a membrane-bound nucleus."},{"text":"Nuclear chromosomes, 80S ribosomes and rough endoplasmic reticulum","correct":false,"why":"A nucleus, cytoplasmic 80S ribosomes and rough ER are features of eukaryotic cells."},{"text":"Nucleoid DNA, 80S ribosomes and a double nuclear membrane","correct":false,"why":"A nucleoid and a nuclear membrane can't describe the same typical cell. Prokaryotic ribosomes are 70S."},{"text":"Circular DNA, lysosomes and membrane-bound mitochondria","correct":false,"why":"Lysosomes and mitochondria are membrane-bound eukaryotic organelles. Prokaryotes lack both."}],"after":null},{"id":"A2.2-q06","topic":"A2.2","kind":"mcq","lead":"","quote":"","prompt":"Which organelle modifies, sorts and packages proteins into vesicles?","options":[{"text":"Rough endoplasmic reticulum","correct":false,"why":"Rough ER synthesizes proteins on attached ribosomes and begins their transport. Later sorting and packaging occur in the Golgi apparatus."},{"text":"Golgi apparatus","correct":true,"why":"The Golgi apparatus receives cell products, modifies and sorts them, then packages them into vesicles."},{"text":"Smooth endoplasmic reticulum","correct":false,"why":"Smooth ER is associated with lipid synthesis and other metabolic processes. It lacks attached ribosomes."},{"text":"Lysosome","correct":false,"why":"A lysosome contains hydrolytic enzymes used in intracellular digestion. It doesn't run the cell's packaging pathway."}],"after":null},{"id":"A2.2-q07","topic":"A2.2","kind":"mcq","lead":"","quote":"","prompt":"A micrograph shows a cell wall, a large sap vacuole and no visible chloroplasts. Which conclusion is best supported?","options":[{"text":"It can't be a plant cell because chloroplasts are absent","correct":false,"why":"Many plant cells, including root cells, don't contain chloroplasts. Chloroplast absence doesn't exclude a plant cell."},{"text":"It is definitely fungal because all fungi have large sap vacuoles","correct":false,"why":"Fungal cells can have vacuoles, but a large sap vacuole doesn't prove fungal identity. Wall composition would matter."},{"text":"It may be a non-photosynthetic plant cell","correct":true,"why":"A cell wall and large sap vacuole support plant identity, while a non-photosynthetic plant cell may lack chloroplasts."},{"text":"It must be animal because chloroplasts are absent","correct":false,"why":"Animal cells lack cell walls and don't have a large permanent sap vacuole. Chloroplast absence alone isn't enough."}],"after":null},{"id":"A2.2-q08","topic":"A2.2","kind":"mcq","lead":"","quote":"","prompt":"Which feature makes a mature mammalian red blood cell atypical among eukaryotic cells?","options":[{"text":"It contains many nuclei formed by cell fusion","correct":false,"why":"That describes a skeletal muscle fiber. A mature mammalian red blood cell loses its nucleus."},{"text":"It has naked circular DNA in a nucleoid","correct":false,"why":"That describes prokaryotic genetic organization. A mature mammalian red blood cell has no nucleoid."},{"text":"It lacks a nucleus after differentiation","correct":true,"why":"The nucleus is lost as the mammalian red blood cell matures, making it an anucleate eukaryotic cell."},{"text":"It shares one cytoplasm with neighboring cells","correct":false,"why":"Continuous multinucleate cytoplasm describes an aseptate fungal hypha, not separate red blood cells."}],"after":null},{"id":"A2.2-q09","topic":"A2.2","kind":"mcq","lead":"","quote":"","prompt":"Which observation best supports the endosymbiotic origin of mitochondria?","options":[{"text":"They contain hydrolytic enzymes inside a single membrane","correct":false,"why":"That describes lysosomes. Hydrolytic enzymes don't provide the required prokaryote-like evidence."},{"text":"They contain 70S ribosomes and naked circular DNA","correct":true,"why":"These resemble prokaryotic ribosomes and DNA, supporting the origin of mitochondria from an engulfed prokaryote."},{"text":"They are assembled by the Golgi apparatus from vesicles","correct":false,"why":"Golgi vesicles don't assemble mitochondria. Mitochondria grow and replicate within cells."},{"text":"They contain 80S ribosomes enclosed by a nucleus","correct":false,"why":"Cytoplasmic 80S ribosomes and a nucleus are eukaryotic features. Mitochondria contain 70S ribosomes and no nucleus."}],"after":null},{"id":"A2.2-q10","topic":"A2.2","kind":"mcq","lead":"","quote":"","prompt":"Why can two differentiated cells have different structures even when they contain the same genome?","options":[{"text":"They express different genes and produce different proteins","correct":true,"why":"Different patterns of gene expression change which proteins are produced, leading to specialized structures and functions."},{"text":"They replace their DNA with genes taken from nearby tissues","correct":false,"why":"Differentiation doesn't normally replace the genome. Cells alter which existing genes they express."},{"text":"They translate every gene but destroy different chromosomes afterward","correct":false,"why":"Cells don't normally express every gene or discard chromosomes to specialize. Regulation occurs at gene expression."},{"text":"They receive different ribosome types during each cell division","correct":false,"why":"Different cytoplasmic ribosome types don't explain specialization. The important difference is which genes are expressed."}],"after":null},{"id":"A2.2-q11","topic":"A2.2","kind":"mcq","lead":"","quote":"","prompt":"Which pair correctly matches an atypical cell structure with its number of nuclei?","options":[{"text":"Skeletal muscle fiber: no nuclei","correct":false,"why":"Skeletal muscle fibers are multinucleate because precursor cells fuse during their development."},{"text":"Aseptate fungal hypha: many nuclei","correct":true,"why":"An aseptate hypha has continuous cytoplasm containing many nuclei without complete cross-walls separating them."},{"text":"Mature sieve tube element: one nucleus","correct":false,"why":"A mature sieve tube element lacks a nucleus and depends on an associated companion cell."},{"text":"Mature mammalian red blood cell: many nuclei","correct":false,"why":"A mature mammalian red blood cell has no nucleus. It doesn't become multinucleate."}],"after":null},{"id":"A2.2-q12","topic":"A2.2","kind":"mcq","lead":"","quote":"","prompt":"What is one advantage of multicellularity identified in A2.2?","options":[{"text":"Every cell can perform every function independently","correct":false,"why":"That describes the demand placed on a unicellular organism. Multicellular organisms can divide functions among specialized cells."},{"text":"All cells can lose their plasma membranes","correct":false,"why":"Cells still need plasma membranes to maintain boundaries and regulate exchange. Multicellularity doesn't remove that requirement."},{"text":"Specialized cells can divide biological functions","correct":true,"why":"Cell specialization permits division of labor, and cooperation among those cells can support a larger body."},{"text":"The organism no longer needs gene expression","correct":false,"why":"Gene expression is required for cell function and differentiation. Multicellularity makes its regulation especially important."}],"after":null},{"id":"A2.2-t1","topic":"A2.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Electron microscopes are better because they magnify more.","prompt":"Why does it fail?","options":[{"text":"Magnification only enlarges an image. The key advantage is greater resolution, which reveals two close points as separate.","correct":true,"why":"That’s exactly why it fails."},{"text":"Image size and actual size must be converted to the same unit before image size is divided by actual size.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: dividing measurements before matching the units."},{"text":"Prokaryotes contain nucleoid DNA and 70S ribosomes; they lack a membrane-bound nucleus and membrane-bound organelles.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying prokaryotes have no DNA or ribosomes."},{"text":"Only photosynthetic plant cells contain chloroplasts. Non-photosynthetic cells, including many root cells, lack them.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling every plant cell chloroplast-containing."}],"after":{"label":"What would have scored","text":"Electron microscopes have greater resolution than light microscopes, so they reveal finer cell ultrastructure."}},{"id":"A2.2-t2","topic":"A2.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"The image is 20 mm and the cell is 10 µm, so the magnification is ×2.","prompt":"Why does it fail?","options":[{"text":"Image size and actual size must be converted to the same unit before image size is divided by actual size.","correct":true,"why":"That’s exactly why it fails."},{"text":"Magnification only enlarges an image. The key advantage is greater resolution, which reveals two close points as separate.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating magnification as resolution."},{"text":"Prokaryotes contain nucleoid DNA and 70S ribosomes; they lack a membrane-bound nucleus and membrane-bound organelles.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying prokaryotes have no DNA or ribosomes."},{"text":"Only photosynthetic plant cells contain chloroplasts. Non-photosynthetic cells, including many root cells, lack them.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling every plant cell chloroplast-containing."}],"after":{"label":"What would have scored","text":"20 mm is 20,000 µm, so the magnification is 20,000 ÷ 10 = ×2000."}},{"id":"A2.2-t3","topic":"A2.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Prokaryotic cells have no nucleus, so they have no DNA or ribosomes.","prompt":"Why does it fail?","options":[{"text":"Prokaryotes contain nucleoid DNA and 70S ribosomes; they lack a membrane-bound nucleus and membrane-bound organelles.","correct":true,"why":"That’s exactly why it fails."},{"text":"Magnification only enlarges an image. The key advantage is greater resolution, which reveals two close points as separate.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating magnification as resolution."},{"text":"Image size and actual size must be converted to the same unit before image size is divided by actual size.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: dividing measurements before matching the units."},{"text":"Only photosynthetic plant cells contain chloroplasts. Non-photosynthetic cells, including many root cells, lack them.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling every plant cell chloroplast-containing."}],"after":{"label":"What would have scored","text":"A prokaryote has naked DNA in a nucleoid region and 70S ribosomes, but no membrane-bound nucleus."}},{"id":"A2.2-t4","topic":"A2.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Plant cells can always be identified because they contain chloroplasts.","prompt":"Why does it fail?","options":[{"text":"Only photosynthetic plant cells contain chloroplasts. Non-photosynthetic cells, including many root cells, lack them.","correct":true,"why":"That’s exactly why it fails."},{"text":"Magnification only enlarges an image. The key advantage is greater resolution, which reveals two close points as separate.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating magnification as resolution."},{"text":"Image size and actual size must be converted to the same unit before image size is divided by actual size.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: dividing measurements before matching the units."},{"text":"Prokaryotes contain nucleoid DNA and 70S ribosomes; they lack a membrane-bound nucleus and membrane-bound organelles.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying prokaryotes have no DNA or ribosomes."}],"after":{"label":"What would have scored","text":"A cell wall supports identification as a plant cell, while chloroplasts identify a photosynthetic plant cell when they’re visible."}},{"id":"A2.2-t5","topic":"A2.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"The organelle is green in the electron micrograph, so it must be a chloroplast.","prompt":"Why does it fail?","options":[{"text":"Electron micrographs are produced without natural color, and added color doesn't establish the identity of a structure.","correct":true,"why":"That’s exactly why it fails."},{"text":"Magnification only enlarges an image. The key advantage is greater resolution, which reveals two close points as separate.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating magnification as resolution."},{"text":"Image size and actual size must be converted to the same unit before image size is divided by actual size.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: dividing measurements before matching the units."},{"text":"Prokaryotes contain nucleoid DNA and 70S ribosomes; they lack a membrane-bound nucleus and membrane-bound organelles.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying prokaryotes have no DNA or ribosomes."}],"after":{"label":"What would have scored","text":"The organelle is identified as a chloroplast from its internal membranes and its position within a plant cell, not from added color."}},{"id":"A2.2-t6","topic":"A2.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Every eukaryotic cell has exactly one membrane-bound nucleus.","prompt":"Why does it fail?","options":[{"text":"Some eukaryotic structures are multinucleate, while mature mammalian red blood cells and sieve tube elements lack nuclei.","correct":true,"why":"That’s exactly why it fails."},{"text":"Magnification only enlarges an image. The key advantage is greater resolution, which reveals two close points as separate.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating magnification as resolution."},{"text":"Image size and actual size must be converted to the same unit before image size is divided by actual size.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: dividing measurements before matching the units."},{"text":"Prokaryotes contain nucleoid DNA and 70S ribosomes; they lack a membrane-bound nucleus and membrane-bound organelles.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying prokaryotes have no DNA or ribosomes."}],"after":{"label":"What would have scored","text":"Typical eukaryotic cells have a nucleus, but skeletal muscle fibers and aseptate hyphae have many, while some differentiated cells have none."}},{"id":"A2.2-t7","topic":"A2.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Mitochondria have DNA, ribosomes and can reproduce.","prompt":"Why does it fail?","options":[{"text":"The evidence depends on specific prokaryote-like features: naked circular DNA, 70S ribosomes and replication within the cell.","correct":true,"why":"That’s exactly why it fails."},{"text":"Magnification only enlarges an image. The key advantage is greater resolution, which reveals two close points as separate.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating magnification as resolution."},{"text":"Image size and actual size must be converted to the same unit before image size is divided by actual size.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: dividing measurements before matching the units."},{"text":"Prokaryotes contain nucleoid DNA and 70S ribosomes; they lack a membrane-bound nucleus and membrane-bound organelles.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying prokaryotes have no DNA or ribosomes."}],"after":{"label":"What would have scored","text":"Mitochondria contain naked circular DNA and 70S ribosomes and can replicate, all of which support their prokaryotic origin."}},{"id":"A2.2-t8","topic":"A2.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"A muscle cell becomes different because it receives different genes from a nerve cell.","prompt":"Why does it fail?","options":[{"text":"Differentiated cells generally retain the same genome; different patterns of gene expression produce different proteins and structures.","correct":true,"why":"That’s exactly why it fails."},{"text":"Magnification only enlarges an image. The key advantage is greater resolution, which reveals two close points as separate.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating magnification as resolution."},{"text":"Image size and actual size must be converted to the same unit before image size is divided by actual size.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: dividing measurements before matching the units."},{"text":"Prokaryotes contain nucleoid DNA and 70S ribosomes; they lack a membrane-bound nucleus and membrane-bound organelles.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying prokaryotes have no DNA or ribosomes."}],"after":{"label":"What would have scored","text":"Muscle and nerve cells contain the same genome but express different genes, so they produce different proteins and become specialized."}}]}},{"code":"A2.3","title":"Viruses","theme":"A","level":2,"levelTitle":"Cells","hlOnly":true,"pages":"67-68","questionsPage":69,"bookTitle":null,"pack":{"oneLiner":"Viruses are acellular genetic parasites that use host cells to reproduce, follow lytic or lysogenic routes, may have several origins and can evolve fast enough to escape immunity or treatment.","essentials":"\n> Tick a line only after you can do it with the page closed and without prompts.\n\n## Core\n\nA2.3 has no SL content. Every checklist item below is Higher Level.\n\n## Higher level\n\n- [ ] State the structural features shared by viruses: small, fixed-size particles with a DNA or RNA genome, a protein capsid, no cytoplasm, and few or no enzymes.\n- [ ] Explain why viruses depend on host cells for energy, nutrition, protein synthesis and reproduction.\n- [ ] Describe variation in viral genomes, including DNA or RNA and single- or double-stranded forms, and distinguish enveloped from non-enveloped viruses.\n- [ ] Compare the structures of bacteriophage lambda, coronaviruses and HIV.\n- [ ] Distinguish positive-sense RNA viruses, negative-sense RNA viruses, retroviruses and DNA viruses by how they produce mRNA.\n- [ ] Outline the attachment, entry, biosynthesis, assembly and release phases of bacteriophage lambda’s lytic cycle.\n- [ ] Explain which host-cell resources a virus uses during a lytic infection.\n- [ ] Outline bacteriophage lambda’s lysogenic cycle, including integration as a prophage, replication with the host chromosome and induction.\n- [ ] Compare the lytic and lysogenic cycles in terms of genome location, virion production, host-cell survival and duration.\n- [ ] Explain why viral diversity and complete dependence on cells support several cellular origins rather than one known common viral ancestor.\n- [ ] Outline the progressive and regressive hypotheses for viral origins.\n- [ ] Explain how convergent evolution could produce features shared by unrelated viruses.\n- [ ] Explain why some viruses evolve rapidly, using mutation rate, replication rate, population size and natural selection.\n- [ ] Distinguish antigenic drift from antigenic shift in influenza viruses.\n- [ ] Explain how rapid evolution occurs in HIV and why it makes treatment difficult.\n- [ ] Apply rapid viral evolution to vaccination and drug treatment, including updated influenza vaccines and combination antiretroviral therapy.\n\n## Links to other topics\n\n- **A1.2 Nucleic acids** — viral genomes can be DNA or RNA, and all viruses must produce mRNA that host ribosomes can translate. A1.2 supplies the molecular language for comparing genome types.\n- **A2.2 Cell structure** — viruses lack cytoplasm, ribosomes and the organization of cells. Comparing them with prokaryotic cells stops “small bacterium” from becoming your mental model.\n- **A4.1 Evolution and speciation** — mutation, natural selection and convergent evolution explain both rapid viral change and similarities among viruses that may have separate origins.\n- **C3.2 Defence against disease** — antigenic change helps viruses escape existing immune responses and affects vaccination.\n- **D1.2 Protein synthesis** — viruses depend on host ribosomes to translate viral mRNA. Genome type determines the route used to make that mRNA.\n- **D3.2 Inheritance** — a lambda prophage is copied with the bacterial chromosome and passed to daughter cells during lysogeny.\n\n## Vocabulary that has to be exact\n\n| Term | What it means | What it’s not |\n| --- | --- | --- |\n| Virus | An acellular infectious agent containing a nucleic-acid genome inside a protein capsid | A very small prokaryotic cell |\n| Virion | A complete virus particle outside a host cell or moving between cells | The infected host cell |\n| Capsid | The protein coat surrounding and protecting a viral genome | A cell membrane or cell wall |\n| Viral envelope | A host-derived lipid membrane surrounding some viruses, usually containing viral proteins | A structure shared by every virus |\n| Bacteriophage | A virus that infects bacteria | A bacterium that consumes other cells |\n| Obligate parasite | An agent that can reproduce only by using a living host cell | An organism that can reproduce independently when nutrients are supplied |\n| Positive-sense RNA | RNA that has the same sense as mRNA and can be translated by ribosomes | RNA that must first be copied into complementary positive-sense RNA |\n| Negative-sense RNA | RNA complementary to mRNA, which must be copied into positive-sense RNA before translation | RNA that carries a negative electrical charge |\n| Retrovirus | An RNA virus that uses reverse transcriptase to make DNA from its RNA | Any virus whose genome contains RNA |\n| Lytic cycle | Viral replication followed by assembly and lysis of the host cell | Viral DNA remaining silent in the host chromosome |\n| Lysogenic cycle | A cycle in which phage DNA is integrated into the host chromosome and copied with it | Immediate production and release of many virions |\n| Prophage | Bacteriophage DNA integrated into a bacterial chromosome | A complete phage particle attached to a bacterium |\n| Induction | Activation and excision of a prophage, leading into the lytic cycle | Initial attachment of a phage to its host |\n| Antigenic drift | Gradual antigen change caused by accumulating mutations | Sudden reassortment of whole genome segments |\n| Antigenic shift | Major antigen change caused by reassortment between different influenza viruses | The gradual buildup of point mutations |\n| Convergent evolution | Independent evolution of similar features under similar selection pressures | Inheritance of a feature from one recent common ancestor |\n","videos":"\nWatch **one** main video, then close it and draw the two replication cycles from memory. A second explanation straight away builds recognition, and recognition is the problem you’re trying to replace with recall.\n\n## Main\n\n**Mister Lee Science — A2.3 Viruses**\n\n- Channel: \u003chttps://www.youtube.com/@misterleescience> — verified\n- Search: \u003chttps://www.youtube.com/results?search_query=Mister+Lee+Science+A2.3+Viruses>\n\nAlex Lee organizes the course by the current IB topic codes, so start with the explanation made for A2.3.\n\n**Watch for:**\n\n- Which features belong to every virus and which occur in only some viruses.\n- What bacteriophage lambda gets from its host during the lytic cycle.\n- Where lambda DNA is during the lytic and lysogenic cycles.\n- Why influenza and HIV can evolve fast enough to complicate treatment.\n\n**Pause at:** the first comparison of the lytic and lysogenic cycles. Cover the labels and trace both routes aloud from attachment. Include the fate of the viral DNA and the host cell in every step.\n\n## If that didn’t land\n\n**Amoeba Sisters — viruses**\n\n- Channel: \u003chttps://www.youtube.com/@AmoebaSisters> — verified\n- Search: \u003chttps://www.youtube.com/results?search_query=Amoeba+Sisters+viruses+lytic+lysogenic+cycles>\n\nUse this if the difference between a virus, a virion and an infected cell still feels blurry. It won’t cover all the IB detail, so return to the checklist afterward.\n\n**Khan Academy — viruses**\n\n- Channel: \u003chttps://www.youtube.com/@khanacademy> — verified\n- Search: \u003chttps://www.youtube.com/results?search_query=Khan+Academy+viruses+lytic+lysogenic+retrovirus>\n\nUse this if genome type, reverse transcription or the route from viral nucleic acid to mRNA is the part you can’t yet explain.\n\n## Worth it once, not for revision\n\nThe switch between lysogeny and lytic replication is worth seeing as an **animation** once. Movement makes integration, copying with the host chromosome, excision and virion assembly easier to place in sequence.\n\n- Search: \u003chttps://www.youtube.com/results?search_query=bacteriophage+lambda+lytic+lysogenic+cycle+animation>\n\nAfter watching, draw one bacterial chromosome before infection, during lysogeny and after induction. Label free phage DNA, prophage and newly assembled virions only where each one actually exists.\n\n## Pinned\n","traps":"\n## Giving every virus an envelope\n\n**Commonly written:** “All viruses have genetic material inside a capsid and a lipid envelope.”\n\n**Why it doesn’t score:** A capsid is universal, but an envelope occurs only in some viruses and is derived from host-cell membrane.\n\n**Scores instead:** “All viruses have a nucleic-acid genome and protein capsid; some also have a host-derived lipid envelope.”\n\n## Calling a virus a small cell\n\n**Commonly written:** “A virus is a tiny cell without many organelles.”\n\n**Why it doesn’t score:** Viruses are acellular and lack cytoplasm and ribosomes, rather than being cells with fewer organelles.\n\n**Scores instead:** “A virus is an acellular infectious agent with a nucleic-acid genome inside a protein capsid.”\n\n## Letting the whole bacteriophage enter the bacterium\n\n**Commonly written:** “Bacteriophage lambda enters the bacterial cell and releases its DNA.”\n\n**Why it doesn’t score:** Lambda attaches outside the bacterium and injects its DNA; the capsid and tail remain outside.\n\n**Scores instead:** “Lambda attaches to receptors on the bacterium and injects its DNA into the cell.”\n\n## Saying viruses divide\n\n**Commonly written:** “The viral cell grows and divides many times before the bacterium bursts.”\n\n**Why it doesn’t score:** Viral genomes and proteins are produced separately using host machinery, then assembled into virions.\n\n**Scores instead:** “The host copies viral nucleic acid and makes viral proteins, which assemble into new virions before lysis.”\n\n## Treating lysogeny as permanent inactivity\n\n**Commonly written:** “During the lysogenic cycle, the viral DNA stays dormant and nothing happens.”\n\n**Why it doesn’t score:** The prophage is copied with the bacterial chromosome and inherited by daughter cells, and induction can activate lytic replication.\n\n**Scores instead:** “The prophage is replicated with the host chromosome until induction causes it to enter the lytic cycle.”\n\n## Calling antigenic shift a large mutation\n\n**Commonly written:** “Antigenic shift happens when one major mutation suddenly changes an influenza antigen.”\n\n**Why it doesn’t score:** Antigenic shift results from reassortment of genome segments between different influenza viruses infecting the same cell.\n\n**Scores instead:** “Antigenic shift is a major antigen change caused by reassortment of influenza genome segments.”\n\n## Saying antiviral drugs cause useful mutations\n\n**Commonly written:** “HIV mutates so that it can become resistant to the drug.”\n\n**Why it doesn’t score:** Mutations arise without regard to need; treatment selects resistant variants already produced by mutation.\n\n**Scores instead:** “Mutation creates HIV variants, and drug treatment increases the frequency of variants that carry resistance.”\n\n## Claiming one origin because viruses share a capsid\n\n**Commonly written:** “All viruses have capsids, so they must have inherited them from one viral ancestor.”\n\n**Why it doesn’t score:** Similar selection pressures can independently favor protective capsids, so the similarity may result from convergent evolution.\n\n**Scores instead:** “Capsids may have evolved independently in different viral lineages as protection for genetic material outside host cells.”\n","cards":[{"id":"A2.3-01","q":"State the structural features shared by viruses, taking care not to include features found only in some viruses.","a":"Viruses are small, fixed-size particles containing nucleic acid as genetic material, either DNA or RNA, surrounded by a protein capsid. They have no cytoplasm and possess few or no enzymes.","note":"An envelope isn't universal, and a virus has DNA or RNA rather than both as its genome.","marks":null},{"id":"A2.3-02","q":"Explain why a virus can't reproduce independently even if nutrients are available.","a":"A virus has no cytoplasm or ribosomes and has little or no independent metabolic machinery. It must enter a suitable host cell and use the host’s energy supply, nutrients, enzymes and ribosomes to copy its genome, produce viral proteins and assemble new virions. Viruses are therefore obligate parasites.","note":"Nutrients alone aren't enough. The missing cellular machinery is the important point.","marks":null},{"id":"A2.3-03","q":"Describe four ways in which the structures of viruses can differ.","a":"A viral genome may be DNA or RNA, and it may be single-stranded or double-stranded. Capsids vary in shape, including helical, polyhedral and complex forms. Some virions have a host-derived lipid envelope containing viral proteins, while others are non-enveloped.","note":"","marks":null},{"id":"A2.3-04","q":"Compare the structures of bacteriophage lambda, a coronavirus and HIV.","a":"All three contain a nucleic-acid genome and a protein capsid. Lambda is a non-enveloped bacteriophage with a double-stranded DNA genome, a head and a tail used in infection of bacteria. Coronaviruses are enveloped viruses with a positive-sense single-stranded RNA genome and projecting spike proteins. HIV is an enveloped retrovirus with two copies of positive-sense single-stranded RNA, reverse transcriptase and viral glycoproteins in its envelope.","note":"The comparison needs a shared feature as well as differences.","marks":null},{"id":"A2.3-05","q":"Distinguish how positive-sense RNA viruses, negative-sense RNA viruses, retroviruses and DNA viruses produce mRNA.","a":"Positive-sense viral RNA can act as mRNA and be translated by host ribosomes. Negative-sense RNA must first be copied into complementary positive-sense mRNA by an RNA-dependent RNA polymerase. A retrovirus uses reverse transcriptase to make DNA from its RNA, and the integrated viral DNA is then transcribed into mRNA. A DNA virus produces mRNA by transcription from viral DNA.","note":"HIV has positive-sense RNA, but as a retrovirus it follows the RNA-to-DNA route after infection.","marks":null},{"id":"A2.3-06","q":"Outline the lytic cycle of bacteriophage lambda from attachment to release.","a":"The phage attaches to specific receptors on a bacterial cell and injects its DNA. Viral genes take control of host-cell processes. Phage DNA is replicated, viral proteins are synthesized by host ribosomes, and the components assemble into new virions. Viral products then cause the bacterium to lyse, releasing the virions.","note":"The phage injects its DNA into the bacterium; the entire phage particle doesn't enter.","marks":null},{"id":"A2.3-07","q":"Explain which resources a virus obtains from a host cell during a lytic infection.","a":"The host supplies energy, raw materials such as nucleotides and amino acids, enzymes and other machinery for nucleic-acid synthesis, and ribosomes for protein synthesis. The viral genome directs these resources toward producing viral nucleic acid and proteins, which assemble into new virions.","note":"","marks":null},{"id":"A2.3-08","q":"Outline the lysogenic cycle of bacteriophage lambda and explain how it can lead to a lytic cycle.","a":"Lambda attaches to a bacterium and injects its DNA. The phage DNA integrates into the bacterial chromosome and becomes a prophage. Viral lytic genes are repressed, so the bacterium survives and copies the prophage whenever its chromosome replicates. The prophage passes to daughter cells. A trigger such as DNA damage can cause induction, in which the prophage is excised and enters the lytic cycle.","note":"","marks":null},{"id":"A2.3-09","q":"Compare the lytic and lysogenic cycles of bacteriophage lambda.","a":"Both cycles begin with attachment and injection of phage DNA into a bacterium. In the lytic cycle, viral DNA is replicated, viral components are produced and assembled, and the host lyses to release virions. In the lysogenic cycle, viral DNA integrates as a prophage, is copied with the host chromosome and passes to daughter cells without immediate virion production or lysis. Induction can switch the prophage into the lytic cycle.","note":"Lysogenic doesn't mean the virus has permanently stopped. It can later enter the lytic cycle.","marks":null},{"id":"A2.3-10","q":"Explain why the evidence favors several viral origins from cellular organisms rather than one established common origin for all viruses.","a":"Viruses show extreme differences in genome type, genome-replication mechanisms and structure, and no single feature establishes one common viral ancestor. Their complete dependence on cells and their use of the shared genetic code support origins connected to cellular life. Different groups may therefore have arisen independently from cellular genetic elements or reduced cellular parasites.","note":"Several origins are supported, but the historical origins of viruses can't be observed directly.","marks":null},{"id":"A2.3-11","q":"Distinguish the progressive and regressive hypotheses for the origin of viruses.","a":"The progressive, or escape, hypothesis proposes that pieces of cellular genetic material gained the ability to move between cells and later acquired protective capsids. The regressive, or reduction, hypothesis proposes that cellular parasites became increasingly dependent on hosts and lost cellular structures and functions until only a reduced parasitic system remained.","note":"","marks":null},{"id":"A2.3-12","q":"Explain how viruses with separate origins could still share a genome, capsid and dependence on host cells.","a":"Different viral lineages could face similar selection pressures while living as obligate intracellular parasites. Natural selection could independently favor a compact genetic system, a protective protein capsid and use of host-cell machinery. These shared features could therefore result from convergent evolution rather than inheritance from one recent common viral ancestor.","note":"","marks":null},{"id":"A2.3-13","q":"Explain why some viruses can evolve rapidly.","a":"Many viruses, especially RNA viruses, have high mutation rates because their genome-copying enzymes make errors and often have limited proofreading. Short generation times and the production of huge numbers of virions generate many variants. Strong selection by host immunity and antiviral drugs then increases the frequency of variants with a survival or transmission advantage. Recombination or reassortment can create further variation in some viruses.","note":"Mutation creates variation; natural selection changes variant frequencies. Don't call those the same process.","marks":null},{"id":"A2.3-14","q":"Distinguish antigenic drift from antigenic shift in influenza viruses and give one consequence of each.","a":"Antigenic drift is the gradual accumulation of mutations in genes encoding influenza surface antigens. It produces smaller changes that help seasonal influenza escape some existing immunity and contribute to frequent vaccine updates. Antigenic shift is a major change caused when genome segments are reassorted between different influenza viruses infecting the same host cell. Shift can produce a new antigen combination to which human populations have little immunity.","note":"Shift depends on influenza’s segmented genome. It isn't a large point mutation.","marks":null},{"id":"A2.3-15","q":"Explain why HIV evolves rapidly within one infected person and how this affects treatment.","a":"HIV produces many new virions, and its reverse transcriptase copies RNA into DNA with a high error rate and no proofreading. This creates a genetically varied viral population. An antiretroviral drug selects for any resistant variants, which can then increase in frequency. Combination therapy targets different stages of replication, making it less likely that one virus already carries all the mutations needed for resistance.","note":"","marks":null},{"id":"A2.3-16","q":"Explain two ways rapid viral evolution changes the prevention or treatment of viral disease.","a":"Antigenic drift in influenza changes surface antigens, so vaccine strains are reviewed and updated to match viruses expected to circulate. Viral mutations can also produce drug-resistant variants, especially when replication continues during treatment. Using several antiviral drugs with different targets reduces the chance that a resistant virus will survive and reproduce.","note":"","marks":null},{"id":"A2.3-17","q":"Correct this claim: 'A virus is a tiny cell that grows and divides inside another cell.'","a":"A virus is acellular: it has no cytoplasm, ribosomes or independent metabolism. Its components are produced using host-cell machinery and then assembled into virions. It doesn't grow and divide by cell division.","note":"New virions are assembled from separately produced parts rather than formed by binary fission.","marks":null},{"id":"A2.3-18","q":"Build one causal explanation linking viral structure, host dependence, rapid evolution and difficulty of treatment.","a":"A virus contains a small nucleic-acid genome and capsid but lacks the cellular machinery needed for independent reproduction, so it uses a host cell to copy its genome and make proteins. Rapid replication produces large viral populations, and inaccurate genome copying in many viruses creates mutations. Host immunity or antiviral drugs select variants that evade recognition or resist treatment. Vaccines may therefore need updating, and several antiviral drugs may be used together to limit resistance.","note":"The chain is structure, dependence, variation, selection and treatment consequence.","marks":null}],"exam":[{"question":"## Q1. Outline the structural features shared by viruses and explain their dependence on host cells. **[5]**","scheme":"- Genetic material consists of nucleic acid / DNA or RNA. **[1]**\n- Protein capsid surrounds / protects the genetic material. **[1]**\n- Viruses have no cytoplasm and few or no enzymes. **[1]**\n- Viruses lack ribosomes / cannot carry out independent protein synthesis. **[1]**\n- Viruses depend on host cells for energy, nutrients, protein synthesis and other life functions. **[1]**\n\n_Examiner note: an envelope can’t be credited as a shared feature because many viruses are non-enveloped._"},{"question":"## Q2. Compare and contrast the structures of bacteriophage lambda, a coronavirus and HIV. **[6]**","scheme":"Award any six:\n\n- All contain a nucleic-acid genome surrounded by protein / a capsid. **[1]**\n- Lambda contains double-stranded DNA, whereas coronaviruses and HIV contain single-stranded RNA. **[1]**\n- Lambda is non-enveloped, whereas coronaviruses and HIV are enveloped. **[1]**\n- Lambda has a complex head-and-tail structure / tail involved in attachment to bacteria. **[1]**\n- Coronavirus has positive-sense single-stranded RNA and projecting spike proteins. **[1]**\n- HIV has two copies of positive-sense single-stranded RNA. **[1]**\n- HIV contains reverse transcriptase. **[1]**\n- Both coronavirus and HIV envelopes contain viral glycoproteins used in host-cell recognition / entry. **[1]**\n\n_Examiner note: three separate descriptions earn fewer marks than direct comparisons. Full marks require shared features and clear differences among the named viruses._"},{"question":"## Q3. Explain the lytic cycle of bacteriophage lambda. **[6]**","scheme":"- Phage attaches to specific receptors on a bacterial cell. **[1]**\n- Phage DNA is injected into the host cell. **[1]**\n- Viral genes redirect host-cell activities / viral DNA is replicated using host resources. **[1]**\n- Viral proteins are synthesized using host ribosomes. **[1]**\n- Viral nucleic acid and proteins assemble into new virions. **[1]**\n- Host cell lyses and releases virions. **[1]**\n\n_Examiner note: saying that the phage “reproduces in the bacterium” misses the sequence. The DNA enters, components are produced separately, virions assemble, and the host lyses._"},{"question":"## Q4. Compare and contrast the lytic and lysogenic cycles of bacteriophage lambda. **[6]**","scheme":"- Both begin with attachment to a bacterial host and injection of phage DNA. **[1]**\n- In the lytic cycle, viral DNA remains separate from the host chromosome / is replicated for virion production. **[1]**\n- In the lysogenic cycle, viral DNA integrates into the bacterial chromosome as a prophage. **[1]**\n- Lytic infection produces and assembles new virions, whereas lysogeny has no immediate virion production. **[1]**\n- Lytic infection ends in host-cell lysis, whereas the lysogenic host survives and reproduces. **[1]**\n- The prophage is copied with the host chromosome and passed to daughter cells / induction can switch it into the lytic cycle. **[1]**\n\n_Examiner note: “active” and “dormant” are too loose by themselves. A full comparison tracks the viral DNA, virion production and fate of the host._"},{"question":"## Q5. Explain the evidence and hypotheses supporting several origins of viruses from cellular organisms. **[5]**","scheme":"- Viruses show extensive diversity in genome type, replication mechanism and structure. **[1]**\n- Dependence on cellular hosts / the shared genetic code supports an origin after or from cellular life. **[1]**\n- Progressive / escape hypothesis: cellular genetic elements gained the ability to transfer between cells. **[1]**\n- Regressive / reduction hypothesis: cellular parasites lost structures and functions as host dependence increased. **[1]**\n- Shared viral features may have evolved independently by convergent evolution under similar selection pressures. **[1]**\n\n_Examiner note: the two hypotheses aren’t rival descriptions of one known event. They offer possible origins for different viral groups, which fits the evidence for several origins._"},{"question":"## Q6. Explain why influenza viruses and HIV evolve rapidly and discuss one consequence for managing each disease. **[6]**","scheme":"- Rapid genome replication / short generation time produces many generations in a short period. **[1]**\n- Large numbers of virions increase the number of mutations arising. **[1]**\n- Error-prone genome copying / limited proofreading produces a high mutation rate in many RNA viruses. **[1]**\n- Influenza antigenic drift changes surface antigens, requiring vaccine strains to be reviewed or updated. **[1]**\n- Accept: reassortment of influenza genome segments can cause antigenic shift / a major antigen change. **[1]**\n- HIV reverse transcriptase lacks proofreading, producing variants from which drug-resistant forms can be selected. **[1]**\n- Accept: combination antiretroviral therapy reduces the probability that a virus is resistant to every drug used. **[1]**\n\n_Examiner note: “viruses mutate because they need to escape” reverses the logic. Mutations arise without regard to need, and treatment or immunity selects among the resulting variants._"}],"mcq":[{"id":"A2.3-q01","topic":"A2.3","kind":"mcq","lead":"","quote":"","prompt":"Which set of features is shared by all viruses?","options":[{"text":"A nucleic-acid genome, a protein capsid, no cytoplasm, and few or no enzymes","correct":true,"why":"These are the shared features in the syllabus. The genome can be DNA or RNA, while the capsid is made of protein."},{"text":"A DNA genome, a protein capsid, ribosomes, and enzymes for independent metabolism","correct":false,"why":"Some viral genomes are RNA, and viruses lack ribosomes and independent metabolism. Those cellular features would remove their dependence on a host."},{"text":"An RNA genome, a lipid envelope, cytoplasm, and enzymes for protein synthesis","correct":false,"why":"DNA viruses exist, and many viruses have no envelope. Viruses also lack cytoplasm and don't carry out their own protein synthesis."},{"text":"A nucleic-acid genome, a cell membrane, cytoplasm, and a small number of ribosomes","correct":false,"why":"That describes a reduced cell more closely than a virus. A viral capsid is universal, but cytoplasm and ribosomes are absent."}],"after":null},{"id":"A2.3-q02","topic":"A2.3","kind":"mcq","lead":"","quote":"","prompt":"Why must viruses use host cells to produce new virions?","options":[{"text":"They lack ribosomes and sufficient metabolic machinery for independent protein synthesis and reproduction","correct":true,"why":"The host supplies ribosomes, energy, materials and other machinery. Viral genes redirect those resources toward making viral components."},{"text":"Their capsids prevent nucleic acids from being copied until a host digests the protein coat","correct":false,"why":"A capsid protects the genome during transmission. Host dependence comes from missing cellular machinery, not from the capsid blocking replication."},{"text":"Their genomes contain no genes and therefore provide no instructions for making viral proteins","correct":false,"why":"Viral genomes do contain genes for viral proteins and replication functions. The missing part is the complete machinery needed to express and copy them independently."},{"text":"They obtain all genetic information from the host chromosome during every infection cycle","correct":false,"why":"A virus brings its own genetic information into the infection. It uses host resources, but it doesn't obtain its entire genome from the host."}],"after":null},{"id":"A2.3-q03","topic":"A2.3","kind":"mcq","lead":"","quote":"","prompt":"Which comparison of bacteriophage lambda, coronaviruses and HIV is accurate?","options":[{"text":"Lambda has double-stranded DNA, while coronaviruses and HIV have single-stranded RNA","correct":true,"why":"Lambda is a DNA bacteriophage. Coronaviruses are positive-sense RNA viruses, while HIV is an RNA retrovirus."},{"text":"Lambda and HIV lack envelopes, while coronaviruses obtain envelopes from host cells","correct":false,"why":"Lambda lacks an envelope, but HIV and coronaviruses are both enveloped. Their envelopes contain viral proteins."},{"text":"Coronaviruses contain reverse transcriptase, while HIV translates its RNA genome directly","correct":false,"why":"Reverse transcriptase belongs to HIV. Coronaviral positive-sense RNA can function as mRNA after entering a host cell."},{"text":"All three contain double-stranded DNA protected by differently shaped protein capsids","correct":false,"why":"Only lambda has a double-stranded DNA genome. Coronaviruses and HIV carry single-stranded RNA."}],"after":null},{"id":"A2.3-q04","topic":"A2.3","kind":"mcq","lead":"","quote":"","prompt":"What must happen before a negative-sense RNA viral genome can be translated?","options":[{"text":"It must be copied into complementary positive-sense mRNA","correct":true,"why":"Ribosomes translate positive-sense mRNA. An RNA-dependent RNA polymerase must make that positive-sense copy first."},{"text":"It must be integrated directly into the host chromosome","correct":false,"why":"Integration is part of the retroviral route and lysogeny in temperate phages. Negative-sense RNA instead needs a positive-sense RNA copy."},{"text":"It must be converted into protein by reverse transcriptase","correct":false,"why":"Reverse transcriptase makes DNA from RNA; it doesn't make protein. Ribosomes carry out translation."},{"text":"It must be joined to a capsid protein that acts as a ribosome","correct":false,"why":"Capsid proteins protect the genome and don't act as ribosomes. Viral proteins are translated by host ribosomes."}],"after":null},{"id":"A2.3-q05","topic":"A2.3","kind":"mcq","lead":"","quote":"","prompt":"Which event occurs at the start of bacteriophage lambda’s lytic cycle?","options":[{"text":"The phage attaches to a receptor and injects its DNA","correct":true,"why":"The phage recognizes the bacterium through attachment proteins. Its DNA enters while the head and tail remain outside."},{"text":"The entire phage enters the bacterial cytoplasm by endocytosis","correct":false,"why":"Bacteria don't take lambda in by endocytosis. Lambda remains outside and injects its DNA through the bacterial surface."},{"text":"The bacterial chromosome enters the phage capsid for replication","correct":false,"why":"The direction is backwards. Phage DNA enters the bacterium and uses host resources to replicate."},{"text":"The phage divides by binary fission beside the bacterial chromosome","correct":false,"why":"Binary fission is cell division. Viral parts are produced separately inside the host and assembled into virions."}],"after":null},{"id":"A2.3-q06","topic":"A2.3","kind":"mcq","lead":"","quote":"","prompt":"What happens to lambda DNA during the lysogenic cycle?","options":[{"text":"It integrates into the bacterial chromosome as a prophage","correct":true,"why":"The prophage is copied whenever the host chromosome replicates and can pass to daughter cells without immediate lysis."},{"text":"It is translated into capsid protein before any DNA replication","correct":false,"why":"DNA isn't translated directly. It must be transcribed into mRNA, and immediate capsid production belongs to lytic replication."},{"text":"It remains inside the external capsid while the bacterium divides","correct":false,"why":"The viral DNA has been injected into the bacterium. During lysogeny it sits in the host chromosome, not in an external capsid."},{"text":"It destroys the bacterial chromosome and immediately directs host-cell lysis","correct":false,"why":"That describes destructive lytic infection. During lysogeny, the host chromosome survives and carries the prophage."}],"after":null},{"id":"A2.3-q07","topic":"A2.3","kind":"mcq","lead":"","quote":"","prompt":"A bacterial lineage carries lambda DNA for many generations without producing virions. Which event could later begin virion production?","options":[{"text":"Induction causing the prophage to leave the chromosome and enter the lytic cycle","correct":true,"why":"A trigger such as DNA damage can cause prophage excision. Viral replication, assembly and lysis can then follow."},{"text":"Conjugation causing the prophage to become a bacterial plasmid and divide independently","correct":false,"why":"Conjugation transfers bacterial DNA between cells. The switch described here is prophage induction into the lytic cycle."},{"text":"Binary fission causing the prophage capsid to rupture inside each daughter cell","correct":false,"why":"A prophage is integrated DNA, not a complete capsid. Binary fission copies it without producing virions."},{"text":"Translation causing viral RNA to integrate permanently into the bacterial chromosome","correct":false,"why":"Translation makes protein from mRNA and doesn't integrate genomes. Lambda’s prophage consists of DNA already integrated in the chromosome."}],"after":null},{"id":"A2.3-q08","topic":"A2.3","kind":"mcq","lead":"","quote":"","prompt":"Which observation best supports the idea that viruses have several origins?","options":[{"text":"Viruses differ greatly in genome type, structure and replication mechanism","correct":true,"why":"Their extreme diversity fits the idea that different viral groups arose through different evolutionary routes."},{"text":"Every virus contains the same genes arranged in the same order","correct":false,"why":"Viruses don't share one universal set of genes in one arrangement. Their genetic systems are highly diverse."},{"text":"Every virus has an envelope derived from the same ancestral cell membrane","correct":false,"why":"Many viruses have no envelope. Enveloped viruses obtain lipid membrane from their current host cells."},{"text":"Viruses reproduce independently by one conserved form of binary fission","correct":false,"why":"Viruses depend on host cells and don't undergo binary fission. Their replication routes vary widely."}],"after":null},{"id":"A2.3-q09","topic":"A2.3","kind":"mcq","lead":"","quote":"","prompt":"What does the progressive hypothesis propose about viral origins?","options":[{"text":"Cellular genetic elements gained the ability to move between cells and acquired protective structures","correct":true,"why":"This is also called the escape hypothesis. Mobile genetic material may have become an infectious system."},{"text":"Free-living cells lost structures and functions as they became increasingly dependent on hosts","correct":false,"why":"That's the regressive or reduction hypothesis. It begins with cellular parasites becoming less complex."},{"text":"Viruses existed before cells and later donated every cellular gene to the first organisms","correct":false,"why":"That isn't the progressive hypothesis. The progressive route begins with genetic elements from existing cells."},{"text":"Unrelated viruses independently evolved capsids because they faced similar selection pressures","correct":false,"why":"That's an explanation based on convergent evolution. It explains similarity, not the progressive origin route itself."}],"after":null},{"id":"A2.3-q10","topic":"A2.3","kind":"mcq","lead":"","quote":"","prompt":"Why can many RNA viruses evolve rapidly?","options":[{"text":"Frequent copying errors, large populations and short generation times produce many variants","correct":true,"why":"Mutation supplies variation quickly, and selection can increase variants favored by immunity, drugs or transmission conditions."},{"text":"Host cells deliberately alter viral RNA so the infection can adapt to antiviral drugs","correct":false,"why":"Mutations don't arise because adaptation is needed. Copying errors create variants, and drugs select among them."},{"text":"RNA viruses reproduce by accurate binary fission but exchange genes with bacterial plasmids","correct":false,"why":"Viruses don't reproduce by binary fission. Rapid change often follows error-prone genome copying and intense selection."},{"text":"Every new virion receives genetic material from a different host-cell chromosome","correct":false,"why":"Virions receive copies of the viral genome, not random host chromosomes. Variation mainly comes from mutation and, in some viruses, recombination or reassortment."}],"after":null},{"id":"A2.3-q11","topic":"A2.3","kind":"mcq","lead":"","quote":"","prompt":"Which process causes antigenic shift in influenza viruses?","options":[{"text":"Reassortment of genome segments from different influenza viruses in one host cell","correct":true,"why":"Influenza has a segmented genome. Mixing segments can create a major new combination of surface antigens."},{"text":"Gradual accumulation of mutations in genes encoding viral surface antigens","correct":false,"why":"That's antigenic drift. It produces smaller changes that accumulate over time."},{"text":"Integration of the influenza genome into a bacterial chromosome as a prophage","correct":false,"why":"That describes lysogeny in a bacteriophage such as lambda. Influenza infects animal cells and doesn't form a bacterial prophage."},{"text":"Reverse transcription of influenza RNA into DNA followed by chromosome integration","correct":false,"why":"That's the retroviral route used by HIV. Influenza is an RNA virus but not a retrovirus."}],"after":null},{"id":"A2.3-q12","topic":"A2.3","kind":"mcq","lead":"","quote":"","prompt":"Why is a combination of antiretroviral drugs used to treat HIV?","options":[{"text":"Resistance to several drugs with different targets requires a less probable combination of mutations","correct":true,"why":"A variant resistant to one drug may still be stopped by the others. This reduces the chance that resistant HIV will reproduce."},{"text":"Each drug increases HIV’s mutation rate until the viral genome becomes unable to function","correct":false,"why":"Treatment isn't intended to drive harmful mutation. The drugs inhibit different stages of viral replication."},{"text":"Different drugs provide the ribosomes and enzymes that HIV lacks outside a host cell","correct":false,"why":"Host cells provide the machinery HIV uses. Antiretroviral drugs inhibit viral processes rather than supplying missing structures."},{"text":"One drug prevents antigenic drift while the others prevent influenza-style antigenic shift","correct":false,"why":"Antigenic shift is associated with reassortment in segmented viruses such as influenza. HIV treatment targets its replication cycle."}],"after":null},{"id":"A2.3-t1","topic":"A2.3","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"All viruses have genetic material inside a capsid and a lipid envelope.","prompt":"Why does it fail?","options":[{"text":"A capsid is universal, but an envelope occurs only in some viruses and is derived from host-cell membrane.","correct":true,"why":"That’s exactly why it fails."},{"text":"Viruses are acellular and lack cytoplasm and ribosomes, rather than being cells with fewer organelles.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling a virus a small cell."},{"text":"Lambda attaches outside the bacterium and injects its DNA; the capsid and tail remai
