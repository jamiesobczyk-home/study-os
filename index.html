t":"DNA wraps around a core of eight histones, with linker DNA between cores and an associated linker histone.","correct":true,"why":"That’s exactly why it fails."},{"text":"Adenine is one nitrogenous base. A nucleotide also needs a pentose sugar and a phosphate group.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling a base a nucleotide."},{"text":"Sugar and phosphate are covalently linked within one strand. Hydrogen bonds join complementary bases across two strands.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: putting hydrogen bonds in the backbone."},{"text":"The strands are antiparallel. If one runs 5′ to 3′ left to right, its partner runs 3′ to 5′ left to right.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: drawing both strands in the same direction."}],"after":{"label":"What would have scored","text":"A nucleosome has DNA wrapped around an eight-histone core, with linker DNA connecting it to neighboring nucleosomes."}}]}},{"code":"A2.1","title":"Origins of cells","theme":"A","level":2,"levelTitle":"Cells","hlOnly":true,"pages":"56-58","questionsPage":69,"bookTitle":null,"pack":{"oneLiner":"A2.1 uses experiments, self-assembling membranes, catalytic RNA, fossils and shared genes to build a testable but incomplete explanation of how non-living chemistry led to cells and LUCA.","essentials":"\n> Tick a line only after you can do it with the page closed and without prompts.\n\n## Core\n\n- [ ] Explain how the lack of free oxygen and ozone, stronger ultraviolet radiation, higher temperatures, carbon dioxide and methane affected prebiotic chemistry on early Earth.\n- [ ] Explain why cells are considered the smallest units of self-sustaining life and why viruses aren’t classified as living.\n- [ ] Explain why the origin of the first cells is difficult to investigate using experiments or fossils.\n- [ ] Explain why catalysis, molecular self-replication, self-assembly and compartmentalization were all needed before cells could evolve.\n- [ ] Describe and evaluate the Miller–Urey experiment as evidence that carbon compounds can form without living organisms.\n\n## Higher level\n\n- [ ] Explain how amphipathic fatty acids can spontaneously assemble into spherical bilayer vesicles in water.\n- [ ] Explain why a membrane-bound compartment was important for maintaining internal chemistry different from the surroundings.\n- [ ] Explain why RNA is a candidate for the first genetic material, using information storage, replication and catalytic activity.\n- [ ] Use ribosomal RNA catalyzing peptide bond formation as evidence supporting the RNA world hypothesis.\n- [ ] Explain how the shared genetic code and conserved genes support the existence of a last universal common ancestor.\n- [ ] Distinguish LUCA from the first living cell and explain what may have happened to other early lineages.\n- [ ] Explain how fossils, carbon isotope ratios and molecular clocks can be used to estimate dates for early cells and LUCA, including their limitations.\n- [ ] Explain how fossils in ancient hydrothermal vent precipitates support a connection between early life and vents.\n- [ ] Explain how conserved sequences reconstructed by genomic analysis support the hypothesis that LUCA lived near hydrothermal vents.\n\n## Links to other topics\n\n- **A1.2 Nucleic acids** — RNA’s nucleotide sequence can store information, while folding gives some RNA catalytic activity. Those two roles explain why RNA is central to hypotheses about the first cells.\n- **A2.3 Viruses** — deciding whether viruses are living tests the meaning of cellular organization, metabolism and autonomous reproduction.\n- **A3.2 Classification and cladistics** — conserved sequences and molecular clocks use comparisons between organisms to reconstruct common ancestry and estimate divergence times.\n- **B1.1 Carbohydrates and lipids** — the amphipathic structure of fatty acids explains their self-assembly into membrane-like vesicles.\n- **B2.1 Membranes and membrane transport** — protocell compartments are the evolutionary starting point for understanding how modern membranes control internal conditions.\n- **B2.2 Organelles and compartmentalization** — the advantage of separating chemical environments begins with protocells and continues in the organelles of eukaryotic cells.\n- **D4.1 Natural selection** — self-replication with heritable variation allowed chemical systems and early cells to evolve rather than remaining unchanged.\n\n## Vocabulary that has to be exact\n\n| Term | What it means | What it’s not |\n| --- | --- | --- |\n| Abiogenesis | The origin of living systems from non-living matter through chemical processes | Spontaneous appearance of a complete modern cell |\n| Prebiotic | Existing or occurring before life arose | A synonym for primitive or poorly adapted |\n| Carbon compound | A compound containing carbon; many compounds needed by cells are carbon based | Evidence by itself that a living organism made the compound |\n| Self-sustaining life | A system able to carry out the processes needed to maintain and reproduce itself at the cellular level | Complete independence from matter or energy in the environment |\n| Catalysis | Increasing the rate of a chemical reaction without the catalyst being consumed | Supplying all the energy or reactants for the reaction |\n| Self-assembly | Organization caused by the properties and interactions of the components | Assembly directed by genes, enzymes or conscious action |\n| Molecular self-replication | Production of copies that preserve information and allow inheritance | Ordinary growth by adding material without copying information |\n| Compartmentalization | Enclosure of reactions and molecules within a boundary such as a membrane | Random separation with no maintained internal conditions |\n| Vesicle | A closed, membrane-bound compartment containing an aqueous interior | A living cell merely because it has a membrane |\n| Protocell | A non-living or early cell-like compartment proposed as an intermediate in cell origins | A fully developed modern prokaryotic cell |\n| Ribozyme | An RNA molecule with catalytic activity | A protein enzyme attached to RNA |\n| RNA world hypothesis | The hypothesis that RNA once had major roles in both heredity and catalysis before DNA and protein dominated those roles | A claim that scientists have recreated the complete origin of life |\n| LUCA | The most recent common ancestral population of all organisms alive today | The first organism ever to exist or the ancestor of every early lineage |\n| Biosignature | A structure, substance or isotope pattern that may have been produced by life | Conclusive proof when non-biological processes could produce a similar pattern |\n| Molecular clock | A method that estimates divergence time from sequence differences and an estimated rate of change | A clock with a perfectly constant rate across every gene and lineage |\n| Conserved sequence | A DNA, RNA or protein sequence that has changed little during evolution | A sequence found only in one recently evolved species |\n| Reducing atmosphere | An atmosphere with little or no free oxygen and chemicals able to donate electrons in reactions | An atmosphere proven to match every condition on early Earth |\n","videos":"\nWatch **one** main video, then close it and reconstruct the proposed sequence from non-living chemistry to cells. A second explanation can make the story feel familiar without making it producible, and producing the sequence is what the exam requires.\n\n## Main\n\n**Alex Lee Biology — A2.1 Origins of cells**\n\n- Channel: \u003chttps://www.youtube.com/@misterleescience> — verified\n- Search: \u003chttps://www.youtube.com/results?search_query=Mister+Lee+Science+A2.1+Origins+of+cells>\n\nAlex Lee organizes the course by the current IB topic codes, so start with the explanation made for A2.1.\n\n**Watch for:**\n\n- What evidence supports each proposed stage, rather than which stages sound plausible.\n- Why RNA could combine heredity and catalysis in one kind of molecule.\n- Why a vesicle helps without automatically becoming alive.\n- Which evidence supports LUCA, and which evidence specifically connects early life with hydrothermal vents.\n\n**Pause at:** the first complete sequence from prebiotic compounds to a protocell. Cover the labels and reproduce it using the terms catalysis, self-assembly, self-replication and compartmentalization. Beside each term, state what problem it solves.\n\n## If that didn’t land\n\n**Khan Academy — hypotheses about the origin of life and the RNA world**\n\n- Channel: \u003chttps://www.youtube.com/@khanacademy> — verified\n- Search: \u003chttps://www.youtube.com/results?search_query=Khan+Academy+origin+of+life+RNA+world>\n\nUse this if the chemistry-to-replication transition is the part you can recognize but can’t yet explain.\n\n**Amoeba Sisters — origin of life and early cells**\n\n- Channel: \u003chttps://www.youtube.com/@AmoebaSisters> — verified\n- Search: \u003chttps://www.youtube.com/results?search_query=Amoeba+Sisters+origin+of+life+early+cells>\n\nUse this for a more visual overview. Afterward, add the IB-specific evidence for Miller–Urey, LUCA and hydrothermal vents from your notes.\n\n## Worth it once, not for revision\n\nFatty-acid self-assembly is spatial, so an **animation** earns an extra watch. Movement makes it easier to see why hydrophilic regions face water, hydrophobic regions cluster away from it and a bilayer closes into a sphere.\n\n- Search: \u003chttps://www.youtube.com/results?search_query=fatty+acid+vesicle+self+assembly+animation>\n\nAfter watching, draw a cross-section of a spherical bilayer vesicle. Label the water-facing regions, inward-facing hydrophobic regions, aqueous interior and external solution. Then explain why the vesicle creates a compartment but doesn’t qualify as living by itself.\n\n## Pinned\n","traps":"\n## Saying Miller and Urey made life\n\n**Commonly written:** \"The Miller–Urey experiment created the first living cells from gases.\"\n\n**Why it doesn’t score:** The experiment produced amino acids and other carbon compounds, not cells or self-replicating living systems.\n\n**Scores instead:** \"The experiment showed that carbon compounds could form abiotically from simpler substances under the tested conditions.\"\n\n## Treating a carbon compound as proof of life\n\n**Commonly written:** \"Finding an organic molecule proves that an organism made it.\"\n\n**Why it doesn’t score:** Carbon compounds can form through abiotic reactions, so their presence alone doesn’t identify a biological source.\n\n**Scores instead:** \"A carbon compound may be consistent with life, but its context and possible abiotic formation must also be evaluated.\"\n\n## Calling every membrane vesicle living\n\n**Commonly written:** \"Once fatty acids formed a vesicle, the vesicle became a cell.\"\n\n**Why it doesn’t score:** A membrane provides compartmentalization but doesn’t supply metabolism, heredity or self-replication.\n\n**Scores instead:** \"Fatty-acid vesicles could maintain distinct internal chemistry, making them a proposed intermediate rather than complete living cells.\"\n\n## Saying RNA came first because it is single stranded\n\n**Commonly written:** \"RNA was the first genetic material because it has only one strand.\"\n\n**Why it doesn’t score:** Strand number doesn’t establish the required roles. The hypothesis depends on RNA storing information, being copied and catalyzing reactions.\n\n**Scores instead:** \"RNA may have preceded DNA because it can store sequence information and some RNA molecules can catalyze reactions.\"\n\n## Describing the ribosome’s catalyst as protein\n\n**Commonly written:** \"A protein enzyme in the ribosome forms the peptide bonds.\"\n\n**Why it doesn’t score:** Peptide bond formation at the ribosome’s catalytic center is carried out by ribosomal RNA.\n\n**Scores instead:** \"Ribosomal RNA catalyzes peptide bond formation, providing a modern example of a ribozyme.\"\n\n## Calling LUCA the first organism\n\n**Commonly written:** \"LUCA was the first living cell on Earth.\"\n\n**Why it doesn’t score:** LUCA was the most recent common ancestor of surviving life; older cells and extinct lineages may have preceded it.\n\n**Scores instead:** \"LUCA was the ancestral population from which all organisms alive today descended, not necessarily the first life.\"\n\n## Treating the oldest fossil as the date life began\n\n**Commonly written:** \"Life began when the oldest known stromatolite formed.\"\n\n**Why it doesn’t score:** The oldest accepted evidence gives a minimum age; the organisms that produced it must already have evolved.\n\n**Scores instead:** \"A dated stromatolite shows that cellular life existed by that time, so life’s origin must have occurred earlier.\"\n\n## Saying hydrothermal vents are proven as LUCA’s habitat\n\n**Commonly written:** \"Fossils at vents prove that LUCA lived in a hydrothermal vent.\"\n\n**Why it doesn’t score:** Vent fossils show ancient life there, while genomic reconstruction supports a compatible metabolism; neither identifies LUCA directly.\n\n**Scores instead:** \"Ancient vent fossils and reconstructed conserved genes together support, but don’t prove, a hydrothermal-vent habitat for LUCA.\"\n","cards":[{"id":"A2.1-01","q":"Explain how conditions on early Earth could have promoted the prebiotic formation of carbon compounds.","a":"Early Earth had little or no free oxygen, so it also lacked an ozone layer. More ultraviolet radiation could reach the surface and provide energy for chemical reactions. Higher concentrations of carbon dioxide and methane contributed to higher temperatures. Under these conditions, carbon compounds could form abiotically through chemical processes that rarely occur under present atmospheric conditions.","note":"Carbon compounds forming without organisms is evidence for prebiotic chemistry, not the production of life.","marks":null},{"id":"A2.1-02","q":"Explain why a cell is considered the smallest unit of self-sustaining life and why a virus doesn’t qualify.","a":"A cell is the smallest unit that can perform the coordinated processes of life, including metabolism, maintenance and reproduction at the cellular level. A virus has no cellular structure or independent metabolism and can reproduce only by using the molecular machinery of a host cell. Viruses therefore aren’t classified as living cells.","note":"The key word is independently. Viruses contain genetic material, but genetic material alone doesn’t make a system living.","marks":null},{"id":"A2.1-03","q":"Explain why hypotheses about the spontaneous origin of the first cells are unusually difficult to test.","a":"Modern cells are highly complex and arise by division of pre-existing cells, while the first cells had to develop from non-living material. The exact conditions on prebiotic Earth can’t be reproduced with certainty, and delicate protocells would be unlikely to leave recognizable fossils. Experiments can test whether individual proposed steps are possible, but they can’t recreate or directly observe the full historical event.","note":"","marks":null},{"id":"A2.1-04","q":"Explain the roles of catalysis, self-assembly, self-replication and compartmentalization in the evolution of the first cells.","a":"Catalysis increased the rates of useful chemical reactions. Self-assembly allowed molecules to organize into larger structures without a pre-existing cell directing them. Self-replication allowed information to be copied and inherited, making evolution possible. Compartmentalization enclosed molecules and reactions so an internal chemical environment could differ from the surroundings.","note":"These are requirements that solve different problems. Listing the four terms without their roles won’t explain cell origins.","marks":null},{"id":"A2.1-05","q":"Describe the setup and result of the Miller–Urey experiment.","a":"Miller and Urey heated water and circulated its vapor through gases including methane, ammonia and hydrogen in a closed apparatus without free oxygen. Electrical sparks supplied energy to represent lightning. The gases were then cooled so products condensed and circulated. After several days, the apparatus contained amino acids and other carbon compounds that hadn’t been present at the start.","note":"The experiment produced organic building blocks, not proteins, cells or life.","marks":null},{"id":"A2.1-06","q":"Evaluate what the Miller–Urey experiment does and doesn’t show about the origin of cells.","a":"The experiment shows that carbon compounds, including amino acids, can form abiotically from simpler substances when an energy source is present. It therefore supports the plausibility of prebiotic synthesis. Its gas mixture and other conditions may not accurately represent every part of early Earth, and the experiment didn’t produce self-replicating systems or cells. It supports one proposed step rather than demonstrating how life began.","note":"","marks":null},{"id":"A2.1-07","q":"Explain how fatty acids can spontaneously form spherical bilayer vesicles in water.","a":"Fatty acids are amphipathic, with hydrophilic regions that interact with water and hydrophobic regions that avoid contact with it. In water, many fatty acids can coalesce into a bilayer with hydrophilic regions facing the aqueous solutions and hydrophobic regions facing inward toward one another. Closing the bilayer into a sphere removes exposed edges and produces a vesicle with an aqueous interior.","note":"Self-assembly follows from molecular interactions. It doesn’t require genes or enzymes directing every molecule.","marks":null},{"id":"A2.1-08","q":"Explain why membrane-bound vesicles were an important proposed step toward the first cells.","a":"A vesicle creates a boundary between an internal aqueous compartment and the external environment. Molecules and reaction products can become concentrated inside it rather than dispersing, and the internal conditions can differ from those outside. This allows interacting reactions and replicating molecules to remain associated, although a membrane alone doesn’t make the vesicle alive.","note":"","marks":null},{"id":"A2.1-09","q":"Explain why RNA is presumed to have preceded DNA as genetic material in early living systems.","a":"The base sequence of RNA can store genetic information, and an RNA strand can serve as a template for production of a complementary strand. Some RNA molecules also fold into shapes that catalyze reactions. RNA could therefore have contributed to both heredity and catalysis before separate DNA genomes and protein enzymes evolved.","note":"The RNA world is a supported hypothesis, not a directly observed history of the first life.","marks":null},{"id":"A2.1-10","q":"Use a feature of the modern ribosome as evidence for the RNA world hypothesis.","a":"In the ribosome, ribosomal RNA in the large subunit catalyzes peptide bond formation during protein synthesis. The catalytic center is therefore a ribozyme rather than a protein enzyme. This retained catalytic role is consistent with the hypothesis that RNA performed catalytic functions before proteins became the main cellular catalysts.","note":"","marks":null},{"id":"A2.1-11","q":"Define LUCA and distinguish it from the first living cell.","a":"LUCA is the last universal common ancestor, meaning the most recent ancestral population from which all organisms alive today descended. LUCA wasn’t necessarily the first cell. Earlier cells and other lineages could have existed before or alongside it without leaving living descendants.","note":"LUCA means last common ancestor of present life, not first life and not necessarily one individual cell.","marks":null},{"id":"A2.1-12","q":"Explain how the genetic code and shared genes provide evidence for LUCA.","a":"Organisms use the same basic genetic code to translate nucleotide sequences into amino acid sequences, and organisms across all domains share conserved genes involved in fundamental cellular processes. Independent origins would be less likely to produce this extensive molecular agreement. The shared features are therefore evidence that modern organisms inherited core biology from a common ancestral population.","note":"","marks":null},{"id":"A2.1-13","q":"Explain why evidence for LUCA doesn’t mean that life originated only once.","a":"LUCA is identified from the shared features of organisms that survive today. Other self-replicating systems or cellular lineages may have evolved independently but later become extinct. Competition from LUCA and its descendants could have removed these lineages, leaving LUCA as the common ancestor of all surviving life.","note":"","marks":null},{"id":"A2.1-14","q":"Explain how fossils and carbon isotope ratios can provide minimum-age estimates for early life.","a":"Structures such as stromatolites can resemble deposits produced by microbial communities, and radiometric dating of their rock context gives an age for the evidence. Biological carbon fixation tends to favor carbon-12 over carbon-13, so unusually low carbon-13 to carbon-12 ratios in ancient carbon can act as a biosignature. Such evidence gives a minimum age because the organisms that produced it must already have existed, but similar structures or chemical patterns can sometimes have non-biological causes.","note":"The date of the oldest accepted evidence isn’t necessarily the date life began.","marks":null},{"id":"A2.1-15","q":"Explain how a molecular clock estimates the age of LUCA and why the estimate is uncertain.","a":"Scientists compare homologous DNA, RNA or protein sequences in living organisms and count differences that have accumulated since their lineages diverged. If the rate of sequence change can be estimated and calibrated, the number of differences can be used to estimate divergence time and work backwards toward LUCA. Estimates are uncertain because mutation rates vary among genes, organisms and periods, while horizontal gene transfer and repeated changes at the same position can obscure history.","note":"","marks":null},{"id":"A2.1-16","q":"Explain how ancient hydrothermal vent precipitates provide evidence about the environment of early life.","a":"Mineral-rich fluids at seafloor hydrothermal vents form precipitates that can surround, mineralize and preserve biological structures. Ancient vent precipitates contain microscopic structures and chemical signatures interpreted as evidence of early life. Their location supports the hypothesis that some ancient organisms lived near hydrothermal vents, although it doesn’t identify those organisms directly as LUCA.","note":"Ancient life at vents and LUCA at vents are related claims, but they aren’t identical.","marks":null},{"id":"A2.1-17","q":"Explain how genomic analysis can support the hypothesis that LUCA lived near hydrothermal vents.","a":"Scientists compare genomes from bacteria and archaea to identify highly conserved sequences likely to have been inherited from their common ancestry. Some reconstructed genes are associated with anaerobic metabolism, high-temperature conditions and the use of hydrogen in energy metabolism. Those inferred traits fit conditions near hydrothermal vents, so genomic evidence supports that habitat without proving an exact location.","note":"","marks":null},{"id":"A2.1-18","q":"Construct a supported sequence from non-living chemistry to the common ancestry of modern cells.","a":"Energy available on prebiotic Earth could promote abiotic formation of carbon compounds, as laboratory experiments show is chemically possible. Molecular self-assembly could produce larger structures and fatty-acid vesicles, while catalytic and replicating RNA could combine reaction control with heredity. Compartments could retain these molecules and establish distinct internal chemistry, allowing protocells to evolve by selection. Fossils, isotope patterns and molecular comparisons indicate that cellular life then evolved for immense periods, with all surviving organisms tracing their ancestry to LUCA.","note":"Keep possibility, evidence and conclusion separate. No experiment has reproduced this entire sequence.","marks":null}],"exam":[{"question":"## Q1. Explain prebiotic formation of carbon compounds. **[4]**\n\nExplain how conditions on early Earth could have allowed carbon compounds to form through processes that rarely occur on Earth today.","scheme":"- The early atmosphere lacked free oxygen / was anaerobic. **[1]**\n- The absence of oxygen resulted in little or no ozone, allowing greater ultraviolet radiation to reach Earth’s surface. **[1]**\n- Higher concentrations of carbon dioxide and methane contributed to higher temperatures. **[1]**\n- Ultraviolet radiation / heat / electrical energy could drive abiotic chemical reactions producing carbon compounds. **[1]**\n\n_Examiner note: naming gases earns limited credit. Full marks require links from atmospheric conditions to energy availability and abiotic chemical reactions._"},{"question":"## Q2. Evaluate the Miller–Urey experiment. **[5]**\n\nEvaluate the Miller–Urey experiment as evidence for the origin of carbon compounds on prebiotic Earth.","scheme":"- Water vapor was circulated with methane, ammonia and hydrogen in the absence of free oxygen / under reducing conditions. **[1]**\n- Electrical discharges supplied energy / simulated lightning. **[1]**\n- Amino acids / other carbon compounds formed from simpler starting substances. **[1]**\n- The result demonstrates that organic building blocks can form abiotically under the tested conditions. **[1]**\n- The atmospheric composition of early Earth is uncertain / the experiment did not produce self-replicating systems or cells. **[1]**\n\n_Examiner note: “Miller and Urey created life” loses the evaluation. The experiment supports abiotic synthesis of building blocks under one set of proposed conditions._"},{"question":"## Q3. Explain fatty-acid vesicle formation and its importance. **[4]**\n\nExplain how fatty acids could form spherical bilayer vesicles and why this mattered in the origin of cells.","scheme":"- Fatty acids are amphipathic / have hydrophilic and hydrophobic regions. **[1]**\n- Hydrophilic regions face the aqueous solutions while hydrophobic regions coalesce away from water / face inward toward one another. **[1]**\n- A bilayer closes into a sphere / forms a membrane-bound vesicle with an aqueous interior. **[1]**\n- The membrane permits internal chemistry to differ from external conditions / concentrates and retains reacting molecules. **[1]**\n\n_Examiner note: a diagram of a bilayer can earn structural marks, but full marks require the consequence of compartmentalization. A vesicle isn’t automatically a living cell._"},{"question":"## Q4. Explain RNA as the presumed first genetic material. **[4]**\n\nExplain the evidence and reasoning behind the RNA world hypothesis.","scheme":"- RNA nucleotide sequences can store genetic information. **[1]**\n- RNA can act as a template for complementary copying / can be replicated. **[1]**\n- Some RNA molecules have catalytic activity / are ribozymes. **[1]**\n- Ribosomal RNA catalyzes peptide bond formation, supporting an ancient catalytic role for RNA. **[1]**\n\n_Examiner note: describing RNA as “simpler than DNA” doesn’t answer the mechanism. Full marks come from its combined roles in heredity and catalysis plus the ribosome evidence._"},{"question":"## Q5. Distinguish LUCA from the first cell and outline evidence for LUCA. **[5]**\n\nDistinguish the last universal common ancestor from the first living cell, and outline molecular evidence for its existence.","scheme":"- LUCA was the most recent ancestral population shared by all organisms alive today. **[1]**\n- LUCA was not necessarily the first cell / earlier cellular lineages could have existed. **[1]**\n- The genetic code is shared across living organisms / is nearly universal. **[1]**\n- Conserved genes / sequences for fundamental cellular processes occur across all domains. **[1]**\n- Other early lineages may have become extinct through competition with LUCA and its descendants. **[1]**\n\n_Examiner note: expanding the acronym earns no mark by itself. The answer must state which organisms share this ancestor and why LUCA needn’t have been the first life._"},{"question":"## Q6. Explain evidence connecting LUCA with hydrothermal vents. **[6]**\n\nExplain how fossil and genomic evidence support the hypothesis that LUCA evolved near hydrothermal vents, and give one limitation of the evidence.","scheme":"- Hydrothermal fluids contain dissolved minerals that precipitate on contact with seawater. **[1]**\n- Precipitates can mineralize / preserve structures or chemical signatures produced by organisms. **[1]**\n- Ancient seafloor hydrothermal vent precipitates contain fossilized evidence interpreted as early life. **[1]**\n- Genomic comparisons identify conserved sequences shared by bacteria and archaea / sequences inferred to have been present in LUCA. **[1]**\n- Some inferred genes indicate anaerobic, hydrogen-dependent or high-temperature metabolism compatible with vent conditions. **[1]**\n- Fossil-like structures may have abiotic explanations / reconstructed genes support but do not prove LUCA’s exact habitat. **[1]**\n\n_Examiner note: “vents supplied energy” is a plausible idea but doesn’t answer an evidence question. Full marks require both ancient precipitates and conserved-sequence evidence._"}],"mcq":[{"id":"A2.1-q01","topic":"A2.1","kind":"mcq","lead":"","quote":"","prompt":"Which condition increased ultraviolet radiation at the surface of early Earth?","options":[{"text":"The absence of free oxygen and therefore of a protective ozone layer","correct":true,"why":"Atmospheric ozone forms from oxygen. With little free oxygen, early Earth had little ozone to absorb incoming ultraviolet radiation."},{"text":"The accumulation of free oxygen released by the earliest photosynthetic organisms","correct":false,"why":"Accumulating oxygen would allow an ozone layer to form and reduce ultraviolet penetration. It describes a later change caused by photosynthesis."},{"text":"The removal of methane and carbon dioxide from the early atmosphere","correct":false,"why":"Methane and carbon dioxide are linked to atmospheric warming in this topic. Removing them doesn’t explain the lack of ultraviolet protection."},{"text":"The presence of an ozone layer composed mainly of carbon dioxide","correct":false,"why":"Ozone consists of oxygen atoms, not carbon dioxide. An ozone layer absorbs ultraviolet radiation rather than increasing it."}],"after":null},{"id":"A2.1-q02","topic":"A2.1","kind":"mcq","lead":"","quote":"","prompt":"Why are viruses classified as non-living in A2.1?","options":[{"text":"They lack cellular organization and depend on host-cell machinery for replication","correct":true,"why":"Viruses can’t carry out independent metabolism or reproduce autonomously. They need a living host cell to make their components."},{"text":"They contain no genetic information that can be inherited by descendants","correct":false,"why":"Viruses contain DNA or RNA, so they do carry genetic information. Their dependence on host-cell machinery is the problem."},{"text":"They are too small to perform any chemical reactions involving biological molecules","correct":false,"why":"Size doesn’t determine whether something is living. Viruses can participate in chemical interactions but lack an independent cellular metabolism."},{"text":"They reproduce by cell division only when environmental conditions become favorable","correct":false,"why":"Viruses don’t reproduce by cell division. New viral particles are assembled from components made within an infected host cell."}],"after":null},{"id":"A2.1-q03","topic":"A2.1","kind":"mcq","lead":"","quote":"","prompt":"Which result was obtained in the Miller–Urey experiment?","options":[{"text":"Amino acids and other carbon compounds formed from simpler substances","correct":true,"why":"The experiment showed that biological building blocks could form abiotically when the chosen gas mixture received an energy input."},{"text":"Self-replicating cells formed after the gases received electrical discharges","correct":false,"why":"No cells or self-replicating systems formed. Electrical sparks helped produce much less complex carbon compounds."},{"text":"DNA molecules formed and began directing the synthesis of proteins","correct":false,"why":"The experiment didn’t produce DNA or a system for protein synthesis. It addressed the earlier formation of small carbon compounds."},{"text":"Fatty-acid vesicles evolved by natural selection inside the apparatus","correct":false,"why":"The reported result concerned abiotic production of carbon compounds. It didn’t demonstrate vesicle evolution or natural selection."}],"after":null},{"id":"A2.1-q04","topic":"A2.1","kind":"mcq","lead":"","quote":"","prompt":"What is the strongest valid conclusion from the Miller–Urey experiment?","options":[{"text":"Abiotic production of carbon compounds is possible under some proposed prebiotic conditions","correct":true,"why":"That conclusion stays within the evidence. The experiment tested one possible environment and produced carbon compounds without organisms."},{"text":"The experimental gas mixture exactly reproduced the atmosphere of early Earth","correct":false,"why":"The composition of the early atmosphere remains uncertain. An experimental model isn’t proof that every chosen condition existed."},{"text":"The origin of self-replicating life from non-living matter has been demonstrated","correct":false,"why":"The apparatus didn’t produce heredity, autonomous replication or cells. It tested one chemical step proposed before life."},{"text":"Lightning was the only energy source capable of producing early organic molecules","correct":false,"why":"Electrical sparks modeled one possible energy source. Ultraviolet radiation, heat and other energy sources could also drive prebiotic reactions."}],"after":null},{"id":"A2.1-q05","topic":"A2.1","kind":"mcq","lead":"","quote":"","prompt":"Why can fatty acids form spherical bilayer vesicles in water?","options":[{"text":"Their hydrophilic regions face water while hydrophobic regions coalesce inward","correct":true,"why":"Those interactions drive amphipathic molecules into bilayers. Closing into a sphere prevents hydrophobic regions at a bilayer edge from contacting water."},{"text":"Their hydrophobic regions form hydrogen bonds with the surrounding water molecules","correct":false,"why":"Hydrophobic regions interact poorly with water. They cluster away from it while the hydrophilic regions remain exposed."},{"text":"Enzymes arrange each fatty acid into its genetically specified membrane position","correct":false,"why":"This is self-assembly, so a pre-existing enzyme or genetic program isn’t required to position every molecule."},{"text":"Electrical attraction places all hydrophilic regions inside an air-filled compartment","correct":false,"why":"A vesicle has an aqueous interior, not an air-filled one. Hydrophilic regions face water on both sides of the bilayer."}],"after":null},{"id":"A2.1-q06","topic":"A2.1","kind":"mcq","lead":"","quote":"","prompt":"What was the main biological importance of compartmentalization in protocells?","options":[{"text":"It allowed internal conditions and reactions to differ from the surroundings","correct":true,"why":"A boundary can retain molecules, concentrate reactants and establish a distinct internal chemical environment."},{"text":"It guaranteed that every membrane-bound structure could reproduce independently","correct":false,"why":"A membrane doesn’t provide a replication system. Reproduction requires additional molecular processes for copying and inheritance."},{"text":"It converted every molecule inside the compartment into genetic material","correct":false,"why":"Enclosure doesn’t change all contents into information-carrying molecules. It keeps potentially useful molecules and reactions associated."},{"text":"It prevented all substances and energy from crossing the outer boundary","correct":false,"why":"A completely sealed compartment couldn’t obtain reactants or exchange energy. Membranes create selective boundaries, not total isolation."}],"after":null},{"id":"A2.1-q07","topic":"A2.1","kind":"mcq","lead":"","quote":"","prompt":"Which combination of properties makes RNA a candidate for the first genetic material?","options":[{"text":"It can store sequence information and some RNA molecules can catalyze reactions","correct":true,"why":"RNA can contribute to both heredity and catalysis. That combination could reduce the number of different molecular systems required in early life."},{"text":"It is always double stranded and chemically more stable than DNA","correct":false,"why":"Cellular RNA is usually single stranded and is generally less chemically stable than DNA. Greater stability helps DNA serve as modern long-term storage."},{"text":"It contains amino acids that fold into active sites for metabolism","correct":false,"why":"Proteins are polymers of amino acids. RNA is made from ribonucleotides, although its folding can still create a catalytic shape."},{"text":"It can reproduce complete cells without templates, catalysts or energy","correct":false,"why":"RNA replication requires chemical resources and a mechanism for templated copying. The hypothesis doesn’t give RNA unlimited autonomous reproduction."}],"after":null},{"id":"A2.1-q08","topic":"A2.1","kind":"mcq","lead":"","quote":"","prompt":"Which observation in modern cells supports an ancient catalytic role for RNA?","options":[{"text":"Ribosomal RNA catalyzes peptide bond formation during translation","correct":true,"why":"The ribosome retains RNA at the catalytic center of protein synthesis. This is evidence that RNA can act as a biological catalyst."},{"text":"Messenger RNA permanently stores the complete genome of every cell","correct":false,"why":"Modern cellular genomes are generally stored as DNA. Messenger RNA carries temporary copies of information for translation."},{"text":"Transfer RNA catalyzes the replication of chromosomal DNA before division","correct":false,"why":"Transfer RNA carries amino acids during translation. DNA polymerases and other proteins carry out chromosomal DNA replication."},{"text":"Ribosomal proteins alone create every peptide bond during translation","correct":false,"why":"Proteins support ribosome structure and function, but ribosomal RNA forms the catalytic center responsible for peptide bond formation."}],"after":null},{"id":"A2.1-q09","topic":"A2.1","kind":"mcq","lead":"","quote":"","prompt":"Which statement defines LUCA most accurately?","options":[{"text":"The most recent ancestral population shared by all organisms alive today","correct":true,"why":"LUCA is defined through the common ancestry of surviving organisms. It may have been a population rather than one individual cell."},{"text":"The first self-replicating molecule that formed anywhere on early Earth","correct":false,"why":"LUCA came after earlier prebiotic chemistry and probably after earlier living systems. It isn’t the first replicating molecule."},{"text":"The only living lineage that ever evolved from non-living material","correct":false,"why":"Other origins or early lineages may have occurred and then become extinct. Present evidence traces surviving life back to LUCA."},{"text":"The earliest fossilized organism discovered in a hydrothermal vent deposit","correct":false,"why":"No fossil has been identified directly as LUCA. LUCA is reconstructed from shared features and genomic comparisons."}],"after":null},{"id":"A2.1-q10","topic":"A2.1","kind":"mcq","lead":"","quote":"","prompt":"Which evidence most directly supports common descent from LUCA?","options":[{"text":"A shared genetic code and conserved genes across cellular organisms","correct":true,"why":"Extensive agreement in core information processing is expected if modern organisms inherited those features from common ancestry."},{"text":"Different organisms occupying unrelated habitats throughout the modern world","correct":false,"why":"Habitat diversity shows ecological adaptation, not common ancestry by itself. Molecular features shared across that diversity provide the evidence."},{"text":"The formation of amino acids inside the Miller–Urey apparatus","correct":false,"why":"Miller–Urey supports abiotic synthesis of building blocks. It doesn’t compare organisms or establish their common descent."},{"text":"The spontaneous assembly of fatty acids into artificial laboratory vesicles","correct":false,"why":"Vesicle assembly supports a possible step in protocell formation. It doesn’t show that present organisms share one ancestor."}],"after":null},{"id":"A2.1-q11","topic":"A2.1","kind":"mcq","lead":"","quote":"","prompt":"What can the age of the oldest accepted biosignature establish?","options":[{"text":"Life existed by at least that date","correct":true,"why":"A dated biosignature gives a minimum age for life. The biological system that produced it may have evolved much earlier."},{"text":"Life originated at exactly that date","correct":false,"why":"The earliest surviving evidence needn’t record the first life. Older evidence may have been destroyed, altered or never preserved."},{"text":"LUCA divided into all modern species on that date","correct":false,"why":"A biosignature doesn’t record every later divergence. LUCA and the diversification of modern lineages are inferred using additional evidence."},{"text":"Every older carbon compound had a non-biological origin","correct":false,"why":"An absence of accepted older evidence doesn’t prove an absence of older life. Preservation and interpretation are both limited."}],"after":null},{"id":"A2.1-q12","topic":"A2.1","kind":"mcq","lead":"","quote":"","prompt":"How does a molecular clock estimate the time since two lineages diverged?","options":[{"text":"It relates sequence differences to an estimated rate of molecular change","correct":true,"why":"Differences accumulate after divergence. A calibrated rate allows scientists to estimate how much time was needed to produce them."},{"text":"It measures the radioactive decay of DNA preserved inside living cells","correct":false,"why":"Molecular clocks compare inherited sequence changes. Radiometric dating instead measures radioactive isotopes in suitable geological materials."},{"text":"It counts the number of cells produced by each lineage per year","correct":false,"why":"Generation counts alone don’t reconstruct ancient divergence. The method depends on changes in homologous molecular sequences."},{"text":"It assumes every organism has accumulated an identical number of mutations","correct":false,"why":"Lineages and genes can change at different rates, which is a limitation. The method needs estimated rates and calibration, not identical totals."}],"after":null},{"id":"A2.1-q13","topic":"A2.1","kind":"mcq","lead":"","quote":"","prompt":"Which finding would support the hypothesis that LUCA lived near hydrothermal vents?","options":[{"text":"Conserved genes indicate anaerobic, hydrogen-dependent metabolism suited to vent conditions","correct":true,"why":"Genes inferred from shared sequences can reveal likely metabolic traits. Anaerobic use of hydrogen fits the chemistry around hydrothermal vents."},{"text":"Recently evolved genes occur only in animals living near warm surface waters","correct":false,"why":"Recent animal genes say little about LUCA. The relevant evidence must be ancient, conserved across major domains and tied to vent conditions."},{"text":"Every modern organism requires oxygen for aerobic cellular respiration","correct":false,"why":"Many organisms are anaerobic, and free oxygen was scarce on early Earth. Universal oxygen dependence isn’t a feature reconstructed for LUCA."},{"text":"Miller–Urey products formed only when exposed to oxygen-rich seawater","correct":false,"why":"The Miller–Urey atmosphere lacked free oxygen and didn’t test LUCA’s habitat. This option conflicts with both the setup and the evidence asked for."}],"after":null},{"id":"A2.1-q14","topic":"A2.1","kind":"mcq","lead":"","quote":"","prompt":"A student claims that fossil-like structures in ancient vent deposits prove LUCA lived there. What is the best evaluation?","options":[{"text":"The structures support ancient life near vents but don’t identify it directly as LUCA","correct":true,"why":"Location and age can support an early vent habitat. Identifying LUCA requires additional comparative genomic evidence and still remains an inference."},{"text":"The structures prove the organisms were LUCA because all fossils preserve complete genomes","correct":false,"why":"Ancient microscopic structures don’t preserve complete readable genomes. Their identity can’t be established that way."},{"text":"The structures provide no evidence because minerals can never preserve biological material","correct":false,"why":"Mineral precipitates can preserve biological shapes and chemical signatures. The limitation concerns interpretation, not an absolute lack of evidence."},{"text":"The structures prove that hydrothermal vents created the first carbon compounds","correct":false,"why":"Evidence of organisms near vents doesn’t establish where the earliest carbon compounds formed. Those are separate claims requiring different evidence."}],"after":null},{"id":"A2.1-t1","topic":"A2.1","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"The Miller–Urey experiment created the first living cells from gases.","prompt":"Why does it fail?","options":[{"text":"The experiment produced amino acids and other carbon compounds, not cells or self-replicating living systems.","correct":t ied and catalyzing reactions.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying RNA came first because it is single stranded."}],"after":{"label":"What would have scored","text":"A carbon compound may be consistent with life, but its context and possible abiotic formation must also be evaluated."}},{"id":"A2.1-t3","topic":"A2.1","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Once fatty acids formed a vesicle, the vesicle became a cell.","prompt":"Why does it fail?","options":[{"text":"A membrane provides compartmentalization but doesn’t supply metabolism, heredity or self-replication.","correct":true,"why":"That’s exactly why it fails."},{"text":"The experiment produced amino acids and other carbon compounds, not cells or self-replicating living systems.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying Miller and Urey made life."},{"text":"Carbon compounds can form through abiotic reactions, so their presence alone doesn’t identify a biological source.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating a carbon compound as proof of life."},{"text":"Strand number doesn’t establish the required roles. The hypothesis depends on RNA storing information, being copied and catalyzing reactions.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying RNA came first because it is single stranded."}],"after":{"label":"What would have scored","text":"Fatty-acid vesicles could maintain distinct internal chemistry, making them a proposed intermediate rather than complete living cells."}},{"id":"A2.1-t4","topic":"A2.1","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"RNA was the first genetic material because it has only one strand.","prompt":"Why does it fail?","options":[{"text":"Strand number doesn’t establish the required roles. The hypothesis depends on n.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling every membrane vesicle living."}],"after":{"label":"What would have scored","text":"Ribosomal RNA catalyzes peptide bond formation, providing a modern example of a ribozyme."}},{"id":"A2.1-t6","topic":"A2.1","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"LUCA was the first living cell on Earth.","prompt":"Why does it fail?","options":[{"text":"LUCA was the most recent common ancestor of surviving life; older cells and extinct lineages may have preceded it.","correct":true,"why":"That’s exactly why it fails."},{"text":"The experiment produced amino acids and other carbon compounds, not cells or self-replicating living systems.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying Miller and Urey made life."},{"text":"Carbon compounds can form through abiotic reactions, so their presence alone doesn’t identify a biological source.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating a carbon compound as proof of life."},{"text":"A membrane provides compartmentalization but doesn’t supply metabolism, heredity or self-replication.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling every membrane vesicle living."}],"after":{"label":"What would have scored","text":"LUCA was the ancestral population from which all organisms alive today descended, not necessarily the first life."}},{"id":"A2.1-t7","topic":"A2.1","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Life began when the oldest known stromatolite formed.","prompt":"Why does it fail?","options":[{"text":"The oldest accepted evidence gives a minimum age; the organisms that produced it must already have evolved.","correct":true,"why":"That’s exactly why it fails."},{"text":"The experiment produced amino acids and other carbon compounds, not cells or self-replicating living systems.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying Miller and Urey made life."},{"text":"Carbon compounds can form through abiotic reactions, so their presence alone doesn’t identify a biological source.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating a carbon compound as proof of life."},{"text":"A membrane provides compartmentalization but doesn’t supply metabolism, heredity or self-replication.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling every membrane vesicle living."}],"after":{"label":"What would have scored","text":"A dated stromatolite shows that cellular life existed by that time, so life’s origin must have occurred earlier."}},{"id":"A2.1-t8","topic":"A2.1","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Fossils at vents prove that LUCA lived in a hydrothermal vent.","prompt":"Why does it fail?","options":[{"text":"Vent fossils show ancient life there, while genomic reconstruction supports a compatible metabolism; neither identifies LUCA directly.","correct":true,"why":"That’s exactly why it fails."},{"text":"The experiment produced amino acids and other carbon compounds, not cells or self-replicating living systems.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying Miller and Urey made life."},{"text":"Carbon compounds can form through abiotic reactions, so their presence alone doesn’t identify a biological source.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating a carbon compound as proof of life."},{"text":"A membrane provides compartmentalization but doesn’t supply metabolism, heredity or self-replication.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling every membrane vesicle living."}],"after":{"label":"What would have scored","text":"Ancient vent fossils and reconstructed conserved genes together support, but don’t prove, a hydrothermal-vent habitat for LUCA."}}]}},{"code":"A2.2","title":"Cell structure","theme":"A","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"59-66","questionsPage":69,"bookTitle":null,"pack":{"oneLiner":"A2.2 is about recognizing what cells share, explaining how their structures differ, using microscopes to investigate them and tracing how specialized and complex cells evolved.","essentials":"\n> Tick a line only after you can do it with the page closed and without prompts.\n\n## Core\n\n- [ ] State cell theory and use it to predict that a newly discovered organism consists of one or more cells.\n- [ ] Prepare, stain, focus and measure a temporary mount using a light microscope.\n- [ ] Calculate magnification, actual size and scale-bar length after converting measurements to the same units.\n- [ ] Explain what electron microscopy, freeze fracture, cryogenic electron microscopy, fluorescent stains and immunofluorescence let scientists observe.\n- [ ] Explain why all typical cells need DNA, cytoplasm, a plasma membrane and ribosomes.\n- [ ] Describe a Gram-positive prokaryotic cell and distinguish its structure from that of a eukaryotic cell.\n- [ ] Identify the major structures of eukaryotic cells and connect each structure to its function.\n- [ ] Explain how a unicellular organism carries out all the functions of life within one cell.\n- [ ] Compare animal, fungal and plant cells using cell walls, vacuoles, plastids, centrioles, cilia and flagella.\n- [ ] Explain how numbers of nuclei make aseptate fungal hyphae, skeletal muscle fibers, mature mammalian red blood cells and phloem sieve tube elements atypical.\n- [ ] Identify prokaryotic, animal and plant cells, and their visible structures, in light and electron micrographs.\n- [ ] Draw and annotate structures from electron micrographs using clear lines, accurate proportions and functions in the annotations.\n\n## Higher level\n\n- [ ] Explain the endosymbiotic origin of mitochondria and chloroplasts, including the evidence from their ribosomes, DNA and replication.\n- [ ] Explain how different patterns of gene expression produce differentiated cells and specialized tissues.\n- [ ] Explain why multicellularity evolved repeatedly and how larger body size and cell specialization can be advantageous.\n\n## Links to other topics\n\n- **A1.2 Nucleic acids** — DNA stores genetic information in both prokaryotic and eukaryotic cells. This connection explains why DNA counts as a feature shared by all cells.\n- **B2.1 Membranes and membrane transport** — A2.2 identifies the plasma membrane as the cell boundary. B2.1 explains its molecular structure and how substances cross it.\n- **B2.2 Organelles and compartmentalization** — the organelles introduced here become a system of specialized compartments. Knowing their identities first makes the later transport pathways easier to follow.\n- **B2.3 Cell specialization** — differentiation changes gene expression, while specialization connects the resulting cell structure to a particular function.\n- **D2.2 Gene expression** — cells with the same genome can develop differently because different genes are expressed. D2.2 supplies the molecular control behind that claim.\n- **A3.1 Diversity of organisms** — cell walls, plastids, cilia and other cell features help compare major groups of organisms.\n\n## Vocabulary that has to be exact\n\n| Term | What it means | What it’s not |\n| --- | --- | --- |\n| Cell theory | The theory that living organisms consist of one or more cells, cells are the smallest units of life, and cells arise from pre-existing cells | A claim that every cell has a nucleus |\n| Magnification | Image size divided by actual size | Resolution, which is the ability to distinguish nearby points |\n| Resolution | The ability to distinguish two close points as separate | How large the image appears |\n| Micrograph | An image produced using a microscope | A biological drawing made from that image |\n| Ultrastructure | Cell structure visible at the resolution of an electron microscope | Only the structures visible with a classroom light microscope |\n| Prokaryote | A cell without a nucleus or membrane-bound organelles; its DNA occupies a nucleoid region | A cell with no DNA or internal organization |\n| Eukaryote | A cell with chromosomes inside a membrane-bound nucleus and membrane-bound organelles | Any cell belonging to a multicellular organism |\n| Nucleoid | The region of a prokaryotic cell containing its main DNA molecule | A membrane-bound nucleus |\n| Naked DNA | DNA that isn’t associated with histone proteins | DNA without genes or nucleotides |\n| Organelle | A specialized structure within a cell | A complete cell within a tissue |\n| Immunofluorescence | Use of fluorescently labeled antibodies to locate a specific antigen, usually a protein | Fluorescent staining that labels every structure equally |\n| Differentiation | Development of different cell types through different patterns of gene expression | A change in the DNA sequence of every specialized cell |\n| Endosymbiosis | A relationship in which one cell lived inside another and eventually became an organelle | Temporary digestion of one cell by another |\n| Multicellular | Consisting of many cooperating cells | Any group of independent unicellular organisms |\n","videos":"\nWatch **one** main video, then close it and draw or explain what you remember. A second full explanation builds recognition again, and recognition is the habit you’re trying to replace with recall.\n\n## Main\n\n**Mister Lee Science — A2.2 Cell structure**\n\n- Channel: \u003chttps://www.youtube.com/@misterleescience> — verified\n- Search: \u003chttps://www.youtube.com/results?search_query=Mister+Lee+Science+A2.2+Cell+structure>\n\nAlex Lee organizes the course by the current IB topic codes, so this is the best first pass through the exact A2.2 scope.\n\n**Watch for:**\n\n- Which structures occur in all typical cells, and why each one is needed.\n- Which observations distinguish a prokaryotic cell from a eukaryotic cell.\n- How animal, fungal and plant cells differ without treating any diagram as universal.\n- Which three observations support the endosymbiotic origin of mitochondria and chloroplasts.\n\n**Pause at:** the first comparison of prokaryotic and eukaryotic cells. Cover the labels and make two columns from memory. Put DNA location, ribosome type, nucleus and membrane-bound organelles into both columns before continuing.\n\n## If that didn’t land\n\n**Amoeba Sisters — prokaryotic and eukaryotic cells**\n\n- Channel: \u003chttps://www.youtube.com/@AmoebaSisters> — verified\n- Search: \u003chttps://www.youtube.com/results?search_query=Amoeba+Sisters+prokaryotic+and+eukaryotic+cells>\n\nUse this when the two cell plans keep blending together. Afterward, explain the comparison without looking at a diagram.\n\n**Khan Academy — cell structures and organelles**\n\n- Channel: \u003chttps://www.youtube.com/@khanacademy> — verified\n- Search: \u003chttps://www.youtube.com/results?search_query=Khan+Academy+cell+structures+organelles>\n\nUse this when you recognize organelle names but can’t produce their functions or connect them into a cell.\n\n## Worth it once, not for revision\n\nFreeze fracture is a mechanical process, so an **animation** earns an extra watch. Seeing a frozen membrane split through the hydrophobic interior makes the resulting fracture faces easier to interpret.\n\n- Search: \u003chttps://www.youtube.com/results?search_query=freeze+fracture+electron+microscopy+animation>\n\nAfter watching, explain aloud what gets frozen, where the membrane splits and what the exposed faces can reveal. Don’t replay it until you’ve tried to produce all three answers.\n\nFor micrographs, spend one session practicing identification rather than watching another explanation.\n\n- Search: \u003chttps://www.youtube.com/results?search_query=IB+Biology+A2.2+cell+micrograph+identification>\n\nPause before each answer appears. Name the cell type, give two visible pieces of evidence and identify any organelles you can defend from the image.\n\n## Pinned\n","traps":"\n## Treating magnification as resolution\n\n**Commonly written:** \"Electron microscopes are better because they magnify more.\"\n\n**Why it doesn’t score:** Magnification only enlarges an image. The key advantage is greater resolution, which reveals two close points as separate.\n\n**Scores instead:** \"Electron microscopes have greater resolution than light microscopes, so they reveal finer cell ultrastructure.\"\n\n## Dividing measurements before matching the units\n\n**Commonly written:** \"The image is 20 mm and the cell is 10 µm, so the magnification is ×2.\"\n\n**Why it doesn’t score:** Image size and actual size must be converted to the same unit before image size is divided by actual size.\n\n**Scores instead:** \"20 mm is 20,000 µm, so the magnification is 20,000 ÷ 10 = ×2000.\"\n\n## Saying prokaryotes have no DNA or ribosomes\n\n**Commonly written:** \"Prokaryotic cells have no nucleus, so they have no DNA or ribosomes.\"\n\n**Why it doesn’t score:** Prokaryotes contain nucleoid DNA and 70S ribosomes; they lack a membrane-bound nucleus and membrane-bound organelles.\n\n**Scores instead:** \"A prokaryote has naked DNA in a nucleoid region and 70S ribosomes, but no membrane-bound nucleus.\"\n\n## Calling every plant cell chloroplast-containing\n\n**Commonly written:** \"Plant cells can always be identified because they contain chloroplasts.\"\n\n**Why it doesn’t score:** Only photosynthetic plant cells contain chloroplasts. Non-photosynthetic cells, including many root cells, lack them.\n\n**Scores instead:** \"A cell wall supports identification as a plant cell, while chloroplasts identify a photosynthetic plant cell when they’re visible.\"\n\n## Using image color as micrograph evidence\n\n**Commonly written:** \"The organelle is green in the electron micrograph, so it must be a chloroplast.\"\n\n**Why it doesn’t score:** Electron micrographs are produced without natural color, and added color doesn't establish the identity of a structure.\n\n**Scores instead:** \"The organelle is identified as a chloroplast from its internal membranes and its position within a plant cell, not from added color.\"\n\n## Saying all eukaryotic cells have one nucleus\n\n**Commonly written:** \"Every eukaryotic cell has exactly one membrane-bound nucleus.\"\n\n**Why it doesn’t score:** Some eukaryotic structures are multinucleate, while mature mammalian red blood cells and sieve tube elements lack nuclei.\n\n**Scores instead:** \"Typical eukaryotic cells have a nucleus, but skeletal muscle fibers and aseptate hyphae have many, while some differentiated cells have none.\"\n\n## Listing endosymbiosis evidence without the comparison\n\n**Commonly written:** \"Mitochondria have DNA, ribosomes and can reproduce.\"\n\n**Why it doesn’t score:** The evidence depends on specific prokaryote-like features: naked circular DNA, 70S ribosomes and replication within the cell.\n\n**Scores instead:** \"Mitochondria contain naked circular DNA and 70S ribosomes and can replicate, all of which support their prokaryotic origin.\"\n\n## Saying differentiation changes the genes present\n\n**Commonly written:** \"A muscle cell becomes different because it receives different genes from a nerve cell.\"\n\n**Why it doesn’t score:** Differentiated cells generally retain the same genome; different patterns of gene expression produce different proteins and structures.\n\n**Scores instead:** \"Muscle and nerve cells contain the same genome but express different genes, so they produce different proteins and become specialized.\"\n","cards":[{"id":"A2.2-01","q":"State the three parts of cell theory, then use the theory to make a prediction about a newly discovered organism.","a":"Living organisms consist of one or more cells, cells are the smallest units of life, and cells arise from pre-existing cells. Deductive reasoning from this theory predicts that a newly discovered living organism will consist of at least one cell.","note":"The prediction follows from the theory. Finding one unusual organism wouldn’t let you rewrite the prediction before examining it.","marks":null},{"id":"A2.2-02","q":"Outline how to prepare and focus a stained temporary mount using a light microscope.","a":"Place a thin specimen in a drop of water on a slide, add a suitable stain if needed, and lower a coverslip at an angle to reduce trapped air. Begin with the lowest-power objective. Use the coarse focus to locate the specimen, then the fine focus to sharpen the image. At higher power, use fine focus and adjust the illumination.","note":"Starting at high power gives a small field of view and makes the specimen harder to find.","marks":null},{"id":"A2.2-03","q":"A cell image is 36 mm long and the cell's actual length is 12 µm. Calculate the magnification and state the unit.","a":"Convert 36 mm to 36,000 µm, then use magnification = image size ÷ actual size. The magnification is 36,000 µm ÷ 12 µm = 3,000. Magnification has no unit, so the answer is ×3000.","note":"The measurements must use the same unit before division. Magnification is a ratio, so mm or µm shouldn't remain in the answer.","marks":null},{"id":"A2.2-04","q":"Explain the difference between magnification and resolution, then compare light and electron microscopy.","a":"Magnification is the ratio of image size to actual size. Resolution is the ability to distinguish two nearby points as separate. Electron microscopes have greater resolution than light microscopes and reveal finer ultrastructure. Light microscopes can show living cells and naturally colored or stained specimens, while conventional electron microscopy requires a vacuum and prepared, non-living material.","note":"A larger blurry image has greater magnification but no extra resolved detail.","marks":null},{"id":"A2.2-05","q":"Explain what freeze fracture, cryogenic electron microscopy, fluorescent staining and immunofluorescence each add to microscopy.","a":"Freeze fracture freezes a specimen and splits membranes through their hydrophobic interior, exposing fracture faces and embedded structures. Cryogenic electron microscopy rapidly freezes specimens so structures can be viewed close to their native state. Fluorescent stains make selected cell components emit visible light. Immunofluorescence uses fluorescently labeled antibodies that bind specific antigens, allowing particular proteins to be located.","note":"","marks":null},{"id":"A2.2-06","q":"Explain why DNA, cytoplasm, a plasma membrane and ribosomes are needed in typical cells.","a":"DNA stores genetic information used to control cell activities and inheritance. The water-based cytoplasm is a medium for metabolic reactions. The lipid plasma membrane forms a boundary and regulates exchange with the surroundings. Ribosomes translate genetic information by synthesizing polypeptides.","note":"","marks":null},{"id":"A2.2-07","q":"Describe the required structure of a Gram-positive prokaryotic cell.","a":"A Gram-positive prokaryotic cell has a plasma membrane surrounded by a cell wall, cytoplasm containing 70S ribosomes, and naked DNA in a loop within a nucleoid region. It has no membrane-bound nucleus and no membrane-bound cytoplasmic organelles.","note":"Prokaryotic cells have DNA and ribosomes. Their defining absence is a membrane-bound nucleus, not all internal structure.","marks":null},{"id":"A2.2-08","q":"Compare the genetic material and ribosomes of prokaryotic and eukaryotic cells.","a":"A prokaryotic cell has naked, usually circular DNA in a nucleoid region and 70S ribosomes in its cytoplasm. A eukaryotic cell has linear DNA associated with histones in chromosomes inside a double-membrane nucleus with pores, and it has 80S ribosomes in its cytoplasm.","note":"Mitochondria and chloroplasts contain 70S ribosomes, but the eukaryotic cytoplasm contains 80S ribosomes.","marks":null},{"id":"A2.2-09","q":"Outline the functions of the nucleus, mitochondria, chloroplasts, rough endoplasmic reticulum and smooth endoplasmic reticulum.","a":"The nucleus contains chromosomes and controls cell activities through gene expression. Mitochondria carry out aerobic respiration and ATP production. Chloroplasts carry out photosynthesis. Rough endoplasmic reticulum has attached ribosomes and synthesizes or transports proteins for secretion or membranes. Smooth endoplasmic reticulum synthesizes lipids and has other metabolic roles.","note":"","marks":null},{"id":"A2.2-10","q":"Outline the functions of the Golgi apparatus, vesicles, lysosomes, vacuoles and cytoskeleton.","a":"The Golgi apparatus modifies, sorts and packages proteins or lipids into vesicles. Vesicles transport or store materials. Lysosomes contain hydrolytic enzymes for intracellular digestion. Vacuoles are membrane-bound compartments used for storage and other functions; a plant sap vacuole also helps maintain turgor. Microtubules and microfilaments form a cytoskeleton that supports cell shape, movement and intracellular transport.","note":"","marks":null},{"id":"A2.2-11","q":"Name the eight functions of life and explain how one unicellular organism can carry them out.","a":"The functions are homeostasis, metabolism, nutrition, movement, excretion, growth, response to stimuli and reproduction. A unicellular organism performs all eight within one cell. For example, a Paramecium takes in food, digests it in food vacuoles, uses cilia for movement, expels wastes, regulates water balance with contractile vacuoles, responds to stimuli, grows and reproduces by cell division.","note":"A unicellular organism has no specialized tissues to divide these jobs between.","marks":null},{"id":"A2.2-12","q":"Compare animal, fungal and plant cells using cell walls, vacuoles, plastids, centrioles, cilia and flagella.","a":"Animal cells lack cell walls and plastids and often contain small temporary vacuoles; many animal cells have centrioles, and some have cilia or flagella. Fungal cells have chitin cell walls, lack plastids and may have vacuoles. Plant cells have cellulose cell walls, usually a large permanent sap vacuole, and may contain chloroplasts or other plastids. Most higher-plant cells lack centrioles, cilia and flagella.","note":"Chloroplasts aren't present in every plant cell. Root cells are the standard counterexample.","marks":null},{"id":"A2.2-13","q":"Correct the claim that every eukaryotic cell contains exactly one nucleus.","a":"Eukaryotic cells don't all contain exactly one nucleus. Aseptate fungal hyphae contain many nuclei in continuous cytoplasm, and skeletal muscle fibers contain many nuclei because precursor cells fuse. Mature mammalian red blood cells and mature phloem sieve tube elements lack nuclei; sieve tube elements depend on companion cells for many metabolic functions.","note":"The misconception fails in both directions: some eukaryotic cells have many nuclei, while others lose the nucleus during differentiation.","marks":null},{"id":"A2.2-14","q":"How can you distinguish prokaryotic, plant and animal cells in micrographs without relying on image color?","a":"A prokaryotic cell is usually smaller and lacks a nucleus and membrane-bound organelles; its DNA occupies a nucleoid region. A plant cell can be identified by a cell wall and may show chloroplasts or a large sap vacuole. An animal cell lacks a cell wall and chloroplasts but may show a nucleus, mitochondria and other membrane-bound organelles. Identification should use visible structures, scale and more than one feature where possible.","note":"Electron micrographs aren't naturally colored. Added color isn't evidence for a cell type.","marks":null},{"id":"A2.2-15","q":"Describe how to make a scoring drawing and annotation from an electron micrograph.","a":"Draw only structures supported by the micrograph, using clear single lines, accurate proportions and no shading. Keep label lines straight, separate and ending on the intended structure. Include a title and scale information when available. An annotation should name a visible structure and connect an observed feature to its function, rather than listing a function with no link to the image.","note":"","marks":null},{"id":"A2.2-16","q":"Explain the endosymbiotic origin of mitochondria and chloroplasts and give three pieces of evidence.","a":"An ancestral eukaryotic cell engulfed an aerobic prokaryote that survived inside it and developed into a mitochondrion. In some later lineages, a photosynthetic prokaryote was engulfed and developed into a chloroplast. Mitochondria and chloroplasts contain 70S ribosomes, naked circular DNA and can replicate within the cell. These prokaryote-like features support endosymbiosis.","note":"The evidence must be linked to prokaryotes. Listing organelle features without making that link leaves the argument unfinished.","marks":null},{"id":"A2.2-17","q":"Explain how cells with the same genome can differentiate into different specialized cell types.","a":"Cells generally contain the same genome, but they express different sets of genes. Signals, often produced by changes in the cell's environment, activate or suppress particular genes. The cells therefore produce different proteins, develop different structures and functions, and become differentiated into specialized cell types that form tissues.","note":"","marks":null},{"id":"A2.2-18","q":"Construct a synthesis answer linking multicellularity, differentiation and specialization.","a":"Multicellularity evolved repeatedly in eukaryotes, including fungi and algae, while all plants and animals are multicellular. Different patterns of gene expression cause cells to differentiate. The resulting specialized cells divide biological work and cooperate in tissues, allowing efficient performance of different functions and the evolution of larger body size.","note":"Multicellularity isn't one event inherited by every multicellular lineage. It evolved independently more than once.","marks":null}],"exam":[{"question":"## Q1. Explain how cell theory can be used to make a prediction about a newly discovered organism. **[3]**\n\nCell theory is an example of a scientific theory from which predictions can be deduced. Explain the reasoning and prediction that apply to a newly discovered living organism.","scheme":"- Living organisms consist of one or more cells. **[1]**\n- Deductive reasoning applies a general theory to a specific new case. **[1]**\n- The newly discovered organism is predicted to consist of at least one cell. **[1]**\n\n_Examiner note: stating that organisms contain cells gives the theory but not the deduction. Full marks require the prediction about the new organism and the reasoning that produced it._"},{"question":"## Q2. Calculate the actual length of a cell. **[3]**\n\nA micrograph shows a cell with an image length of 45 mm at a magnification of ×1500. Calculate the cell's actual length in micrometers.","scheme":"- Uses actual size = image size ÷ magnification. **[1]**\n- Converts 45 mm to 45,000 µm before division / converts the final result correctly from millimeters. **[1]**\n- Actual length = 30 µm. **[1]**\n\n_Examiner note: 45 ÷ 1500 = 0.03 isn't a complete answer unless the unit is handled. The scoring result is 0.03 mm or 30 µm, with 30 µm matching the requested unit._"},{"question":"## Q3. Compare and contrast prokaryotic and eukaryotic cell structure. **[6]**","scheme":"Award any six:\n\n- Both contain a plasma membrane and cytoplasm. **[1]**\n- Both contain DNA as genetic material and ribosomes for protein synthesis. **[1]**\n- Prokaryotic DNA is naked and usually circular, whereas eukaryotic nuclear DNA is linear and associated with histones. **[1]**\n- Prokaryotic DNA occupies a nucleoid region, whereas eukaryotic chromosomes are enclosed within a double-membrane nucleus with pores. **[1]**\n- Prokaryotic cytoplasm contains 70S ribosomes, whereas eukaryotic cytoplasm contains 80S ribosomes. **[1]**\n- Prokaryotes lack membrane-bound cytoplasmic organelles, whereas eukaryotes contain organelles such as mitochondria, endoplasmic reticulum and Golgi apparatus. **[1]**\n- Prokaryotic cells are generally smaller than eukaryotic cells. **[1]**\n\n_Examiner note: two separate lists earn less than paired comparisons. Each difference should place the prokaryotic and eukaryotic versions of the same feature in one statement._"},{"question":"## Q4. Distinguish four atypical eukaryotic cell structures by their numbers of nuclei. **[4]**\n\nRefer to aseptate fungal hyphae, skeletal muscle fibers, mature mammalian red blood cells and mature phloem sieve tube elements.","scheme":"- Aseptate fungal hyphae have many nuclei in continuous cytoplasm / lack septa dividing the hypha into separate cells. **[1]**\n- Skeletal muscle fibers are multinucleate / form by fusion of precursor cells. **[1]**\n- Mature mammalian red blood cells lack a nucleus. **[1]**\n- Mature phloem sieve tube elements lack a nucleus / depend metabolically on companion cells. **[1]**\n\n_Examiner note: saying that these cells are “unusual” earns nothing by itself. The distinction being tested is whether each example has many nuclei or no nucleus._"},{"question":"## Q5. Explain the evidence for the endosymbiotic origin of mitochondria and chloroplasts. **[5]**","scheme":"- An ancestral eukaryotic cell engulfed an aerobic prokaryote that survived and became a mitochondrion. **[1]**\n- A photosynthetic prokaryote was later engulfed in some lineages and became a chloroplast. **[1]**\n- Mitochondria and chloroplasts contain 70S ribosomes, as do prokaryotes. **[1]**\n- Mitochondria and chloroplasts contain naked circular DNA resembling prokaryotic DNA. **[1]**\n- Mitochondria and chloroplasts can replicate within the cell / show a prokaryote-like capacity for division. **[1]**\n\n_Examiner note: the organelle features score as evidence only when their similarity to prokaryotes is clear. “They have DNA and ribosomes” misses the significant forms: naked circular DNA and 70S ribosomes._"},{"question":"## Q6. Explain how differentiation and multicellularity allow specialized tissues to develop. **[5]**","scheme":"- Cells in an organism generally contain the same genome. **[1]**\n- Different cell types express different sets / patterns of genes. **[1]**\n- Changes in the environment / signals can activate or suppress gene expression. **[1]**\n- Different proteins are produced, causing cells to develop different structures and functions / differentiate. **[1]**\n- Specialized cells cooperate in tissues / division of labor permits more efficient functions and larger body size. **[1]**\n\n_Examiner note: differentiation doesn't mean that each cell receives different genes. The central chain is different gene expression, different proteins, different structure and function._"}],"mcq":[{"id":"A2.2-q01","topic":"A2.2","kind":"mcq","lead":"","quote":"","prompt":"Which prediction follows deductively from cell theory when an organism is newly discovered?","options":[{"text":"The organism consists of one or more cells","correct":true,"why":"Cell theory applies to living organisms, so it predicts cellular organization before the new organism is examined."},{"text":"The organism consists entirely of eukaryotic cells","correct":false,"why":"Cell theory predicts cells, but it doesn't predict their type. The organism could be prokaryotic."},{"text":"Every cell in the organism contains one nucleus","correct":false,"why":"Prokaryotes lack nuclei, and several eukaryotic cell types have many nuclei or none."},{"text":"Every cell in the organism performs photosynthesis","correct":false,"why":"Photosynthesis belongs to certain cells and organisms. It isn't part of cell theory."}],"after":null},{"id":"A2.2-q02","topic":"A2.2","kind":"mcq","lead":"","quote":"","
