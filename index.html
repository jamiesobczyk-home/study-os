e water column. Evaporation from the leaf creates the tension.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying cohesion causes transpiration pull."}],"after":{"label":"What would have scored","text":"Evaporation of sweat removes a large amount of energy from the skin because water has a high latent heat of vaporization."}},{"id":"A1.1-t7","topic":"A1.1","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Water is dense and viscous. Air contains oxygen.","prompt":"Why does it fail?","options":[{"text":"A compare-and-contrast question requires paired statements that use one medium as the reference for the other.","correct":true,"why":"That’s exactly why it fails."},{"text":"The atoms carry partial charges because electrons are shared unequally. The molecule remains neutral overall.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling partial charges full charges."},{"text":"The O–H bonds within one molecule are polar covalent bonds. Hydrogen bonds act between separate molecules.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: putting hydrogen bonds inside the molecule."},{"text":"Cohesion transmits tension through the water column. Evaporation from the leaf creates the tension.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying cohesion causes transpiration pull."}],"after":{"label":"What would have scored","text":"Water is more viscous than air, so aquatic animals experience greater drag and benefit from streamlined bodies."}},{"id":"A1.1-t8","topic":"A1.1","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Liquid water on a planet means that life exists there.","prompt":"Why does it fail?","options":[{"text":"Water indicates a potentially suitable condition for known life. It doesn’t show that organisms are present.","correct":true,"why":"That’s exactly why it fails."},{"text":"The atoms carry partial charges because electrons are shared unequally. The molecule remains neutral overall.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling partial charges full charges."},{"text":"The O–H bonds within one molecule are polar covalent bonds. Hydrogen bonds act between separate molecules.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: putting hydrogen bonds inside the molecule."},{"text":"Cohesion transmits tension through the water column. Evaporation from the leaf creates the tension.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying cohesion causes transpiration pull."}],"after":{"label":"What would have scored","text":"Liquid water indicates potential habitability for life as we know it, but its presence alone doesn’t demonstrate life."}}]}},{"code":"A1.2","title":"Nucleic acids","theme":"A","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"4-7","questionsPage":8,"bookTitle":null,"pack":{"oneLiner":"DNA stores instructions in the order of its bases, and its paired strands make those instructions possible to copy and use.","essentials":"\n> Tick a line only after you can do it with the page closed and without prompts.\n\n## Core\n\n- [ ] Explain why DNA is the genetic material of living organisms without claiming that every virus uses DNA.\n- [ ] Draw a nucleotide as a phosphate, a pentose sugar and a nitrogenous base, with each part in the right place.\n- [ ] Explain how condensation joins nucleotides into an RNA strand and creates a covalent sugar–phosphate backbone.\n- [ ] Name the bases in DNA and RNA, and explain why their order carries information.\n- [ ] Draw two antiparallel DNA strands with A–T and G–C pairs, showing hydrogen bonds between bases rather than along the backbone.\n- [ ] Compare DNA and RNA by sugar, bases and usual number of strands, including the difference at the 2′ carbon of their sugars.\n- [ ] Explain how complementary base pairing lets DNA be copied and information be expressed in RNA.\n- [ ] Explain why the possible sequences of four bases give DNA a high capacity to store information.\n- [ ] Explain how the near-universality of the genetic code supports common ancestry, without claiming that every organism has the same DNA sequence.\n\n## Higher level\n\n- [ ] Label the 5′ and 3′ ends of nucleic acid strands and explain why template strands run antiparallel to newly made strands.\n- [ ] Explain why a purine pairing with a pyrimidine keeps the width of the DNA double helix consistent.\n- [ ] Describe a nucleosome as DNA wound around an eight-histone core, with linker DNA and an associated linker histone.\n- [ ] Explain how the Hershey–Chase radioisotope results identify DNA rather than protein as the genetic material of the bacteriophage.\n- [ ] Interpret Chargaff’s base-composition data, including A≈T and G≈C within species and differing base proportions among species.\n\n## Links to other topics\n\n* **B1.2 Proteins** — a DNA base sequence ultimately specifies a protein's amino acid sequence. This connects a change in a gene to a possible change in protein shape and function.\n* **D1.1 DNA replication** — complementary strands and 5′/3′ directionality explain how copies are made and why the two new strands are synthesized differently.\n* **D1.2 Protein synthesis** — RNA uses complementary pairing to carry a copy of a gene's information; its base sequence is then read during translation.\n* **D1.3 Mutation and gene editing** — a changed base alters the stored sequence. Keeping the base order separate from the sugar–phosphate backbone makes a mutation easier to describe accurately.\n\n## Vocabulary that has to be exact\n\n| Term                       | What it means                                                                                                    | What it’s not                                                 |\n| -------------------------- | ---------------------------------------------------------------------------------------------------------------- | ------------------------------------------------------------- |\n| Nucleotide                 | A phosphate group, a pentose sugar and a nitrogenous base joined as one monomer                                  | A base on its own                                             |\n| Sugar–phosphate backbone   | The covalently linked alternating sugars and phosphates of one strand                                            | The hydrogen bonds between DNA strands                        |\n| Phosphodiester bond        | A covalent link joining the 3′ sugar position of one nucleotide through phosphate to the 5′ position of the next | A bond between complementary bases                            |\n| Complementary base pairing | Specific pairing of A with T in DNA, or A with U in RNA, and G with C                                            | A claim that two whole DNA molecules have identical sequences |\n| Antiparallel               | The two DNA strands run in opposite 5′ to 3′ directions                                                          | Two strands with opposite base identities at every position   |\n| Genetic code               | The correspondence between mRNA codons and amino acids or stop signals                                           | The entire base sequence of one species' genome               |\n| Purine                     | A two-ring base, adenine or guanine                                                                              | A one-ring pyrimidine, cytosine, thymine or uracil            |\n| Nucleosome                 | DNA wrapped around a core of eight histone proteins                                                              | A nucleotide or a complete chromosome                         |\n","videos":"\nWatch **one** explanation, then close it and draw the strands from memory. Watching the same idea twice can make it familiar without making it available when you need to produce it.\n\n## Main\n\n**Mister Lee Science (Alex Lee) — A1.2 Nucleic acids**\n\n* Channel: [https://www.youtube.com/@misterleescience](https://www.youtube.com/@misterleescience)\n* Search: [https://www.youtube.com/results?search_query=Mister+Lee+Science+IB+Biology+A1.2+nucleic+acids](https://www.youtube.com/results?search_query=Mister+Lee+Science+IB+Biology+A1.2+nucleic+acids)\n\n**Watch for:**\n\n* Where are the phosphate, sugar and base on one nucleotide?\n* Which bonds join nucleotides along one strand, and which bonds join the two DNA strands?\n* Why does each DNA strand run in the opposite direction to the other?\n* How does one strand's base order determine the complementary strand's order?\n\n**Pause at:** the first double-stranded DNA diagram. Hide its labels and draw three paired nucleotides. Mark both 5′ and 3′ ends, circle the sugar–phosphate backbones, then add A–T and G–C between them.\n\n## If that didn’t land\n\n**Amoeba Sisters — DNA and RNA**\n\n* Channel: [https://www.youtube.com/@AmoebaSisters](https://www.youtube.com/@AmoebaSisters)\n* Search: [https://www.youtube.com/results?search_query=Amoeba+Sisters+DNA+RNA+structure+base+pairing](https://www.youtube.com/results?search_query=Amoeba+Sisters+DNA+RNA+structure+base+pairing)\n\nTry this if the DNA/RNA comparison hasn't stuck. It gives you a different explanation, but you still need to draw and label the strands afterwards.\n\n**Khan Academy — nucleotides and nucleic acid structure**\n\n* Channel: [https://www.youtube.com/@khanacademy](https://www.youtube.com/@khanacademy)\n* Search: [https://www.youtube.com/results?search_query=Khan+Academy+nucleotides+phosphodiester+bond+DNA+RNA](https://www.youtube.com/results?search_query=Khan+Academy+nucleotides+phosphodiester+bond+DNA+RNA)\n\nUse this if you can picture the strands but can't yet explain which atoms form the backbone.\n\n## Worth it once, not for revision\n\nAn **animation** of DNA wrapping around histones earns one extra watch because the nucleosome is spatial. You need to see which part winds around the core and which DNA connects neighboring nucleosomes.\n\n* Search: [https://www.youtube.com/results?search_query=DNA+nucleosome+histone+octamer+linker+DNA+animation](https://www.youtube.com/results?search_query=DNA+nucleosome+histone+octamer+linker+DNA+animation)\n\nAfterward, sketch one eight-histone core with DNA around it and linker DNA leaving on both sides. Don't use the animation as a replacement for that sketch.\n\n## Pinned\n","traps":"\n## Calling a base a nucleotide\n\n**Commonly written:** “Adenine is a nucleotide in DNA.”\n\n**Why it doesn’t score:** Adenine is one nitrogenous base. A nucleotide also needs a pentose sugar and a phosphate group.\n\n**Scores instead:** “An adenine nucleotide contains the base adenine attached to a pentose sugar and a phosphate group.”\n\n## Putting hydrogen bonds in the backbone\n\n**Commonly written:** “Hydrogen bonds join the sugars and phosphates along a DNA strand.”\n\n**Why it doesn’t score:** Sugar and phosphate are covalently linked within one strand. Hydrogen bonds join complementary bases across two strands.\n\n**Scores instead:** “Covalent phosphodiester bonds form each sugar–phosphate backbone, while hydrogen bonds join complementary bases between strands.”\n\n## Drawing both strands in the same direction\n\n**Commonly written:** “Both DNA strands run 5′ to 3′ from left to right.”\n\n**Why it doesn’t score:** The strands are antiparallel. If one runs 5′ to 3′ left to right, its partner runs 3′ to 5′ left to right.\n\n**Scores instead:** “The two DNA strands are antiparallel, so their 5′ to 3′ directions are opposite.”\n\n## Pairing A with U in DNA\n\n**Commonly written:** “Adenine pairs with uracil in the DNA double helix.”\n\n**Why it doesn’t score:** DNA uses thymine opposite adenine. Uracil replaces thymine in RNA, including the RNA copied from a DNA template.\n\n**Scores instead:** “Adenine pairs with thymine in DNA, while adenine pairs with uracil in RNA.”\n\n## Confusing code with base sequence\n\n**Commonly written:** “All organisms have the same DNA sequence because the genetic code is universal.”\n\n**Why it doesn’t score:** Organisms differ in DNA sequence. Near-universality concerns the mapping from mRNA codons to amino acids, not matching genomes.\n\n**Scores instead:** “Nearly all organisms use the same correspondence between mRNA codons and amino acids despite having different DNA sequences.”\n\n## Assuming all four bases have equal percentages\n\n**Commonly written:** “Chargaff proved that A, T, G and C each make up 25% of DNA.”\n\n**Why it doesn’t score:** A is approximately equal to T and G to C within double-stranded DNA, but A+T and G+C proportions can vary across species.\n\n**Scores instead:** “Chargaff found that A≈T and G≈C within species, while the overall base composition varied between species.”\n\n## Swapping the Hershey–Chase isotopes\n\n**Commonly written:** “Sulfur-35 labeled DNA and entered the bacteria.”\n\n**Why it doesn’t score:** Sulfur-35 labeled phage protein, mostly found outside the bacteria. Phosphorus-32 labeled DNA and was found with the bacterial pellet.\n\n**Scores instead:** “Phosphorus-32-labeled DNA was found mainly with the infected bacterial pellet, while sulfur-35-labeled protein remained mainly in the supernatant.”\n\n## Treating the nucleosome as one histone\n\n**Commonly written:** “DNA sits inside a single histone to make a nucleosome.”\n\n**Why it doesn’t score:** DNA wraps around a core of eight histones, with linker DNA between cores and an associated linker histone.\n\n**Scores instead:** “A nucleosome has DNA wrapped around an eight-histone core, with linker DNA connecting it to neighboring nucleosomes.”\n","cards":[{"id":"A1.2-01","q":"What molecule carries hereditary information in living organisms, and how do some viruses differ?","a":"DNA is the genetic material in living organisms. Some viruses use RNA as their genetic material, but viruses aren't classified as living organisms in this syllabus. That exception doesn't change the statement about living organisms.","note":"Don't turn 'all living organisms' into 'every biological entity.'","marks":null},{"id":"A1.2-02","q":"Draw a nucleotide and name its three components, stating what the base attaches to.","a":"A nucleotide contains a phosphate group, a five-carbon pentose sugar and a nitrogenous base. The base attaches to the sugar, and the phosphate attaches to the sugar at a different position. A base alone isn't a nucleotide.","note":"","marks":null},{"id":"A1.2-03","q":"Explain how RNA nucleotides join into a polymer, including the bond and the molecule released.","a":"The 3′ hydroxyl of one nucleotide's ribose joins to the phosphate attached to the next nucleotide's 5′ carbon in a condensation reaction that releases water. The resulting covalent phosphodiester links create an alternating sugar–phosphate backbone with bases projecting from it.","note":"The backbone is covalent. Hydrogen bonds aren't the links along one RNA strand.","marks":null},{"id":"A1.2-04","q":"Name all bases in DNA and RNA, then explain where the stored information lies.","a":"DNA contains adenine, thymine, guanine and cytosine. RNA contains adenine, uracil, guanine and cytosine. The order of bases along a strand carries information; the repeating sugar–phosphate backbone doesn't encode the changing sequence.","note":"","marks":null},{"id":"A1.2-05","q":"Describe how the two strands of DNA are arranged and held together, including both base-pair rules.","a":"DNA has two antiparallel nucleotide strands in a double helix. Covalent phosphodiester bonds hold each sugar–phosphate backbone together. Hydrogen bonds join complementary bases between strands: adenine pairs with thymine, and guanine pairs with cytosine.","note":"You can draw the paired strands as a ladder; the helical twist isn't required for this diagram.","marks":null},{"id":"A1.2-06","q":"Compare DNA and RNA by sugar, bases and usual number of strands. What differs on the sugars?","a":"DNA usually has two strands and contains deoxyribose and the bases A, T, G and C. RNA is usually single-stranded and contains ribose and A, U, G and C. Ribose has an OH group at its 2′ carbon, where deoxyribose has H.","note":"RNA can fold back and pair with itself, so 'usually single-stranded' is more accurate than 'never pairs.'","marks":null},{"id":"A1.2-07","q":"Explain how complementary base pairing helps DNA information be copied and expressed.","a":"During DNA replication, each existing strand can act as a template because A pairs with T and G with C, specifying bases on a new strand. During transcription, a DNA template specifies a complementary RNA sequence, with U pairing with A in RNA. Hydrogen bonding provides the base-pair specificity.","note":"","marks":null},{"id":"A1.2-08","q":"Why can a molecule with only four different DNA bases store so much information?","a":"DNA molecules can contain very long sequences, and each position can hold one of four bases. A sequence of n positions therefore has 4^n possible base orders. The base order stores information compactly while the sugar–phosphate backbone remains repetitive.","note":"","marks":null},{"id":"A1.2-09","q":"Explain how the near-universality of the genetic code supports common ancestry. What claim would go too far?","a":"Across almost all living organisms, the same mRNA codons specify the same amino acids, which is evidence that they inherited this translation system from a common ancestor. It doesn't mean their DNA sequences are identical, and there are a few exceptions to the code.","note":"The genetic code maps codons to amino acids. It isn't another name for a genome.","marks":null},{"id":"A1.2-10","q":"Label a nucleic acid strand's 5′ and 3′ ends and explain the direction of a newly synthesized strand.","a":"The 5′ end has a phosphate associated with the sugar's 5′ carbon; the 3′ end has a free hydroxyl on the sugar's 3′ carbon. New nucleotides are added to the 3′ end, so a new DNA or RNA strand is synthesized 5′ to 3′ while its template is read in the opposite direction.","note":"The 5′ and 3′ labels refer to numbered carbons in the sugar, not to a count of bases.","marks":null},{"id":"A1.2-11","q":"Which bases are purines and pyrimidines, and why do their pairings help keep DNA width consistent?","a":"Adenine and guanine are two-ring purines; cytosine and thymine are one-ring pyrimidines. A–T and G–C each pair one purine with one pyrimidine, giving both pairs the same approximate width. A purine–purine pair would be too wide and a pyrimidine–pyrimidine pair too narrow for the usual DNA helix.","note":"","marks":null},{"id":"A1.2-12","q":"Describe one nucleosome, including the core, the DNA and the linker region.","a":"A nucleosome contains DNA wrapped around a core of eight histone proteins. Linker DNA connects neighboring nucleosome cores, and an additional linker histone associates with DNA near the entry and exit and helps stabilize the arrangement. It isn't a single histone with DNA inside it.","note":"","marks":null},{"id":"A1.2-13","q":"Trace the labels, separation and results in Hershey and Chase's bacteriophage experiment. What did those results support?","a":"Hershey and Chase labeled phage DNA with radioactive phosphorus-32 in one sample and phage protein with sulfur-35 in another. After infection, blending removed attached phage coats and centrifugation put bacteria in the pellet. Most phosphorus label was in the pellet, while most sulfur label remained in the supernatant. This showed that phage DNA, rather than most of its protein coat, entered the bacteria and supported DNA as the phage's genetic material.","note":"Don't claim that no sulfur entered any cell or that this experiment alone proved DNA is the genetic material of every organism.","marks":null},{"id":"A1.2-14","q":"What patterns did Chargaff find in DNA base proportions, and what earlier claim did the data undermine?","a":"Within a species' double-stranded DNA, the proportion of adenine is approximately equal to thymine and guanine is approximately equal to cytosine. The relative A+T and G+C proportions differ among species. That variation undermined the tetranucleotide hypothesis that DNA was a monotonous repetition of the four bases in equal amounts.","note":"A≈T and G≈C don't imply A≈G or that all four bases have equal percentages.","marks":null},{"id":"A1.2-15","q":"Correct this claim: 'Hydrogen bonds make the DNA sugar–phosphate backbone, while covalent bonds join A to T.'","a":"Covalent phosphodiester bonds join sugars and phosphates along each DNA strand. Hydrogen bonds form between the complementary bases on different strands, including A–T and G–C. Reversing those locations confuses the stable backbone with the pairing that allows strands to separate and template copies.","note":"","marks":null},{"id":"A1.2-16","q":"Rebuild the path from one nucleotide to a copied and expressed DNA sequence, naming the components, bonds, direction and pairing rules.","a":"Each nucleotide has a phosphate, sugar and base. Covalent phosphodiester bonds join nucleotides 5′ to 3′ into a sugar–phosphate backbone with a variable base sequence. Two DNA strands run antiparallel, with hydrogen-bonded A–T and G–C pairs. Complementarity lets either strand specify a new DNA partner during replication, while a DNA template specifies RNA during transcription, using U opposite A.","note":"This is the synthesis card. Draw both strands and an RNA copy before checking.","marks":null}],"exam":[{"question":"## Q1. Outline how RNA nucleotides form a strand with a sugar–phosphate backbone. **[4]**","scheme":"* Each nucleotide contains a phosphate group, ribose sugar and nitrogenous base. **[1]**\n* A condensation reaction joins nucleotides / releases water. **[1]**\n* A covalent phosphodiester bond links the 3′ sugar position of one nucleotide to the phosphate at the 5′ position of the next. **[1]**\n* Alternating sugars and phosphates form the backbone, with bases projecting from the strand. **[1]**\n\n*Examiner note: naming phosphodiester bonds isn't enough for four marks. Place the bond between neighboring nucleotides, then show the continuous backbone and its outward-facing bases.*"},{"question":"## Q2. Compare and contrast DNA and RNA in structure. **[5]**","scheme":"* Both are nucleotide polymers with covalent sugar–phosphate backbones. **[1]**\n* DNA contains deoxyribose, whereas RNA contains ribose / ribose has a 2′ OH where deoxyribose has H. **[1]**\n* DNA contains thymine, whereas RNA contains uracil. **[1]**\n* Both contain adenine, guanine and cytosine. **[1]**\n* DNA is usually double-stranded, whereas RNA is usually single-stranded. **[1]**\n\n*Examiner note: answer in paired comparisons. Saying RNA never forms paired regions overstates the difference, since a single strand can fold back on itself.*"},{"question":"## Q3. Explain how DNA structure allows genetic information to be copied accurately. **[5]**","scheme":"* The order of bases along a strand stores genetic information. **[1]**\n* The two strands are complementary / each can act as a template. **[1]**\n* Adenine pairs with thymine and guanine pairs with cytosine. **[1]**\n* Specific hydrogen bonding between complementary bases selects bases on each new strand. **[1]**\n* The new strand is synthesized 5′ to 3′ while the template is read antiparallel / in the opposite direction. **[1]**\n\n*Examiner note: “DNA unzips and copies itself” skips the information-carrying base order and the pairing rules. State both before describing the new strand.*"},{"question":"## Q4. Explain why purine-to-pyrimidine pairing contributes to the stability of the DNA helix. **[4]**","scheme":"* Adenine and guanine are two-ring purines. **[1]**\n* Thymine and cytosine are one-ring pyrimidines. **[1]**\n* A–T and G–C each pair one purine with one pyrimidine. **[1]**\n* The pairs have similar widths / keep the distance between backbones consistent along the helix. **[1]**\n\n*Examiner note: don't substitute the number of hydrogen bonds for the geometric reason. This question asks why the helix can keep a consistent width across different sequences.*"},{"question":"## Q5. Explain how the results of the Hershey–Chase experiment supported DNA as the genetic material of the bacteriophage. **[5]**","scheme":"* Phage DNA was labeled with phosphorus-32 in one sample and phage protein with sulfur-35 in another. **[1]**\n* Phages infected bacteria, then blending detached coats and centrifugation separated bacteria in the pellet from coats in the supernatant. **[1]**\n* Most phosphorus-32 was found with the bacterial pellet. **[1]**\n* Most sulfur-35 stayed in the supernatant / with the phage coats. **[1]**\n* DNA entered bacteria and directed production of new phages / the result supports DNA rather than protein as the phage's hereditary material. **[1]**\n\n*Examiner note: if you can't place each isotope after centrifugation, the conclusion has no evidence. Keep the label, fraction and inference together.*"},{"question":"## Q6. Suggest what Chargaff's measurements show about DNA, given one species with A 30%, T 30%, G 20% and C 20%, and another with A 20%, T 20%, G 30% and C 30%. **[4]**","scheme":"* In each species A is approximately equal to T. **[1]**\n* In each species G is approximately equal to C. **[1]**\n* Base proportions vary between species / A+T content differs between species. **[1]**\n* The variation refutes a fixed, equal-proportion repeating tetranucleotide pattern / supports capacity for differing base sequences. **[1]**\n\n*Examiner note: four values that sum to 100% don't answer the question. Compare the paired proportions within each species and the composition between species.*"}],"mcq":[{"id":"A1.2-q01","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"Which three parts make one nucleotide?","options":[{"text":"A phosphate group, a pentose sugar and a nitrogenous base","correct":true,"why":"Those are the three parts you need to draw and label. The base is attached to the sugar."},{"text":"A phosphate group, an amino acid and a nitrogenous base","correct":false,"why":"Amino acids build proteins. A nucleotide uses a five-carbon sugar instead."},{"text":"A nitrogenous base, a pentose sugar and a peptide bond","correct":false,"why":"Peptide bonds link amino acids in proteins. A nucleotide has a phosphate group."},{"text":"Two nitrogenous bases linked by a five-carbon sugar","correct":false,"why":"A nucleotide has one base, one sugar and a phosphate. Paired bases belong to two DNA strands."}],"after":null},{"id":"A1.2-q02","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"Which linkage builds the backbone along one DNA strand?","options":[{"text":"Hydrogen bonds between A and T bases on neighboring nucleotides","correct":false,"why":"Hydrogen bonds pair bases between the two DNA strands. They don't join a strand's backbone."},{"text":"Covalent phosphodiester bonds between sugars and phosphate groups","correct":true,"why":"The alternating sugars and phosphates form a covalent chain. That's one strand's backbone."},{"text":"Ionic attractions between charged bases on the same strand","correct":false,"why":"The bases aren't linked along a strand by ionic attractions. The backbone links sugar and phosphate."},{"text":"Peptide bonds between adjacent sugars and nitrogenous bases","correct":false,"why":"Peptide bonds form in proteins. Nucleotide chains use phosphodiester links in the backbone."}],"after":null},{"id":"A1.2-q03","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"A DNA strand reads 5′-ATGC-3′. What is its complementary strand when written left to right?","options":[{"text":"5′-TACG-3′, because matching strands run in the same direction","correct":false,"why":"The base letters match, but the direction labels don't. DNA strands run antiparallel."},{"text":"3′-TACG-5′, with opposite strand directions","correct":true,"why":"T pairs with A, A with T, C with G and G with C. The partner runs 3′ to 5′ left to right."},{"text":"3′-UACG-5′, because uracil pairs with adenine in DNA","correct":false,"why":"Uracil occurs in RNA. In a DNA partner strand, adenine pairs with thymine."},{"text":"5′-ATGC-3′, because each base pairs with an identical base","correct":false,"why":"A pairs with T, and G pairs with C. Complementary doesn't mean identical."}],"after":null},{"id":"A1.2-q04","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"Which structural difference identifies ribose rather than deoxyribose?","options":[{"text":"It has a phosphate group attached directly to its 2′ carbon","correct":false,"why":"The 2′ distinction is an OH group, not a phosphate. Phosphate links the sugar backbone."},{"text":"It has an OH group on its 2′ carbon instead of an H","correct":true,"why":"Ribose keeps a 2′ OH. Deoxyribose lacks that oxygen at the same position."},{"text":"It has five carbon atoms while deoxyribose has six carbon atoms","correct":false,"why":"Both are five-carbon sugars. They differ in the group on carbon 2′."},{"text":"It contains uracil within its sugar ring rather than thymine","correct":false,"why":"Uracil and thymine are bases attached to sugars. They aren't atoms within the sugar ring."}],"after":null},{"id":"A1.2-q05","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"Why can one DNA strand specify the base order of a new partner?","options":[{"text":"The repeating phosphates determine the identity of every new base","correct":false,"why":"Phosphates repeat along the backbone and don't carry a changing base-by-base instruction."},{"text":"Specific A–T and G–C pairing identifies each complementary base","correct":true,"why":"Each template base limits which base can pair across from it. That's the basis of copying."},{"text":"The strand's histone proteins select bases by matching their shape","correct":false,"why":"Histones package DNA into nucleosomes. Complementary bases specify the copied sequence."},{"text":"Both strands already contain identical bases at every position","correct":false,"why":"The two strands are complementary, not usually identical. A faces T, and G faces C."}],"after":null},{"id":"A1.2-q06","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"A DNA segment contains 8 positions. How many different base sequences are possible?","options":[{"text":"32, because each of four bases can occupy eight positions once","correct":false,"why":"A base can appear more than once. Multiplying four by eight misses the independent choices."},{"text":"256, because four base types are paired across two DNA strands","correct":false,"why":"Pairing determines the opposite strand. It doesn't reduce eight positions to four choices total."},{"text":"65,536, because each of eight positions has four choices","correct":true,"why":"That's 4^8. The order of bases, rather than a new backbone for each message, creates the variety."},{"text":"40,320, because every base must occur exactly once in the segment","correct":false,"why":"Bases can repeat. The calculation isn't a permutation of eight distinct items."}],"after":null},{"id":"A1.2-q07","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"What does the near-universality of the genetic code support?","options":[{"text":"The idea that all species have exactly the same DNA sequences","correct":false,"why":"Species differ in DNA sequence. The shared feature is the codon-to-amino-acid correspondence."},{"text":"The idea that RNA has replaced DNA as the genetic material of cells","correct":false,"why":"RNA participates in gene expression, but living cells store hereditary instructions in DNA."},{"text":"The idea that all viruses have DNA and must share a common cell ancestor","correct":false,"why":"Some viruses have RNA genomes. The claim about living organisms doesn't cover every virus."},{"text":"Shared codon assignments inherited from a common ancestor","correct":true,"why":"Nearly the same codons specify the same amino acids across life. A shared origin explains that pattern."}],"after":null},{"id":"A1.2-q08","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"A new RNA chain is being extended during transcription. At which end is the next nucleotide added?","options":[{"text":"The 3′ end, leaving the new strand to grow 5′ to 3′","correct":true,"why":"Nucleotides join to the growing chain's 3′ OH. The template is read in the opposite direction."},{"text":"The 5′ end, leaving the new strand to grow 3′ to 5′","correct":false,"why":"That's backwards for synthesis. RNA polymerase extends the 3′ end of the new strand."},{"text":"Either end, depending on whether adenine or guanine comes next","correct":false,"why":"The base identity doesn't set the growth direction. New nucleotides join at the 3′ end."},{"text":"Both ends at once, because the DNA template has two strands","correct":false,"why":"One RNA strand grows at its 3′ end while a DNA strand acts as the template."}],"after":null},{"id":"A1.2-q09","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"Why do A–T and G–C pairs help keep the DNA helix a consistent width?","options":[{"text":"Each pair contains two purines with the same double-ring structure","correct":false,"why":"A and G are purines, but T and C are pyrimidines. Two purines would make a wider pair."},{"text":"Each pair contains two pyrimidines that fit between the backbones","correct":false,"why":"T and C are pyrimidines, but A and G are purines. Two pyrimidines would make a narrower pair."},{"text":"Each pair contains one purine and one pyrimidine","correct":true,"why":"A–T and G–C occupy similar widths because both pair one purine with one pyrimidine."},{"text":"Each pair has the same number of hydrogen bonds between its bases","correct":false,"why":"A–T and G–C don't have the same number of hydrogen bonds. Their similar width comes from base sizes."}],"after":null},{"id":"A1.2-q10","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"Which description identifies a nucleosome?","options":[{"text":"An RNA strand folded around a single histone protein","correct":false,"why":"Nucleosomes package DNA, not RNA, and use an eight-histone core."},{"text":"A DNA strand wound around a core of eight histones","correct":true,"why":"DNA winds around the histone core. Linker DNA connects the cores along a longer molecule."},{"text":"Two free DNA bases held together by a histone bond","correct":false,"why":"Bases pair through hydrogen bonds. Histones package DNA at a larger scale."},{"text":"An eight-nucleotide sequence enclosed inside one phosphate group","correct":false,"why":"Phosphates belong to nucleotide backbones. A nucleosome contains a protein core and wrapped DNA."}],"after":null},{"id":"A1.2-q11","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"In Hershey and Chase's experiment, where was most phosphorus-32 found after blending and centrifugation?","options":[{"text":"In the supernatant with the sulfur-labeled phage coats","correct":false,"why":"The supernatant held most protein label. Phosphorus labeled DNA and stayed with infected bacteria."},{"text":"In the bacterial pellet, where DNA from the phage had entered","correct":true,"why":"Phosphorus labeled phage DNA, and most of that label went with the infected bacteria into the pellet."},{"text":"Only in newly made viral protein, because phosphorus labels proteins","correct":false,"why":"Sulfur was used to label protein. Phosphorus labeled the DNA in the original phages."},{"text":"Equally in the pellet and supernatant, showing both substances entered","correct":false,"why":"The two labels separated. Most phosphorus was in the pellet, while most sulfur stayed outside."}],"after":null},{"id":"A1.2-q12","topic":"A1.2","kind":"mcq","lead":"","quote":"","prompt":"One species has 30% A and 20%
