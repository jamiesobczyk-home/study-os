ide. Two K+ then bind outside; dephosphorylation returns the protein to its original conformation and releases the K+ inside. One ATP is hydrolysed per cycle, moving three Na+ out and two K+ in against their electrochemical gradients and making the inside relatively more negative.","note":"Three sodium out, two potassium in. The unequal exchange makes the pump electrogenic.","marks":null},{"id":"B2.1-12","q":"Trace the energy pathway that allows a sodium–glucose cotransporter to move glucose into an intestinal epithelial cell against its gradient.","a":"The sodium–potassium pump hydrolyses ATP and moves Na+ out of the epithelial cell, maintaining a low intracellular Na+ concentration. Na+ then enters from the intestinal lumen down its electrochemical gradient through a sodium–glucose cotransporter. The coupled conformational change carries glucose into the cell against its gradient. This is indirect or secondary active transport because ATP is used by the pump, not by the cotransporter itself.","note":"Keep the causal chain intact: ATP powers the pump, the pump establishes the Na+ gradient, and the Na+ gradient powers glucose uptake.","marks":null},{"id":"B2.1-13","q":"Distinguish voltage-gated and ligand-gated ion channels by what opens them, and state what happens after opening.","a":"A voltage-gated channel opens or closes in response to a change in membrane potential. A ligand-gated channel opens or closes when a specific signalling molecule binds. Once open, ions move through the channel down their electrochemical gradient without ATP being hydrolysed by the channel.","note":"","marks":null},{"id":"B2.1-14","q":"Explain why membrane fluidity is required for vesicle fission and fusion, and connect each process to a named example.","a":"Because phospholipids can move within a fluid bilayer, a membrane can bend, separate and reseal during fission, as when an endocytic vesicle forms. A vesicle membrane can also merge and become continuous with another membrane during fusion, as in exocytosis or delivery to an organelle. Both processes preserve a closed hydrophobic barrier around aqueous contents.","note":"","marks":null},{"id":"B2.1-15","q":"Correct this misconception: 'Any membrane transport that uses a protein is active transport.'","a":"Protein use does not make transport active. Facilitated diffusion uses a channel or carrier but remains passive because particles move down their concentration or electrochemical gradient without ATP input. Active transport moves a substance against its gradient using an energy source and a pump or carrier.","note":"In a comparison, write about both gradient direction and energy source.","marks":null},{"id":"B2.1-16","q":"Explain how cell-adhesion proteins allow individual cells to form a tissue.","a":"Cell-adhesion proteins in one cell membrane bind to specific proteins on neighbouring cells or to the extracellular matrix. These attachments hold cells in stable positions and connect them mechanically, allowing cells to remain organized as a tissue rather than separating.","note":"","marks":null}],"exam":[{"question":"## Q1. Explain how phospholipid structure causes a bilayer to form in water. **[4]**","scheme":"- A phospholipid has a hydrophilic/polar phosphate head and hydrophobic/non-polar hydrocarbon tails. **[1]**\n- The heads interact with / face the aqueous solutions. **[1]**\n- The tails are excluded from water / cluster away from water. **[1]**\n- A bilayer forms spontaneously with heads facing out on both sides and tails facing inward. **[1]**\n\n_Examiner note: naming the molecule amphipathic is not the explanation. Full marks require the orientation of both regions and the interaction with water._"},{"question":"## Q2. Compare and contrast facilitated diffusion and active transport across a membrane. **[5]**","scheme":"- Both use specific integral membrane proteins / carriers can be involved in both. **[1]**\n- Facilitated diffusion is passive, whereas active transport requires an energy source. **[1]**\n- Facilitated diffusion moves substances down a concentration/electrochemical gradient, whereas active transport moves them against one. **[1]**\n- Facilitated diffusion may use channels or carriers, whereas direct active transport uses pumps/carriers that undergo conformational change. **[1]**\n- Facilitated diffusion tends to reduce a gradient, whereas active transport can establish or maintain a gradient. **[1]**\n\n_Examiner note: two separate descriptions are not a comparison. Pair each similarity or difference in the same sentence._"},{"question":"## Q3. Explain sodium-dependent glucose uptake from the intestinal lumen into an epithelial cell. **[5]**","scheme":"- The sodium–potassium pump hydrolyses ATP / uses energy to move Na+ out of the epithelial cell. **[1]**\n- This maintains a low Na+ concentration inside the cell / establishes a Na+ electrochemical gradient. **[1]**\n- Na+ moves into the cell down its electrochemical gradient through a sodium–glucose cotransporter. **[1]**\n- Glucose is carried into the cell at the same time against its concentration gradient. **[1]**\n- This is indirect/secondary active transport because ATP is used by the pump rather than by the cotransporter. **[1]**\n\n_Examiner note: “active transport moves glucose in” misses the causal chain. Full marks connect ATP to the pump, the pump to the Na+ gradient and that gradient to glucose uptake._"},{"question":"## Q4. Outline how cholesterol affects the fluidity of an animal cell membrane. **[3]**","scheme":"- Cholesterol is positioned between phospholipids in the bilayer. **[1]**\n- At higher temperatures it restricts phospholipid movement / reduces excessive fluidity. **[1]**\n- At lower temperatures it prevents close phospholipid packing / reduces solidification. **[1]**\n\n_Examiner note: cholesterol does not move fluidity in one fixed direction. One temperature condition gives an incomplete answer._"},{"question":"## Q5. Distinguish voltage-gated channels from ligand-gated channels. **[3]**","scheme":"- Voltage-gated channels respond to a change in membrane potential. **[1]**\n- Ligand-gated channels respond when a specific signalling molecule binds. **[1]**\n- When open, both allow specific ions to move down their electrochemical gradients / neither channel directly hydrolyses ATP for ion movement. **[1]**\n\n_Examiner note: “both open when stimulated” gains no distinction mark. Name the different stimulus for each channel._"},{"question":"## Q6. Explain how membrane properties allow vesicles to form and fuse. **[4]**","scheme":"- Phospholipids move laterally, making the bilayer fluid/flexible. **[1]**\n- The membrane can bend and undergo fission to enclose material in a vesicle / accept: endocytosis as a named example. **[1]**\n- A vesicle membrane can fuse with another membrane / accept: exocytosis or organelle delivery as a named example. **[1]**\n- The bilayers reseal so hydrophobic tails remain away from water / a closed barrier is maintained. **[1]**\n\n_Examiner note: describing a vesicle moving is not enough. The question asks why the membrane can split, merge and reseal without exposing its hydrophobic tails to water._"}]}},{"code":"B2.2","title":"Organelles and compartmentalization","theme":"B","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"75-76","questionsPage":80,"bookTitle":null,"pack":null},{"code":"B2.3","title":"Cell specialization","theme":"B","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"77-79","questionsPage":80,"bookTitle":null,"pack":null},{"code":"B3.1","title":"Gas exchange","theme":"B","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"115-120","questionsPage":133,"bookTitle":null,"pack":null},{"code":"B3.2","title":"Transport","theme":"B","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"121-128","questionsPage":133,"bookTitle":null,"pack":null},{"code":"B3.3","title":"Muscle and motility","theme":"B","level":3,"levelTitle":"Organisms","hlOnly":true,"pages":"129-132","questionsPage":133,"bookTitle":null,"pack":null},{"code":"B4.1","title":"Adaptation to environment","theme":"B","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"190-194","questionsPage":199,"bookTitle":null,"pack":null},{"code":"B4.2","title":"Ecological niches","theme":"B","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"195-198","questionsPage":199,"bookTitle":null,"pack":null},{"code":"C1.1","title":"Enzymes and metabolism","theme":"C","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"19-25","questionsPage":38,"bookTitle":null,"pack":null},{"code":"C1.2","title":"Cell respiration","theme":"C","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"26-31","questionsPage":38,"bookTitle":null,"pack":{"oneLiner":"Respiration is a controlled, stepwise way of getting the energy out of glucose and into ATP — broken into stages not because biology likes complexity, but because releasing it all at once would waste most of it as heat.","essentials":"\n## Core\n\n- [ ] Explain **ATP as the energy currency**: it is the molecule cells actually\n      spend, it releases usable energy when the terminal phosphate is removed,\n      and it can be regenerated from ADP and phosphate.\n- [ ] Give processes ATP supplies: active transport, protein synthesis, muscle\n      contraction, cell division, nerve impulse transmission.\n- [ ] Describe the **ATP–ADP cycle**: energy from respiration converts ADP + Pi\n      to ATP; hydrolysis of ATP back to ADP + Pi releases it where needed.\n- [ ] Define **cell respiration** as the controlled release of energy from\n      organic compounds to produce ATP — not the same thing as breathing.\n- [ ] Compare **aerobic and anaerobic respiration** in humans and in yeast:\n      the products, the ATP yield, and whether oxygen is required.\n- [ ] State the variables affecting **rate of respiration** and how each is\n      measured (temperature, substrate concentration, oxygen availability).\n\n## Higher level\n\n- [ ] Explain the role of **NAD** as a hydrogen carrier, and define oxidation\n      and reduction in terms of hydrogen and electron transfer.\n- [ ] Describe **glycolysis**: in the cytoplasm, glucose to two pyruvate, net\n      gain of 2 ATP, 2 reduced NAD, no oxygen required.\n- [ ] Explain why **pyruvate is converted to lactate** in anaerobic conditions:\n      to regenerate NAD so that glycolysis can continue.\n- [ ] Describe the **link reaction**: pyruvate is decarboxylated and oxidised in\n      the mitochondrial matrix to form acetyl CoA, releasing CO2 and reducing NAD.\n- [ ] Describe the **Krebs cycle**: in the matrix, a series of oxidations and\n      decarboxylations, producing CO2, reduced NAD, reduced FAD, and ATP.\n- [ ] Describe the **electron transport chain**: reduced NAD and FAD deliver\n      electrons to carriers in the inner mitochondrial membrane; energy released\n      pumps protons into the intermembrane space.\n- [ ] Explain **chemiosmosis**: the proton gradient drives protons back through\n      ATP synthase, and that flow phosphorylates ADP to ATP.\n- [ ] Explain the role of **oxygen as the terminal electron acceptor**, and what\n      happens to the whole chain when it is absent.\n- [ ] Compare **lipids and carbohydrates as respiratory substrates**: lipids\n      yield more energy per gram because they are more reduced (more hydrogen\n      per carbon), but carbohydrates are released faster and can be respired\n      anaerobically.\n\n## Links to other topics\n\n- **C1.1 Enzymes** — every step here is enzyme-catalysed; rate questions pull\n  straight from C1.1.\n- **B2.2 Organelles** — the inner membrane's folding into cristae is surface\n  area for the electron transport chain. Structure serving function.\n- **C1.3 Photosynthesis** — chemiosmosis appears again, in a different\n  membrane, running the other way. Learn it properly once and get both.\n- **B3.1 Gas exchange / B3.2 Transport** — why the oxygen has to arrive at all.\n\n## Vocabulary that has to be exact\n\n| Term | What it means | What it is not |\n| --- | --- | --- |\n| Cell respiration | Releasing energy from organic compounds to make ATP | Breathing / gas exchange |\n| Oxidation | Loss of electrons / loss of hydrogen | Reaction with oxygen only |\n| Reduction | Gain of electrons / gain of hydrogen | Removal of something |\n| Decarboxylation | Removal of a carbon as CO2 | Any loss of carbon |\n| Chemiosmosis | ATP synthesis driven by a proton gradient across a membrane | Electron transport itself |\n| Substrate-level phosphorylation | ATP made by direct transfer of a phosphate group | Chemiosmosis |\n","videos":"\n> **Read this before pressing play.** This is the topic where watching feels\n> most like learning and is least like it. The pathway is easy to follow and\n> hard to reproduce, and following is what a video trains. So the rule here is\n> stricter than usual: one video, then the drawing, then the quiz. Do not watch\n> a second video before you have drawn the pathway from memory once.\n\n## Main\n\n**Alex Lee — C1.2 Cell respiration** (likely split across several videos)\n\n- Channel: \u003chttps://www.youtube.com/@misterleescience> — verified\n- Find it: \u003chttps://www.youtube.com/results?search_query=Mister+Lee+Science+C1.2+cell+respiration>\n\nWatch it in **stages, not in one sitting**. Glycolysis one day, link reaction\nand Krebs the next, electron transport chain and chemiosmosis the third. Each\nstage gets its own drawing and its own quiz run. Trying to absorb the whole\npathway in one evening is the single most common way this topic goes wrong.\n\nFor each stage, get these four answers before moving on:\n- **Where** in the cell does it happen?\n- **What goes in?**\n- **What comes out** — including CO2 and reduced NAD, not just ATP?\n- **How much ATP**, and is it substrate-level or chemiosmosis?\n\n## For chemiosmosis specifically\n\n- Find it: \u003chttps://www.youtube.com/results?search_query=chemiosmosis+ATP+synthase+animation+proton+gradient>\n\nWatch an **animation**. Chemiosmosis is a physical, mechanical idea — protons\npushed to one side, flowing back through a turbine. Once you have seen it move,\nthe phrase \"proton gradient drives ATP synthesis\" stops being words and starts\nbeing a picture. This is the highest-value ninety seconds in the topic.\n\n## For the shape of the whole thing\n\n**Crash Course Biology — Respiration**\n\n- Find it: \u003chttps://www.youtube.com/results?search_query=Crash+Course+Biology+cellular+respiration>\n\nFast and not IB-specific, so it is no good for detail. But it is genuinely\nuseful *first*, before Alex Lee, to get the overall shape in your head so the\ndetailed version has somewhere to attach. Ten minutes, once.\n\n## Worth it once, not for revision\n\n- Any good animation of the electron transport chain embedded in the cristae.\n  Seeing how much membrane is folded in there makes the surface-area point\n  (B2.2) obvious rather than memorised.\n\n## Pinned\n\n- Glycolysis:\n- Link + Krebs:\n- ETC + chemiosmosis:\n","traps":"\n## Confusing respiration with breathing\n\n**Commonly written:** \"Respiration is how we take in oxygen.\"\n\n**Why it does not score:** Cell respiration is a chemical process in cells that\nreleases energy from organic compounds to make ATP. Breathing is ventilation.\nExaminers treat this as a definitional error, and it is an easy mark to lose on\na one-mark question.\n\n**Scores instead:** \"Cell respiration is the controlled release of energy from\norganic compounds to produce ATP.\"\n\n## Saying ATP \"stores\" energy long-term\n\n**Commonly written:** \"ATP is where the cell stores its energy.\"\n\n**Why it does not score:** ATP is the short-term, immediately spendable form —\ncurrency, not savings. Cells hold very little of it and regenerate it\nconstantly. Glycogen and lipids are the stores.\n\n**Scores instead:** \"ATP is the immediate source of energy for cellular work,\ncontinually regenerated from ADP and phosphate.\"\n\n## Forgetting that anaerobic respiration still includes glycolysis\n\n**Commonly written:** \"In anaerobic respiration, glucose is converted to\nlactate and no ATP is made.\"\n\n**Why it does not score:** Glycolysis runs in both cases and yields a net 2 ATP.\nAnaerobic respiration is not \"no ATP\", it is \"much less ATP\".\n\n**Scores instead:** \"Glycolysis still occurs, giving a net yield of 2 ATP; the\npyruvate is then converted to lactate.\"\n\n## Not knowing *why* pyruvate becomes lactate\n\n**Commonly written:** \"Pyruvate turns into lactate because there is no oxygen.\"\n\n**Why it does not score:** That is the condition, not the reason. The reason is\nthat the conversion oxidises reduced NAD back to NAD, and glycolysis cannot\ncontinue without a supply of NAD. This is a favourite examiner question\nprecisely because it separates memorising from understanding.\n\n**Scores instead:** \"Converting pyruvate to lactate regenerates NAD from reduced\nNAD, allowing glycolysis — and therefore ATP production — to continue.\"\n\n## Saying oxygen is \"used to make ATP\"\n\n**Commonly written:** \"Oxygen is needed to produce the ATP.\"\n\n**Why it does not score:** It is too vague to credit, and it hides the actual\nmechanism. Oxygen's job is specific: it is the final electron acceptor at the\nend of the electron transport chain, combining with electrons and protons to\nform water. Without it the chain backs up, no proton gradient is maintained,\nand chemiosmosis stops.\n\n**Scores instead:** \"Oxygen acts as the terminal electron acceptor, combining\nwith electrons and hydrogen ions to form water; this keeps the electron\ntransport chain running so the proton gradient is maintained.\"\n\n## Muddling chemiosmosis with the electron transport chain\n\n**Commonly written:** Using the two terms as though they are the same step.\n\n**Why it does not score:** They are two linked things. The electron transport\nchain moves electrons between carriers and uses the energy released to pump\nprotons into the intermembrane space. Chemiosmosis is protons flowing back\nthrough ATP synthase, and that flow making ATP.\n\n**Scores instead:** Keep them separate and state the link: the chain builds the\ngradient, chemiosmosis spends it.\n\n## Getting the locations wrong\n\n**Commonly written:** Glycolysis placed in the mitochondrion.\n\n**Why it does not score:** Glycolysis is in the **cytoplasm**. The link reaction\nand Krebs cycle are in the **matrix**. The electron transport chain and ATP\nsynthase are in the **inner mitochondrial membrane**. Location marks are free\nmarks, and they are lost constantly.\n\n**Scores instead:** Learn the four locations as a set — it is four facts and\nthey appear in almost every question on this topic.\n\n## Saying lipids release more energy \"because they are bigger\"\n\n**Commonly written:** \"Lipids give more energy per gram because the molecules\nare larger.\"\n\n**Why it does not score:** Size is not the mechanism. Lipids are more **reduced**\n— they carry more hydrogen per carbon — so they yield more reduced NAD and FAD,\nand therefore more ATP through chemiosmosis.\n\n**Scores instead:** \"Lipids are more reduced than carbohydrates, with more\nhydrogen per carbon atom, so their oxidation produces more reduced NAD and FAD\nand therefore more ATP per gram.\"\n","cards":[{"id":"C1.2-01","q":"Define cell respiration in the words a mark scheme would accept.","a":"Cell respiration is the controlled release of energy from organic compounds in cells to produce ATP.","note":"Three elements: controlled, from organic compounds, to produce ATP. It is not breathing.","marks":null},{"id":"C1.2-02","q":"Why is ATP described as the energy currency of the cell rather than an energy store?","a":"ATP is the form of energy cells actually spend on work, and it is used almost immediately after it is made. Cells hold only a small quantity and regenerate it continuously from ADP and inorganic phosphate. Long-term energy storage is in glycogen and lipids; ATP is the spendable form in between.","note":"","marks":null},{"id":"C1.2-03","q":"Name four processes in a cell that require ATP.","a":"Active transport across membranes, protein synthesis, muscle contraction, cell division. Also acceptable: transmission of nerve impulses, DNA replication, and movement of cilia or flagella.","note":"","marks":null},{"id":"C1.2-04","q":"Compare aerobic and anaerobic respiration in humans: oxygen, products, and ATP yield.","a":"Aerobic respiration requires oxygen, fully oxidises glucose to carbon dioxide and water, and yields a large amount of ATP per glucose. Anaerobic respiration occurs without oxygen, converts glucose to lactate, and yields only the net 2 ATP from glycolysis. Anaerobic respiration is faster to start and useful for short bursts of intense activity, but cannot be sustained.","note":"","marks":null},{"id":"C1.2-05","q":"How does anaerobic respiration in yeast differ from that in humans?","a":"In yeast, pyruvate is converted to ethanol and carbon dioxide; in humans it is converted to lactate. Both regenerate NAD so glycolysis can continue, and both yield only the 2 ATP from glycolysis. The yeast pathway is the basis of brewing and of the rise in bread dough.","note":"","marks":null},{"id":"C1.2-06","q":"What is the role of NAD in respiration? Define oxidation and reduction as you answer.","a":"NAD is a hydrogen carrier. It accepts hydrogen atoms (and so electrons) released when substrates are oxidised, becoming reduced NAD, and carries them to the electron transport chain where it is re-oxidised. Oxidation is the loss of electrons or hydrogen; reduction is the gain of electrons or hydrogen.","note":"HL. NAD being regenerated is the thread that ties glycolysis, fermentation and the ETC together.","marks":null},{"id":"C1.2-07","q":"Glycolysis: where, what in, what out, how much ATP, oxygen needed?","a":"In the cytoplasm. Glucose (6 carbons) in; two pyruvate (3 carbons each) out. Net gain of 2 ATP by substrate-level phosphorylation, and 2 reduced NAD. No oxygen is required, which is why glycolysis runs in both aerobic and anaerobic conditions.","note":"Two ATP are invested first and four produced, hence a net of two. The word 'net' is often the mark.","marks":null},{"id":"C1.2-08","q":"In anaerobic conditions, why is pyruvate converted to lactate? Give the reason, not the condition.","a":"To regenerate NAD. Converting pyruvate to lactate oxidises reduced NAD back to NAD, and glycolysis requires a supply of NAD to continue. Without that regeneration, glycolysis would stop and even the small anaerobic ATP yield would cease.","note":"'Because there is no oxygen' describes when it happens, not why it helps. This distinction is examined often.","marks":null},{"id":"C1.2-09","q":"The link reaction: where, what happens, what comes out?","a":"In the mitochondrial matrix. Each pyruvate is decarboxylated, releasing one carbon dioxide, and oxidised, reducing one NAD. The remaining two-carbon acetyl group binds to coenzyme A to form acetyl CoA, which enters the Krebs cycle. No ATP is produced directly.","note":"","marks":null},{"id":"C1.2-10","q":"The Krebs cycle: where, and what are its products per turn?","a":"In the mitochondrial matrix. Per turn: two carbon dioxide released by decarboxylation, three reduced NAD and one reduced FAD from the oxidations, and one ATP by substrate-level phosphorylation. Acetyl CoA combines with a four-carbon compound to form a six-carbon compound, which is then progressively oxidised and decarboxylated to regenerate the four-carbon acceptor.","note":"Two turns per glucose, because glycolysis produced two pyruvate.","marks":null},{"id":"C1.2-11","q":"Describe the electron transport chain, including where it is and what it achieves.","a":"It is a series of electron carriers in the inner mitochondrial membrane. Reduced NAD and reduced FAD deliver electrons to the chain and are re-oxidised. As electrons pass from carrier to carrier they release energy, which is used to pump protons from the matrix into the intermembrane space, creating a proton concentration gradient across the inner membrane.","note":"","marks":null},{"id":"C1.2-12","q":"Explain chemiosmosis.","a":"Protons accumulated in the intermembrane space diffuse back into the matrix down their concentration gradient, and can only do so through ATP synthase. The flow of protons through ATP synthase drives the enzyme, which phosphorylates ADP to produce ATP. So the gradient built by the electron transport chain is what is actually spent to make most of the cell's ATP.","note":"The chain builds the gradient; chemiosmosis spends it. Keep the two steps separate in your answer.","marks":null},{"id":"C1.2-13","q":"What is the role of oxygen in aerobic respiration, and what happens without it?","a":"Oxygen is the terminal electron acceptor at the end of the electron transport chain, combining with electrons and hydrogen ions to form water. This removes electrons from the chain so it can keep running. Without oxygen the chain backs up, carriers stay reduced, the proton gradient is not maintained, chemiosmosis stops, and NAD is no longer regenerated — so the Krebs cycle and link reaction halt, leaving only glycolysis.","note":"","marks":null},{"id":"C1.2-14","q":"Where does each of the four stages of aerobic respiration take place?","a":"Glycolysis: cytoplasm. Link reaction: mitochondrial matrix. Krebs cycle: mitochondrial matrix. Electron transport chain and ATP synthase: inner mitochondrial membrane, folded into cristae.","note":"Free marks, lost constantly. Learn the four as a set.","marks":null},{"id":"C1.2-15","q":"Why do lipids yield more energy per gram than carbohydrates?","a":"Lipids are more reduced than carbohydrates — they contain more hydrogen per carbon atom. Oxidising them therefore releases more hydrogen to NAD and FAD, producing more reduced carriers, which deliver more electrons to the electron transport chain and so generate more ATP by chemiosmosis per gram of substrate.","note":"The mechanism is 'more reduced / more hydrogen per carbon', not 'bigger molecules'.","marks":null},{"id":"C1.2-16","q":"Give one advantage carbohydrates have over lipids as a respiratory substrate.","a":"Carbohydrates can be respired anaerobically, since glycolysis does not require oxygen, whereas lipid respiration requires the aerobic pathway. Carbohydrates are also mobilised and oxidised more rapidly, so they suit short bursts of high demand.","note":"","marks":null},{"id":"C1.2-17","q":"Name three variables that affect the rate of cell respiration.","a":"Temperature (affecting enzyme activity, with a rate that falls off after the optimum as enzymes denature), substrate or glucose concentration, and oxygen availability. Rate can be measured with a respirometer, by oxygen consumption or carbon dioxide production.","note":"","marks":null}],"exam":[{"question":"## Q1. Outline the role of NAD in aerobic cell respiration. **[3]**","scheme":"- NAD acts as a hydrogen (and electron) carrier. **[1]**\n- It is reduced when it accepts hydrogen released during the oxidation of\n  substrates in glycolysis, the link reaction and the Krebs cycle. **[1]**\n- Reduced NAD carries these to the electron transport chain, where it is\n  oxidised back to NAD and the electrons are passed to the carriers. **[1]**\n- Accept: NAD is thereby regenerated for reuse. **[1 max within total]**\n\n_Examiner note: the cycle is the point — reduced somewhere, re-oxidised\nsomewhere else. An answer that only says \"NAD carries hydrogen\" gets one mark._"},{"question":"## Q2. Explain why the conversion of pyruvate to lactate allows anaerobic respiration to continue. **[3]**","scheme":"- The conversion oxidises reduced NAD back to NAD. **[1]**\n- Glycolysis requires a supply of NAD to oxidise its substrate / cannot proceed\n  without NAD. **[1]**\n- Regenerating NAD therefore allows glycolysis, and so the net production of\n  2 ATP, to continue in the absence of oxygen. **[1]**\n\n_Examiner note: \"because there is no oxygen\" states the condition and scores\nnothing. The question is why this particular conversion helps._"},{"question":"## Q3. Explain how ATP is synthesised by chemiosmosis in a mitochondrion. **[5]**","scheme":"- Electrons from reduced NAD (and reduced FAD) pass along the electron\n  transport chain in the inner mitochondrial membrane. **[1]**\n- Energy released as electrons pass between carriers is used to pump protons\n  (H+) from the matrix into the intermembrane space. **[1]**\n- This establishes a proton concentration gradient / higher H+ concentration in\n  the intermembrane space. **[1]**\n- Protons diffuse back into the matrix down this gradient through ATP\n  synthase. **[1]**\n- The flow of protons through ATP synthase drives the phosphorylation of ADP to\n  ATP. **[1]**\n- Oxygen acts as the terminal electron acceptor, forming water, allowing the\n  chain to continue. **[1 max within total]**\n\n_Examiner note: this is a sequence question. Marks are awarded for the steps in\na workable order — an answer containing all the right nouns in no particular\norder will not score five._"},{"question":"## Q4. Compare and contrast lipids and carbohydrates as respiratory substrates. **[4]**","scheme":"Comparative statements only. Maximum [4]:\n\n- Both can be oxidised in aerobic cell respiration to produce ATP. **[1]**\n- Lipids release more energy per gram than carbohydrates. **[1]**\n- Because lipids are more reduced / contain more hydrogen per carbon atom, so\n  more reduced NAD and FAD are produced. **[1]**\n- Carbohydrates can be respired anaerobically whereas lipids cannot. **[1]**\n- Carbohydrates are mobilised / respired more rapidly than lipids. **[1]**\n\n_Examiner note: the \"more reduced\" mark is the one that separates grades here.\n\"Lipids have more energy\" restates the first point without explaining it._"},{"question":"## Q5. State the precise location of each stage of aerobic cell respiration in a eukaryotic cell. **[4]**","scheme":"- Glycolysis: cytoplasm. **[1]**\n- Link reaction: mitochondrial matrix. **[1]**\n- Krebs cycle: mitochondrial matrix. **[1]**\n- Electron transport chain and ATP synthase: inner mitochondrial membrane\n  (cristae). **[1]**\n\n_Examiner note: \"mitochondrion\" alone is not precise enough for the last three.\nThe question said precise, and matrix versus inner membrane is the distinction\nbeing tested._"},{"question":"## Q6. Distinguish between cell respiration and gas exchange. **[2]**","scheme":"- Cell respiration is a chemical process within cells that releases energy from\n  organic compounds to produce ATP, whereas gas exchange is the movement of\n  oxygen and carbon dioxide between an organism and its environment. **[1]**\n- Cell respiration occurs in all living cells continuously, whereas gas exchange\n  occurs at a specialised surface. **[1]**\n\n_Examiner note: a free two marks if you have kept the words separate all year,\nand a guaranteed zero if you have not._"}]}},{"code":"C1.3","title":"Photosynthesis","theme":"C","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"32-37","questionsPage":38,"bookTitle":null,"pack":null},{"code":"C2.1","title":"Chemical signalling","theme":"C","level":2,"levelTitle":"Cells","hlOnly":true,"pages":"81-85","questionsPage":93,"bookTitle":null,"pack":null},{"code":"C2.2","title":"Neural signalling","theme":"C","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"86-92","questionsPage":93,"bookTitle":null,"pack":null},{"code":"C3.1","title":"Integration of body systems","theme":"C","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"134-143","questionsPage":150,"bookTitle":null,"pack":null},{"code":"C3.2","title":"Defence against disease","theme":"C","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"144-149","questionsPage":150,"bookTitle":null,"pack":null},{"code":"C4.1","title":"Populations and communities","theme":"C","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"200-207","questionsPage":214,"bookTitle":null,"pack":null},{"code":"C4.2","title":"Transfers of energy and matter","theme":"C","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"208-213","questionsPage":214,"bookTitle":null,"pack":null},{"code":"D1.1","title":"DNA replication","theme":"D","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"39-42","questionsPage":55,"bookTitle":null,"pack":null},{"code":"D1.2","title":"Protein synthesis","theme":"D","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"43-49","questionsPage":55,"bookTitle":null,"pack":null},{"code":"D1.3","title":"Mutation and gene editing","theme":"D","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"50-54","questionsPage":55,"bookTitle":null,"pack":null},{"code":"D2.1","title":"Cell and nuclear division","theme":"D","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"94-98","questionsPage":104,"bookTitle":null,"pack":null},{"code":"D2.2","title":"Gene expression","theme":"D","level":2,"levelTitle":"Cells","hlOnly":true,"pages":"99-100","questionsPage":104,"bookTitle":null,"pack":null},{"code":"D2.3","title":"Water potential","theme":"D","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"101-103","questionsPage":104,"bookTitle":null,"pack":null},{"code":"D3.1","title":"Reproduction","theme":"D","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"151-160","questionsPage":178,"bookTitle":null,"pack":null},{"code":"D3.2","title":"Inheritance","theme":"D","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"161-171","questionsPage":178,"bookTitle":null,"pack":null},{"code":"D3.3","title":"Homeostasis","theme":"D","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"172-177","questionsPage":178,"bookTitle":null,"pack":null},{"code":"D4.1","title":"Natural selection","theme":"D","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"215-219","questionsPage":233,"bookTitle":null,"pack":null},{"code":"D4.2","title":"Stability and change","theme":"D","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"220-226","questionsPage":233,"bookTitle":"Sustainability and changes","pack":null},{"code":"D4.3","title":"Climate change","theme":"D","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"227-232","questionsPage":233,"bookTitle":null,"pack":null}],"builtAt":"2026-09-22"};</script>
<script>
/* study-os web app. No dependencies, no network, no install.
   Runs from a URL or straight off the filesystem. Progress is per-browser. */
(function () {
  'use strict';

  var DATA = window.__STUDY_DATA__;
  var KEY = 'study-os:' + DATA.course.id + ':v1';
  var BOX_DAYS = { 1: 1, 2: 3, 3: 7, 4: 16, 5: 35 };
  var MAX_BOX = 5;

  // ---------------------------------------------------------------- storage

  function today() { return new Date().toISOString().slice(0, 10); }
  function addDays(iso, n) {
    var d = new Date(iso + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function emptyState() { return { version: 1, cards: {}, sessions: [] }; }

  var state = (function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return emptyState();
      var s = JSON.parse(raw);
      return { version: 1, cards: s.cards || {}, sessions: s.sessions || [] };
    } catch (e) {
      // Private mode, blocked storage, or corrupt data must never block study.
      return emptyState();
    }
  })();

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('Could not save progress in this browser'); }
  }

  function cardState(id) {
    return state.cards[id] || { box: 0, due: null, reps: 0, lapses: 0 };
  }
  function isDue(id, day) {
    var c = cardState(id);
    return c.box === 0 || !c.due || c.due <= (day || today());
  }
  function grade(id, result) {
    var prev = cardState(id), box;
    if (result === 'got') box = Math.min(MAX_BOX, Math.max(1, prev.box + 1));
    else if (result === 'shaky') box = Math.max(1, prev.box);
    else box = 1;
    var day = today();
    state.cards[id] = {
      box: box, due: addDays(day, BOX_DAYS[box]),
      reps: prev.reps + 1, lapses: prev.lapses + (result === 'missed' ? 1 : 0),
      lastSeen: day
    };
    save();
    return BOX_DAYS[box];
  }

  // ------------------------------------------------------------ markdown

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function inline(s) {
    // Links are extracted before the emphasis passes run. URLs legitimately
    // contain underscores (search_query=) and asterisks, and letting the
    // italic rule loose on them corrupts the href — which shipped, and broke
    // every video link in every pack.
    var slots = [];
    var stash = function (html) { return '\u0000' + (slots.push(html) - 1) + '\u0000'; };

    var out = esc(s)
      .replace(/`([^`]+)`/g, function (m, c) { return stash('<code>' + c + '</code>'); })
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, text, url) {
        return stash('<a href="' + url + '" target="_blank" rel="noopener">' + text + '</a>');
      })
      .replace(/(^|[\s(])&lt;(https?:\/\/\S+?)&gt;/g, function (m, pre, url) {
        return pre + stash('<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>');
      })
      .replace(/(^|[^*])\*\*([^*]+)\*\*/g, '$1<strong>$2</strong>')
      .replace(/(^|[^*_])_([^_]+)_/g, '$1<em>$2</em>');

    return out.replace(/\u0000(\d+)\u0000/g, function (m, i) { return slots[Number(i)]; });
  }

  /* Renders the markdown subset the packs are written in: headings, lists,
     checkbox lists, tables, blockquotes, rules, paragraphs. */
  function md(src) {
    if (!src) return '';
    var lines = String(src).replace(/\r/g, '').split('\n');
    var out = [], i = 0;

    function flushList(tag, items) {
      out.push('<' + tag + '>' + items.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</' + tag + '>');
    }

    /* Rebuild indentation as real nesting, so sub-points stay sub-points. */
    function nestList(items, start) {
      var base = items[start].indent, html = '<ul>', k = start;
      while (k < items.length) {
        if (items[k].indent < base) break;
        if (items[k].indent > base) {
          var sub = nestList(items, k);
          html = html.replace(/<\/li>$/, '') + sub.html + '</li>';
          k = sub.next;
          continue;
        }
        html += '<li>' + items[k].html + '</li>';
        k++;
      }
      return { html: html + '</ul>', next: k };
    }

    while (i < lines.length) {
      var line = lines[i];

      if (!line.trim()) { i++; continue; }

      if (/^\s*(---|\*\*\*)\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

      if (/^\s*```/.test(line)) {
        var fence = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { fence.push(lines[i]); i++; }
        i++; // closing fence
        out.push('<pre>' + esc(fence.join('\n')) + '</pre>');
        continue;
      }

      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        var lvl = Math.min(h[1].length + 1, 6);
        out.push('<h' + lvl + '>' + inline(h[2]) + '</h' + lvl + '>');
        i++; continue;
      }

      if (/^>\s?/.test(line)) {
        var quote = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { quote.push(lines[i].replace(/^>\s?/, '')); i++; }
        out.push('<blockquote>' + md(quote.join('\n')) + '</blockquote>');
        continue;
      }

      if (/^\|/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
        var cells = function (r) {
          return r.replace(/^\||\|$/g, '').split('|').map(function (c) { return inline(c.trim()); });
        };
        var head = cells(lines[i]); i += 2;
        var body = [];
        while (i < lines.length && /^\|/.test(lines[i])) { body.push(cells(lines[i])); i++; }
        out.push('<table><thead><tr>' + head.map(function (c) { return '<th>' + c + '</th>'; }).join('') +
          '</tr></thead><tbody>' + body.map(function (r) {
            return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table>');
        continue;
      }

      if (/^\s*[-*]\s+/.test(line)) {
        var items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          var indent = lines[i].match(/^\s*/)[0].replace(/\t/g, '  ').length;
          var t = lines[i].replace(/^\s*[-*]\s+/, '');
          // Escape first, then prepend the checkbox glyph — the other way
          // round escapes our own markup and shows it as text.
          var box = '';
          if (/^\[ \]\s*/.test(t)) { box = '<span class="box">&#9633;</span> '; t = t.replace(/^\[ \]\s*/, ''); }
          else if (/^\[x\]\s*/i.test(t)) { box = '<span class="box done">&#9745;</span> '; t = t.replace(/^\[x\]\s*/i, ''); }
          items.push({ indent: indent, html: box + inline(t) });
          i++;
        }
        out.push(nestList(items, 0).html);
        continue;
      }

      if (/^\s*\d+\.\s+/.test(line)) {
        var ol = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          ol.push(inline(lines[i].replace(/^\s*\d+\.\s+/, ''))); i++;
        }
        flushList('ol', ol); continue;
      }

      if (/^ {4}\S/.test(line)) {
        var pre = [];
        while (i < lines.length && (/^ {4}/.test(lines[i]) || !lines[i].trim())) {
          if (!lines[i].trim() && !(i + 1 < lines.length && /^ {4}/.test(lines[i + 1]))) break;
          pre.push(lines[i].replace(/^ {4}/, '')); i++;
        }
        out.push('<pre>' + esc(pre.join('\n')) + '</pre>'); continue;
      }

      var para = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|>|\||\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      if (para.length) out.push('<p>' + inline(para.join(' ')) + '</p>');
      else i++;
    }
    return out.join('\n');
  }

  // ------------------------------------------------------------- helpers

  var topics = DATA.topics;
  var byCode = {};
  topics.forEach(function (t) { byCode[t.code] = t; });
  var packed = topics.filter(function (t) { return t.pack; });

  function allCards() {
    var out = [];
    packed.forEach(function (t) {
      t.pack.cards.forEach(function (c) { out.push({ card: c, topic: t }); });
    });
    return out;
  }
  function dueCards(topic) {
    var day = today();
    var pool = topic
      ? topic.pack.cards.map(function (c) { return { card: c, topic: topic }; })
      : allCards();
    return pool.filter(function (x) { return isDue(x.card.id, day); });
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function topicStats(t) {
    var total = t.pack.cards.length, seen = 0, due = 0, boxSum = 0, day = today();
    t.pack.cards.forEach(function (c) {
      var s = cardState(c.id);
      if (s.box > 0) { seen++; boxSum += s.box; }
      if (isDue(c.id, day)) due++;
    });
    return { total: total, seen: seen, due: due, strength: seen ? boxSum / seen / MAX_BOX : 0 };
  }

  var el = document.getElementById('view');
  function html(s) { el.innerHTML = s; window.scrollTo(0, 0); }
  function on(sel, ev, fn) {
    Array.prototype.forEach.call(el.querySelectorAll(sel), function (n) { n.addEventListener(ev, fn); });
  }
  var toastEl = document.getElementById('toast');
  var toastTimer;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  // --------------------------------------------------------------- views

  var views = {};

  views.home = function () {
    var due = dueCards(null);
    var byTopic = {};
    due.forEach(function (x) {
      byTopic[x.topic.code] = (byTopic[x.topic.code] || 0) + 1;
    });
    var codes = Object.keys(byTopic);
    var totalCards = allCards().length;
    var seen = allCards().filter(function (x) { return cardState(x.card.id).box > 0; }).length;

    if (!packed.length) {
      return html('<div class="empty"><h1>No topics yet</h1><p>No study packs have been added to this build.</p></div>');
    }

    var focus = codes.length ? byCode[codes[0]] : packed[0];
    html(
      '<h1>' + esc(DATA.course.title) + '</h1>' +
      '<p class="sub">' + (due.length
        ? '<strong>' + due.length + ' card' + (due.length === 1 ? '' : 's') + '</strong> due across ' + codes.length + ' topic' + (codes.length === 1 ? '' : 's') + '.'
        : 'Nothing due right now. Good time to start a new topic.') + '</p>' +

      (due.length ? '<button class="btn wide" data-go="quiz">Start review &rarr;</button>' : '') +

      '<div class="stat" style="margin-top:22px">' +
        '<div><b>' + seen + '/' + totalCards + '</b><span>cards attempted</span></div>' +
        '<div><b>' + due.length + '</b><span>due now</span></div>' +
        '<div><b>' + packed.length + '</b><span>topics ready</span></div>' +
      '</div>' +

      (codes.length ? '<h2>Due</h2><ul class="clean">' + codes.map(function (c) {
        var t = byCode[c];
        return '<li><button class="topic-row" data-topic="' + c + '">' +
          '<span class="code">' + c + '</span><span class="t">' + esc(t.title) + '</span>' +
          '<span class="pill due">' + byTopic[c] + '</span></button></li>';
      }).join('') + '</ul>' : '') +

      '<h2>A session looks like this</h2>' +
      '<div class="card"><ol class="steps">' +
        '<li><b>Watch</b><small>One video, holding the questions from the pack. 15 min.</small></li>' +
        '<li><b>Capture</b><small>Close the video. Write what you remember. Then check the book. 5 min.</small></li>' +
        '<li><b>Recall</b><small>Quiz yourself out loud, and grade honestly. 10 min.</small></li>' +
        '<li><b>Check</b><small>One exam question, marked strictly. 10 min.</small></li>' +
      '</ol>' +

      '</div>' +

    );
  };

  views.why = function () {

      '<h1>Why this works</h1>' +

      '<button class="btn ghost" data-go="home">Back</button>'
    );
  };

  views.browse = function () {
    var groups = {};
    topics.forEach(function (t) {
      (groups[t.theme] = groups[t.theme] || []).push(t);
    });
    html('<h1>All topics</h1><p class="sub">' + packed.length + ' of ' + topics.length + ' have study packs.</p>' +
      Object.keys(groups).sort().map(function (th) {
        return '<h2>Theme ' + th + ' &middot; <span style="font-weight:400;color:var(--muted)">' + esc(DATA.themes[th]) + '</span></h2><ul class="clean">' +
          groups[th].map(function (t) {
            var s = t.pack ? topicStats(t) : null;
            return '<li>' + (t.pack

                '<span class="bar-track"><span class="bar-fill" style="width:' + Math.round(s.strength * 100) + '%"></span></span></button>'
              : '<span class="topic-row" style="opacity:.45"><span class="code">' + t.code + '</span>' +

  views.progress = function () {
    if (!packed.length) return html('<div class="empty"><p>Nothing to show yet.</p></div>');
    var totals = packed.map(topicStats);
    var cards = totals.reduce(function (n, s) { return n + s.total; }, 0);
    var seen = totals.reduce(function (n, s) { return n + s.seen; }, 0);
    var due = totals.reduce(function (n, s) { return n + s.due; }, 0);
    var sessions = state.sessions.length;

    html('<h1>Progress</h1>' +
      '<p class="sub">Bars show how well you can <em>recall</em> a topic, not how much you have read.</p>' +
      '<div class="stat">' +
        '<div><b>' + seen + '/' + cards + '</b><span>cards attempted</span></div>' +
        '<div><b>' + due + '</b><span>due now</span></div>' +
        '<div><b>' + sessions + '</b><span>sessions done</span></div>' +
      '</div>' +
      '<ul class="clean">' + packed.map(function (t) {
        var s = topicStats(t);
        return '<li><button class="topic-row" data-topic="' + t.code + '">' +
          '<span class="code">' + t.code + '</span><span class="t">' + esc(t.title) + '</span>' +
          '<span style="font-size:12px;color:var(--muted);min-width:3.4em;text-align:right">' + s.seen + '/' + s.total + '</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:' + Math.round(s.strength * 100) + '%"></span></span></button></li>';
      }).join('') + '</ul>' +
      '<h2>Moving between devices</h2>' +
      '<div class="card"><p>Progress is saved in <strong>this browser only</strong>. If you study on a school laptop and at home, carry it across with these.</p>' +
      '<div class="row"><button class="btn ghost sm" id="exp">Copy my progress</button>' +
      '<button class="btn ghost sm" id="imp">Paste progress in</button>' +
      '<button class="btn ghost sm" id="dl">Download backup</button></div></div>'
    );

    document.getElementById('exp').onclick = function () {
      var text = JSON.stringify(state);
      navigator.clipboard && navigator.clipboard.writeText(text).then(
        function () { toast('Progress copied. Paste it on the other device.'); },
        function () { window.prompt('Copy this:', text); }
      ) || window.prompt('Copy this:', text);
    };
    document.getElementById('imp').onclick = function () {
      var text = window.prompt('Paste the progress text from your other device:');
      if (!text) return;
      try {
        var s = JSON.parse(text);
        if (!s || typeof s.cards !== 'object') throw new Error('bad');
        // Merge rather than replace: keep whichever record is further along.
        Object.keys(s.cards).forEach(function (id) {
          var mine = state.cards[id], theirs = s.cards[id];
          if (!mine || (theirs.reps || 0) > (mine.reps || 0)) state.cards[id] = theirs;
        });
        state.sessions = (state.sessions || []).concat(s.sessions || []).slice(-500);
        save(); toast('Progress merged.'); views.progress();
      } catch (e) { toast('That did not look like progress data.'); }
    };
    document.getElementById('dl').onclick = function () {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = DATA.course.id + '-progress-' + today() + '.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    };
  };

  views.topic = function (code) {
    var t = byCode[code];
    if (!t || !t.pack) return views.browse();
    var s = topicStats(t);
    var book = DATA.book;
    html(
      '<p class="meta">Theme ' + t.theme + ' &middot; ' + esc(t.levelTitle) + (t.hlOnly ? ' &middot; HL only' : '') + '</p>' +
      '<h1>' + t.code + ' ' + esc(t.title) + '</h1>' +
      (t.pack.oneLiner ? '<p class="sub">' + inline(t.pack.oneLiner) + '</p>' : '') +
      '<div class="card"><ol class="steps">' +
        '<li><b>Watch</b><small>One video, with the questions in front of you.</small></li>' +

        '<li><b>Recall</b><small>' + s.due + ' of ' + s.total + ' cards due.</small></li>' +

      '<h2>What you have to be able to do</h2>' + md(t.pack.essentials) +

    );
  };

  views.watch = function (code) {
    var t = byCode[code];
    if (!t || !t.pack) return views.browse();
    var book = DATA.book;
    html(
      '<p class="meta">' + t.code + ' &middot; step 1 of 4</p>' +
      '<h1>Watch</h1>' +
      md(t.pack.videos) +
      '<h2>Now close the video</h2>' +
      '<div class="capture">' +
        '<p><strong>From memory, with nothing open:</strong></p>' +
        '<textarea id="cap" placeholder="Three things I can now state:&#10;1.&#10;2.&#10;3.&#10;&#10;One thing I could explain out loud:&#10;-&#10;&#10;One thing still fuzzy:&#10;-"></textarea>' +
        '<p class="note">This will feel bad. You just watched a clear explanation and can produce almost none of it. That gap is the real state of your knowledge — everyone has it, most people never look.</p>' +
      '</div>' +
      (book && t.pages
        ? '<div class="card"><h3>Then check yourself</h3><p>' + esc(book.author) + ', <em>' + esc(book.title) + '</em>, <strong>section ' + t.code + ', pp. ' + t.pages + '</strong>.' +
          (t.bookTitle ? ' The book prints this one as &ldquo;' + esc(t.bookTitle) + '&rdquo;.' : '') +
          '</p><p class="note">Read it only after you have written the box above. Mark every point you missed — those are the ones to watch for in the quiz.</p></div>'
        : '') +
      '<button class="btn wide" data-go="quiz" data-code="' + t.code + '">Done — quiz me &rarr;</button>'
    );
    // Keep the capture text for this topic so a reload does not lose it.
    var box = document.getElementById('cap');
    var ck = 'study-os:capture:' + t.code;
    try { box.value = sessionStorage.getItem(ck) || ''; } catch (e) {}
    box.addEventListener('input', function () {
      try { sessionStorage.setItem(ck, box.value); } catch (e) {}
    });
  };

  var quiz = null;

  views.quiz = function (code) {
    var topic = code ? byCode[code] : null;
    if (code && (!topic || !topic.pack)) return views.browse();
    var pool = dueCards(topic);
    if (!pool.length && topic) pool = topic.pack.cards.map(function (c) { return { card: c, topic: topic }; });
    if (!pool.length) {
      return html('<div class="empty"><h1>Nothing due</h1><p>Every card you have seen is resting. Start a new topic, or try an exam question.</p>' +
        '<div class="row" style="justify-content:center"><button class="btn ghost" data-go="browse">Browse topics</button></div></div>');
    }
    quiz = { deck: shuffle(pool).slice(0, 20), i: 0, got: 0, shaky: 0, missed: 0, revealed: false };
    renderCard();
  };

  function renderCard() {
    if (quiz.i >= quiz.deck.length) return quizDone();
    var item = quiz.deck[quiz.i], c = item.card;
    var pct = Math.round((quiz.i / quiz.deck.length) * 100);
    html(
      '<p class="meta">' + item.topic.code + ' &middot; card ' + (quiz.i + 1) + ' of ' + quiz.deck.length + '</p>' +
      '<div class="card">' +
        '<p class="q">' + inline(c.q) + '</p>' +
        (c.marks ? '<p class="note">[' + c.marks + ' marks]</p>' : '') +
        '<div id="ans" class="hide">' +
          '<div class="a">' + md(c.a) + (c.note ? '<p class="note">' + inline(c.note) + '</p>' : '') + '</div>' +
          '<div class="grade">' +
            '<button class="g-got" data-grade="got">Got it<span>solid</span></button>' +
            '<button class="g-shaky" data-grade="shaky">Shaky<span>half there</span></button>' +
            '<button class="g-missed" data-grade="missed">Missed<span>no idea</span></button>' +
          '</div>' +
        '</div>' +
        '<button class="btn wide" id="reveal" style="margin-top:16px">Say it out loud, then reveal</button>' +
      '</div>' +
      '<div class="progress-track"><div style="width:' + pct + '%"></div></div>'
    );
    document.getElementById('reveal').onclick = function () {
      document.getElementById('ans').classList.remove('hide');
      this.classList.add('hide');
    };
    on('[data-grade]', 'click', function () {
      var days = grade(c.id, this.getAttribute('data-grade'));
      quiz[this.getAttribute('data-grade')]++;
      quiz.i++;
      toast(days === 1 ? 'Back tomorrow' : 'Back in ' + days + ' days');
      renderCard();
    });
  }

  function quizDone() {
    var n = quiz.got + quiz.shaky + quiz.missed;
    if (n) {
      state.sessions.push({ date: today(), cards: n, got: quiz.got, shaky: quiz.shaky, missed: quiz.missed });
      if (state.sessions.length > 500) state.sessions = state.sessions.slice(-500);
      save();

    var weak = quiz.missed + quiz.shaky;
    html('<h1>Done</h1>' +
      '<div class="stat">' +
        '<div><b style="color:var(--good)">' + quiz.got + '</b><span>got it</span></div>' +

        : '') +
      '<div class="row"><button class="btn ghost" data-go="exam" data-code="' + t.code + '">Another question</button>' +
      '<button class="btn ghost" data-go="topic" data-code="' + t.code + '">Back to ' + t.code + '</button></div>'
    );
    document.getElementById('reveal').onclick = function () {
      document.getElementById('ms').classList.remove('hide');
      this.classList.add('hide');
    };
  };

  // -------------------------------------------------------------- routing

  function go(name, arg) {
    location.hash = '#' + name + (arg ? '/' + arg : '');
  }
  function route() {
    var raw = (location.hash || '#home').slice(1).split('/');
    var name = raw[0] || 'home';
    var fn = views[name] || views.home;
    Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
      if (b.getAttribute('data-go') === name) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    fn(raw[1]);
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go],[data-topic]');
    if (!t) return;
    if (t.hasAttribute('data-topic')) { e.preventDefault(); return go('topic', t.getAttribute('data-topic')); }
    e.preventDefault();
    go(t.getAttribute('data-go'), t.getAttribute('data-code') || '');
  });

  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
