<script>window.__STUDY_DATA__ = {"course":{"id":"bio-hl","title":"Biology HL"},"themes":{"A":"Unity and diversity","B":"Form and function","C":"Interaction and interdependence","D":"Continuity and change"},"levels":{"1":"Molecules","2":"Cells","3":"Organisms","4":"Ecosystems"},"book":{"author":"Andrew Allott","title":"Biology Study Guide","edition":"2023 edition","answersUrl":"https://www.oxfordsecondary.com/ib-science-support"},"method":"\nRead this once. It is short, and it explains why the system asks you to do the\none thing you will not want to do.\n\n## The problem with videos\n\nYou already know you learn well from videos. That is real, and it is worth\nbuilding on — a good explanation with moving pictures will get an idea into\nyour head faster than a textbook page will.\n\nBut there is a catch, and it is the reason a topic can feel clear on Sunday and\nblank on Thursday.\n\nWhen you watch someone explain cell respiration, you follow along. Each step\nmakes sense as it arrives. At the end you feel like you understand it, and that\nfeeling is honest — you *did* understand it while it was in front of you. What\nyou have built is the ability to **recognise** the explanation. Recognition is\nfast, it feels like knowledge, and it disappears within days.\n\nAn exam never asks you to recognise anything. It asks you to **produce** it,\nfrom nothing, on a blank page, under time pressure. That is a different skill,\nand watching does not train it.\n\n## What actually makes things stick\n\nTrying to remember something is what moves it into long-term memory. Not\nreading it again. Not highlighting it. Not watching a second video.\n\nThe uncomfortable part: the harder the recall feels, the better it works.\nStruggling to remember something and eventually getting it does more for you\nthan reading it smoothly ten times. Which means the study method that feels\nmost productive is usually the one doing the least.\n\nThat is the whole reason this system exists. It is built to take what you get\nfrom videos — which is genuinely a lot — and force it through the step that\nmakes it permanent.\n\n## The loop\n\nFour steps, about forty minutes.\n\n**1. Watch (15 min).** One video. Not three. `study watch C1.2` gives you the\nvideo and, more importantly, the specific questions to hold in your head while\nyou watch. Watching with a question is an active thing. Watching without one is\ntelevision.\n\n**2. Capture (5 min).** Close the laptop. On paper, write down what you\nremember. Three things you can now state, one thing you could explain out loud,\none thing that is still fuzzy.\n\nThis step will feel bad. You will sit there having just watched a clear\nexplanation and produce almost nothing. **That is not a sign the video failed or\nthat you are bad at this.** That gap — between what you could follow and what\nyou can produce — is the actual state of your knowledge, and every student has\nit. The difference is that most never look at it, so they find out in the exam.\n\n**Then open the Allott study guide** at the same topic code and read the\nsection. It is deliberately condensed — a few pages a topic — which makes it a\nfast way to see what you left out. Mark every point you missed. Those are the\nones to watch for in the quiz.\n\nDo it in that order. The book after the brain-dump is a check. The book before\nit is just reading, and reading is the thing that does not work.\n\n**3. Recall (10 min).** `study quiz`. Say each answer out loud before you reveal\nit. Out loud matters: thinking \"yeah, I know this\" is exactly the recognition\nfeeling that got you here.\n\nMark yourself honestly. A card you half-had is a card you missed. The system\nuses your answers to decide when to show each card again, so lying to it only\nmeans it stops showing you the things you most need.\n\n**4. Check (10 min).** `study exam C1.2`. One real exam-style question with a\nreal mark scheme. Write the answer properly, then mark yourself strictly. This\nis where you find out that you understood the biology and still lost two marks\nfor writing \"describe\" when the question said \"explain\".\n\nWhen you want more of these, your study guide has a question set at the end of\neach group — `study exam` tells you the page — and the answers are free at\n\u003chttps://www.oxfordsecondary.com/ib-science-support>. Those are worth more than\nanother video, every time.\n\n## Why cards come back when they do\n\nCards you get right move further away — one day, then three, then a week, then\nover a month. Cards you miss come straight back tomorrow.\n\nSo the deck automatically concentrates on what you do not know, and the stuff\nyou have solid stops wasting your time. Twenty minutes on the right twenty\ncards beats two hours re-reading a chapter, and it is not close.\n\nYou cannot cram this. Six short sessions across two weeks will leave you with\nmore than one six-hour session, even though the six-hour session feels more\nlike work. Spacing is doing something real: every time you retrieve a fact\nafter nearly forgetting it, you make it harder to forget next time.\n\n## What a bad week looks like\n\nYou will have weeks where you do nothing. The cards pile up and opening the\nthing feels worse every day.\n\nWhen that happens, do not try to clear the backlog. Run `study quiz --limit 10`\nand do ten cards. Then stop. Ten cards today beats a heroic session you keep\npostponing, and it beats zero, which is what usually actually happens.\n\n## The short version\n\n- Watching is how the idea gets in. Recall is how it stays.\n- The step that feels worst is the step that works.\n- The book comes *after* the brain-dump, never before it.\n- Be honest when you mark yourself. The system is only as good as your grading.\n- Little and often. Always.\n","topics":[{"code":"A1.1","title":"Water","theme":"A","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"1-3","questionsPage":8,"bookTitle":null,"pack":{"oneLiner":"Water's bent, polar structure lets it form hydrogen bonds and dissolve charged or polar substances, which explains its roles in transport, temperature control, habitats and metabolism.","essentials":"\n> Tick a line only after you can do it with the page closed and without prompts.\n\n## Core\n\n- [ ] Explain why oxygen and hydrogen share electrons unequally in water, and why the molecule's bent shape gives it two differently charged regions.\n- [ ] Distinguish the polar covalent bonds inside a water molecule from the hydrogen bonds between water molecules.\n- [ ] Explain how many individually weak hydrogen bonds produce water's cohesion and surface tension.\n- [ ] Distinguish cohesion from adhesion and connect both properties to the movement of water through xylem.\n- [ ] Explain how water surrounds ions and polar molecules, allowing them to dissolve and move in aqueous solutions.\n- [ ] Predict whether a biological substance will be hydrophilic or hydrophobic from its charge and polarity.\n- [ ] Explain why water is a medium for metabolic reactions and for transport in blood, tissue fluid and plant sap.\n- [ ] Explain how organisms transport poorly soluble substances, using oxygen and lipids as named examples.\n- [ ] Compare water with air in density, buoyancy, viscosity, thermal conductivity and specific heat capacity, then link the differences to animal adaptations.\n- [ ] Explain how high specific heat capacity limits temperature change and how high latent heat of vaporization makes evaporation an effective cooling process.\n- [ ] Outline why the search for extraterrestrial life focuses on liquid water, without claiming that water proves life is present.\n\n## Links to other topics\n\n- **B2.1 Membranes and membrane transport** — polarity explains why phospholipids arrange into bilayers. If hydrophilic and hydrophobic interactions are secure here, membrane structure has a cause rather than becoming another diagram to memorise.\n- **B3.2 Transport** — transpiration applies cohesion, adhesion and evaporation to an entire plant. A1.1 supplies the molecular explanation for the mechanism.\n- **D2.3 Water potential** — osmosis depends on water as a solvent and on differences in the tendency of water to move. Accurate solvent language here prevents confusion later.\n- **D3.3 Homeostasis** — sweating works because evaporation requires energy. The homeostasis question is an application of latent heat of vaporization.\n\n## Vocabulary that has to be exact\n\n| Term | What it means | What it is not |\n| --- | --- | --- |\n| Electronegativity | The tendency of an atom to attract a shared pair of electrons | An atom's overall electrical charge |\n| Polar molecule | A molecule with an uneven distribution of charge and partial positive and negative regions | An ion; water remains neutral overall |\n| Polar covalent bond | A covalent bond in which electrons are shared unequally | A hydrogen bond between molecules |\n| Hydrogen bond | An attraction between a partially positive hydrogen and a partially negative electronegative atom on another molecule | The O–H bond within one water molecule |\n| Cohesion | Attraction between molecules of the same substance, such as water and water | Adhesion to another surface |\n| Adhesion | Attraction between different substances, such as water and cellulose | Cohesion between water molecules |\n| Hydrophilic | Charged or polar and able to interact with water | Any substance found inside an organism |\n| Hydrophobic | Non-polar and poorly soluble in water | A substance pushed away by a repulsive force |\n| Specific heat capacity | Energy needed to raise the temperature of unit mass by one degree | Energy needed for a liquid to evaporate |\n| Latent heat of vaporization | Energy needed to change a liquid to a gas without changing temperature | The temperature at which a substance boils |\n","videos":"\nWatch **one** main video. Then close it and write what you can produce from memory. Watching another version immediately strengthens recognition, and recognition is the skill that has been hiding the gaps.\n\n## Main\n\n**Alex Lee Biology — A1.1 Water**\n\n- Channel: \u003chttps://www.youtube.com/@AlexLeeBiology>\n- Search: \u003chttps://www.youtube.com/results?search_query=Alex+Lee+IB+Biology+A1.1+Water>\n\nAlex Lee organizes the course by the current IB topic codes, so start with the explanation built for A1.1.\n\n**Watch for:**\n\n- Why oxygen attracts the shared electrons more strongly than hydrogen does.\n- Why the two O–H bond dipoles do not cancel in a bent molecule.\n- How the explanation moves from hydrogen bonding to cohesion, adhesion and thermal properties.\n- Which property of water explains each biological example, rather than memorizing the example alone.\n\n**Pause at:** the first labelled water molecule. Hide the labels, draw its shape, add δ− and δ+ in the correct places, and explain aloud why the whole molecule is polar but not charged.\n\n## If that did not land\n\n**Khan Academy — hydrogen bonding and water**\n\n- Channel: \u003chttps://www.youtube.com/@khanacademy>\n- Search: \u003chttps://www.youtube.com/results?search_query=Khan+Academy+hydrogen+bonding+water+properties>\n\nUse this if the chemistry under polarity and hydrogen bonding is the part you cannot yet reproduce.\n\n**Amoeba Sisters — properties of water**\n\n- Channel: \u003chttps://www.youtube.com/@AmoebaSisters>\n- Search: \u003chttps://www.youtube.com/results?search_query=Amoeba+Sisters+properties+of+water>\n\nUse this for a shorter biological explanation. When it ends, return to recall instead of opening a third video.\n\n## Worth it once, not for revision\n\nA hydrogen-bond network changes from moment to moment, so an **animation** earns one exception to the one-video rule. Movement shows the bonds forming and breaking more clearly than a static paragraph can.\n\n- Search: \u003chttps://www.youtube.com/results?search_query=water+molecules+hydrogen+bonds+animation>\n\nAfter watching, draw four water molecules. Use solid lines for polar covalent bonds and dotted lines for hydrogen bonds. If the two bond types end up in the same place, watch that segment again.\n\n## Pinned\n","traps":"\n## Calling partial charges full charges\n\n**Commonly written:** \"The oxygen in water is negative and the hydrogens are positive.\"\n\n**Why it does not score:** The atoms carry partial charges because electrons are shared unequally. The molecule remains neutral overall.\n\n**Scores instead:** \"Oxygen attracts the shared electrons more strongly, so it has a partial negative charge and each hydrogen has a partial positive charge.\"\n\n## Putting hydrogen bonds inside the molecule\n\n**Commonly written:** \"Hydrogen bonds join oxygen to hydrogen in a water molecule.\"\n\n**Why it does not score:** The O–H bonds within one molecule are polar covalent bonds. Hydrogen bonds act between separate molecules.\n\n**Scores instead:** \"Polar covalent bonds join oxygen to hydrogen within each molecule, while hydrogen bonds form between neighbouring water molecules.\"\n\n## Saying cohesion causes transpiration pull\n\n**Commonly written:** \"Cohesion pulls water from the roots to the leaves.\"\n\n**Why it does not score:** Cohesion transmits tension through the water column. Evaporation from the leaf creates the tension.\n\n**Scores instead:** \"Transpiration creates tension in the xylem, and cohesion transmits that tension through an unbroken column of water.\"\n\n## Treating adhesion and cohesion as interchangeable\n\n**Commonly written:** \"Adhesion keeps water molecules joined together in xylem.\"\n\n**Why it does not score:** Water-to-water attraction is cohesion. Adhesion is attraction between water and the vessel wall.\n\n**Scores instead:** \"Cohesion keeps water molecules connected, while adhesion helps water cling to the hydrophilic xylem walls.\"\n\n## Saying hydrophobic substances are repelled\n\n**Commonly written:** \"Water pushes lipids away because they are hydrophobic.\"\n\n**Why it does not score:** No repulsive force is required. Non-polar lipids lack favorable interactions with water, while water molecules continue hydrogen bonding with one another.\n\n**Scores instead:** \"Lipids are poorly soluble because they are non-polar and cannot form favorable electrostatic interactions with water.\"\n\n## Using specific heat capacity to explain sweating\n\n**Commonly written:** \"Sweat cools the body because water has a high specific heat capacity.\"\n\n**Why it does not score:** Sweating involves a change from liquid to vapor, so the relevant property is latent heat of vaporization.\n\n**Scores instead:** \"Evaporation of sweat removes a large amount of energy from the skin because water has a high latent heat of vaporization.\"\n\n## Listing facts instead of comparing habitats\n\n**Commonly written:** \"Water is dense and viscous. Air contains oxygen.\"\n\n**Why it does not score:** A compare-and-contrast question requires paired statements that use one medium as the reference for the other.\n\n**Scores instead:** \"Water is more viscous than air, so aquatic animals experience greater drag and benefit from streamlined bodies.\"\n\n## Treating water as proof of extraterrestrial life\n\n**Commonly written:** \"Liquid water on a planet means that life exists there.\"\n\n**Why it does not score:** Water indicates a potentially suitable condition for known life. It does not show that organisms are present.\n\n**Scores instead:** \"Liquid water indicates potential habitability for life as we know it, but its presence alone does not demonstrate life.\"\n","cards":[{"id":"A1.1-01","q":"Explain fully why a water molecule is polar but has no overall charge.","a":"Oxygen is more electronegative than hydrogen, so it attracts the shared electrons in each O–H bond more strongly. Oxygen develops a partial negative charge and the hydrogen atoms develop partial positive charges. Water is bent, so the two bond dipoles do not cancel. The molecule is polar even though its total charge remains zero.","note":"A complete answer needs unequal sharing, partial charges and the bent shape.","marks":null},{"id":"A1.1-02","q":"Distinguish the O–H bonds within one water molecule from the bonds between neighbouring water molecules.","a":"Within one water molecule, oxygen and hydrogen are joined by polar covalent bonds in which electrons are shared unequally. Between neighbouring water molecules, a hydrogen bond forms between a partially positive hydrogen and a partially negative oxygen. A hydrogen bond is an intermolecular attraction and is weaker than a covalent bond.","note":"Putting hydrogen bonds inside the molecule is a common mark-losing error.","marks":null},{"id":"A1.1-03","q":"Explain how many weak hydrogen bonds can give water strong cohesive behavior.","a":"Each hydrogen bond between water molecules is weak and forms or breaks readily. A body of water contains a very large number of these bonds at the same time. Their combined attraction keeps water molecules associated, producing cohesion even though no single hydrogen bond is strong.","note":"","marks":null},{"id":"A1.1-04","q":"Distinguish cohesion from adhesion and give one biological consequence of each.","a":"Cohesion is attraction between water molecules, and it helps an unbroken column of water remain under tension in xylem. Adhesion is attraction between water and another polar surface, and it helps water cling to the cellulose walls of xylem vessels.","note":"State what is attracted to what before giving the example.","marks":null},{"id":"A1.1-05","q":"Explain the complete sequence by which water is pulled from roots toward leaves in xylem.","a":"Water evaporates from mesophyll cell walls and leaves through stomata, creating tension in the xylem. Cohesion caused by hydrogen bonding transmits the tension through a continuous column of water. Adhesion between water and the hydrophilic xylem walls helps support the column against gravity as it is pulled upward.","note":"Transpiration provides the pull. Cohesion transmits it. Adhesion supports the column.","marks":null},{"id":"A1.1-06","q":"Explain how cohesion produces surface tension at the surface of water.","a":"Water molecules at the surface form hydrogen bonds with neighbouring molecules beside and below them. The resulting inward cohesive attraction makes the surface resist being stretched or broken. This surface tension can support small organisms at the air–water boundary.","note":"","marks":null},{"id":"A1.1-07","q":"Explain at the molecular level how water dissolves sodium chloride.","a":"The partially negative oxygen regions of water molecules orient toward Na+ ions, while the partially positive hydrogen regions orient toward Cl− ions. These attractions separate the ions from the crystal and surround each ion with a hydration shell, keeping the ions dispersed in solution.","note":"","marks":null},{"id":"A1.1-08","q":"Predict how water interacts differently with polar and non-polar substances, and explain the difference.","a":"Water forms hydrogen bonds or other electrostatic attractions with polar or charged substances, so many of them dissolve. Non-polar substances cannot form comparable favorable interactions with water, so water continues bonding with itself and excludes them, leaving them poorly soluble.","note":"Hydrophobic substances are not pushed away by water. They lack favorable interactions with it.","marks":null},{"id":"A1.1-09","q":"Explain why water is an effective medium for metabolism and transport in living organisms.","a":"Ions and many polar molecules dissolve in water, allowing reactants to move, collide and undergo enzyme-catalyzed reactions in aqueous cytoplasm. Dissolved substances can also be carried in blood plasma, tissue fluid and plant sap. Water therefore provides both a reaction medium and a transport medium.","note":"","marks":null},{"id":"A1.1-10","q":"Explain how blood transports oxygen and lipids even though both have limited solubility in water.","a":"Most oxygen is carried bound reversibly to haemoglobin inside red blood cells rather than dissolved in plasma. Hydrophobic lipids are carried in lipoproteins, which have hydrophilic outer surfaces that interact with plasma and hydrophobic interiors that enclose the lipids.","note":"Haemoglobin-bound oxygen is carried in red blood cells, not dissolved in plasma.","marks":null},{"id":"A1.1-11","q":"Compare density and viscosity in water and air, then explain one consequence of each difference for animals.","a":"Water is denser than air and provides greater buoyancy, so aquatic animals require less support against gravity. Water is also more viscous than air and produces greater drag, so streamlined shapes reduce the energy needed for movement through it.","note":"","marks":null},{"id":"A1.1-12","q":"Compare thermal conductivity in water and air, then explain a consequence for an endothermic animal.","a":"Water has a higher thermal conductivity than air, so it transfers heat away from an animal more rapidly. Endothermic aquatic animals may therefore need insulation such as blubber or a low surface-area-to-volume ratio to reduce heat loss.","note":"","marks":null},{"id":"A1.1-13","q":"Explain how water's high specific heat capacity affects organisms and aquatic habitats.","a":"A large amount of energy is required to raise the temperature of water because added energy is used in disrupting hydrogen bonds before molecular motion increases greatly. Water-rich organisms and aquatic habitats therefore change temperature slowly, reducing rapid temperature fluctuations.","note":"","marks":null},{"id":"A1.1-14","q":"Explain how high latent heat of vaporization makes sweating and transpiration effective cooling processes.","a":"A large amount of energy is required for water molecules to escape from the liquid because hydrogen bonds must be disrupted. When water evaporates from skin or a leaf, that energy is taken from the surface and its surroundings, so the remaining surface cools.","note":"Evaporative cooling depends on latent heat of vaporization, not specific heat capacity.","marks":null},{"id":"A1.1-15","q":"Correct this claim: 'Finding liquid water on another planet proves that life is present.'","a":"Finding liquid water shows that one condition required by all known life may be present. Liquid water can act as a solvent and medium for metabolic reactions and transport. Its presence therefore indicates potential habitability for life as we know it, but it does not demonstrate that organisms are present.","note":"This is a limit-of-evidence question. Habitability is not evidence of life by itself.","marks":null},{"id":"A1.1-16","q":"Construct one causal chain linking water's molecular structure to its major biological roles.","a":"Water's polar covalent bonds and bent shape create partial charges. Those partial charges allow hydrogen bonds between molecules and attractions with ions and other polar substances. Hydrogen bonding produces cohesion and important thermal properties, while polarity makes water an effective solvent. These properties support xylem transport, aqueous metabolism, transport of solutes, stable temperatures and evaporative cooling.","note":"Do not recite disconnected properties. Move from structure to interaction to property to biological consequence.","marks":null}],"exam":[{"question":"## Q1. Explain why a water molecule is polar. **[3]**","scheme":"- Oxygen is more electronegative than hydrogen / attracts the shared electrons in each O–H bond more strongly. **[1]**\n- Oxygen has a partial negative charge and the hydrogen atoms have partial positive charges. **[1]**\n- Water is bent / the bond dipoles do not cancel, producing separate partially charged regions. **[1]**\n\n_Examiner note: \"oxygen is negative\" is too loose. Full marks require partial charges and the reason the two bond dipoles do not cancel._"},{"question":"## Q2. Distinguish cohesion from adhesion and give one biological example of each. **[4]**","scheme":"- Cohesion is attraction between molecules of the same substance / between water molecules. **[1]**\n- accept: cohesion maintains a continuous water column in xylem / produces surface tension. **[1]**\n- Adhesion is attraction between different substances / between water and a polar or charged surface. **[1]**\n- accept: adhesion allows water to cling to cellulose xylem walls / contributes to capillary movement in narrow spaces. **[1]**\n\n_Examiner note: examples alone do not distinguish the terms. The answer must identify what is attracted to what on both sides of the comparison._"},{"question":"## Q3. Explain how the properties of water contribute to transport from roots to leaves in a tall plant. **[4]**","scheme":"- Evaporation from mesophyll cell walls / transpiration through stomata creates tension in xylem. **[1]**\n- Water molecules form hydrogen bonds with one another / are cohesive. **[1]**\n- Cohesion transmits tension through an unbroken column of water. **[1]**\n- Adhesion between water and hydrophilic / cellulose xylem walls helps support the column against gravity. **[1]**\n\n_Examiner note: saying that cohesion \"pulls water up\" loses the source of the force. Transpiration creates the tension, cohesion transmits it, and adhesion supports the column._"},{"question":"## Q4. Compare and contrast water and air as habitats for animals. **[6]**","scheme":"Award any six:\n\n- Both are fluids through which animals can move. **[1]**\n- Water is denser than air and provides greater buoyancy / reduces the need for weight-bearing support. **[1]**\n- Water is more viscous than air and creates greater drag / increases the advantage of streamlining. **[1]**\n- Water has higher thermal conductivity than air and removes body heat more rapidly / increases the need for insulation. **[1]**\n- Water has higher specific heat capacity than air and undergoes smaller or slower temperature changes / provides a more stable thermal environment. **[1]**\n- Oxygen is less available in water than in air / aquatic gas exchange requires adaptations for extracting dissolved oxygen. **[1]**\n\n_Examiner note: every difference must be comparative. \"Water is viscous\" states a fact, while \"water is more viscous than air, so swimming produces greater drag\" answers the command term._"},{"question":"## Q5. Explain how evaporation of water cools a human body or a leaf. **[3]**","scheme":"- Water has a high latent heat of vaporization / much energy is required to disrupt hydrogen bonds during evaporation. **[1]**\n- Higher-energy water molecules leave the liquid as vapor. **[1]**\n- Energy is removed from the surface / the mean kinetic energy and temperature of the remaining liquid decrease. **[1]**\n\n_Examiner note: high specific heat capacity does not explain evaporation. The answer must name latent heat of vaporization and show where the energy goes._"},{"question":"## Q6. Suggest why liquid water is used as an indicator of potential habitability when searching for extraterrestrial life. **[3]**","scheme":"- All known life uses liquid water as a solvent / medium for metabolism. **[1]**\n- Liquid water allows dissolved substances to move and react / supports transport and biochemical reactions. **[1]**\n- Its presence indicates that one condition for life as we know it may be met, but does not prove that life is present. **[1]**\n\n_Examiner note: the limiting sentence earns the third mark. Water supports a possibility; it is not direct evidence of organisms._"}]}},{"code":"A1.2","title":"Nucleic acids","theme":"A","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"4-7","questionsPage":8,"bookTitle":null,"pack":null},{"code":"A2.1","title":"Origins of cells","theme":"A","level":2,"levelTitle":"Cells","hlOnly":true,"pages":"56-58","questionsPage":69,"bookTitle":null,"pack":null},{"code":"A2.2","title":"Cell structure","theme":"A","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"59-66","questionsPage":69,"bookTitle":null,"pack":null},{"code":"A2.3","title":"Viruses","theme":"A","level":2,"levelTitle":"Cells","hlOnly":true,"pages":"67-68","questionsPage":69,"bookTitle":null,"pack":null},{"code":"A3.1","title":"Diversity of organisms","theme":"A","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"105-109","questionsPage":114,"bookTitle":null,"pack":null},{"code":"A3.2","title":"Classification and cladistics","theme":"A","level":3,"levelTitle":"Organisms","hlOnly":true,"pages":"110-113","questionsPage":114,"bookTitle":null,"pack":null},{"code":"A4.1","title":"Evolution and speciation","theme":"A","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"179-184","questionsPage":189,"bookTitle":null,"pack":null},{"code":"A4.2","title":"Conservation of biodiversity","theme":"A","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"185-188","questionsPage":189,"bookTitle":"Conservation of biology","pack":null},{"code":"B1.1","title":"Carbohydrates and lipids","theme":"B","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"9-13","questionsPage":18,"bookTitle":null,"pack":null},{"code":"B1.2","title":"Proteins","theme":"B","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"14-17","questionsPage":18,"bookTitle":null,"pack":null},{"code":"B2.1","title":"Membranes and membrane transport","theme":"B","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"70-74","questionsPage":80,"bookTitle":null,"pack":{"oneLiner":"A membrane is a two-molecule-thick sheet of fat that water-soluble things cannot cross, studded with proteins that decide what gets across anyway — which is how a cell gets to have an inside that is different from its outside.","essentials":"\n> Each line is a thing you should be able to *do* with the page closed.\n\n## Core\n\n- [ ] Describe a **phospholipid**: a hydrophilic phosphate head and two\n      hydrophobic hydrocarbon tails — one molecule that is part polar and part\n      non-polar.\n- [ ] Explain **why a bilayer forms spontaneously in water**: the hydrophilic\n      heads face the water on both sides and the hydrophobic tails are shielded\n      in the middle. Nothing assembles it; it is the lowest-energy arrangement.\n- [ ] Explain why the bilayer is a **barrier to ions and large polar molecules**\n      but not to small non-polar ones: the hydrophobic core repels charge.\n- [ ] Rank what crosses by **simple diffusion** and what cannot: oxygen, carbon\n      dioxide and steroid hormones cross freely; glucose, amino acids and all\n      ions do not.\n- [ ] Distinguish **integral** proteins (embedded in, often spanning, the\n      bilayer) from **peripheral** proteins (attached to one surface).\n- [ ] Explain **facilitated diffusion** through channel proteins: passive, down\n      the concentration gradient, no ATP, but requiring a specific protein.\n- [ ] Explain **osmosis through aquaporins** and why water needs them despite\n      being a small molecule — it is polar, so it crosses the hydrophobic core\n      too slowly for cells such as kidney tubule cells.\n- [ ] Explain **active transport** by pump proteins: against the gradient, using\n      ATP, with the protein changing shape.\n- [ ] Explain what makes membrane permeability **selective**: which proteins are\n      present, not gaps in the bilayer.\n- [ ] Describe **glycoproteins and glycolipids** and their role in cell\n      recognition and adhesion.\n- [ ] Explain the **fluid mosaic model**: fluid because phospholipids move\n      laterally, mosaic because proteins are scattered and varied.\n- [ ] Relate **fatty acid saturation to fluidity** — unsaturated tails have\n      kinks, pack less tightly, and increase fluidity.\n- [ ] Explain **cholesterol's** role in animal membranes: it reduces fluidity at\n      higher temperatures and prevents tight packing at lower ones, so it\n      buffers fluidity in both directions.\n\n## Higher level\n\n- [ ] Explain how membrane fluidity permits **vesicle fusion and fission**, and\n      why that matters for endocytosis, exocytosis and vesicle traffic.\n- [ ] Describe **gated ion channels** — voltage-gated and ligand-gated — and\n      that they open in response to a specific signal rather than continuously.\n- [ ] Explain the **sodium–potassium pump** as an exchange transporter: three\n      Na+ out and two K+ in per ATP hydrolysed, generating both a concentration\n      gradient and a charge difference across the membrane.\n- [ ] Explain **sodium-dependent glucose cotransport** as indirect active\n      transport: glucose moves against its gradient powered by sodium moving\n      down the gradient the pump created — the ATP was spent earlier, elsewhere.\n- [ ] Explain how **cell adhesion** through membrane proteins allows tissues to\n      form.\n\n## Links to other topics\n\n- **A1.1 Water** — this whole topic is the hydrophilic/hydrophobic split from\n  A1.1 applied at a larger scale. If B2.1 will not stick, the problem is\n  usually back in A1.1.\n- **C2.2 Neural signalling** — the sodium–potassium pump and gated channels are\n  the resting potential and action potential. Learn them properly here.\n- **D2.3 Water potential** — osmosis and aquaporins.\n- **B2.2 Organelles** — compartmentalization only works because membranes are\n  selective.\n\n## Vocabulary that has to be exact\n\n| Term | What it means | What it is not |\n| --- | --- | --- |\n| Simple diffusion | Straight through the bilayer, no protein | Facilitated diffusion |\n| Facilitated diffusion | Through a protein, passive, down the gradient | Active transport — no ATP is used |\n| Active transport | Through a pump, against the gradient, ATP used | Any transport that uses a protein |\n| Osmosis | Movement of water across a partially permeable membrane | Diffusion of solute |\n| Integral protein | Embedded in the bilayer | Necessarily spanning it — some do not |\n| Fluid mosaic | Fluid (lipids move) + mosaic (varied proteins scattered) | A static diagram |\n| Cotransport | One solute's gradient powers another's movement | Direct ATP use at that protein |\n","videos":"\n> This topic has more moving parts than A1.1, so the temptation to watch three\n> videos back to back is strong. Resist it. Watch one, then draw the membrane\n> from memory before you watch anything else. The drawing is the point.\n\n## Main\n\n**Alex Lee — B2.1 Membranes and membrane transport** (~20–25 min, may be split)\n\n- Channel: \u003chttps://www.youtube.com/@AlexLeeBiology>\n- Find it: \u003chttps://www.youtube.com/results?search_query=Alex+Lee+IB+Biology+B2.1+membranes+transport>\n\nWatch for:\n- The moment the bilayer is explained as *spontaneous*. If you come away\n  thinking something builds it, you have missed the central idea.\n- The difference between facilitated diffusion and active transport, stated in\n  terms of **gradient direction** and **ATP**. Those two variables separate\n  every transport mechanism in this topic.\n- Anything said about cholesterol. It gets one line and is worth a mark.\n\nPause at: the transport summary. Before playing on, write the four mechanisms\n(simple diffusion, facilitated diffusion, osmosis, active transport) and for\neach one answer: protein needed? ATP needed? which way down the gradient?\nThat table is most of the topic.\n\n## For the HL material\n\n**Sodium–potassium pump and cotransport**\n\n- Find it: \u003chttps://www.youtube.com/results?search_query=sodium+potassium+pump+animation+3+sodium+2+potassium>\n- Find it: \u003chttps://www.youtube.com/results?search_query=sodium+glucose+cotransporter+secondary+active+transport>\n\nWatch an **animation**, not a lecture, for these two. The pump's shape change\nand the cotransporter's dependence on the sodium gradient are spatial ideas —\nthey are much cheaper to learn from movement than from a paragraph. This is the\none place in the topic where a second video genuinely earns its time.\n\n## If that did not land\n\n**Amoeba Sisters — Cell Transport**\n\n- Find it: \u003chttps://www.youtube.com/results?search_query=Amoeba+Sisters+cell+transport>\n\nNot HL depth, but if the passive/active distinction itself is the problem, this\nsorts it out in ten minutes and you can return to Alex Lee afterwards.\n\n## Pinned\n\n- Main:\n- Pump animation:\n- Cotransport animation:\n","traps":"\n## Saying facilitated diffusion \"uses energy\"\n\n**Commonly written:** \"Facilitated diffusion uses a protein and energy to move\nglucose into the cell.\"\n\n**Why it does not score:** Facilitated diffusion is passive. The energy comes\nfrom the concentration gradient that already exists, not from ATP. Writing\n\"energy\" here reads as a failure to distinguish it from active transport —\nwhich is exactly what the question is testing.\n\n**Scores instead:** \"Facilitated diffusion moves substances down their\nconcentration gradient through a channel protein, without the use of ATP.\"\n\n## Treating \"uses a protein\" as the definition of active transport\n\n**Commonly written:** \"It is active transport because a protein is involved.\"\n\n**Why it does not score:** Facilitated diffusion uses proteins too. The two\nthings that define active transport are movement **against** the gradient and\nthe use of **ATP**.\n\n**Scores instead:** Name both: against the concentration gradient, and ATP\nhydrolysed by the pump protein.\n\n## Describing the bilayer as assembled\n\n**Commonly written:** \"The cell builds the phospholipids into a bilayer.\"\n\n**Why it does not score:** It misses the whole mechanism. The bilayer is the\narrangement that results from hydrophobic tails being excluded by water — it is\nspontaneous.\n\n**Scores instead:** \"Phospholipids arrange themselves spontaneously, with the\nhydrophilic heads facing the aqueous solution and the hydrophobic tails facing\ninwards, away from water.\"\n\n## Saying water cannot cross the membrane\n\n**Commonly written:** \"Water needs aquaporins because it cannot pass through\nthe bilayer.\"\n\n**Why it does not score:** Water does cross, just slowly, because it is small\neven though it is polar. Aquaporins make it fast enough for cells that move a\nlot of water, such as those in the kidney.\n\n**Scores instead:** \"Water crosses the bilayer slowly because it is polar;\naquaporins greatly increase the rate, which matters in cells such as kidney\ntubule cells.\"\n\n## Getting the sodium–potassium pump's numbers backwards\n\n**Commonly written:** \"Two sodium out, three potassium in.\"\n\n**Why it does not score:** It is three Na+ **out** and two K+ **in** per ATP.\nThe direction and the imbalance both matter: more positive charge leaves than\nenters, which is why the inside becomes negative — the fact C2.2 is built on.\n\n**Scores instead:** \"Three sodium ions are pumped out and two potassium ions in\nfor each ATP hydrolysed, so the inside of the cell becomes more negative.\"\n\n## Calling cotransport \"active transport\" without qualification\n\n**Commonly written:** \"Glucose enters by active transport with sodium.\"\n\n**Why it does not score:** No ATP is hydrolysed at the cotransporter itself.\nGlucose moves against its gradient using the energy stored in the sodium\ngradient — which the pump built earlier using ATP. The examiner wants that\nchain, because it is the whole point of the example.\n\n**Scores instead:** \"Indirect (secondary) active transport: sodium moving down\nits concentration gradient powers glucose uptake against its own gradient; the\nATP was used earlier by the sodium–potassium pump to establish that gradient.\"\n\n## Saying cholesterol \"makes membranes more fluid\" (or less)\n\n**Commonly written:** Either one, stated flatly.\n\n**Why it does not score:** It does both, depending on temperature. That\ntwo-directional buffering is the examinable point.\n\n**Scores instead:** \"Cholesterol reduces fluidity at higher temperatures by\nrestricting phospholipid movement, and prevents tight packing at lower\ntemperatures, so membrane fluidity stays within a workable range.\"\n","cards":[{"id":"B2.1-01","q":"Describe the structure of a phospholipid and explain why that structure makes a bilayer form in water.","a":"A phospholipid has a hydrophilic phosphate head and two hydrophobic hydrocarbon tails, so one molecule is part polar and part non-polar. In water, the molecules arrange themselves spontaneously into two layers: the hydrophilic heads face the aqueous solution on each side, and the hydrophobic tails point inwards, away from water. Nothing assembles the bilayer — it is the arrangement that results from water molecules bonding preferentially with each other and excluding the tails.","note":"'Spontaneously' is the word that matters. The bilayer is a consequence, not a construction.","marks":null},{"id":"B2.1-02","q":"Which substances cross a membrane by simple diffusion, and which cannot? Give the reason.","a":"Small non-polar molecules cross freely — oxygen, carbon dioxide, and steroid hormones — because they can pass through the hydrophobic core. Ions and large polar molecules such as glucose and amino acids cannot, because the hydrophobic core repels charged and polar particles. Water is the awkward case: it is polar but small enough to cross slowly.","note":"","marks":null},{"id":"B2.1-03","q":"For each of simple diffusion, facilitated diffusion, osmosis and active transport: protein needed? ATP needed? Which direction relative to the gradient?","a":"Simple diffusion: no protein, no ATP, down the gradient. Facilitated diffusion: channel or carrier protein, no ATP, down the gradient. Osmosis: no protein required but aquaporins speed it up, no ATP, water moves down its own concentration gradient. Active transport: pump protein, ATP required, against the gradient.","note":"If you can rebuild this table from memory, most of the transport marks in this topic are already yours.","marks":null},{"id":"B2.1-04","q":"Water is a small molecule. Why do many cells still need aquaporins?","a":"Water is polar, so although it is small enough to cross the hydrophobic core, it does so slowly. Aquaporins are channel proteins that let water pass far more rapidly. Cells that move large volumes of water quickly — such as kidney tubule cells and root hair cells — depend on them.","note":"Do not write that water cannot cross without aquaporins. It can; it is just too slow to be useful.","marks":null},{"id":"B2.1-05","q":"Distinguish between integral and peripheral membrane proteins.","a":"Integral proteins are embedded within the hydrophobic core of the bilayer, and many (transmembrane proteins) span it completely; they have hydrophobic regions where they contact the tails. Peripheral proteins are attached to one surface of the membrane, often to the surface of an integral protein, and are not embedded in the core.","note":"","marks":null},{"id":"B2.1-06","q":"Explain the fluid mosaic model. What does each of the two words refer to?","a":"Fluid: the phospholipids are not fixed and move laterally within their layer, so the membrane behaves like a two-dimensional liquid, and proteins can move within it too. Mosaic: the proteins embedded in and attached to the bilayer vary in size, shape and position, and are scattered through it rather than arranged in a pattern.","note":"","marks":null},{"id":"B2.1-07","q":"How does the saturation of fatty acid tails affect membrane fluidity, and why?","a":"Unsaturated fatty acids contain carbon-to-carbon double bonds that put kinks in the hydrocarbon tails. Kinked tails cannot pack together tightly, so the membrane is more fluid. Saturated tails are straight, pack closely, and make the membrane less fluid. Organisms living at low temperatures tend to have a higher proportion of unsaturated fatty acids.","note":"","marks":null},{"id":"B2.1-08","q":"What does cholesterol do to membrane fluidity? Be careful — the answer has two halves.","a":"Cholesterol buffers fluidity in both directions. At higher temperatures it reduces fluidity by restricting the movement of phospholipids. At lower temperatures it prevents the phospholipids from packing tightly together, which stops the membrane becoming too rigid. The net effect is that fluidity stays within a workable range across a range of temperatures.","note":"Stating only one half is the most common way to lose this mark.","marks":null},{"id":"B2.1-09","q":"What are glycoproteins and glycolipids, and what do they do?","a":"They are proteins and lipids with carbohydrate chains attached, projecting from the outer surface of the membrane. They act in cell recognition — acting as markers that allow cells to identify one another, as in the immune system and blood group antigens — and in cell adhesion, helping cells bind together to form tissues.","note":"","marks":null},{"id":"B2.1-10","q":"What makes a membrane selectively permeable? Be precise about the cause.","a":"Selectivity comes from which transport proteins are present in the membrane, not from holes or gaps in the bilayer. The bilayer itself blocks essentially all ions and large polar molecules; a substance crosses only if there is a channel, carrier or pump specific to it. So a cell controls what enters and leaves by controlling which proteins it puts in its membrane.","note":"","marks":null},{"id":"B2.1-11","q":"Explain how the sodium-potassium pump works, including the numbers.","a":"It is an integral protein that hydrolyses ATP to change shape. Per ATP used, it moves three sodium ions out of the cell and two potassium ions in, both against their concentration gradients. Because three positive charges leave for every two that enter, the inside of the cell becomes more negative relative to the outside, creating both a concentration gradient and a potential difference.","note":"HL. Three out, two in. Getting the direction backwards costs marks in C2.2 as well.","marks":null},{"id":"B2.1-12","q":"Glucose enters intestinal cells against its concentration gradient, but no ATP is used at the transporter. Explain.","a":"This is indirect, or secondary, active transport. The sodium-potassium pump uses ATP to keep the sodium concentration inside the cell low. A cotransporter protein then allows sodium to move into the cell down its steep concentration gradient, and couples that movement to carrying glucose in at the same time, against the glucose gradient. The ATP was spent earlier by the pump — the energy is stored in the sodium gradient and spent here.","note":"HL. The chain is the answer: ATP to the pump, pump to the sodium gradient, sodium gradient to glucose.","marks":null},{"id":"B2.1-13","q":"What is a gated ion channel, and what are the two types you need to know?","a":"A gated ion channel is a channel protein that opens and closes in response to a specific signal, rather than being permanently open. Voltage-gated channels open in response to a change in the membrane potential; ligand-gated channels open when a specific chemical, such as a neurotransmitter, binds to them.","note":"","marks":null},{"id":"B2.1-14","q":"Why does membrane fluidity matter for vesicles?","a":"Because the membrane is fluid, it can break and rejoin without losing its structure. This allows vesicles to bud off from a membrane (fission) and to merge with another membrane (fusion), which is what makes endocytosis, exocytosis and transport between organelles possible. A rigid membrane could not do this.","note":"","marks":null},{"id":"B2.1-15","q":"Someone says 'glucose enters the cell by facilitated diffusion, which uses energy from ATP'. What is wrong?","a":"Facilitated diffusion does not use ATP. It is passive: the substance moves down its own concentration gradient, and the channel or carrier protein simply provides a route through the bilayer for something that could not otherwise cross. The two features that would make it active transport are movement against the gradient and the hydrolysis of ATP, and neither applies here.","note":"","marks":null},{"id":"B2.1-16","q":"How do membrane proteins allow cells to form tissues?","a":"Cell adhesion molecules in the plasma membrane bind to matching molecules on adjacent cells, holding the cells together in a stable arrangement. Glycoproteins on the cell surface also allow cells to recognise one another, so cells of the same type associate and organise into a tissue rather than remaining separate.","note":"HL. Recognition and adhesion are two jobs of the same surface layer — recognition decides which cells bind, adhesion holds them there.","marks":null}],"exam":[{"question":"## Q1. Explain how the structure of phospholipids results in the formation of a bilayer in an aqueous environment. **[4]**","scheme":"- Phospholipids have a hydrophilic (polar) phosphate head and hydrophobic\n  (non-polar) hydrocarbon tails. **[1]**\n- The hydrophilic heads are attracted to / form hydrogen bonds with water. **[1]**\n- The hydrophobic tails are excluded from water / water molecules associate\n  preferentially with each other. **[1]**\n- The result is two layers with heads facing outwards into the aqueous solution\n  on both sides and tails facing inwards. **[1]**\n- Award a mark for stating that this arrangement occurs spontaneously. **[1 max within total]**\n\n_Examiner note: the word \"amphipathic\" earns nothing by itself. The marks are\nfor saying which part goes where and why._"},{"question":"## Q2. Compare and contrast facilitated diffusion and active transport. **[5]**","scheme":"Comparative statements only. Maximum [5]:\n\n- Both move substances across the membrane through (integral / transmembrane)\n  proteins. **[1]**\n- Both are specific — each protein transports particular substances. **[1]**\n- Facilitated diffusion is passive whereas active transport requires ATP. **[1]**\n- Facilitated diffusion moves substances down the concentration gradient\n  whereas active transport moves them against it. **[1]**\n- Facilitated diffusion uses channel or carrier proteins whereas active\n  transport uses pump proteins that change shape. **[1]**\n- Active transport can generate a concentration gradient whereas facilitated\n  diffusion dissipates one. **[1]**\n\n_Examiner note: at least one similarity is required. Writing two separate\ndescriptions caps you well below full marks however accurate each one is._"},{"question":"## Q3. Explain how glucose is absorbed from the small intestine into an epithelial cell against its concentration gradient. **[4]**","scheme":"- The sodium–potassium pump uses ATP to move sodium ions out of the epithelial\n  cell (three Na+ out, two K+ in). **[1]**\n- This maintains a low sodium concentration inside the cell, so a steep sodium\n  concentration gradient exists from the intestinal lumen into the cell. **[1]**\n- A cotransporter protein moves sodium into the cell down that gradient. **[1]**\n- The energy released is used to move glucose into the cell at the same time,\n  against the glucose concentration gradient — indirect / secondary active\n  transport. **[1]**\n\n_Examiner note: an answer that says \"active transport moves glucose in\" scores\none mark at most. The question is asking for the chain, and the chain is the\nreason this example is in the syllabus._"},{"question":"## Q4. Outline the role of cholesterol in the membranes of animal cells. **[3]**","scheme":"- Cholesterol is positioned between phospholipids in the bilayer. **[1]**\n- At higher temperatures it restricts phospholipid movement, reducing\n  fluidity. **[1]**\n- At lower temperatures it prevents phospholipids packing closely together,\n  so the membrane does not become too rigid. **[1]**\n- Accept: it therefore maintains membrane fluidity across a range of\n  temperatures. **[1 max within total]**\n\n_Examiner note: one direction only scores one of the two temperature marks. The\nexaminable idea is that it works both ways._"},{"question":"## Q5. Distinguish between the movement of oxygen and the movement of sodium ions across a plasma membrane. **[3]**","scheme":"- Oxygen crosses by simple diffusion whereas sodium ions require a transport\n  protein. **[1]**\n- Oxygen is small and non-polar so it passes through the hydrophobic core,\n  whereas sodium ions are charged and are repelled by it. **[1]**\n- Oxygen moves only down its concentration gradient (passive), whereas sodium\n  ions can be moved against their gradient by pumps using ATP. **[1]**\n\n_Examiner note: \"distinguish\" wants the contrast in each sentence. Also note\nthat the question says sodium ions, not sodium — the charge is the reason._"}]}},{"code":"B2.2","title":"Organelles and compartmentalization","theme":"B","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"75-76","questionsPage":80,"bookTitle":null,"pack":null},{"code":"B2.3","title":"Cell specialization","theme":"B","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"77-79","questionsPage":80,"bookTitle":null,"pack":null},{"code":"B3.1","title":"Gas exchange","theme":"B","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"115-120","questionsPage":133,"bookTitle":null,"pack":null},{"code":"B3.2","title":"Transport","theme":"B","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"121-128","questionsPage":133,"bookTitle":null,"pack":null},{"code":"B3.3","title":"Muscle and motility","theme":"B","level":3,"levelTitle":"Organisms","hlOnly":true,"pages":"129-132","questionsPage":133,"bookTitle":null,"pack":null},{"code":"B4.1","title":"Adaptation to environment","theme":"B","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"190-194","questionsPage":199,"bookTitle":null,"pack":null},{"code":"B4.2","title":"Ecological niches","theme":"B","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"195-198","questionsPage":199,"bookTitle":null,"pack":null},{"code":"C1.1","title":"Enzymes and metabolism","theme":"C","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"19-25","questionsPage":38,"bookTitle":null,"pack":null},{"code":"C1.2","title":"Cell respiration","theme":"C","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"26-31","questionsPage":38,"bookTitle":null,"pack":{"oneLiner":"Respiration is a controlled, stepwise way of getting the energy out of glucose and into ATP — broken into stages not because biology likes complexity, but because releasing it all at once would waste most of it as heat.","essentials":"\n## Core\n\n- [ ] Explain **ATP as the energy currency**: it is the molecule cells actually\n      spend, it releases usable energy when the terminal phosphate is removed,\n      and it can be regenerated from ADP and phosphate.\n- [ ] Give processes ATP supplies: active transport, protein synthesis, muscle\n      contraction, cell division, nerve impulse transmission.\n- [ ] Describe the **ATP–ADP cycle**: energy from respiration converts ADP + Pi\n      to ATP; hydrolysis of ATP back to ADP + Pi releases it where needed.\n- [ ] Define **cell respiration** as the controlled release of energy from\n      organic compounds to produce ATP — not the same thing as breathing.\n- [ ] Compare **aerobic and anaerobic respiration** in humans and in yeast:\n      the products, the ATP yield, and whether oxygen is required.\n- [ ] State the variables affecting **rate of respiration** and how each is\n      measured (temperature, substrate concentration, oxygen availability).\n\n## Higher level\n\n- [ ] Explain the role of **NAD** as a hydrogen carrier, and define oxidation\n      and reduction in terms of hydrogen and electron transfer.\n- [ ] Describe **glycolysis**: in the cytoplasm, glucose to two pyruvate, net\n      gain of 2 ATP, 2 reduced NAD, no oxygen required.\n- [ ] Explain why **pyruvate is converted to lactate** in anaerobic conditions:\n      to regenerate NAD so that glycolysis can continue.\n- [ ] Describe the **link reaction**: pyruvate is decarboxylated and oxidised in\n      the mitochondrial matrix to form acetyl CoA, releasing CO2 and reducing NAD.\n- [ ] Describe the **Krebs cycle**: in the matrix, a series of oxidations and\n      decarboxylations, producing CO2, reduced NAD, reduced FAD, and ATP.\n- [ ] Describe the **electron transport chain**: reduced NAD and FAD deliver\n      electrons to carriers in the inner mitochondrial membrane; energy released\n      pumps protons into the intermembrane space.\n- [ ] Explain **chemiosmosis**: the proton gradient drives protons back through\n      ATP synthase, and that flow phosphorylates ADP to ATP.\n- [ ] Explain the role of **oxygen as the terminal electron acceptor**, and what\n      happens to the whole chain when it is absent.\n- [ ] Compare **lipids and carbohydrates as respiratory substrates**: lipids\n      yield more energy per gram because they are more reduced (more hydrogen\n      per carbon), but carbohydrates are released faster and can be respired\n      anaerobically.\n\n## Links to other topics\n\n- **C1.1 Enzymes** — every step here is enzyme-catalysed; rate questions pull\n  straight from C1.1.\n- **B2.2 Organelles** — the inner membrane's folding into cristae is surface\n  area for the electron transport chain. Structure serving function.\n- **C1.3 Photosynthesis** — chemiosmosis appears again, in a different\n  membrane, running the other way. Learn it properly once and get both.\n- **B3.1 Gas exchange / B3.2 Transport** — why the oxygen has to arrive at all.\n\n## Vocabulary that has to be exact\n\n| Term | What it means | What it is not |\n| --- | --- | --- |\n| Cell respiration | Releasing energy from organic compounds to make ATP | Breathing / gas exchange |\n| Oxidation | Loss of electrons / loss of hydrogen | Reaction with oxygen only |\n| Reduction | Gain of electrons / gain of hydrogen | Removal of something |\n| Decarboxylation | Removal of a carbon as CO2 | Any loss of carbon |\n| Chemiosmosis | ATP synthesis driven by a proton gradient across a membrane | Electron transport itself |\n| Substrate-level phosphorylation | ATP made by direct transfer of a phosphate group | Chemiosmosis |\n","videos":"\n> **Read this before pressing play.** This is the topic where watching feels\n> most like learning and is least like it. The pathway is easy to follow and\n> hard to reproduce, and following is what a video trains. So the rule here is\n> stricter than usual: one video, then the drawing, then the quiz. Do not watch\n> a second video before you have drawn the pathway from memory once.\n\n## Main\n\n**Alex Lee — C1.2 Cell respiration** (likely split across several videos)\n\n- Channel: \u003chttps://www.youtube.com/@AlexLeeBiology>\n- Find it: \u003chttps://www.youtube.com/results?search_query=Alex+Lee+IB+Biology+C1.2+cell+respiration>\n\nWatch it in **stages, not in one sitting**. Glycolysis one day, link reaction\nand Krebs the next, electron transport chain and chemiosmosis the third. Each\nstage gets its own drawing and its own quiz run. Trying to absorb the whole\npathway in one evening is the single most common way this topic goes wrong.\n\nFor each stage, get these four answers before moving on:\n- **Where** in the cell does it happen?\n- **What goes in?**\n- **What comes out** — including CO2 and reduced NAD, not just ATP?\n- **How much ATP**, and is it substrate-level or chemiosmosis?\n\n## For chemiosmosis specifically\n\n- Find it: \u003chttps://www.youtube.com/results?search_query=chemiosmosis+ATP+synthase+animation+proton+gradient>\n\nWatch an **animation**. Chemiosmosis is a physical, mechanical idea — protons\npushed to one side, flowing back through a turbine. Once you have seen it move,\nthe phrase \"proton gradient drives ATP synthesis\" stops being words and starts\nbeing a picture. This is the highest-value ninety seconds in the topic.\n\n## For the shape of the whole thing\n\n**Crash Course Biology — Respiration**\n\n- Find it: \u003chttps://www.youtube.com/results?search_query=Crash+Course+Biology+cellular+respiration>\n\nFast and not IB-specific, so it is no good for detail. But it is genuinely\nuseful *first*, before Alex Lee, to get the overall shape in your head so the\ndetailed version has somewhere to attach. Ten minutes, once.\n\n## Worth it once, not for revision\n\n- Any good animation of the electron transport chain embedded in the cristae.\n  Seeing how much membrane is folded in there makes the surface-area point\n  (B2.2) obvious rather than memorised.\n\n## Pinned\n\n- Glycolysis:\n- Link + Krebs:\n- ETC + chemiosmosis:\n","traps":"\n## Confusing respiration with breathing\n\n**Commonly written:** \"Respiration is how we take in oxygen.\"\n\n**Why it does not score:** Cell respiration is a chemical process in cells that\nreleases energy from organic compounds to make ATP. Breathing is ventilation.\nExaminers treat this as a definitional error, and it is an easy mark to lose on\na one-mark question.\n\n**Scores instead:** \"Cell respiration is the controlled release of energy from\norganic compounds to produce ATP.\"\n\n## Saying ATP \"stores\" energy long-term\n\n**Commonly written:** \"ATP is where the cell stores its energy.\"\n\n**Why it does not score:** ATP is the short-term, immediately spendable form —\ncurrency, not savings. Cells hold very little of it and regenerate it\nconstantly. Glycogen and lipids are the stores.\n\n**Scores instead:** \"ATP is the immediate source of energy for cellular work,\ncontinually regenerated from ADP and phosphate.\"\n\n## Forgetting that anaerobic respiration still includes glycolysis\n\n**Commonly written:** \"In anaerobic respiration, glucose is converted to\nlactate and no ATP is made.\"\n\n**Why it does not score:** Glycolysis runs in both cases and yields a net 2 ATP.\nAnaerobic respiration is not \"no ATP\", it is \"much less ATP\".\n\n**Scores instead:** \"Glycolysis still occurs, giving a net yield of 2 ATP; the\npyruvate is then converted to lactate.\"\n\n## Not knowing *why* pyruvate becomes lactate\n\n**Commonly written:** \"Pyruvate turns into lactate because there is no oxygen.\"\n\n**Why it does not score:** That is the condition, not the reason. The reason is\nthat the conversion oxidises reduced NAD back to NAD, and glycolysis cannot\ncontinue without a supply of NAD. This is a favourite examiner question\nprecisely because it separates memorising from understanding.\n\n**Scores instead:** \"Converting pyruvate to lactate regenerates NAD from reduced\nNAD, allowing glycolysis — and therefore ATP production — to continue.\"\n\n## Saying oxygen is \"used to make ATP\"\n\n**Commonly written:** \"Oxygen is needed to produce the ATP.\"\n\n**Why it does not score:** It is too vague to credit, and it hides the actual\nmechanism. Oxygen's job is specific: it is the final electron acceptor at the\nend of the electron transport chain, combining with electrons and protons to\nform water. Without it the chain backs up, no proton gradient is maintained,\nand chemiosmosis stops.\n\n**Scores instead:** \"Oxygen acts as the terminal electron acceptor, combining\nwith electrons and hydrogen ions to form water; this keeps the electron\ntransport chain running so the proton gradient is maintained.\"\n\n## Muddling chemiosmosis with the electron transport chain\n\n**Commonly written:** Using the two terms as though they are the same step.\n\n**Why it does not score:** They are two linked things. The electron transport\nchain moves electrons between carriers and uses the energy released to pump\nprotons into the intermembrane space. Chemiosmosis is protons flowing back\nthrough ATP synthase, and that flow making ATP.\n\n**Scores instead:** Keep them separate and state the link: the chain builds the\ngradient, chemiosmosis spends it.\n\n## Getting the locations wrong\n\n**Commonly written:** Glycolysis placed in the mitochondrion.\n\n**Why it does not score:** Glycolysis is in the **cytoplasm**. The link reaction\nand Krebs cycle are in the **matrix**. The electron transport chain and ATP\nsynthase are in the **inner mitochondrial membrane**. Location marks are free\nmarks, and they are lost constantly.\n\n**Scores instead:** Learn the four locations as a set — it is four facts and\nthey appear in almost every question on this topic.\n\n## Saying lipids release more energy \"because they are bigger\"\n\n**Commonly written:** \"Lipids give more energy per gram because the molecules\nare larger.\"\n\n**Why it does not score:** Size is not the mechanism. Lipids are more **reduced**\n— they carry more hydrogen per carbon — so they yield more reduced NAD and FAD,\nand therefore more ATP through chemiosmosis.\n\n**Scores instead:** \"Lipids are more reduced than carbohydrates, with more\nhydrogen per carbon atom, so their oxidation produces more reduced NAD and FAD\nand therefore more ATP per gram.\"\n","cards":[{"id":"C1.2-01","q":"Define cell respiration in the words a mark scheme would accept.","a":"Cell respiration is the controlled release of energy from organic compounds in cells to produce ATP.","note":"Three elements: controlled, from organic compounds, to produce ATP. It is not breathing.","marks":null},{"id":"C1.2-02","q":"Why is ATP described as the energy currency of the cell rather than an energy store?","a":"ATP is the form of energy cells actually spend on work, and it is used almost immediately after it is made. Cells hold only a small quantity and regenerate it continuously from ADP and inorganic phosphate. Long-term energy storage is in glycogen and lipids; ATP is the spendable form in between.","note":"","marks":null},{"id":"C1.2-03","q":"Name four processes in a cell that require ATP.","a":"Active transport across membranes, protein synthesis, muscle contraction, cell division. Also acceptable: transmission of nerve impulses, DNA replication, and movement of cilia or flagella.","note":"","marks":null},{"id":"C1.2-04","q":"Compare aerobic and anaerobic respiration in humans: oxygen, products, and ATP yield.","a":"Aerobic respiration requires oxygen, fully oxidises glucose to carbon dioxide and water, and yields a large amount of ATP per glucose. Anaerobic respiration occurs without oxygen, converts glucose to lactate, and yields only the net 2 ATP from glycolysis. Anaerobic respiration is faster to start and useful for short bursts of intense activity, but cannot be sustained.","note":"","marks":null},{"id":"C1.2-05","q":"How does anaerobic respiration in yeast differ from that in humans?","a":"In yeast, pyruvate is converted to ethanol and carbon dioxide; in humans it is converted to lactate. Both regenerate NAD so glycolysis can continue, and both yield only the 2 ATP from glycolysis. The yeast pathway is the basis of brewing and of the rise in bread dough.","note":"","marks":null},{"id":"C1.2-06","q":"What is the role of NAD in respiration? Define oxidation and reduction as you answer.","a":"NAD is a hydrogen carrier. It accepts hydrogen atoms (and so electrons) released when substrates are oxidised, becoming reduced NAD, and carries them to the electron transport chain where it is re-oxidised. Oxidation is the loss of electrons or hydrogen; reduction is the gain of electrons or hydrogen.","note":"HL. NAD being regenerated is the thread that ties glycolysis, fermentation and the ETC together.","marks":null},{"id":"C1.2-07","q":"Glycolysis: where, what in, what out, how much ATP, oxygen needed?","a":"In the cytoplasm. Glucose (6 carbons) in; two pyruvate (3 carbons each) out. Net gain of 2 ATP by substrate-level phosphorylation, and 2 reduced NAD. No oxygen is required, which is why glycolysis runs in both aerobic and anaerobic conditions.","note":"Two ATP are invested first and four produced, hence a net of two. The word 'net' is often the mark.","marks":null},{"id":"C1.2-08","q":"In anaerobic conditions, why is pyruvate converted to lactate? Give the reason, not the condition.","a":"To regenerate NAD. Converting pyruvate to lactate oxidises reduced NAD back to NAD, and glycolysis requires a supply of NAD to continue. Without that regeneration, glycolysis would stop and even the small anaerobic ATP yield would cease.","note":"'Because there is no oxygen' describes when it happens, not why it helps. This distinction is examined often.","marks":null},{"id":"C1.2-09","q":"The link reaction: where, what happens, what comes out?","a":"In the mitochondrial matrix. Each pyruvate is decarboxylated, releasing one carbon dioxide, and oxidised, reducing one NAD. The remaining two-carbon acetyl group binds to coenzyme A to form acetyl CoA, which enters the Krebs cycle. No ATP is produced directly.","note":"","marks":null},{"id":"C1.2-10","q":"The Krebs cycle: where, and what are its products per turn?","a":"In the mitochondrial matrix. Per turn: two carbon dioxide released by decarboxylation, three reduced NAD and one reduced FAD from the oxidations, and one ATP by substrate-level phosphorylation. Acetyl CoA combines with a four-carbon compound to form a six-carbon compound, which is then progressively oxidised and decarboxylated to regenerate the four-carbon acceptor.","note":"Two turns per glucose, because glycolysis produced two pyruvate.","marks":null},{"id":"C1.2-11","q":"Describe the electron transport chain, including where it is and what it achieves.","a":"It is a series of electron carriers in the inner mitochondrial membrane. Reduced NAD and reduced FAD deliver electrons to the chain and are re-oxidised. As electrons pass from carrier to carrier they release energy, which is used to pump protons from the matrix into the intermembrane space, creating a proton concentration gradient across the inner membrane.","note":"","marks":null},{"id":"C1.2-12","q":"Explain chemiosmosis.","a":"Protons accumulated in the intermembrane space diffuse back into the matrix down their concentration gradient, and can only do so through ATP synthase. The flow of protons through ATP synthase drives the enzyme, which phosphorylates ADP to produce ATP. So the gradient built by the electron transport chain is what is actually spent to make most of the cell's ATP.","note":"The chain builds the gradient; chemiosmosis spends it. Keep the two steps separate in your answer.","marks":null},{"id":"C1.2-13","q":"What is the role of oxygen in aerobic respiration, and what happens without it?","a":"Oxygen is the terminal electron acceptor at the end of the electron transport chain, combining with electrons and hydrogen ions to form water. This removes electrons from the chain so it can keep running. Without oxygen the chain backs up, carriers stay reduced, the proton gradient is not maintained, chemiosmosis stops, and NAD is no longer regenerated — so the Krebs cycle and link reaction halt, leaving only glycolysis.","note":"","marks":null},{"id":"C1.2-14","q":"Where does each of the four stages of aerobic respiration take place?","a":"Glycolysis: cytoplasm. Link reaction: mitochondrial matrix. Krebs cycle: mitochondrial matrix. Electron transport chain and ATP synthase: inner mitochondrial membrane, folded into cristae.","note":"Free marks, lost constantly. Learn the four as a set.","marks":null},{"id":"C1.2-15","q":"Why do lipids yield more energy per gram than carbohydrates?","a":"Lipids are more reduced than carbohydrates — they contain more hydrogen per carbon atom. Oxidising them therefore releases more hydrogen to NAD and FAD, producing more reduced carriers, which deliver more electrons to the electron transport chain and so generate more ATP by chemiosmosis per gram of substrate.","note":"The mechanism is 'more reduced / more hydrogen per carbon', not 'bigger molecules'.","marks":null},{"id":"C1.2-16","q":"Give one advantage carbohydrates have over lipids as a respiratory substrate.","a":"Carbohydrates can be respired anaerobically, since glycolysis does not require oxygen, whereas lipid respiration requires the aerobic pathway. Carbohydrates are also mobilised and oxidised more rapidly, so they suit short bursts of high demand.","note":"","marks":null},{"id":"C1.2-17","q":"Name three variables that affect the rate of cell respiration.","a":"Temperature (affecting enzyme activity, with a rate that falls off after the optimum as enzymes denature), substrate or glucose concentration, and oxygen availability. Rate can be measured with a respirometer, by oxygen consumption or carbon dioxide production.","note":"","marks":null}],"exam":[{"question":"## Q1. Outline the role of NAD in aerobic cell respiration. **[3]**","scheme":"- NAD acts as a hydrogen (and electron) carrier. **[1]**\n- It is reduced when it accepts hydrogen released during the oxidation of\n  substrates in glycolysis, the link reaction and the Krebs cycle. **[1]**\n- Reduced NAD carries these to the electron transport chain, where it is\n  oxidised back to NAD and the electrons are passed to the carriers. **[1]**\n- Accept: NAD is thereby regenerated for reuse. **[1 max within total]**\n\n_Examiner note: the cycle is the point — reduced somewhere, re-oxidised\nsomewhere else. An answer that only says \"NAD carries hydrogen\" gets one mark._"},{"question":"## Q2. Explain why the conversion of pyruvate to lactate allows anaerobic respiration to continue. **[3]**","scheme":"- The conversion oxidises reduced NAD back to NAD. **[1]**\n- Glycolysis requires a supply of NAD to oxidise its substrate / cannot proceed\n  without NAD. **[1]**\n- Regenerating NAD therefore allows glycolysis, and so the net production of\n  2 ATP, to continue in the absence of oxygen. **[1]**\n\n_Examiner note: \"because there is no oxygen\" states the condition and scores\nnothing. The question is why this particular conversion helps._"},{"question":"## Q3. Explain how ATP is synthesised by chemiosmosis in a mitochondrion. **[5]**","scheme":"- Electrons from reduced NAD (and reduced FAD) pass along the electron\n  transport chain in the inner mitochondrial membrane. **[1]**\n- Energy released as electrons pass between carriers is used to pump protons\n  (H+) from the matrix into the intermembrane space. **[1]**\n- This establishes a proton concentration gradient / higher H+ concentration in\n  the intermembrane space. **[1]**\n- Protons diffuse back into the matrix down this gradient through ATP\n  synthase. **[1]**\n- The flow of protons through ATP synthase drives the phosphorylation of ADP to\n  ATP. **[1]**\n- Oxygen acts as the terminal electron acceptor, forming water, allowing the\n  chain to continue. **[1 max within total]**\n\n_Examiner note: this is a sequence question. Marks are awarded for the steps in\na workable order — an answer containing all the right nouns in no particular\norder will not score five._"},{"question":"## Q4. Compare and contrast lipids and carbohydrates as respiratory substrates. **[4]**","scheme":"Comparative statements only. Maximum [4]:\n\n- Both can be oxidised in aerobic cell respiration to produce ATP. **[1]**\n- Lipids release more energy per gram than carbohydrates. **[1]**\n- Because lipids are more reduced / contain more hydrogen per carbon atom, so\n  more reduced NAD and FAD are produced. **[1]**\n- Carbohydrates can be respired anaerobically whereas lipids cannot. **[1]**\n- Carbohydrates are mobilised / respired more rapidly than lipids. **[1]**\n\n_Examiner note: the \"more reduced\" mark is the one that separates grades here.\n\"Lipids have more energy\" restates the first point without explaining it._"},{"question":"## Q5. State the precise location of each stage of aerobic cell respiration in a eukaryotic cell. **[4]**","scheme":"- Glycolysis: cytoplasm. **[1]**\n- Link reaction: mitochondrial matrix. **[1]**\n- Krebs cycle: mitochondrial matrix. **[1]**\n- Electron transport chain and ATP synthase: inner mitochondrial membrane\n  (cristae). **[1]**\n\n_Examiner note: \"mitochondrion\" alone is not precise enough for the last three.\nThe question said precise, and matrix versus inner membrane is the distinction\nbeing tested._"},{"question":"## Q6. Distinguish between cell respiration and gas exchange. **[2]**","scheme":"- Cell respiration is a chemical process within cells that releases energy from\n  organic compounds to produce ATP, whereas gas exchange is the movement of\n  oxygen and carbon dioxide between an organism and its environment. **[1]**\n- Cell respiration occurs in all living cells continuously, whereas gas exchange\n  occurs at a specialised surface. **[1]**\n\n_Examiner note: a free two marks if you have kept the words separate all year,\nand a guaranteed zero if you have not._"}]}},{"code":"C1.3","title":"Photosynthesis","theme":"C","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"32-37","questionsPage":38,"bookTitle":null,"pack":null},{"code":"C2.1","title":"Chemical signalling","theme":"C","level":2,"levelTitle":"Cells","hlOnly":true,"pages":"81-85","questionsPage":93,"bookTitle":null,"pack":null},{"code":"C2.2","title":"Neural signalling","theme":"C","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"86-92","questionsPage":93,"bookTitle":null,"pack":null},{"code":"C3.1","title":"Integration of body systems","theme":"C","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"134-143","questionsPage":150,"bookTitle":null,"pack":null},{"code":"C3.2","title":"Defence against disease","theme":"C","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"144-149","questionsPage":150,"bookTitle":null,"pack":null},{"code":"C4.1","title":"Populations and communities","theme":"C","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"200-207","questionsPage":214,"bookTitle":null,"pack":null},{"code":"C4.2","title":"Transfers of energy and matter","theme":"C","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"208-213","questionsPage":214,"bookTitle":null,"pack":null},{"code":"D1.1","title":"DNA replication","theme":"D","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"39-42","questionsPage":55,"bookTitle":null,"pack":null},{"code":"D1.2","title":"Protein synthesis","theme":"D","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"43-49","questionsPage":55,"bookTitle":null,"pack":null},{"code":"D1.3","title":"Mutation and gene editing","theme":"D","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"50-54","questionsPage":55,"bookTitle":null,"pack":null},{"code":"D2.1","title":"Cell and nuclear division","theme":"D","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"94-98","questionsPage":104,"bookTitle":null,"pack":null},{"code":"D2.2","title":"Gene expression","theme":"D","level":2,"levelTitle":"Cells","hlOnly":true,"pages":"99-100","questionsPage":104,"bookTitle":null,"pack":null},{"code":"D2.3","title":"Water potential","theme":"D","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"101-103","questionsPage":104,"bookTitle":null,"pack":null},{"code":"D3.1","title":"Reproduction","theme":"D","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"151-160","questionsPage":178,"bookTitle":null,"pack":null},{"code":"D3.2","title":"Inheritance","theme":"D","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"161-171","questionsPage":178,"bookTitle":null,"pack":null},{"code":"D3.3","title":"Homeostasis","theme":"D","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"172-177","questionsPage":178,"bookTitle":null,"pack":null},{"code":"D4.1","title":"Natural selection","theme":"D","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"215-219","questionsPage":233,"bookTitle":null,"pack":null},{"code":"D4.2","title":"Stability and change","theme":"D","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"220-226","questionsPage":233,"bookTitle":"Sustainability and changes","pack":null},{"code":"D4.3","title":"Climate change","theme":"D","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"227-232","questionsPage":233,"bookTitle":null,"pack":null}],"builtAt":"2026-09-21"};</script>
