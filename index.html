{"text":"The direction of cholesterol's effect depends on temperature, so one flat statement misses the buffering role.","correct":true,"why":"That’s exactly why it fails."},{"text":"This replaces the molecular explanation with an unnamed process. The examiner wants the hydrophilic and hydrophobic regions related to water.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying the cell assembles the bilayer."},{"text":"“Repels” suggests a force pushing the ion away. The key idea is that transfer of a charged particle from water into a non-polar environment is energetically unfavourable.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying the hydrophobic core repels ions."},{"text":"Facilitated diffusion is passive. A protein supplies a selective route, but net movement remains down a concentration or electrochemical gradient.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: giving facilitated diffusion an ATP cost."}],"after":{"label":"What would have scored","text":"Cholesterol reduces excessive fluidity at higher temperatures and prevents close phospholipid packing at lower temperatures."}},{"id":"B2.1-t7","topic":"B2.1","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"The pump moves two sodium ions out and three potassium ions in.","prompt":"Why does it fail?","options":[{"text":"The numbers and directions are reversed, removing the unequal charge transfer that makes the pump electrogenic.","correct":true,"why":"That’s exactly why it fails."},{"text":"This replaces the molecular explanation with an unnamed process. The examiner wants the hydrophilic and hydrophobic regions related to water.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying the cell assembles the bilayer."},{"text":"“Repels” suggests a force pushing the ion away. The key idea is that transfer of a charged particle from water into a non-polar environment is energetically unfavourable.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying the hydrophobic core repels ions."},{"text":"Facilitated diffusion is passive. A protein supplies a selective route, but net movement remains down a concentration or electrochemical gradient.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: giving facilitated diffusion an ATP cost."}],"after":{"label":"What would have scored","text":"For each ATP hydrolyzed, the pump moves three Na+ out and two K+ in, making the cell interior relatively more negative."}},{"id":"B2.1-t8","topic":"B2.1","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"The sodium–glucose cotransporter uses ATP to bring glucose into the cell.","prompt":"Why does it fail?","options":[{"text":"ATP is hydrolyzed by the sodium–potassium pump. The cotransporter uses energy stored in the Na+ electrochemical gradient.","correct":true,"why":"That’s exactly why it fails."},{"text":"This replaces the molecular explanation with an unnamed process. The examiner wants the hydrophilic and hydrophobic regions related to water.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying the cell assembles the bilayer."},{"text":"“Repels” suggests a force pushing the ion away. The key idea is that transfer of a charged particle from water into a non-polar environment is energetically unfavourable.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying the hydrophobic core repels ions."},{"text":"Facilitated diffusion is passive. A protein supplies a selective route, but net movement remains down a concentration or electrochemical gradient.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: giving facilitated diffusion an ATP cost."}],"after":{"label":"What would have scored","text":"The sodium–potassium pump uses ATP to establish a Na+ gradient, and Na+ moving down that gradient through the cotransporter drives glucose uptake against its gradient."}}]}},{"code":"B2.2","title":"Organelles and compartmentalization","theme":"B","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"75-76","questionsPage":80,"bookTitle":null,"pack":null},{"code":"B2.3","title":"Cell specialization","theme":"B","level":2,"levelTitle":"Cells","hlOnly":false,"pages":"77-79","questionsPage":80,"bookTitle":null,"pack":null},{"code":"B3.1","title":"Gas exchange","theme":"B","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"115-120","questionsPage":133,"bookTitle":null,"pack":null},{"code":"B3.2","title":"Transport","theme":"B","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"121-128","questionsPage":133,"bookTitle":null,"pack":null},{"code":"B3.3","title":"Muscle and motility","theme":"B","level":3,"levelTitle":"Organisms","hlOnly":true,"pages":"129-132","questionsPage":133,"bookTitle":null,"pack":null},{"code":"B4.1","title":"Adaptation to environment","theme":"B","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"190-194","questionsPage":199,"bookTitle":null,"pack":null},{"code":"B4.2","title":"Ecological niches","theme":"B","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"195-198","questionsPage":199,"bookTitle":null,"pack":null},{"code":"C1.1","title":"Enzymes and metabolism","theme":"C","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"19-25","questionsPage":38,"bookTitle":null,"pack":null},{"code":"C1.2","title":"Cell respiration","theme":"C","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"26-31","questionsPage":38,"bookTitle":null,"pack":{"oneLiner":"Respiration is a controlled, stepwise way of getting the energy out of glucose and into ATP — broken into stages not because biology likes complexity, but because releasing it all at once would waste most of it as heat.","essentials":"\n## Core\n\n- [ ] Explain **ATP as the energy currency**: it’s the molecule cells actually\n      spend, it releases usable energy when the terminal phosphate is removed,\n      and it can be regenerated from ADP and phosphate.\n- [ ] Give processes ATP supplies: active transport, protein synthesis, muscle\n      contraction, cell division, nerve impulse transmission.\n- [ ] Describe the **ATP–ADP cycle**: energy from respiration converts ADP + Pi\n      to ATP; hydrolysis of ATP back to ADP + Pi releases it where needed.\n- [ ] Define **cell respiration** as the controlled release of energy from\n      organic compounds to produce ATP. It isn’t the same thing as breathing.\n- [ ] Compare **aerobic and anaerobic respiration** in humans and in yeast:\n      the products, the ATP yield, and whether oxygen is required.\n- [ ] State the variables affecting **rate of respiration** and how each is\n      measured (temperature, substrate concentration, oxygen availability).\n\n## Higher level\n\n- [ ] Explain the role of **NAD** as a hydrogen carrier, and define oxidation\n      and reduction in terms of hydrogen and electron transfer.\n- [ ] Describe **glycolysis**: in the cytoplasm, glucose to two pyruvate, net\n      gain of 2 ATP, 2 reduced NAD, no oxygen required.\n- [ ] Explain why **pyruvate is converted to lactate** in anaerobic conditions:\n      to regenerate NAD so that glycolysis can continue.\n- [ ] Describe the **link reaction**: pyruvate is decarboxylated and oxidized in\n      the mitochondrial matrix to form acetyl CoA, releasing CO2 and reducing NAD.\n- [ ] Describe the **Krebs cycle**: in the matrix, a series of oxidations and\n      decarboxylations, producing CO2, reduced NAD, reduced FAD, and ATP.\n- [ ] Describe the **electron transport chain**: reduced NAD and FAD deliver\n      electrons to carriers in the inner mitochondrial membrane; energy released\n      pumps protons into the intermembrane space.\n- [ ] Explain **chemiosmosis**: the proton gradient drives protons back through\n      ATP synthase, and that flow phosphorylates ADP to ATP.\n- [ ] Explain the role of **oxygen as the terminal electron acceptor**, and what\n      happens to the whole chain when it’s absent.\n- [ ] Compare **lipids and carbohydrates as respiratory substrates**: lipids\n      yield more energy per gram because they are more reduced (more hydrogen\n      per carbon), but carbohydrates are released faster and can be respired\n      anaerobically.\n\n## Links to other topics\n\n- **C1.1 Enzymes** — every step here is enzyme-catalyzed; rate questions pull\n  straight from C1.1.\n- **B2.2 Organelles** — the inner membrane's folding into cristae is surface\n  area for the electron transport chain. Structure serving function.\n- **C1.3 Photosynthesis** — chemiosmosis appears again, in a different\n  membrane, running the other way. Learn it properly once and get both.\n- **B3.1 Gas exchange / B3.2 Transport** — why the oxygen has to arrive at all.\n\n## Vocabulary that has to be exact\n\n| Term | What it means | What it’s not |\n| --- | --- | --- |\n| Cell respiration | Releasing energy from organic compounds to make ATP | Breathing / gas exchange |\n| Oxidation | Loss of electrons / loss of hydrogen | Reaction with oxygen only |\n| Reduction | Gain of electrons / gain of hydrogen | Removal of something |\n| Decarboxylation | Removal of a carbon as CO2 | Any loss of carbon |\n| Chemiosmosis | ATP synthesis driven by a proton gradient across a membrane | Electron transport itself |\n| Substrate-level phosphorylation | ATP made by direct transfer of a phosphate group | Chemiosmosis |\n","videos":"\n> **Read this before pressing play.** This is the topic where watching feels\n> most like learning and is least like it. The pathway is easy to follow and\n> hard to reproduce, and following is what a video trains. So the rule here is\n> stricter than usual: one video, then the drawing, then the quiz. Don’t watch\n> a second video before you’ve drawn the pathway from memory once.\n\n## Main\n\n**Alex Lee — C1.2 Cell respiration** (likely split across several videos)\n\n- Channel: \u003chttps://www.youtube.com/@misterleescience> — verified\n- Find it: \u003chttps://www.youtube.com/results?search_query=Mister+Lee+Science+C1.2+cell+respiration>\n\nWatch it in **stages, not in one sitting**. Glycolysis one day, link reaction\nand Krebs the next, electron transport chain and chemiosmosis the third. Each\nstage gets its own drawing and its own quiz run. Trying to absorb the whole\npathway in one evening is the single most common way this topic goes wrong.\n\nFor each stage, get these four answers before moving on:\n- **Where** in the cell does it happen?\n- **What goes in?**\n- **What comes out** — including CO2 and reduced NAD, not just ATP?\n- **How much ATP**, and is it substrate-level or chemiosmosis?\n\n## For chemiosmosis specifically\n\n- Find it: \u003chttps://www.youtube.com/results?search_query=chemiosmosis+ATP+synthase+animation+proton+gradient>\n\nWatch an **animation**. Chemiosmosis is a physical, mechanical idea — protons\npushed to one side, flowing back through a turbine. Once you’ve seen it move,\nthe phrase \"proton gradient drives ATP synthesis\" stops being words and starts\nbeing a picture. This is the highest-value ninety seconds in the topic.\n\n## For the shape of the whole thing\n\n**Crash Course Biology — Respiration**\n\n- Find it: \u003chttps://www.youtube.com/results?search_query=Crash+Course+Biology+cellular+respiration>\n\nFast and not IB-specific, so it’s no good for detail. But it’s genuinely\nuseful *first*, before Alex Lee, to get the overall shape in your head so the\ndetailed version has somewhere to attach. Ten minutes, once.\n\n## Worth it once, not for revision\n\n- Any good animation of the electron transport chain embedded in the cristae.\n  Seeing how much membrane is folded in there makes the surface-area point\n  (B2.2) obvious rather than memorized.\n\n## Pinned\n\n- Glycolysis:\n- Link + Krebs:\n- ETC + chemiosmosis:\n","traps":"\n## Confusing respiration with breathing\n\n**Commonly written:** \"Respiration is how we take in oxygen.\"\n\n**Why it doesn’t score:** Cell respiration is a chemical process in cells that\nreleases energy from organic compounds to make ATP. Breathing is ventilation.\nExaminers treat this as a definitional error, and it’s an easy mark to lose on\na one-mark question.\n\n**Scores instead:** \"Cell respiration is the controlled release of energy from\norganic compounds to produce ATP.\"\n\n## Saying ATP \"stores\" energy long-term\n\n**Commonly written:** \"ATP is where the cell stores its energy.\"\n\n**Why it doesn’t score:** ATP is the short-term, immediately spendable form —\ncurrency, not savings. Cells hold very little of it and regenerate it\nconstantly. Glycogen and lipids are the stores.\n\n**Scores instead:** \"ATP is the immediate source of energy for cellular work,\ncontinually regenerated from ADP and phosphate.\"\n\n## Forgetting that anaerobic respiration still includes glycolysis\n\n**Commonly written:** \"In anaerobic respiration, glucose is converted to\nlactate and no ATP is made.\"\n\n**Why it doesn’t score:** Glycolysis runs in both cases and yields a net 2 ATP.\nAnaerobic respiration isn’t \"no ATP\", it’s \"much less ATP\".\n\n**Scores instead:** \"Glycolysis still occurs, giving a net yield of 2 ATP; the\npyruvate is then converted to lactate.\"\n\n## Not knowing *why* pyruvate becomes lactate\n\n**Commonly written:** \"Pyruvate turns into lactate because there’s no oxygen.\"\n\n**Why it doesn’t score:** That’s the condition, not the reason. The reason is\nthat the conversion oxidizes reduced NAD back to NAD, and glycolysis can’t\ncontinue without a supply of NAD. This is a favourite examiner question\nprecisely because it separates memorizing from understanding.\n\n**Scores instead:** \"Converting pyruvate to lactate regenerates NAD from reduced\nNAD, allowing glycolysis, and therefore ATP production, to continue.\"\n\n## Saying oxygen is \"used to make ATP\"\n\n**Commonly written:** \"Oxygen is needed to produce the ATP.\"\n\n**Why it doesn’t score:** It’s too vague to credit, and it hides the actual\nmechanism. Oxygen's job is specific: it’s the final electron acceptor at the\nend of the electron transport chain, combining with electrons and protons to\nform water. Without it the chain backs up, no proton gradient is maintained,\nand chemiosmosis stops.\n\n**Scores instead:** \"Oxygen acts as the terminal electron acceptor, combining\nwith electrons and hydrogen ions to form water; this keeps the electron\ntransport chain running so the proton gradient is maintained.\"\n\n## Muddling chemiosmosis with the electron transport chain\n\n**Commonly written:** Using the two terms as though they are the same step.\n\n**Why it doesn’t score:** They are two linked things. The electron transport\nchain moves electrons between carriers and uses the energy released to pump\nprotons into the intermembrane space. Chemiosmosis is protons flowing back\nthrough ATP synthase, and that flow making ATP.\n\n**Scores instead:** Keep them separate and state the link: the chain builds the\ngradient, chemiosmosis spends it.\n\n## Getting the locations wrong\n\n**Commonly written:** Glycolysis placed in the mitochondrion.\n\n**Why it doesn’t score:** Glycolysis is in the **cytoplasm**. The link reaction\nand Krebs cycle are in the **matrix**. The electron transport chain and ATP\nsynthase are in the **inner mitochondrial membrane**. Location marks are free\nmarks, and they are lost constantly.\n\n**Scores instead:** Learn the four locations as a set. It’s four facts and\nthey appear in almost every question on this topic.\n\n## Saying lipids release more energy \"because they are bigger\"\n\n**Commonly written:** \"Lipids give more energy per gram because the molecules\nare larger.\"\n\n**Why it doesn’t score:** Size isn’t the mechanism. Lipids are more **reduced**\n— they carry more hydrogen per carbon, so they yield more reduced NAD and FAD,\nand therefore more ATP through chemiosmosis.\n\n**Scores instead:** \"Lipids are more reduced than carbohydrates, with more\nhydrogen per carbon atom, so their oxidation produces more reduced NAD and FAD\nand therefore more ATP per gram.\"\n","cards":[{"id":"C1.2-01","q":"Define cell respiration in the words a mark scheme would accept.","a":"Cell respiration is the controlled release of energy from organic compounds in cells to produce ATP.","note":"Three elements: controlled, from organic compounds, to produce ATP. It’s not breathing.","marks":null},{"id":"C1.2-02","q":"Why is ATP described as the energy currency of the cell rather than an energy store?","a":"ATP is the form of energy cells actually spend on work, and it’s used almost immediately after it’s made. Cells hold only a small quantity and regenerate it continuously from ADP and inorganic phosphate. Long-term energy storage is in glycogen and lipids; ATP is the spendable form in between.","note":"","marks":null},{"id":"C1.2-03","q":"Name four processes in a cell that require ATP.","a":"Active transport across membranes, protein synthesis, muscle contraction, cell division. Also acceptable: transmission of nerve impulses, DNA replication, and movement of cilia or flagella.","note":"","marks":null},{"id":"C1.2-04","q":"Compare aerobic and anaerobic respiration in humans: oxygen, products, and ATP yield.","a":"Aerobic respiration requires oxygen, fully oxidizes glucose to carbon dioxide and water, and yields a large amount of ATP per glucose. Anaerobic respiration occurs without oxygen, converts glucose to lactate, and yields only the net 2 ATP from glycolysis. Anaerobic respiration is faster to start and useful for short bursts of intense activity, but can’t be sustained.","note":"","marks":null},{"id":"C1.2-05","q":"How does anaerobic respiration in yeast differ from that in humans?","a":"In yeast, pyruvate is converted to ethanol and carbon dioxide; in humans it’s converted to lactate. Both regenerate NAD so glycolysis can continue, and both yield only the 2 ATP from glycolysis. The yeast pathway is the basis of brewing and of the rise in bread dough.","note":"","marks":null},{"id":"C1.2-06","q":"What is the role of NAD in respiration? Define oxidation and reduction as you answer.","a":"NAD is a hydrogen carrier. It accepts hydrogen atoms (and so electrons) released when substrates are oxidized, becoming reduced NAD, and carries them to the electron transport chain where it’s re-oxidized. Oxidation is the loss of electrons or hydrogen; reduction is the gain of electrons or hydrogen.","note":"HL. NAD being regenerated is the thread that ties glycolysis, fermentation and the ETC together.","marks":null},{"id":"C1.2-07","q":"Glycolysis: where, what in, what out, how much ATP, oxygen needed?","a":"In the cytoplasm. Glucose (6 carbons) in; two pyruvate (3 carbons each) out. Net gain of 2 ATP by substrate-level phosphorylation, and 2 reduced NAD. No oxygen is required, which is why glycolysis runs in both aerobic and anaerobic conditions.","note":"Two ATP are invested first and four produced, hence a net of two. The word 'net' is often the mark.","marks":null},{"id":"C1.2-08","q":"In anaerobic conditions, why is pyruvate converted to lactate? Give the reason, not the condition.","a":"To regenerate NAD. Converting pyruvate to lactate oxidizes reduced NAD back to NAD, and glycolysis requires a supply of NAD to continue. Without that regeneration, glycolysis would stop and even the small anaerobic ATP yield would cease.","note":"'Because there’s no oxygen' describes when it happens, not why it helps. This distinction is examined often.","marks":null},{"id":"C1.2-09","q":"The link reaction: where, what happens, what comes out?","a":"In the mitochondrial matrix. Each pyruvate is decarboxylated, releasing one carbon dioxide, and oxidized, reducing one NAD. The remaining two-carbon acetyl group binds to coenzyme A to form acetyl CoA, which enters the Krebs cycle. No ATP is produced directly.","note":"","marks":null},{"id":"C1.2-10","q":"The Krebs cycle: where, and what are its products per turn?","a":"In the mitochondrial matrix. Per turn: two carbon dioxide released by decarboxylation, three reduced NAD and one reduced FAD from the oxidations, and one ATP by substrate-level phosphorylation. Acetyl CoA combines with a four-carbon compound to form a six-carbon compound, which is then progressively oxidized and decarboxylated to regenerate the four-carbon acceptor.","note":"Two turns per glucose, because glycolysis produced two pyruvate.","marks":null},{"id":"C1.2-11","q":"Describe the electron transport chain, including where it’s and what it achieves.","a":"It’s a series of electron carriers in the inner mitochondrial membrane. Reduced NAD and reduced FAD deliver electrons to the chain and are re-oxidized. As electrons pass from carrier to carrier they release energy, which is used to pump protons from the matrix into the intermembrane space, creating a proton concentration gradient across the inner membrane.","note":"","marks":null},{"id":"C1.2-12","q":"Explain chemiosmosis.","a":"Protons accumulated in the intermembrane space diffuse back into the matrix down their concentration gradient, and can only do so through ATP synthase. The flow of protons through ATP synthase drives the enzyme, which phosphorylates ADP to produce ATP. So the gradient built by the electron transport chain is what is actually spent to make most of the cell's ATP.","note":"The chain builds the gradient; chemiosmosis spends it. Keep the two steps separate in your answer.","marks":null},{"id":"C1.2-13","q":"What is the role of oxygen in aerobic respiration, and what happens without it?","a":"Oxygen is the terminal electron acceptor at the end of the electron transport chain, combining with electrons and hydrogen ions to form water. This removes electrons from the chain so it can keep running. Without oxygen the chain backs up, carriers stay reduced, the proton gradient isn’t maintained, chemiosmosis stops, and NAD is no longer regenerated — so the Krebs cycle and link reaction halt, leaving only glycolysis.","note":"","marks":null},{"id":"C1.2-14","q":"Where does each of the four stages of aerobic respiration take place?","a":"Glycolysis: cytoplasm. Link reaction: mitochondrial matrix. Krebs cycle: mitochondrial matrix. Electron transport chain and ATP synthase: inner mitochondrial membrane, folded into cristae.","note":"Free marks, lost constantly. Learn the four as a set.","marks":null},{"id":"C1.2-15","q":"Why do lipids yield more energy per gram than carbohydrates?","a":"Lipids are more reduced than carbohydrates — they contain more hydrogen per carbon atom. Oxidizing them therefore releases more hydrogen to NAD and FAD, producing more reduced carriers, which deliver more electrons to the electron transport chain and so generate more ATP by chemiosmosis per gram of substrate.","note":"The mechanism is 'more reduced / more hydrogen per carbon', not 'bigger molecules'.","marks":null},{"id":"C1.2-16","q":"Give one advantage carbohydrates have over lipids as a respiratory substrate.","a":"Carbohydrates can be respired anaerobically, since glycolysis doesn’t require oxygen, whereas lipid respiration requires the aerobic pathway. Carbohydrates are also mobilized and oxidized more rapidly, so they suit short bursts of high demand.","note":"","marks":null},{"id":"C1.2-17","q":"Name three variables that affect the rate of cell respiration.","a":"Temperature (affecting enzyme activity, with a rate that falls off after the optimum as enzymes denature), substrate or glucose concentration, and oxygen availability. Rate can be measured with a respirometer, by oxygen consumption or carbon dioxide production.","note":"","marks":null}],"exam":[{"question":"## Q1. Outline the role of NAD in aerobic cell respiration. **[3]**","scheme":"- NAD acts as a hydrogen (and electron) carrier. **[1]**\n- It’s reduced when it accepts hydrogen released during the oxidation of\n  substrates in glycolysis, the link reaction and the Krebs cycle. **[1]**\n- Reduced NAD carries these to the electron transport chain, where it’s\n  oxidized back to NAD and the electrons are passed to the carriers. **[1]**\n- Accept: NAD is thereby regenerated for reuse. **[1 max within total]**\n\n_Examiner note: the cycle is the point — reduced somewhere, re-oxidized\nsomewhere else. An answer that only says \"NAD carries hydrogen\" gets one mark._"},{"question":"## Q2. Explain why the conversion of pyruvate to lactate allows anaerobic respiration to continue. **[3]**","scheme":"- The conversion oxidizes reduced NAD back to NAD. **[1]**\n- Glycolysis requires a supply of NAD to oxidize its substrate / can’t proceed\n  without NAD. **[1]**\n- Regenerating NAD therefore allows glycolysis, and so the net production of\n  2 ATP, to continue in the absence of oxygen. **[1]**\n\n_Examiner note: \"because there’s no oxygen\" states the condition and scores\nnothing. The question is why this particular conversion helps._"},{"question":"## Q3. Explain how ATP is synthesized by chemiosmosis in a mitochondrion. **[5]**","scheme":"- Electrons from reduced NAD (and reduced FAD) pass along the electron\n  transport chain in the inner mitochondrial membrane. **[1]**\n- Energy released as electrons pass between carriers is used to pump protons\n  (H+) from the matrix into the intermembrane space. **[1]**\n- This establishes a proton concentration gradient / higher H+ concentration in\n  the intermembrane space. **[1]**\n- Protons diffuse back into the matrix down this gradient through ATP\n  synthase. **[1]**\n- The flow of protons through ATP synthase drives the phosphorylation of ADP to\n  ATP. **[1]**\n- Oxygen acts as the terminal electron acceptor, forming water, allowing the\n  chain to continue. **[1 max within total]**\n\n_Examiner note: this is a sequence question. Marks are awarded for the steps in\na workable order — an answer containing all the right nouns in no particular\norder won’t score five._"},{"question":"## Q4. Compare and contrast lipids and carbohydrates as respiratory substrates. **[4]**","scheme":"Comparative statements only. Maximum [4]:\n\n- Both can be oxidized in aerobic cell respiration to produce ATP. **[1]**\n- Lipids release more energy per gram than carbohydrates. **[1]**\n- Because lipids are more reduced / contain more hydrogen per carbon atom, so\n  more reduced NAD and FAD are produced. **[1]**\n- Carbohydrates can be respired anaerobically whereas lipids cannot. **[1]**\n- Carbohydrates are mobilized / respired more rapidly than lipids. **[1]**\n\n_Examiner note: the \"more reduced\" mark is the one that separates grades here.\n\"Lipids have more energy\" restates the first point without explaining it._"},{"question":"## Q5. State the precise location of each stage of aerobic cell respiration in a eukaryotic cell. **[4]**","scheme":"- Glycolysis: cytoplasm. **[1]**\n- Link reaction: mitochondrial matrix. **[1]**\n- Krebs cycle: mitochondrial matrix. **[1]**\n- Electron transport chain and ATP synthase: inner mitochondrial membrane\n  (cristae). **[1]**\n\n_Examiner note: \"mitochondrion\" alone isn’t precise enough for the last three.\nThe question said precise, and matrix versus inner membrane is the distinction\nbeing tested._"},{"question":"## Q6. Distinguish between cell respiration and gas exchange. **[2]**","scheme":"- Cell respiration is a chemical process within cells that releases energy from\n  organic compounds to produce ATP, whereas gas exchange is the movement of\n  oxygen and carbon dioxide between an organism and its environment. **[1]**\n- Cell respiration occurs in all living cells continuously, whereas gas exchange\n  occurs at a specialized surface. **[1]**\n\n_Examiner note: a free two marks if you’ve kept the words separate all year,\nand a guaranteed zero if you’ve not._"}],"mcq":[{"id":"C1.2-q01","topic":"C1.2","kind":"mcq","lead":"","quote":"","prompt":"Which is the correct definition of cell respiration?","options":[{"text":"Taking in oxygen and releasing carbon dioxide from the lungs","correct":false,"why":"That's breathing, or gas exchange. Mixing them up is the most common way to lose this mark."},{"text":"Controlled release of energy from organic compounds to produce ATP","correct":true,"why":"Respiration happens in every living cell, and its purpose is making ATP."},{"text":"Converting glucose into ATP so energy can be stored for later","correct":false,"why":"ATP isn't a long-term store. Cells make it and spend it almost right away."},{"text":"Breaking down glucose in the absence of oxygen to release energy","correct":false,"why":"That's only anaerobic respiration. The definition has to cover aerobic respiration too."}],"after":null},{"id":"C1.2-q02","topic":"C1.2","kind":"mcq","lead":"","quote":"","prompt":"Why is ATP described as an energy currency rather than an energy store?","options":[{"text":"It holds more energy per gram than lipids or carbohydrates","correct":false,"why":"It's the opposite. Lipids and carbohydrates are the long-term stores."},{"text":"It can only be made in the mitochondria of animal cells","correct":false,"why":"Glycolysis makes ATP in the cytoplasm, and plants make ATP too."},{"text":"It's used almost as soon as it's made, so little is kept","correct":true,"why":"Cells spend ATP as fast as they regenerate it from ADP and phosphate, like cash rather than savings."},{"text":"It releases energy only when combined with oxygen","correct":false,"why":"ATP releases energy when its terminal phosphate is removed by hydrolysis. Oxygen isn't involved."}],"after":null},{"id":"C1.2-q03","topic":"C1.2","kind":"mcq","lead":"","quote":"","prompt":"Where does glycolysis happen, and what is its net ATP yield per glucose?","options":[{"text":"In the cytoplasm, with a net gain of 2 ATP","correct":true,"why":"Glycolysis splits glucose into two pyruvate in the cytoplasm. It doesn't need oxygen."},{"text":"In the mitochondrial matrix, with a net gain of 2 ATP","correct":false,"why":"The matrix is where the link reaction and the Krebs cycle happen. Glycolysis is in the cytoplasm."},{"text":"In the cytoplasm, with a net gain of 4 ATP","correct":false,"why":"Four ATP are made, but two were spent getting started, so the net gain is 2."},{"text":"On the inner mitochondrial membrane, with a net gain of 36 ATP","correct":false,"why":"That's closer to the whole of aerobic respiration. Glycolysis alone makes a net 2 ATP."}],"after":null},{"id":"C1.2-q04","topic":"C1.2","kind":"mcq","lead":"","quote":"","prompt":"In anaerobic conditions in muscle, why is pyruvate converted to lactate?","options":[{"text":"Because there's no oxygen available","correct":false,"why":"That's when it happens, not why. The mark is for the purpose, which is regenerating NAD."},{"text":"To regenerate NAD so glycolysis can continue","correct":true,"why":"Glycolysis needs NAD to accept hydrogen. Making lactate frees up NAD, so glycolysis keeps producing ATP."},{"text":"To produce more ATP from each pyruvate","correct":false,"why":"Making lactate produces no ATP. It only keeps glycolysis running."},{"text":"To remove carbon dioxide from the cell","correct":false,"why":"No CO2 is released when lactate forms in humans. That happens in yeast."}],"after":null},{"id":"C1.2-q05","topic":"C1.2","kind":"mcq","lead":"","quote":"","prompt":"What are the products of anaerobic respiration in yeast?","options":[{"text":"Lactate only","correct":false,"why":"Lactate is the product in humans. Yeast makes something different."},{"text":"Ethanol and carbon dioxide","correct":true,"why":"Yeast converts pyruvate to ethanol and CO2. That's what bread and brewing rely on."},{"text":"Carbon dioxide and water","correct":false,"why":"Those are the products of aerobic respiration."},{"text":"Lactate and carbon dioxide","correct":false,"why":"Lactate doesn't come with CO2. Yeast makes ethanol and CO2."}],"after":null},{"id":"C1.2-q06","topic":"C1.2","kind":"mcq","lead":"","quote":"","prompt":"What happens to pyruvate in the link reaction?","options":[{"text":"It's decarboxylated and oxidized to form acetyl CoA","correct":true,"why":"A carbon leaves as CO2, hydrogen goes to NAD, and what's left joins coenzyme A. This happens in the matrix."},{"text":"It's reduced to lactate so NAD can be regenerated","correct":false,"why":"That's what happens in anaerobic conditions in muscle, not in the link reaction."},{"text":"It's split into two molecules of glucose in the matrix","correct":false,"why":"Pyruvate comes from glucose, not the other way around. It loses a carbon here."},{"text":"It's phosphorylated by ATP synthase to make ATP","correct":false,"why":"No ATP is made in the link reaction. ATP synthase works in the inner membrane."}],"after":null},{"id":"C1.2-q07","topic":"C1.2","kind":"mcq","lead":"","quote":"","prompt":"Which products does the Krebs cycle release?","options":[{"text":"Oxygen, glucose and water","correct":false,"why":"Oxygen is used at the end of the electron transport chain, and glucose isn't made here."},{"text":"Lactate, ethanol and ATP","correct":false,"why":"Lactate and ethanol are anaerobic products. The Krebs cycle needs aerobic conditions."},{"text":"Pyruvate, NAD and oxygen","correct":false,"why":"Pyruvate enters the link reaction before the cycle. NAD is reduced here, not released."},{"text":"Reduced NAD, reduced FAD and CO2","correct":true,"why":"The cycle's oxidations reduce NAD and FAD, and its decarboxylations release CO2. A little ATP is made too."}],"after":null},{"id":"C1.2-q08","topic":"C1.2","kind":"mcq","lead":"","quote":"","prompt":"What does the energy released along the electron transport chain do directly?","options":[{"text":"Phosphorylates ADP to make ATP","correct":false,"why":"That's the trap. The chain's energy pumps protons. ATP synthase makes the ATP afterward, in chemiosmosis."},{"text":"Pumps protons into the intermembrane space","correct":true,"why":"That builds up a proton gradient across the inner membrane, which chemiosmosis then uses."},{"text":"Splits oxygen molecules into atoms","correct":false,"why":"Oxygen accepts electrons at the end of the chain. The energy isn't used to split it."},{"text":"Breaks glucose down into pyruvate","correct":false,"why":"That's glycolysis, which happens in the cytoplasm."}],"after":null},{"id":"C1.2-q09","topic":"C1.2","kind":"mcq","lead":"","quote":"","prompt":"Which describes chemiosmosis in mitochondria?","options":[{"text":"Electrons pass along carriers in the inner membrane","correct":false,"why":"That's the electron transport chain. Chemiosmosis is what happens to the protons afterward."},{"text":"Protons flow back into the matrix through ATP synthase","correct":true,"why":"Protons move down their gradient through ATP synthase, and that flow phosphorylates ADP to ATP."},{"text":"Water moves across the inner membrane by osmosis","correct":false,"why":"Despite the name, chemiosmosis isn't about water. It's the movement of protons."},{"text":"Protons are pumped out of the matrix using ATP","correct":false,"why":"The pumping is powered by electron transport, not ATP. Chemiosmosis is protons flowing back in."}],"after":null},{"id":"C1.2-q10","topic":"C1.2","kind":"mcq","lead":"","quote":"","prompt":"What is the role of oxygen in aerobic respiration?","options":[{"text":"It's used by ATP synthase to make ATP","correct":false,"why":"That's the trap. ATP synthase uses the proton gradient. Oxygen isn't used to make ATP directly."},{"text":"It oxidizes glucose directly in glycolysis","correct":false,"why":"Glycolysis doesn't need oxygen at all."},{"text":"It accepts electrons at the end of the chain","correct":true,"why":"Oxygen is the terminal electron acceptor and forms water. Without it, the chain backs up and stops."},{"text":"It's released as a product of the Krebs cycle","correct":false,"why":"The Krebs cycle releases CO2, not oxygen."}],"after":null},{"id":"C1.2-q11","topic":"C1.2","kind":"mcq","lead":"","quote":"","prompt":"Where is the electron transport chain located?","options":[{"text":"In the cytoplasm","correct":false,"why":"Only glycolysis happens in the cytoplasm."},{"text":"In the mitochondrial matrix","correct":false,"why":"The matrix is for the link reaction and the Krebs cycle."},{"text":"In the inner mitochondrial membrane","correct":true,"why":"The cristae fold that membrane to give more surface for the chain and ATP synthase."},{"text":"In the outer mitochondrial membrane","correct":false,"why":"The chain is in the inner membrane, so protons get pumped into the space between the two."}],"after":null},{"id":"C1.2-q12","topic":"C1.2","kind":"mcq","lead":"","quote":"","prompt":"Why do lipids release more energy per gram than carbohydrates when respired?","options":[{"text":"Lipid molecules are larger than carbohydrate molecules","correct":false,"why":"Size isn't the reason, and \"because they're bigger\" gets no marks."},{"text":"Lipids can be respired without any oxygen","correct":false,"why":"It's the reverse. Carbohydrates can be respired anaerobically, and lipids can't."},{"text":"Lipids are more reduced, with more hydrogen per carbon","correct":true,"why":"More hydrogen means more reduced NAD and FAD, so more ATP from the electron transport chain."},{"text":"Lipids are broken down faster than carbohydrates","correct":false,"why":"Carbohydrates release their energy faster. Lipids release more of it per gram."}],"after":null},{"id":"C1.2-t1","topic":"C1.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Respiration is how we take in oxygen.","prompt":"Why does it fail?","options":[{"text":"Cell respiration is a chemical process in cells that releases energy from organic compounds to make ATP. Breathing is ventilation. Examiners treat this as a definitional error, and it’s an easy mark to lose on a one-mark question.","correct":true,"why":"That’s exactly why it fails."},{"text":"ATP is the short-term, immediately spendable form — currency, not savings. Cells hold very little of it and regenerate it constantly. Glycogen and lipids are the stores.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying ATP \"stores\" energy long-term."},{"text":"Glycolysis runs in both cases and yields a net 2 ATP. Anaerobic respiration isn’t \"no ATP\", it’s \"much less ATP\".","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: forgetting that anaerobic respiration still includes glycolysis."},{"text":"That’s the condition, not the reason. The reason is that the conversion oxidizes reduced NAD back to NAD, and glycolysis can’t continue without a supply of NAD. This is a favourite examiner question precisely because it separates memorizing from understanding.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: not knowing *why* pyruvate becomes lactate."}],"after":{"label":"What would have scored","text":"Cell respiration is the controlled release of energy from organic compounds to produce ATP."}},{"id":"C1.2-t2","topic":"C1.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"ATP is where the cell stores its energy.","prompt":"Why does it fail?","options":[{"text":"ATP is the short-term, immediately spendable form — currency, not savings. Cells hold very little of it and regenerate it constantly. Glycogen and lipids are the stores.","correct":true,"why":"That’s exactly why it fails."},{"text":"Cell respiration is a chemical process in cells that releases energy from organic compounds to make ATP. Breathing is ventilation. Examiners treat this as a definitional error, and it’s an easy mark to lose on a one-mark question.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: confusing respiration with breathing."},{"text":"Gly <script>
/* study-os web app. No dependencies, no network, no install.
   Runs from a URL or straight off the filesystem. Progress is per-browser. */
(function () {
  'use strict';

  /* A generated file that git has tried to merge looks healthy and is not:
     one half supplies the code, the other a stale data payload, and a feature
     quietly renders as empty. Say so plainly instead. */
  function showDamaged(reason) {
    document.body.innerHTML =
      '<main class="wrap"><div class="damaged">' +
      '<h1>This file is damaged</h1>' +
      '<p>' + reason + '</p>' +
      '<p>Rebuild it with <code>study build</code>, or use the live version:</p>' +
      '<p><a href="https://jamiesobczyk-home.github.io/study-os/">' +
      'jamiesobczyk-home.github.io/study-os</a></p>' +
      '</div></main>';
  }

  /* Merge markers usually land *after* this script in the document, so the
     scan cannot run now — document.body is still being parsed. It runs at
     boot() instead. This early check only catches a payload that failed to
     parse, which would otherwise throw on the next line. */
  if (!window.__STUDY_DATA__ || !window.__STUDY_DATA__.topics) {
    showDamaged('Its course data is missing, or it couldn’t be read.');
    return;
  }

  function markersInDocument() {
    var text = (document.body && document.body.textContent) || '';
    return /(^|\n)\s*(<{7} |>{7} |={7}\s*$)/.test(text);
  }

  var DATA = window.__STUDY_DATA__;
  var KEY = 'study-os:' + DATA.course.id + ':v1';
  var BOX_DAYS = { 1: 1, 2: 3, 3: 7, 4: 16, 5: 35 };
  var MAX_BOX = 5;

  // ---------------------------------------------------------------- storage

  function today() { return new Date().toISOString().slice(0, 10); }
  function addDays(iso, n) {
    var d = new Date(iso + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function emptyState() { return { version: 1, cards: {}, sessions: [] }; }

  var state = (function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return emptyState();
      var s = JSON.parse(raw);
      return { version: 1, cards: s.cards || {}, sessions: s.sessions || [] };
    } catch (e) {
      // Private mode, blocked storage, or corrupt data must never block study.
      return emptyState();
    }
  })();

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('Could not save progress in this browser'); }
  }

  function cardState(id) {
    return state.cards[id] || { box: 0, due: null, reps: 0, lapses: 0 };
  }

  /* Quiz results live in their own store. Multiple choice measures
     recognition; the review schedule above measures production. Letting a
     lucky guess push a card out to a 35-day interval would quietly corrupt
     the thing that actually works, so these never touch state.cards. */
  var MCQ_KEY = 'study-os:' + DATA.course.id + ':mcq:v1';
  var mcqState = (function () {
    try {
      var raw = localStorage.getItem(MCQ_KEY);
      if (!raw) return { version: 1, questions: {}, sessions: [], picked: [] };
      var s = JSON.parse(raw);
      return {
        version: 1,
        questions: s.questions || {},
        sessions: s.sessions || [],
        picked: s.picked || []
      };
    } catch (e) {
      return { version: 1, questions: {}, sessions: [], picked: [] };
    }
  })();

  function saveMcq() {
    try { localStorage.setItem(MCQ_KEY, JSON.stringify(mcqState)); }
    catch (e) { /* blocked storage must never block a quiz */ }
  }

  /** Topics that actually have quiz questions. */
  function quizTopics() {
    return topics.filter(function (t) { return t.pack && t.pack.mcq && t.pack.mcq.length; });
  }
  function isDue(id, day) {
    var c = cardState(id);
    return c.box === 0 || !c.due || c.due <= (day || today());
  }
  function grade(id, result) {
    var prev = cardState(id), box;
    if (result === 'got') box = Math.min(MAX_BOX, Math.max(1, prev.box + 1));
    else if (result === 'shaky') box = Math.max(1, prev.box);
    else box = 1;
    var day = today();
    state.cards[id] = {
      box: box, due: addDays(day, BOX_DAYS[box]),
      reps: prev.reps + 1, lapses: prev.lapses + (result === 'missed' ? 1 : 0),
      lastSeen: day
    };
    save();
    return BOX_DAYS[box];
  }

  // ------------------------------------------------------------ markdown

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function inline(s) {
    // Links are extracted before the emphasis passes run. URLs legitimately
    // contain underscores (search_query=) and asterisks, and letting the
    // italic rule loose on them corrupts the href — which shipped, and broke
    // every video link in every pack.
    var slots = [];
    var stash = function (html) { return '\u0000' + (slots.push(html) - 1) + '\u0000'; };

    var out = esc(s)
      .replace(/`([^`]+)`/g, function (m, c) { return stash('<code>' + c + '</code>'); })
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, text, url) {
        return stash('<a href="' + url + '" target="_blank" rel="noopener">' + text + '</a>');
      })
      .replace(/(^|[\s(])&lt;(https?:\/\/\S+?)&gt;/g, function (m, pre, url) {
        return pre + stash('<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>');
      })
      .replace(/(^|[^*])\*\*([^*]+)\*\*/g, '$1<strong>$2</strong>')
      .replace(/(^|[^*_])_([^_]+)_/g, '$1<em>$2</em>');

    return out.replace(/\u0000(\d+)\u0000/g, function (m, i) { return slots[Number(i)]; });
  }

  /* Renders the markdown subset the packs are written in: headings, lists,
     checkbox lists, tables, blockquotes, rules, paragraphs. */
  function md(src) {
    if (!src) return '';
    var lines = String(src).replace(/\r/g, '').split('\n');
    var out = [], i = 0;

    function flushList(tag, items) {
      out.push('<' + tag + '>' + items.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</' + tag + '>');
    }

    /* Rebuild indentation as real nesting, so sub-points stay sub-points. */
    function nestList(items, start) {
      var base = items[start].indent, html = '<ul>', k = start;
      while (k < items.length) {
        if (items[k].indent < base) break;
        if (items[k].indent > base) {
          var sub = nestList(items, k);
          html = html.replace(/<\/li>$/, '') + sub.html + '</li>';
          k = sub.next;
          continue;
        }
        html += '<li>' + items[k].html + '</li>';
        k++;
      }
      return { html: html + '</ul>', next: k };
    }

    while (i < lines.length) {
      var line = lines[i];

      if (!line.trim()) { i++; continue; }

      if (/^\s*(---|\*\*\*)\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

      if (/^\s*```/.test(line)) {
        var fence = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { fence.push(lines[i]); i++; }
        i++; // closing fence
        out.push('<pre>' + esc(fence.join('\n')) + '</pre>');
        continue;
      }

      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        var lvl = Math.min(h[1].length + 1, 6);
        out.push('<h' + lvl + '>' + inline(h[2]) + '</h' + lvl + '>');
        i++; continue;
      }

      if (/^>\s?/.test(line)) {
        var quote = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { quote.push(lines[i].replace(/^>\s?/, '')); i++; }
        out.push('<blockquote>' + md(quote.join('\n')) + '</blockquote>');
        continue;
      }

      if (/^\|/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
        var cells = function (r) {
          return r.replace(/^\||\|$/g, '').split('|').map(function (c) { return inline(c.trim()); });
        };
        var head = cells(lines[i]); i += 2;
        var body = [];
        while (i < lines.length && /^\|/.test(lines[i])) { body.push(cells(lines[i])); i++; }
        out.push('<table><thead><tr>' + head.map(function (c) { return '<th>' + c + '</th>'; }).join('') +
          '</tr></thead><tbody>' + body.map(function (r) {
            return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table>');
        continue;
      }

      if (/^\s*[-*]\s+/.test(line)) {
        var items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          var indent = lines[i].match(/^\s*/)[0].replace(/\t/g, '  ').length;
          var t = lines[i].replace(/^\s*[-*]\s+/, '');
          // Escape first, then prepend the checkbox glyph — the other way
          // round escapes our own markup and shows it as text.
          var box = '';
          if (/^\[ \]\s*/.test(t)) { box = '<span class="box">&#9633;</span> '; t = t.replace(/^\[ \]\s*/, ''); }
          else if (/^\[x\]\s*/i.test(t)) { box = '<span class="box done">&#9745;</span> '; t = t.replace(/^\[x\]\s*/i, ''); }
          items.push({ indent: indent, html: box + inline(t) });
          i++;
        }
        out.push(nestList(items, 0).html);
        continue;
      }

      if (/^\s*\d+\.\s+/.test(line)) {
        var ol = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          ol.push(inline(lines[i].replace(/^\s*\d+\.\s+/, ''))); i++;
        }
        flushList('ol', ol); continue;
      }

      if (/^ {4}\S/.test(line)) {
        var pre = [];
        while (i < lines.length && (/^ {4}/.test(lines[i]) || !lines[i].trim())) {
          if (!lines[i].trim() && !(i + 1 < lines.length && /^ {4}/.test(lines[i + 1]))) break;
          pre.push(lines[i].replace(/^ {4}/, '')); i++;
        }
        out.push('<pre>' + esc(pre.join('\n')) + '</pre>'); continue;
      }

      var para = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|>|\||\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      if (para.length) out.push('<p>' + inline(para.join(' ')) + '</p>');
      else i++;
    }
    return out.join('\n');
  }

  function allCards() {
    var out = [];
    packed.forEach(function (t) {
      t.pack.cards.forEach(function (c) { out.push({ card: c, topic: t }); });
    });
    return out;
  }
  function dueCards(topic) {
    var day = today();
    var pool = topic
      ? topic.pack.cards.map(function (c) { return { card: c, topic: topic }; })
      : allCards();
    return pool.filter(function (x) { return isDue(x.card.id, day); });
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function topicStats(t) {
    var total = t.pack.cards.length, seen = 0, due = 0, boxSum = 0, day = today();
    t.pack.cards.forEach(function (c) {
      var s = cardState(c.id);
      if (s.box > 0) { seen++; boxSum += s.box; }
      if (isDue(c.id, day)) due++;
    });
    return { total: total, seen: seen, due: due, strength: seen ? boxSum / seen / MAX_BOX : 0 };
  }

  views.mcqRun = function () {
    var codes = (mcqState.picked || []).filter(function (c) { return byCode[c] && byCode[c].pack; });
    if (!codes.length) return views.mcq();

    // A deck in progress is only reused for the same sections. Picking
    // different ones and pressing Start has to build a new deck, or he gets
    // the old sections until the page is reloaded.
    var key = codes.slice().sort().join(',');
    if (!run || run.done || run.key !== key) {
      var pool = [];
      codes.forEach(function (c) {
        byCode[c].pack.mcq.forEach(function (q) { pool.push(q); });
      });
      if (!pool.length) return views.mcq();
      run = { key: key, deck: shuffle(pool), i: 0, right: 0, wrong: 0, done: false };
    }
    renderQuestion();
  };

  function renderQuestion() {
    if (run.i >= run.deck.length) return quizFinished();
    var q = run.deck[run.i];

    // Every question arrives in one shape, whether it was written as a
    // multiple-choice question or derived from a topic's common mistakes.
    // Exactly one option is correct, and every option carries its own why.
    var options = shuffle(q.options.slice());

    var pct = Math.round((run.i / run.deck.length) * 100);
    html(
      '<p class="meta">' + q.topic + ' · question ' + (run.i + 1) + ' of ' + run.deck.length + '</p>' +
      '<div class="card">' +
        (q.lead ? '<p class="sub" style="margin-bottom:10px">' + inline(q.lead) + '</p>' : '') +
        (q.quote ? '<blockquote class="wrote">' + inline(q.quote) + '</blockquote>' : '') +
        '<p class="q" style="margin:' + (q.quote ? '18px' : '0') + ' 0 12px">' + inline(q.prompt) + '</p>' +
        '<div class="opts">' + options.map(function (o, i) {
          return '<button class="opt" data-i="' + i + '">' + inline(o.text) + '</button>';
        }).join('') + '</div>' +
        '<div id="verdict"></div>' +
      '</div>' +
      '<div class="progress-track"><div style="width:' + pct + '%"></div></div>'
    );

    on('.opt', 'click', function () {
      answer(q, options[Number(this.getAttribute('data-i'))], options);
    });
  }

  function answer(q, chosen, options) {
    var rec = mcqState.questions[q.id] || { seen: 0, correct: 0, wrong: 0 };
    rec.seen += 1;
    if (chosen.correct) { rec.correct += 1; run.right += 1; }
    else { rec.wrong += 1; run.wrong += 1; rec.lastWrong = today(); }
    mcqState.questions[q.id] = rec;
    saveMcq();

    Array.prototype.forEach.call(el.querySelectorAll('.opt'), function (btn, i) {
      btn.disabled = true;
      if (options[i].correct) btn.classList.add('right');
      else if (options[i] === chosen) btn.classList.add('chosen-wrong');
    });

    var right = options.filter(function (o) { return o.correct; })[0];
    var after = q.after
      ? '<p class="meta" style="margin:16px 0 6px">' + esc(q.after.label) + '</p><p>' + inline(q.after.text) + '</p>'
      : '';

    // Wrong: say why that pick fails first, then the right answer and why.
    // That order is the whole point of the feature.
    var v = document.getElementById('verdict');
    v.innerHTML = chosen.correct
      ? '<div class="verdict-box good"><p><strong>Correct.</strong> ' + inline(chosen.why) + '</p>' + after + '</div>'
      : '<div class="verdict-box bad">' +
          '<p><strong>Not this one.</strong> ' + inline(chosen.why) + '</p>' +
          '<p class="meta" style="margin:16px 0 6px">The right answer</p>' +
          '<p><strong>' + inline(right.text) + '</strong></p>' +
          (q.kind === 'mcq' ? '<p>' + inline(right.why) + '</p>' : '') +
          after +
        '</div>';

    v.insertAdjacentHTML('beforeend',
      '<button class="btn wide" id="next" style="margin-top:16px">' +
      (run.i + 1 >= run.deck.length ? 'See how you did' : 'Next question') + '</button>');
    document.getElementById('next').onclick = function () { run.i += 1; renderQuestion(); };
    document.getElementById('next').focus();
  }

  function quizFinished() {
    run.done = true;
    var total = run.right + run.wrong;
    mcqState.sessions.push({ date: today(), asked: total, right: run.right, wrong: run.wrong });
    if (mcqState.sessions.length > 500) mcqState.sessions = mcqState.sessions.slice(-500);
    saveMcq();

    html('<h1>' + run.right + ' of ' + total + '</h1>' +
      '<div class="card"><p>' + (run.wrong
        ? 'The ' + run.wrong + ' you missed are the useful ones. Each one was a real marking point stuck to the wrong mistake, and that mix-up is what costs marks in an exam.'
        : 'All correct. Now try writing one of those answers from memory — that part’s harder.') +
      '</p></div>' +
      '<div class="row"><button class="btn" data-go="mcq">Pick sections</button>' +
      '<button class="btn ghost" data-go="home">Home</button></div>');
  }

  // -------------------------------------------------------------- routing

  function go(name, arg) {
    location.hash = '#' + name + (arg ? '/' + arg : '');
  }
  function route() {
    var raw = (location.hash || '#home').slice(1).split('/');
    var name = raw[0] || 'home';
    var fn = views[name] || views.home;
    Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
      if (b.getAttribute('data-go') === name) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    fn(raw[1]);
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go],[data-topic]');
    if (!t) return;
    if (t.hasAttribute('data-topic')) { e.preventDefault(); return go('topic', t.getAttribute('data-topic')); }
    e.preventDefault();
    go(t.getAttribute('data-go'), t.getAttribute('data-code') || '');
  });

  function boot() {
    if (markersInDocument()) {
      return showDamaged('It has unresolved merge markers in it, so parts of it are out of date.');
    }
    window.addEventListener('hashchange', route);
    route();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
