e: letting the whole bacteriophage enter the bacterium."}],"after":{"label":"What would have scored","text":"The host copies viral nucleic acid and makes viral proteins, which assemble into new virions before lysis."}},{"id":"A2.3-t5","topic":"A2.3","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"During the lysogenic cycle, the viral DNA stays dormant and nothing happens.","prompt":"Why does it fail?","options":[{"text":"The prophage is copied with the bacterial chromosome and inherited by daughter cells, and induction can activate lytic replication.","correct":true,"why":"That’s exactly why it fails."},{"text":"A capsid is universal, but an envelope occurs only in some viruses and is derived from host-cell membrane.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: giving every virus an envelope."},{"text":"Viruses are acellular and lack cytoplasm and ribosomes, rather than being cells with fewer organelles.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling a virus a small cell."},{"text":"Lambda attaches outside the bacterium and injects its DNA; the capsid and tail remain outside.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: letting the whole bacteriophage enter the bacterium."}],"after":{"label":"What would have scored","text":"The prophage is replicated with the host chromosome until induction causes it to enter the lytic cycle."}},{"id":"A2.3-t6","topic":"A2.3","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Antigenic shift happens when one major mutation suddenly changes an influenza antigen.","prompt":"Why does it fail?","options":[{"text":"Antigenic shift results from reassortment of genome segments between different influenza viruses infecting the same cell.","correct":true,"why":"That’s exactly why it fails."},{"text":"A capsid is universal, but an envelope occurs only in some viruses and is derived from host-cell membrane.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: giving every virus an envelope."},{"text":"Viruses are acellular and lack cytoplasm and ribosomes, rather than being cells with fewer organelles.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling a virus a small cell."},{"text":"Lambda attaches outside the bacterium and injects its DNA; the capsid and tail remain outside.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: letting the whole bacteriophage enter the bacterium."}],"after":{"label":"What would have scored","text":"Antigenic shift is a major antigen change caused by reassortment of influenza genome segments."}},{"id":"A2.3-t7","topic":"A2.3","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"HIV mutates so that it can become resistant to the drug.","prompt":"Why does it fail?","options":[{"text":"Mutations arise without regard to need; treatment selects resistant variants already produced by mutation.","correct":true,"why":"That’s exactly why it fails."},{"text":"A capsid is universal, but an envelope occurs only in some viruses and is derived from host-cell membrane.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: giving every virus an envelope."},{"text":"Viruses are acellular and lack cytoplasm and ribosomes, rather than being cells with fewer organelles.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling a virus a small cell."},{"text":"Lambda attaches outside the bacterium and injects its DNA; the capsid and tail remain outside.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: letting the whole bacteriophage enter the bacterium."}],"after":{"label":"What would have scored","text":"Mutation creates HIV variants, and drug treatment increases the frequency of variants that carry resistance."}},{"id":"A2.3-t8","topic":"A2.3","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"All viruses have capsids, so they must have inherited them from one viral ancestor.","prompt":"Why does it fail?","options":[{"text":"Similar selection pressures can independently favor protective capsids, so the similarity may result from convergent evolution.","correct":true,"why":"That’s exactly why it fails."},{"text":"A capsid is universal, but an envelope occurs only in some viruses and is derived from host-cell membrane.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: giving every virus an envelope."},{"text":"Viruses are acellular and lack cytoplasm and ribosomes, rather than being cells with fewer organelles.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: calling a virus a small cell."},{"text":"Lambda attaches outside the bacterium and injects its DNA; the capsid and tail remain outside.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: letting the whole bacteriophage enter the bacterium."}],"after":{"label":"What would have scored","text":"Capsids may have evolved independently in different viral lineages as protection for genetic material outside host cells."}}]}},{"code":"A3.1","title":"Diversity of organisms","theme":"A","level":3,"levelTitle":"Organisms","hlOnly":false,"pages":"105-109","questionsPage":114,"bookTitle":null,"pack":null},{"code":"A3.2","title":"Classification and cladistics","theme":"A","level":3,"levelTitle":"Organisms","hlOnly":true,"pages":"110-113","questionsPage":114,"bookTitle":null,"pack":null},{"code":"A4.1","title":"Evolution and speciation","theme":"A","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"179-184","questionsPage":189,"bookTitle":null,"pack":null},{"code":"A4.2","title":"Conservation of biodiversity","theme":"A","level":4,"levelTitle":"Ecosystems","hlOnly":false,"pages":"185-188","questionsPage":189,"bookTitle":"Conservation of biology","pack":null},{"code":"B1.1","title":"Carbohydrates and lipids","theme":"B","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"9-13","questionsPage":18,"bookTitle":null,"pack":null},{"code":"B1.2","title":"Proteins","theme":"B","level":1,"levelTitle":"Molecules","hlOnly":false,"pages":"14-17","questionsPage":18,"bookTitle":null,"pack":{"oneLiner":"Twenty building blocks, joined in any order and any length, fold into shapes determined entirely by that order — and the shape is what does the job, which is why heating a protein or shifting its pH destroys the function without breaking a single link in the chain.","essentials":"\n> Each line is a thing you should be able to *do* with the page closed.\n> Note how short the Core list is and how long the Higher level one is. That\n> ratio is the topic.\n\n## Core\n\n- [ ] Draw and label the **generalized structure of an amino acid**: a central\n      carbon bonded to an amine group, a carboxyl group, a hydrogen atom, and a\n      variable R group.\n- [ ] Explain **condensation** between two amino acids: the amine group of one\n      reacts with the carboxyl group of the other, forming a **peptide bond**\n      and releasing one molecule of water. The product is a dipeptide.\n- [ ] Extend that to **polypeptides**: repeated condensation joins many amino\n      acids into a chain, releasing one water per bond formed.\n- [ ] Explain **dietary requirements for amino acids**: some amino acids can’t\n      be synthesized by the body and must be obtained from food (essential);\n      the rest can be made from other compounds (non-essential). A diet short\n      of an essential amino acid limits protein synthesis.\n- [ ] Explain why the **variety of possible peptide chains is effectively\n      unlimited**: any of 20 amino acids can occupy any position, and chains\n      vary in length, so the number of possible sequences of length *n* is\n      20 to the power of *n*.\n- [ ] Explain the **effect of temperature and pH on protein structure**: both\n      disrupt the bonds holding the folded shape, changing the conformation and\n      causing loss of function. That’s **denaturation**. It may be reversible or\n      irreversible, and it does **not** break peptide bonds.\n\n## Higher level\n\n> Seven of the twelve syllabus statements sit here. This is the bulk of the\n> topic for you.\n\n- [ ] Explain how **chemical diversity in R groups** is the basis of protein\n      diversity: R groups differ in size, charge, polarity and reactivity, so\n      the same backbone supports enormously different molecules.\n- [ ] Define **primary structure** as the sequence of amino acids in a\n      polypeptide, and explain that it determines the final conformation,\n      because it fixes which R groups can interact and where.\n- [ ] Describe **secondary structure**: the alpha helix (coiling) and beta\n      pleated sheet (pleating), both stabilized by **hydrogen bonds between the\n      amine and carboxyl groups of the backbone**, not between R groups.\n- [ ] Describe **tertiary structure** as the overall three-dimensional shape of\n      one polypeptide, and name the four interactions between **R groups**\n      that hold it: hydrogen bonds, ionic bonds, disulfide covalent bonds\n      (between two cysteines), and hydrophobic interactions.\n- [ ] Explain the **effect of polar and non-polar amino acids** on tertiary\n      structure: in an aqueous environment, non-polar R groups tend to be\n      positioned in the interior and polar ones on the surface. In a membrane\n      the arrangement is reversed, with non-polar R groups facing the\n      hydrophobic core.\n- [ ] Describe **quaternary structure**: two or more polypeptides associating\n      into one functional protein. Distinguish **non-conjugated** proteins\n      (polypeptides only) from **conjugated** proteins, which include a\n      non-polypeptide prosthetic group. Haemoglobin with its haem groups is\n      the standard example.\n- [ ] Compare **fibrous and globular proteins**: fibrous are long, narrow,\n      repetitive in sequence, largely insoluble and structural (collagen,\n      keratin); globular are rounded, irregular in sequence, soluble and\n      functional (enzymes, haemoglobin, insulin).\n\n## Links to other topics\n\n- **C1.1 Enzymes and metabolism** — enzymes are globular proteins, and the\n  active site is tertiary structure. Denaturation here *is* the enzyme\n  denaturation there. Learn it once.\n- **B2.1 Membranes** — integral and peripheral proteins sit where they do\n  because of polar and non-polar R groups. Same principle, one level up.\n- **D1.2 Protein synthesis** — translation builds primary structure. That\n  topic makes much more sense once you know what primary structure determines.\n- **A1.1 Water** — the hydrophobic interactions folding a protein are the same\n  exclusion effect you met with water. Nothing pushes.\n\n## Vocabulary that has to be exact\n\n| Term | What it means | What it’s not |\n| --- | --- | --- |\n| Peptide bond | Covalent bond between amino acids, formed by condensation | A hydrogen bond. It survives denaturation |\n| Primary structure | The **sequence** of amino acids | The shape |\n| Secondary structure | Helix or pleated sheet, H-bonded along the **backbone** | Held by R group interactions |\n| Tertiary structure | The 3D shape of **one** polypeptide, held by R group interactions | Quaternary |\n| Quaternary structure | **Two or more** polypeptides in one functional protein | Present in every protein |\n| Conjugated protein | Contains a non-polypeptide prosthetic group | Any protein with more than one chain |\n| Denaturation | Loss of 3D conformation and function | Breaking the polypeptide into amino acids |\n| Essential amino acid | Can’t be synthesized; must come from the diet | More important than the others |\n","videos":"\n> Watch **one** video, not four. A second explanation of the same idea feels\n> like progress and is mostly re-recognition. When one is done, close it and\n> draw the four levels of structure from memory — that drawing is the point.\n\n> Links below are channel and search links, which don’t rot. When you find the\n> video that actually works, paste its URL under \"Pinned\".\n\n## Main\n\n**Alex Lee — B1.2 Proteins** (may be split across videos)\n\n- Channel: \u003chttps://www.youtube.com/@misterleescience> — verified\n- Find it: \u003chttps://www.youtube.com/results?search_query=Mister+Lee+Science+B1.2+Proteins>\n\nAlex Lee's IB Biology series is widely recommended by IB students and is\nreported to follow the 2023 syllabus topic by topic. Search rather than trusting\na channel URL — handles change, and a dead link is what ends a study session.\nWhen you find the channel, paste it under Pinned. Because so much of B1.2 is HL,\ncheck he covers the higher level material and doesn’t stop at the SL statements.\n\nWatch for:\n- **Which bonds hold which level.** This is the whole topic. Secondary is\n  hydrogen bonds along the backbone; tertiary is four kinds of interaction\n  between R groups. If you take one thing away, take that.\n- The moment denaturation is explained. Listen for whether peptide bonds break.\n  They don’t, and that’s a marking point.\n- Every time an R group is mentioned — R groups are the reason proteins differ.\n\nPause at: the tertiary structure diagram. Before playing on, name all four\nR group interactions out loud. If the fourth doesn’t come, rewind.\n\n## If that didn’t land\n\n**Amoeba Sisters — Biomolecules / Protein structure**\n\n- Channel: \u003chttps://www.youtube.com/@AmoebaSisters> — verified\n- Find it: \u003chttps://www.youtube.com/results?search_query=Amoeba+Sisters+protein+structure+amino+acids>\n\nNot HL depth, but if amino acids and condensation themselves are the problem,\nthis sorts them out quickly and you can return to Alex Lee for the folding.\n\n**Protein folding animation**\n\n- Find it: \u003chttps://www.youtube.com/results?search_query=protein+folding+animation+primary+secondary+tertiary+quaternary>\n\nWatch an **animation** for the folding specifically. Going from a flat chain to\na three-dimensional shape is a spatial idea, and it’s far cheaper to learn\nfrom movement than from a paragraph. This is the one place in the topic where a\nsecond video earns its time.\n\n## Worth it once, not for revision\n\n- Any short clip of an egg white cooking, explained as denaturation. Sixty\n  seconds, and irreversible denaturation stops being an abstraction.\n\n## Pinned\n\n_Paste the URL of the video that actually worked, once you’ve found it._\n\n- Main:\n- Folding animation:\n","traps":"## Saying secondary structure is held by R group interactions\n\n**Commonly written:** \"The alpha helix is held together by bonds between the R\ngroups.\"\n\n**Why it doesn’t score:** Secondary structure is stabilized by hydrogen bonds\nbetween the **amine and carboxyl groups of the backbone**. R group interactions\nare what hold **tertiary** structure. Getting this backwards collapses the two\nlevels into one and loses marks in both.\n\n**Scores instead:** \"Hydrogen bonds form between the carboxyl group of one\namino acid and the amine group of another along the polypeptide backbone,\nproducing an alpha helix or beta pleated sheet.\"\n\n## Saying denaturation breaks peptide bonds\n\n**Commonly written:** \"Heating denatures the protein by breaking the bonds\nbetween the amino acids.\"\n\n**Why it doesn’t score:** Peptide bonds are covalent and aren’t broken by\nheat or pH change. What breaks are the weaker interactions holding the folded\nshape. The primary structure survives denaturation intact, which is exactly\nwhy denaturation is sometimes reversible.\n\n**Scores instead:** \"Heat disrupts the hydrogen bonds, ionic bonds and\nhydrophobic interactions holding the tertiary structure, changing the\nconformation. The peptide bonds and primary structure are unaffected.\"\n\n## Treating denaturation as always irreversible\n\n**Commonly written:** \"Denaturation is permanent.\"\n\n**Why it doesn’t score:** The syllabus says it may be reversible or\nirreversible. A protein denatured mildly can sometimes refold, because the\nprimary structure that determines the shape is still there.\n\n**Scores instead:** \"Denaturation may be reversible or irreversible depending\non the severity of the change.\"\n\n## Naming the levels without naming the bonds\n\n**Commonly written:** \"Primary is the sequence, secondary is the helix,\ntertiary is the 3D shape, quaternary is more than one chain.\"\n\n**Why it doesn’t score:** That’s a list of labels. Questions on this topic\nalmost always ask what **holds** each level, and a labels-only answer scores at\nthe bottom of the band.\n\n**Scores instead:** Attach the bonding to every level — backbone hydrogen bonds\nfor secondary; hydrogen, ionic, disulfide and hydrophobic interactions between\nR groups for tertiary.\n\n## Saying every protein has quaternary structure\n\n**Commonly written:** \"All proteins have four levels of structure.\"\n\n**Why it doesn’t score:** Quaternary structure exists only where two or more\npolypeptides associate. A protein made of a single polypeptide has no\nquaternary structure at all.\n\n**Scores instead:** \"Quaternary structure is present only in proteins made of\nmore than one polypeptide, such as haemoglobin.\"\n\n## Saying hydrophobic R groups are \"repelled\" by water\n\n**Commonly written:** \"Non-polar R groups are pushed into the centre because\nwater repels them.\"\n\n**Why it doesn’t score:** Nothing pushes. Water molecules bond preferentially\nwith each other and with polar R groups, which leaves the non-polar ones\nexcluded and therefore clustered inside. This is the same mechanism as in A1.1,\nand examiners treat \"repelled\" as a misunderstanding rather than loose wording.\n\n**Scores instead:** \"Non-polar R groups can’t form hydrogen bonds with water,\nso water associates with itself and with polar R groups instead, leaving the\nnon-polar groups clustered in the interior.\"\n\n## Calling essential amino acids the important ones\n\n**Commonly written:** \"Essential amino acids are the ones the body needs most.\"\n\n**Why it doesn’t score:** \"Essential\" is about synthesis, not importance. All\ntwenty are needed. Essential ones are simply those the body can’t make, so\nthey must come from the diet.\n\n**Scores instead:** \"Essential amino acids can’t be synthesized by the body\nand must be obtained from the diet; non-essential ones can be synthesized.\"\n\n## Getting condensation and hydrolysis backwards\n\n**Commonly written:** \"Water is added to join two amino acids.\"\n\n**Why it doesn’t score:** Condensation **releases** water as the bond forms.\nAdding water breaks the bond, which is hydrolysis. One word, one mark, and it\nis lost constantly.\n\n**Scores instead:** \"Condensation joins the amine group of one amino acid to\nthe carboxyl group of another, forming a peptide bond and releasing a molecule\nof water.\"\n","cards":[{"id":"B1.2-01","q":"Describe the generalized structure of an amino acid. Name every group attached to the central carbon.","a":"A central carbon atom is bonded to four things: an amine group (NH2), a carboxyl group (COOH), a hydrogen atom, and a variable R group. The first three are identical in every amino acid; only the R group differs.","note":"Four groups, and three of them are always the same. That’s why R groups carry all the diversity.","marks":null},{"id":"B1.2-02","q":"Explain what happens when two amino acids join, naming the reaction, the bond and the by-product.","a":"The reaction is condensation. The amine group of one amino acid reacts with the carboxyl group of the other, forming a covalent peptide bond between them and releasing one molecule of water. The product of two amino acids joining is a dipeptide.","note":"Condensation releases water. Adding water to break the bond is hydrolysis — getting these backwards is a constant one-mark loss.","marks":null},{"id":"B1.2-03","q":"A polypeptide contains 150 amino acids. How many peptide bonds does it have, and how many water molecules were released making it?","a":"149 peptide bonds, and 149 water molecules released. Each condensation joins one more amino acid to the chain and releases one water, so a chain of n amino acids has n minus 1 bonds.","note":"","marks":null},{"id":"B1.2-04","q":"Distinguish between essential and non-essential amino acids, and say why the distinction matters in a diet.","a":"Essential amino acids can’t be synthesized by the body and must be obtained from food. Non-essential amino acids can be synthesized from other compounds. The distinction matters because a diet short of any essential amino acid limits protein synthesis, regardless of how much total protein is eaten.","note":"'Essential' means 'can’t be made', not 'most important'. All twenty are needed.","marks":null},{"id":"B1.2-05","q":"Explain why the number of possible polypeptides is effectively unlimited.","a":"Any of the 20 amino acids can occupy any position in the chain, and chains can be any length. For a chain of n amino acids the number of possible sequences is 20 to the power of n, which becomes astronomically large even for short chains.","note":"","marks":null},{"id":"B1.2-06","q":"Define denaturation, and state precisely what is and isn’t broken.","a":"Denaturation is the disruption of a protein's three-dimensional conformation, causing loss of function. The hydrogen bonds, ionic bonds and hydrophobic interactions holding the folded shape are disrupted. Peptide bonds aren’t broken, so the primary structure remains intact. Denaturation may be reversible or irreversible depending on severity.","note":"Three separate marking points hide in here: shape lost, function lost, peptide bonds intact.","marks":null},{"id":"B1.2-07","q":"Explain how a change in pH denatures a protein, at the level of the bonds involved.","a":"A change in pH alters the charges on the R groups of amino acids, because acidic and basic R groups gain or lose hydrogen ions. Ionic bonds between oppositely charged R groups are therefore disrupted, and hydrogen bonding is affected, so the tertiary structure changes and function is lost.","note":"","marks":null},{"id":"B1.2-08","q":"Explain how high temperature denatures a protein.","a":"Increased temperature increases the kinetic energy and vibration of the molecule. This disrupts the relatively weak hydrogen bonds, ionic bonds and hydrophobic interactions holding the tertiary structure, so the protein unfolds and loses its functional shape. The covalent peptide bonds aren’t broken.","note":"","marks":null},{"id":"B1.2-09","q":"What is primary structure, and why does it determine everything else about the protein?","a":"Primary structure is the sequence of amino acids in a polypeptide, joined by peptide bonds. It determines the final conformation because the sequence fixes which R groups are present and where they sit relative to one another, and therefore which interactions can form as the chain folds.","note":"HL. 'The sequence determines the shape' is the sentence the whole topic rests on.","marks":null},{"id":"B1.2-10","q":"Describe secondary structure, naming both forms and the bonds that hold them. Be precise about where those bonds form.","a":"Secondary structure is regular, repeating folding of the polypeptide into an alpha helix (coiling) or a beta pleated sheet (pleating). Both are stabilized by hydrogen bonds between the carboxyl group of one amino acid and the amine group of another along the polypeptide backbone. R groups aren’t involved.","note":"HL. Backbone, not R groups. This is the single most common confusion in the topic.","marks":null},{"id":"B1.2-11","q":"Name all four interactions that hold tertiary structure, and say what they form between.","a":"All four form between R groups: hydrogen bonds between polar R groups; ionic bonds between oppositely charged R groups; disulfide covalent bonds between two cysteine R groups; and hydrophobic interactions between non-polar R groups. Together they fold one polypeptide into its specific three-dimensional shape.","note":"HL. Four of them, all between R groups. If only three come to mind, the missing one is usually disulfide.","marks":null},{"id":"B1.2-12","q":"Where do polar and non-polar R groups end up in a protein dissolved in water, and why? What changes in a membrane protein?","a":"In an aqueous environment, non-polar R groups are positioned mainly in the interior and polar R groups on the surface. This is because water bonds preferentially with itself and with polar groups, leaving the non-polar ones excluded and clustered inside. In a membrane protein the arrangement is reversed where the protein spans the bilayer: non-polar R groups face outwards into the hydrophobic core.","note":"HL. Nothing pushes the non-polar groups inward — they are excluded. Same mechanism as A1.1.","marks":null},{"id":"B1.2-13","q":"What is quaternary structure, and what makes a protein conjugated rather than non-conjugated?","a":"Quaternary structure is the association of two or more polypeptides into a single functional protein. A non-conjugated protein consists of polypeptides only. A conjugated protein also contains a non-polypeptide prosthetic group; haemoglobin is the standard example, with four polypeptides and four haem groups.","note":"HL. Not every protein has quaternary structure — only those with more than one chain.","marks":null},{"id":"B1.2-14","q":"Compare fibrous and globular proteins across shape, solubility, sequence and role, with an example of each.","a":"Fibrous proteins are long and narrow with a repetitive amino acid sequence, are largely insoluble in water, and have structural roles — collagen and keratin. Globular proteins are rounded and compact with an irregular sequence, are soluble in water, and have functional roles such as catalysis or transport — enzymes and haemoglobin.","note":"","marks":null},{"id":"B1.2-15","q":"Why can twenty amino acids produce proteins as different as keratin and an enzyme?","a":"Because the R groups differ chemically — in size, charge, polarity and reactivity. The backbone is identical in every amino acid, so it’s the R groups that determine which interactions form during folding, and therefore the shape and properties of the finished protein. Different sequences of R groups give completely different molecules from the same set of building blocks.","note":"","marks":null},{"id":"B1.2-16","q":"Someone writes: 'Boiling an egg denatures the proteins by breaking the peptide bonds.' What is wrong, and what is right?","a":"Peptide bonds are covalent and aren’t broken by heat. What heat disrupts are the weaker hydrogen bonds, ionic bonds and hydrophobic interactions holding the tertiary structure. The protein unfolds and loses function, but the primary structure is unchanged. In this case the denaturation happens to be irreversible.","note":"","marks":null},{"id":"B1.2-17","q":"Build the four levels of protein structure from memory: name each, and name what holds it.","a":"Primary: the sequence of amino acids, joined by peptide bonds. Secondary: alpha helix or beta pleated sheet, held by hydrogen bonds between backbone amine and carboxyl groups. Tertiary: the three-dimensional shape of one polypeptide, held by hydrogen bonds, ionic bonds, disulfide covalent bonds and hydrophobic interactions between R groups. Quaternary: two or more polypeptides associating, held by the same kinds of R group interaction, and present only in multi-chain proteins.","note":"HL. The synthesis card. If you can produce this one cleanly, most of B1.2 is yours.","marks":null}],"exam":[{"question":"## Q1. Outline how a dipeptide is formed from two amino acids. **[3]**","scheme":"- The reaction is condensation. **[1]**\n- The amine group of one amino acid reacts with the carboxyl group of the\n  other, forming a peptide bond. **[1]**\n- A molecule of water is released / eliminated. **[1]**\n\n_Examiner note: all three points are separate marks, and candidates routinely\ndrop the water. \"They join by a peptide bond\" is one mark, not three._"},{"question":"## Q2. Explain the effect of high temperature on the structure and function of an enzyme. **[4]**","scheme":"- Increased temperature increases kinetic energy / vibration of the\n  molecule. **[1]**\n- This disrupts the hydrogen bonds / ionic bonds / hydrophobic interactions\n  holding the tertiary structure. **[1]**\n- The three-dimensional conformation changes — the protein is denatured. **[1]**\n- The active site changes shape, so the substrate no longer fits / the enzyme\n  loses function. **[1]**\n- Accept: peptide bonds and primary structure are not affected. **[1 max within total]**\n\n_Examiner note: an answer that says \"the enzyme denatures and stops working\"\nscores one mark at most. \"Explain\" wants the chain (energy, bonds, shape,\nfunction), and each link is a separate mark._"},{"question":"## Q3. Distinguish between the secondary and tertiary structure of a protein. **[4]**","scheme":"Comparative statements. Maximum [4]:\n\n- Secondary structure is regular repeating folding (alpha helix or beta pleated\n  sheet) whereas tertiary structure is the overall three-dimensional shape of\n  the whole polypeptide. **[1]**\n- Secondary structure is stabilized by hydrogen bonds between backbone amine\n  and carboxyl groups, whereas tertiary structure is stabilized by interactions\n  between R groups. **[1]**\n- Tertiary structure involves four types of interaction — hydrogen bonds, ionic\n  bonds, disulfide covalent bonds and hydrophobic interactions — whereas\n  secondary structure involves hydrogen bonds only. **[1]**\n- Secondary structure is independent of the R groups present whereas tertiary\n  structure depends directly on which R groups are in the sequence. **[1]**\n\n_Examiner note: the backbone-versus-R-group distinction is the mark that\nseparates grades here. An answer that attributes secondary structure to R group\ninteractions loses it and usually confuses the rest of the answer too._"},{"question":"## Q4. Explain how the primary structure of a polypeptide determines its tertiary structure. **[3]**","scheme":"- Primary structure is the sequence of amino acids. **[1]**\n- The sequence determines which R groups are present and their positions in the\n  chain. **[1]**\n- The R groups interact — by hydrogen bonds, ionic bonds, disulfide bonds and\n  hydrophobic interactions — and these interactions fold the chain into a\n  specific three-dimensional shape. **[1]**\n\n_Examiner note: \"the sequence determines the shape\" restates the question and\nscores nothing on its own. The mark is in naming R groups as the link between\nthe two._"},{"question":"## Q5. Compare and contrast fibrous and globular proteins. **[4]**","scheme":"Comparative statements only. Maximum [4]:\n\n- Both are polypeptides / both are built from amino acids joined by peptide\n  bonds. **[1]**\n- Fibrous proteins are long and narrow whereas globular proteins are rounded\n  and compact. **[1]**\n- Fibrous proteins have a repetitive amino acid sequence whereas globular\n  proteins have an irregular sequence. **[1]**\n- Fibrous proteins are largely insoluble in water whereas globular proteins are\n  soluble. **[1]**\n- Fibrous proteins have structural roles whereas globular proteins have\n  functional roles such as catalysis or transport. **[1]**\n- Named examples used comparatively: collagen or keratin versus haemoglobin,\n  insulin or an enzyme. **[1]**\n\n_Examiner note: \"compare and contrast\" requires at least one similarity, and\nevery point must be written comparatively. \"Fibrous proteins are insoluble\"\nscores nothing on its own._"},{"question":"## Q6. State what is meant by a conjugated protein, and give one example. **[2]**","scheme":"- A protein containing a non-polypeptide prosthetic group in addition to its\n  polypeptide(s). **[1]**\n- Example: haemoglobin, which contains haem groups. **[1]**\n\n_Examiner note: \"state\" wants two sentences at most. A protein with more than\none chain isn’t automatically conjugated. That’s quaternary structure, which\nis a different idea._"}],"mcq":[{"id":"B1.2-q01","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"Which four groups are bonded to the central carbon of an amino acid?","options":[{"text":"An amine group, a carboxyl group, a hydrogen atom and an R group","correct":true,"why":"Every amino acid has the same first three. Only the R group changes from one amino acid to the next."},{"text":"An amine group, a phosphate group, a hydrogen atom and an R group","correct":false,"why":"Phosphate groups belong in nucleotides and phospholipids. An amino acid has a carboxyl group there."},{"text":"A hydroxyl group, a carboxyl group, a hydrogen atom and an R group","correct":false,"why":"The \"amino\" in amino acid is the amine group. A hydroxyl group isn't one of the four."},{"text":"An amine group, a carboxyl group, a methyl group and a peptide bond","correct":false,"why":"A peptide bond only forms when two amino acids join, and the fourth group is a hydrogen atom."}],"after":null},{"id":"B1.2-q02","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"What happens when two amino acids join by condensation?","options":[{"text":"A water molecule is used up to split them apart","correct":false,"why":"That's hydrolysis, the reverse reaction. Condensation releases water."},{"text":"A peptide bond forms and water is released","correct":true,"why":"The amine group of one reacts with the carboxyl group of the other. You get a dipeptide and one molecule of water."},{"text":"A hydrogen bond forms between their R groups","correct":false,"why":"The link between amino acids in a chain is a peptide bond, which is covalent. R groups aren't involved."},{"text":"A disulfide bond forms and CO2 is released","correct":false,"why":"Disulfide bonds form between two cysteines in tertiary structure. They don't join amino acids into a chain."}],"after":null},{"id":"B1.2-q03","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"A polypeptide is 150 amino acids long. How many water molecules were released when it was made?","options":[{"text":"150","correct":false,"why":"Count the bonds, not the amino acids. A chain of 150 has one fewer bond than it has amino acids."},{"text":"149","correct":true,"why":"One water comes off for each peptide bond, and a chain of 150 amino acids has 149 bonds."},{"text":"151","correct":false,"why":"There's one bond fewer than the number of amino acids, not one more."},{"text":"300","correct":false,"why":"Each condensation releases one water, not two."}],"after":null},{"id":"B1.2-q04","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"What makes an amino acid \"essential\"?","options":[{"text":"It's needed in larger amounts than the others","correct":false,"why":"\"Essential\" isn't about amount or importance. It's about where the amino acid has to come from."},{"text":"It's found in every protein the body makes","correct":false,"why":"Plenty of proteins lack particular amino acids. That isn't what the word means here."},{"text":"The body can't make it, so it must come from food","correct":true,"why":"Non-essential ones can be made from other compounds. Essential ones can't, so a diet short of one limits protein synthesis."},{"text":"It's the only type that can form peptide bonds","correct":false,"why":"Every amino acid can form peptide bonds. Essential describes diet, not chemistry."}],"after":null},{"id":"B1.2-q05","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"How many different sequences are possible for a peptide three amino acids long?","options":[{"text":"60","correct":false,"why":"That's 20 × 3. Each of the three positions multiplies the choices, so it's 20 × 20 × 20."},{"text":"400","correct":false,"why":"That's 20 squared, which is the answer for two amino acids, not three."},{"text":"1,140","correct":false,"why":"That counts combinations where order doesn't matter. In a peptide order matters, so it's 20 to the power of 3."},{"text":"8,000","correct":true,"why":"Any of 20 amino acids can go in each position, so it's 20 to the power of 3."}],"after":null},{"id":"B1.2-q06","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"An enzyme is heated until it denatures. Which bonds are still intact?","options":[{"text":"Hydrogen bonds holding the secondary structure","correct":false,"why":"Those are among the first to break when a protein is heated."},{"text":"Ionic bonds between charged R groups","correct":false,"why":"Ionic bonds in the tertiary structure are disrupted by denaturation. That's part of why the shape changes."},{"text":"Peptide bonds between the amino acids","correct":true,"why":"Denaturation changes the shape, not the sequence. The chain is still one piece afterward."},{"text":"Hydrophobic interactions in the interior","correct":false,"why":"Heat disrupts those too, which is part of why the protein unfolds."}],"after":null},{"id":"B1.2-q07","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"Which statement about denaturation is correct?","options":[{"text":"It's always permanent once the shape is lost","correct":false,"why":"Mild denaturation can reverse. Writing \"always permanent\" loses the mark."},{"text":"It can be reversible or irreversible, depending on severity","correct":true,"why":"Some proteins refold when normal conditions return. Severe heat or extreme pH can make the change permanent."},{"text":"It breaks the protein back down into amino acids","correct":false,"why":"That would be hydrolysis. Denaturation leaves the chain of amino acids whole."},{"text":"It only happens at temperatures above 100 °C","correct":false,"why":"Many proteins denature well below boiling, and pH changes can denature them at any temperature."}],"after":null},{"id":"B1.2-q08","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"How does a change in pH denature a protein?","options":[{"text":"It changes the charges on R groups, disrupting ionic bonds","correct":true,"why":"Adding or removing H+ changes which R groups are charged, so ionic and hydrogen bonds holding the shape break."},{"text":"It hydrolyzes the peptide bonds along the backbone","correct":false,"why":"pH changes disrupt the folding, not the peptide bonds. The sequence stays the same."},{"text":"It adds extra amino acids to the end of the chain","correct":false,"why":"pH can't add amino acids. Only translation builds the chain."},{"text":"It removes water from inside the folded protein","correct":false,"why":"Losing water isn't the mechanism. pH works by changing the charges on R groups."}],"after":null},{"id":"B1.2-q09","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"Which bonds hold a protein's secondary structure together?","options":[{"text":"Ionic bonds between oppositely charged R groups","correct":false,"why":"That's tertiary structure. R-group bonds shape the whole chain, not the helix."},{"text":"Disulfide bonds between pairs of cysteine R groups","correct":false,"why":"Disulfide bonds are also R-group interactions, so they belong to tertiary structure."},{"text":"Hydrogen bonds between backbone amine and carboxyl groups","correct":true,"why":"The alpha helix and beta pleated sheet are the backbone folding on itself, so the R groups aren't involved yet."},{"text":"Hydrophobic interactions between non-polar R groups","correct":false,"why":"Those help fold the whole chain in tertiary structure, not the helix or sheet."}],"after":null},{"id":"B1.2-q10","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"Which interactions hold a protein's tertiary structure together?","options":[{"text":"Peptide bonds only, between neighboring amino acids along the chain","correct":false,"why":"Peptide bonds make the primary structure. The tertiary shape is held by R groups interacting."},{"text":"Hydrogen, ionic and disulfide bonds plus hydrophobic interactions between R groups","correct":true,"why":"Name all four and say they're between R groups. Listing \"bonds\" without naming them doesn't score."},{"text":"Hydrogen bonds between backbone amine and carboxyl groups, and nothing else","correct":false,"why":"That's secondary structure. Tertiary structure comes from the R groups."},{"text":"Bonds between two or more separate polypeptide chains in one protein","correct":false,"why":"That's quaternary structure. Tertiary is the shape of one chain."}],"after":null},{"id":"B1.2-q11","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"Which protein is an example of quaternary structure?","options":[{"text":"Haemoglobin, made of four polypeptide chains","correct":true,"why":"Quaternary structure means two or more polypeptides in one protein. Haemoglobin also has haem groups, so it's conjugated too."},{"text":"Any enzyme, since every protein has four levels","correct":false,"why":"Not every protein has quaternary structure. Many are a single polypeptide."},{"text":"A single polypeptide folded into an alpha helix","correct":false,"why":"One chain can't have quaternary structure, and a helix is secondary structure."},{"text":"Any dipeptide formed from two amino acids","correct":false,"why":"A dipeptide is two amino acids in one chain. Quaternary structure needs two or more chains."}],"after":null},{"id":"B1.2-q12","topic":"B1.2","kind":"mcq","lead":"","quote":"","prompt":"Which description fits a globular protein?","options":[{"text":"Long and narrow, insoluble, with a structural role","correct":false,"why":"That describes fibrous proteins like collagen and keratin."},{"text":"Rounded and soluble, with a functional role","correct":true,"why":"Enzymes, haemoglobin and insulin all fit. Their shape lets them do a job, not hold something up."},{"text":"Repetitive in sequence, forming strong fibers","correct":false,"why":"Repetitive sequences are a fibrous-protein feature. Globular proteins have irregular sequences."},{"text":"Always embedded in the phospholipid bilayer","correct":false,"why":"Some membrane proteins are globular, but most globular proteins, like enzymes, work in solution."}],"after":null},{"id":"B1.2-t1","topic":"B1.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"The alpha helix is held together by bonds between the R groups.","prompt":"Why does it fail?","options":[{"text":"Secondary structure is stabilized by hydrogen bonds between the **amine and carboxyl groups of the backbone**. R group interactions are what hold **tertiary** structure. Getting this backwards collapses the two levels into one and loses marks in both.","correct":true,"why":"That’s exactly why it fails."},{"text":"Peptide bonds are covalent and aren’t broken by heat or pH change. What breaks are the weaker interactions holding the folded shape. The primary structure survives denaturation intact, which is exactly why denaturation is sometimes reversible.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying denaturation breaks peptide bonds."},{"text":"The syllabus says it may be reversible or irreversible. A protein denatured mildly can sometimes refold, because the primary structure that determines the shape is still there.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating denaturation as always irreversible."},{"text":"That’s a list of labels. Questions on this topic almost always ask what **holds** each level, and a labels-only answer scores at the bottom of the band.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: naming the levels without naming the bonds."}],"after":{"label":"What would have scored","text":"Hydrogen bonds form between the carboxyl group of one amino acid and the amine group of another along the polypeptide backbone, producing an alpha helix or beta pleated sheet."}},{"id":"B1.2-t2","topic":"B1.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":"Heating denatures the protein by breaking the bonds between the amino acids.","prompt":"Why does it fail?","options":[{"text":"Peptide bonds are covalent and aren’t broken by heat or pH change. What breaks are the weaker interactions holding the folded shape. The primary structure survives denaturation intact, which is exactly why denaturation is sometimes reversible.","correct":true,"why":"That’s exactly why it fails."},{"text":"Secondary structure is stabilized by hydrogen bonds between the **amine and carboxyl groups of the backbone**. R group interactions are what hold **tertiary** structure. Getting this backwards collapses the two levels into one and loses marks in both.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: saying secondary structure is held by R group interactions."},{"text":"The syllabus says it may be reversible or irreversible. A protein denatured mildly can sometimes refold, because the primary structure that determines the shape is still there.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: treating denaturation as always irreversible."},{"text":"That’s a list of labels. Questions on this topic almost always ask what **holds** each level, and a labels-only answer scores at the bottom of the band.","correct":false,"why":"That’s a real marking point, but it’s about a different mistake: naming the levels without naming the bonds."}],"after":{"label":"What would have scored","text":"Heat disrupts the hydrogen bonds, ionic bonds and hydrophobic interactions holding the tertiary structure, changing the conformation. The peptide bonds and primary structure are unaffected."}},{"id":"B1.2-t3","topic":"B1.2","kind":"trap","lead":"A student wrote this. It didn’t score:","quote":
